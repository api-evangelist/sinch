delivery:
  signature: Callbacks are signed using HMAC‑SHA256. The signature is placed in the `authorization` header as `service <serviceKey>:<Signature>`
    where the key/secret are taken from the Sinch dashboard. The request must also include an `x‑timestamp` header (ISO‑8601 UTC) which is part
    of the signed string.
  retries: The Conversation API uses exponential backoff retries. Retries occur when the response is not in the 200–299 range, specifically on
    network/timeout failures, OAuth2 token fetch failures, HTTP 5xx, and 429 status codes. Retries are not performed for other 4xx responses.
    The exact backoff schedule is not published.
