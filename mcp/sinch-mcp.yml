source: https://developers.sinch.com/.well-known/agent-card.json (names the MCP URL); POST https://developers.sinch.com/mcp
  initialize + tools/list on 2026-10-08 (200, text/event-stream, serverInfo "Sinch Docs" 2026-10-08, protocolVersion 2025-06-18);
