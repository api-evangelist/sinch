        '400':
          description: 'INVALID_ARGUMENT: If the input parameters are not valid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 400
                  message: Invalid campaign_registration_id
                  status: INVALID_ARGUMENT
                  details:
                  - type: BadRequest
                    fieldViolations:
                    - field: campaign_registration_id
                      description: invalid value
        '404':
          description: The campaign could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 404
                  message: Campaign not found
                  status: NOT_FOUND
                  details:
                  - type: ResourceInfo
                    resourceType: Campaign
                    resourceName: 01frjdjhq2mnps0srvbt9wpvek
                    owner: ''
                    description: not found
        '429':
          description: Over limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 429
                  message: Over limit
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 500
                  message: Error while retrieving campaign details.
                  status: INTERNAL
                  details:
                  - type: ResourceInfo
                    resourceType: Campaign
                    resourceName: 01frjdjhq2mnps0srvbt9wpvek
                    owner: ''
                    description: Error while retrieving campaign details.
  /v1/projects/{projectId}/campaignRegistrations:fetchByTcrCampaignId:
    get:
      tags:
      - 10DLC Campaign Registration
      summary: Get Campaign Details using the TCR Campaign ID
      description: Returns the specified campaign by its TCR Campaign ID.
      operationId: CampaignRegistrationExternalService_GetCampaignByTcrCampaignId
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/campaignRegistrationIdQuery'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: 'INVALID_ARGUMENT: If the input parameters are not valid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 400
                  message: Invalid tcr_campaign_id
                  status: INVALID_ARGUMENT
                  details:
                  - type: BadRequest
                    fieldViolations:
                    - field: tcr_campaign_id
                      description: invalid value
        '404':
          description: The campaign could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 404
                  message: Campaign not found
                  status: NOT_FOUND
                  details:
                  - type: ResourceInfo
                    resourceType: Campaign
                    resourceName: CTF4STM
                    owner: ''
                    description: not found
        '429':
          description: Over limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 429
                  message: Over limit
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 500
                  message: Error while retrieving campaign details.
                  status: INTERNAL
                  details:
                  - type: ResourceInfo
                    resourceType: Campaign
                    resourceName: CTF4STM
                    owner: ''
                    description: Error while retrieving campaign details.
  /v1/projects/{projectId}/campaignRegistrations:qualify:
    get:
      tags:
      - 10DLC Campaign Registration
      summary: Qualify Brand by Use Case
      description: 'Before submitting a campaign, this API will provide some important feedback about how the resulting campaign will be treated. You can verify that the campaign will be supported by all operators, the AT&T message class and TPM, the T-Mobile brand daily bucket that will be applied and more.


        It is suggested to validate that the operator restrictions will meet your needs prior to submitting the campaign request. Brand revettings do not automatically adjust operator restrictions, and in some cases a new campaign may have to be resubmitted to receive the adjusted MNO values.'
      operationId: CampaignRegistrationExternalService_QualifyBrandByUseCase
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/brandId'
      - $ref: '#/components/parameters/useCase'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualifyBrandByUseCaseResponse'
        '400':
          description: Invalid Brand ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 400
                  message: Invalid brand_id. It must have upper-case alphanumeric characters with prefix letter 'B' and max length of 8 characters
                  status: INVALID_ARGUMENT
                  details:
                  - type: BadRequest
                    fieldViolations:
                    - field: brand_id
                      description: invalid value, it must have upper-case alphanumeric characters with prefix letter 'B' and max length of 8 characters
        '429':
          description: Over limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 429
                  message: Over limit
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 500
                  message: Brand not found
                  status: INTERNAL
                  details:
                  - type: ResourceInfo
                    resourceType: QualifyBrandByUseCaseResponse
                    resourceName: ''
                    owner: ''
                    description: Brand not found
  /v1/projects/{projectId}/campaignRegistration/{campaignRegistrationId}:
    delete:
      tags:
      - 10DLC Campaign Registration
      summary: Delete Campaign by campaignId
      description: Deactivate a campaign by removing the campaign from TCR and OSR. A campaign cannot be restored once it is deactivated. New campaign status is EXPIRED.
      operationId: CampaignRegistrationExternalService_DeleteCampaign
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/campaignRegistrationId'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 'INVALID_ARGUMENT: If the input parameters are not valid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 400
                  message: Invalid campaign_id
                  status: INVALID_ARGUMENT
                  details:
                  - type: BadRequest
                    fieldViolations:
                    - field: tcr_campaign_id
                      description: invalid value
        '404':
          description: The campaign could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 404
                  message: Campaign not found
                  status: NOT_FOUND
                  details:
                  - type: ResourceInfo
                    resourceType: Campaign
                    resourceName: CTF4STM
                    owner: ''
                    description: not found
        '429':
          description: Over limit
          content:
