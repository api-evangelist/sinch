    v1uploadCampaignFilesRequest:
      type: object
      description: Request payload to upload a file for a campaign registration. Only one file can be uploaded at a time.
      required:
      - campaignInternalId
      - submitCampaign
      properties:
        projectId:
          type: string
          description: The project ID to which the campaign belongs.
          example: 0fc52975-636a-4700-8943-68759df5c9e1
        campaignInternalId:
          type: string
          description: The campaign ID returned by the create campaign API endpoint.
          example: 01k4cxccbt519xa3ejty1r5jb4
        file:
          type: object
          description: 'Files must be no larger than 10MB.


            For PRIVACY_POLICY, TERMS_AND_CONDITIONS, CALL_TO_ACTION, and OPT_IN file categories, the following file types are supported:


            jpg, jpeg, png, bmp, tiff, raw, pdf, rtf, xml, odt, docx, tml, txt


            For MMS file category, the following file types are supported:


            bmp, dib, gif, jpeg, jpg, m2a, m4a, m4b, m4p, m4r, m4v, mp1, mp2, mp3, mp4, mpa, oga, ogg, ogm, ogv, ogx, png, spx, txt, wav, webm


            There can be a maximum of 5 files submitted for MMS and a maximum of 5 files for the other categories.'
          properties:
            fileName:
              type: string
              description: The name of the file you want to upload.
              example: MyFile.txt
            fileContent:
              type: string
              description: The content of the file encoded in base64.
              example: VGhpcyBpcyBhIHRlc3QgdGV4dCBmaWxlLg==
            fileCategory:
              type: integer
              description: Represents the category or intended purpose of a file and used to classify uploaded files based on their content or function.
              enum:
              - 1
              - 2
              - 3
              - 4
              - 5
              x-enumDescriptions:
                PRIVACY_POLICY=1: File related to privacy policy content.
                TERMS_AND_CONDITIONS=2: File related to terms and conditions.
                CALL_TO_ACTION=3: File related to call-to-action prompts.
                OPT_IN=4: File related to user opt-in/consent.
                MMS=5: File related to MMS (Multimedia Messaging Service) contexts.
        submitCampaign:
          type: boolean
          description: 'Set this property to `false` for all uploaded files except the final one, which will allow for uploading documents across multiple requests without submitting the campaign.

            For the last file, set it to `true` to indicate that the upload is complete and the campaign should be submitted for review.'
    fieldViolations:
      type: object
      properties:
        field:
          type: string
          description: The field which produced the error.
          example: order_by
        description:
          type: string
          description: The description of the error.
          example: Invalid `order_by` number.
    InternalErrorResponse:
      type: object
