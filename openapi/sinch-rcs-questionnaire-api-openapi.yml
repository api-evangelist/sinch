openapi: 3.2.0
info:
  title: Provisioning RCS Questionnaire API
  description: Manage your RCS questionnaires.
  version: 1.2.117
servers:
- url: https://provisioning.api.sinch.com
  description: Production server
security:
- BasicAuth: []
  BearerAuth: []
  OAuth2Production: []
tags:
- name: RCS Questionnaire
  description: Manage your RCS questionnaires.
paths:
  /v1/projects/{projectId}/rcs/questionnaire/{useCase}:
    get:
      description: 'Returns questionnaire questions for a use case.


        The launch questionnaire is based on information required by different Suppliers and Operators. As such, especially the country specific, may be subject to change.'
      operationId: RcsQuestionnaireController_getQuestions_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: useCase
        required: true
        in: path
        description: Use case.
        x-enumDescriptions:
          MULTIUSE: Configures the sender for multiple distinct types of message flows.
          OTP: Configures the sender exclusively for one-time passwords and secure tokens.
          PROMOTIONAL: Configures the sender for marketing, offers, and promotional broadcasts.
          TRANSACTIONAL: Configures the sender for critical, non-marketing customer alerts and account updates.
        schema:
          $ref: '#/components/schemas/RcsInputSenderUseCasesEnum'
      - name: countries
        required: false
        in: query
        description: Optional query for sender countries.
        x-enumDescriptions:
          AT: The country code for Austria.
          BE: The country code for Belgium.
          BR: The country code for Brazil.
          CA: The country code for Canada.
          CZ: The country code for the Czech Republic.
          DK: The country code for Denmark.
          FI: The country code for Finland.
          FR: The country code for France.
          DE: The country code for Germany.
          GR: The country code for Greece.
          HU: The country code for Hungary.
          IT: The country code for Italy.
          LT: The country code for Lithuania.
          MX: The country code for Mexico.
          NL: The country code for the Netherlands.
          'NO': The country code for Norway.
          PE: The country code for Peru.
          PL: The country code for Poland.
          PT: The country code for Portugal.
          SG: The country code for Singapore.
          SK: The country code for Slovakia.
          ES: The country code for Spain.
          SE: The country code for Sweden.
          US: The country code for the United States of America.
          GB: The country code for the United Kingdom of Great Britain.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RcsInputRcsCountryCodesEnum'
      - name: usQuestionnaireBrandCampaignVersion
        required: false
        in: query
        description: Optional query parameter to specify the US questionnaire brand campaign version.
        x-enumDescriptions:
          NON_US_PRIVATE: Applies compliance rules designated for a privately held brand located outside the United States.
          NON_US_PUBLIC: Applies compliance rules designated for a publicly traded brand located outside the United States.
          US_PRIVATE: Applies compliance rules designated for a privately held brand located within the United States.
          US_PUBLIC: Applies compliance rules designated for a publicly traded brand located within the United States.
        schema:
          $ref: '#/components/schemas/RcsUsQuestionnaireBrandCampaignVersionsEnum'
      - name: usQuestionnaireVersion
        required: false
        in: query
        description: Optional query parameter to specify the US questionnaire version.
        x-enumDescriptions:
          v1: Specifies the initial legacy version of the US compliance questionnaire framework.
          v2: Specifies the current updated version of the US compliance questionnaire framework.
        schema:
          $ref: '#/components/schemas/RcsUsQuestionnaireVersionsEnum'
      responses:
        '200':
          description: Questionnaire questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsSenderDetailsQuestionnaireBaseDto'
              examples:
                usPublicQuestionnaireResponse:
                  summary: Get US Public questionnaire response
                  description: "\n    Response with US Public questionnaire questions.\n    "
                  value:
                    general:
                      questions:
                        optInDescription:
                          question: How do users agree to receive messages from your business through the agent?
                          suggestedAnswers:
                          - By subscribing to our loyalty program
                          - By making a purchase in-store or online
                          - By subscribing to a newsletter
                          - By creating an account on our website or app
                        triggerDescription:
                          question: When does your business send messages to users through the agent?
                          suggestedAnswers:
                          - User actions (e.g. after making a purchase)
                        interactionsDescription:
                          question: How will users interact with your business through the agent?
                          suggestedAnswers:
                          - Online Payment
                          - Password reset
                          - OTP/2FA for account login
                        optOutDescription:
                          question: What message does your business send when a user opts out?
                          suggestedAnswers:
                          - Thank you for opting out
                          - Thank you for unsubscribing
                          - We have registered your opt out request
                        videoUris:
                          question: ''
                          suggestedAnswers: []
                        screenshotUris:
                          question: ''
                          suggestedAnswers: []
                    verification:
