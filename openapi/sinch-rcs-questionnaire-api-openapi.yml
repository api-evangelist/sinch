        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsPapiErrorDto'
              examples:
                questionnaire_invalid_use_case-0:
                  summary: QuestionnaireInvalidUseCaseError
                  value:
                    errorCode: questionnaire_invalid_use_case
                    message: Invalid use case value.
                    resolution: Verify that the use case value is supported by the Provisioning API.
                    additionalInformation:
                      validUseCases: MULTIUSE, OTP, PROMOTIONAL, TRANSACTIONAL
                questionnaire_invalid_country-1:
                  summary: QuestionnaireInvalidCountryError
                  value:
                    errorCode: questionnaire_invalid_country
                    message: Invalid country.
                    resolution: Use the supported values for the countries parameter.
                    additionalInformation:
                      supportedValues: AT, BE, BR, CA, CZ, DK, FI, FR, DE, GR, HU, IT, LT, MX, NL, NO, PE, PL, PT, SG, SK, ES, SE, US, GB
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcsPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
