    validateSvamlResponse:
      type: object
      additionalProperties: false
      description: 'Result of a SVAML validation request.


        The HTTP `200` status indicates the validation was successfully performed — not that the payload is valid.

        Inspect `isValid` to determine the outcome.'
      required:
      - isValid
      properties:
        isValid:
          type: boolean
          description: '`true` if the submitted SVAML payload passed validation; `false` if one or more errors were found.'
        errors:
          type: array
          description: 'Validation error messages describing why the SVAML payload is invalid.


            Present only when `isValid` is `false`. Each entry identifies a specific problem, including the affected field or command where applicable.'
          items:
            type: string
            description: A human-readable description of a single validation error.
      examples:
      - isValid: false
        errors:
        - Invalid dial command. Missing destination.
        - Invalid say command. Missing voice name.
        - Unknown command 'test'.
        - Invalid property 'test' in the dial command
    pause:
      type: object
      additionalProperties: false
      title: Pause
      description: 'Delays execution of the next command in the sequence for a specified duration. This is a blocking command — no further commands execute until the pause completes.


        The pause does not affect call audio; the call remains connected and audio continues uninterrupted.'
      required:
      - command
      - durationMilliseconds
      properties:
        command:
          type: string
          const: pause
          description: Pause execution.
        durationMilliseconds:
          type: integer
          minimum: 1
          description: Duration of the pause in milliseconds.
          example: 1000
      examples:
      - command: pause
        durationMilliseconds: 1500
    dial:
      type: object
      additionalProperties: false
      title: Dial
      description: 'Initiates a new outbound call leg within the current session.


        This is a non-blocking command — the next command in the sequence executes immediately while the call is being established in parallel. Call lifecycle events (answer, busy, reject, timeout, hangup, failure) are handled via the `events` property.


        The `from` and `to` endpoint types should ideally match. If they differ, the platform attempts to convert the `from` value to be compatible with the `to` type. For example, PSTN supports only E.164 phone numbers, so a SIP address such as `sip:46701234567@acme.se` can be converted to an E.164 number. If the `from` value cannot be converted, it defaults to null (anonymous).'
      required:
      - command
      - to
      properties:
        command:
          type: string
          const: dial
          description: Command to initiate a new call
        callName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: outgoing
          description: 'Identifier for this call leg within the session. Must be unique across all active call legs in the session.


            Other commands (e.g., `hangup`) can reference this name to target this specific leg.'
        from:
          $ref: '#/components/schemas/from'
        to:
          $ref: '#/components/schemas/to'
        dialTimeoutDurationSeconds:
          type: integer
          minimum: 1
          maximum: 60
          description: Maximum time in seconds to wait for the call to be answered. If the timeout expires without an answer, the `onTimeout` event is triggered.
          example: 15
        maxCallDurationSeconds:
          type: integer
          minimum: 1
          maximum: 14400
          description: Maximum duration of the call in seconds. The call is terminated automatically when this limit is reached.
          example: 3600
        events:
          $ref: '#/components/schemas/callEvents'
      examples:
      - command: dial
        callName: destination
        from:
          type: PHONE
          phone:
            number: '+15551234567'
        to:
          type: PHONE
          phone:
            number: '+15559876543'
        dialTimeoutDurationSeconds: 30
        maxCallDurationSeconds: 3600
