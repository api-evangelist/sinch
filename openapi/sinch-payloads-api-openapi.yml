        onHangup:
          description: SVAML commands to be executed when the call is hung up
          $ref: '#/components/schemas/svamlCommands'
        onFailure:
          description: SVAML commands to be executed when the call fails
          $ref: '#/components/schemas/svamlCommands'
    webhook:
      type: object
      additionalProperties: false
      title: Webhook
      description: 'Triggers a mid-call webhook to the application backend, allowing it to return a new set of SVAML commands that control the remainder of the call flow.


        This is a blocking command — execution pauses until a response is received from the webhook endpoint. The next command in the sequence runs only after the backend responds. Webhook requests use a 5-second timeout. If a `fallbackUrl` is provided, a failed request is re-sent to it — see *Timeouts and failover* in the **Webhooks** section for the authoritative algorithm.'
      required:
      - command
      - webhookName
      - url
      properties:
        command:
          type: string
          const: webhook
          description: Command to trigger a mid-call webhook
        webhookName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^\S+$
          description: 'Name for this webhook event. When triggered, the webhook request''s `event` property will contain this name prepended with `call.webhook.`.


            For example, if `webhookName` is set to `"my.custom.event"`, the event will be delivered as `"call.webhook.my.custom.event"`.'
        url:
          type: string
          description: URL of the webhook endpoint to send the mid-call event to.
          format: uri
        fallbackUrl:
          $ref: '#/components/schemas/webhookFallbackUrl'
      examples:
      - command: webhook
        webhookName: my.custom.event
        url: https://example.com/webhook
        fallbackUrl: https://example.com/fallback
    phoneNumber:
