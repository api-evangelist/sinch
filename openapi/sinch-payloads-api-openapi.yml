openapi: 3.2.0
info:
  title: Sinch Payloads API
  version: 2.0.58
  contact:
    name: Sinch Support
    url: https://sinch.com/help-center/
    email: support@sinch.com
  license:
    name: Sinch License
    url: https://www.sinch.com/legal/
  termsOfService: https://www.sinch.com/terms-of-service/
  x-sinch-standards-version: standards-2026-03-31
  description: 'Operations tagged Payloads across 2 of this provider''s published API definitions: sinch-voice-api-v2-openapi.yaml, sinch-voice-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://voice.api.sinch.com
  description: Endpoint which enables consuming the Voice API globally - Redirected by Sinch to the closest region.
- url: https://us1.voice.api.sinch.com
  description: North America 1 - East
- url: https://br1.voice.api.sinch.com
  description: South America 1 - East
- url: https://eu1.voice.api.sinch.com
  description: Europe 1 - Central
- url: https://sg1.voice.api.sinch.com
  description: Asia Pacific 1 - Southeast
- url: https://au1.voice.api.sinch.com
  description: Australia & Oceania 1 - Southeast
security:
- BasicAuth: []
- SinchOAuth2: []
tags:
- name: Payloads
  description: SVAML (Sinch Voice API Markup Language) is a JSON-based markup language used to define call flows and control the behavior of voice calls in the Sinch Voice API.
paths:
  /v2/projects/{projectId}/svaml/describe:
    post:
      tags:
      - Payloads
      summary: Describe the call flow from the SVAML payload
      description: This endpoint is useful for understanding the structure and flow of a SVAML payload without executing it. It provides a detailed description of the commands, events, and messages defined in the SVAML.
      operationId: describeSvaml
      parameters:
      - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/describeSvamlRequest'
            examples:
              basicFlow:
                summary: Describe a simple SVAML flow
                value:
                  svaml:
                    callName: incoming
                    commands:
                    - command: answer
                    - command: messages
                      messages:
                      - type: SAY
                        say:
                          text: Welcome to ACME support.
                          voiceName: Emma
      responses:
        '200':
          description: SVAML description provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/svamlDescriptionResponse'
              example:
                description: The call is answered and a TTS message is played using the voice Emma.
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      x-codeSamples:
      - lang: Python
        source: "\"\"\"\nSinch Python Snippet\n\nThis snippet is available at https://github.com/sinch/sinch-sdk-python/tree/main/examples/snippets\n\"\"\"\n\nimport os\n\nfrom dotenv import load_dotenv\n\nfrom sinch import SinchClient\n\nload_dotenv()\n\nsinch_client = SinchClient(\n    project_id=os.environ.get(\"SINCH_PROJECT_ID\") or \"MY_PROJECT_ID\",\n    key_id=os.environ.get(\"SINCH_KEY_ID\") or \"MY_KEY_ID\",\n    key_secret=os.environ.get(\"SINCH_KEY_SECRET\") or \"MY_KEY_SECRET\",\n)\n\n# The SVAML commands to describe\ncommands = [{\"command\": \"hangup\"}]\n\nresponse = sinch_client.voice.v2.svaml.describe(commands=commands)\n\nprint(f\"Successfully described SVAML payload.\\n{response}\")"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.voice.v2.svaml.describe({\n      describeSvamlRequestBody: {\n        svaml: {\n          commands: [\n            {\n              command: 'messages',\n              messages: [\n                {\n                  type: 'SAY',\n                  say: {\n                    text: 'Hello, your call is now connected.',\n                    voiceName: 'Emma',\n                  },\n                },\n              ],\n            },\n          ],\n        },\n      },\n    });\n    console.log('✅ Successfully described a Voice v2 SVAML payload.');\n    console.log(`Response:\\n${JSON.stringify(response, null, 2)}`);\n  } catch (err) {\n    console.error('❌ Failed to describe a Voice v2 SVAML payload:');\n    console.error(err);\n  }\n}\n\nmain();\n"
    servers:
    - url: https://voice.api.sinch.com
      description: Endpoint which enables consuming the Voice API globally - Redirected by Sinch to the closest region.
    - url: https://us1.voice.api.sinch.com
      description: North America 1 - East
    - url: https://br1.voice.api.sinch.com
      description: South America 1 - East
    - url: https://eu1.voice.api.sinch.com
      description: Europe 1 - Central
    - url: https://sg1.voice.api.sinch.com
      description: Asia Pacific 1 - Southeast
    - url: https://au1.voice.api.sinch.com
      description: Australia & Oceania 1 - Southeast
  /v2/projects/{projectId}/svaml/validate:
    post:
      tags:
      - Payloads
      summary: Validate a SVAML payload
      description: This endpoint checks the structure and content of the SVAML commands to ensure they conform to the expected schema and rules. It can operate in different validation modes, such as strict or lenient, depending on the requirements.
      operationId: validateSvaml
      parameters:
      - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/validateSvamlRequest'
            examples:
              strictValidation:
                summary: Validate a SVAML flow using strict mode
                value:
                  validationType: STRICT
                  svaml:
                    callName: incoming
                    commands:
                    - command: answer
                    - command: messages
                      messages:
                      - type: SAY
                        say:
                          text: Welcome to ACME support.
                          voiceName: Emma
      responses:
        '200':
          description: Validation performed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validateSvamlResponse'
              examples:
                validPayload:
                  summary: Validation successful
                  value:
                    isValid: true
                invalidPayload:
                  summary: Validation failed
                  value:
                    isValid: false
                    errors:
                    - Invalid dial command. Missing destination.
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      x-codeSamples:
      - lang: Python
        source: "\"\"\"\nSinch Python Snippet\n\nThis snippet is available at https://github.com/sinch/sinch-sdk-python/tree/main/examples/snippets\n\"\"\"\n\nimport os\n\nfrom dotenv import load_dotenv\n\nfrom sinch import SinchClient\n\nload_dotenv()\n\nsinch_client = SinchClient(\n    project_id=os.environ.get(\"SINCH_PROJECT_ID\") or \"MY_PROJECT_ID\",\n    key_id=os.environ.get(\"SINCH_KEY_ID\") or \"MY_KEY_ID\",\n    key_secret=os.environ.get(\"SINCH_KEY_SECRET\") or \"MY_KEY_SECRET\",\n)\n\n# The SVAML commands to validate\ncommands = [{\"command\": \"hangup\"}]\n\nresponse = sinch_client.voice.v2.svaml.validate(commands=commands)\n\nprint(f\"Successfully validated SVAML payload.\\n{response}\")\n"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.voice.v2.svaml.validate({\n      validateSvamlRequestBody: {\n        svaml: {\n          commands: [\n            {\n              command: 'messages',\n              messages: [\n                {\n                  type: 'SAY',\n                  say: {\n                    text: 'Hello, your call is now connected.',\n                    voiceName: 'Emma',\n                  },\n                },\n              ],\n            },\n          ],\n        },\n      },\n    });\n    console.log('✅ Successfully validated a Voice v2 SVAML payload.');\n    console.log(`Response:\\n${JSON.stringify(response, null, 2)}`);\n  } catch (err) {\n    console.error('❌ Failed to validate a Voice v2 SVAML payload:');\n    console.error(err);\n  }\n}\n\nmain();\n"
    servers:
    - url: https://voice.api.sinch.com
      description: Endpoint which enables consuming the Voice API globally - Redirected by Sinch to the closest region.
    - url: https://us1.voice.api.sinch.com
      description: North America 1 - East
    - url: https://br1.voice.api.sinch.com
      description: South America 1 - East
    - url: https://eu1.voice.api.sinch.com
      description: Europe 1 - Central
    - url: https://sg1.voice.api.sinch.com
      description: Asia Pacific 1 - Southeast
    - url: https://au1.voice.api.sinch.com
      description: Australia & Oceania 1 - Southeast
components:
  schemas:
    recordingOptions:
      title: Recording Options
      type: object
      additionalProperties: false
      description: Recording options for this recording.
      required:
      - destination
      - destinationUrl
      - credentials
      properties:
        format:
          $ref: '#/components/schemas/recordingFormat'
        recordingType:
          $ref: '#/components/schemas/recordingType'
        destination:
          $ref: '#/components/schemas/recordingDestination'
        destinationUrl:
          type: string
          description: Destination URL for the recording.
          example: s3://voice-recordings-prod/calls
        credentials:
          type: string
          description: Credentials to third party storage.
          example: accessKeyId:secretAccessKey:eu-central-1
        transcriptionOptions:
          $ref: '#/components/schemas/transcriptionOptions'
    amdEvents:
      type: object
      additionalProperties: false
      title: AMD Events
      description: SVAML commands to execute based on the answering machine detection result. These events define different call flows depending on whether a human, machine, beep, or unknown entity answers the call.
      properties:
        onHuman:
          description: SVAML commands to be executed when a human is detected
          $ref: '#/components/schemas/svamlCommands'
        onMachine:
          description: SVAML commands to be executed when a machine is detected
          $ref: '#/components/schemas/svamlCommands'
        onBeep:
          description: SVAML commands to be executed when a beep is detected
          $ref: '#/components/schemas/svamlCommands'
        onUnknown:
          description: SVAML commands to be executed when an unknown event is detected
          $ref: '#/components/schemas/svamlCommands'
    problemDetails:
      title: Problem Details
      description: Base error response schema following [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) (Problem Details for HTTP APIs). All error responses use this structure.
      x-category: response
      x-usage: http-response
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - detail
      - instance
      properties:
        type:
          type: string
          description: URI that identifies the problem type and links to the corresponding error documentation.
        title:
          type: string
          description: Human-readable short summary of the problem type.
        detail:
          type: string
          description: Human-readable explanation of the specific problem occurrence.
        instance:
          type: string
          description: URI reference that identifies the specific occurrence of the problem (typically the request path).
    typesOfMessages:
      type: array
      title: Message List
      description: Ordered list of messages to play.
      minItems: 1
      maxItems: 10
      items:
        $ref: '#/components/schemas/message'
    answer:
      type: object
      additionalProperties: false
      title: Answer
      description: Answers an inbound call leg. This is a non-blocking command — execution continues to the next command in the sequence immediately after the answer is initiated.
      required:
      - command
      properties:
        command:
          type: string
          const: answer
          description: Answer call
      examples:
      - command: answer
    stopMessages:
      type: object
      additionalProperties: false
      title: Stop Messages
      description: 'Stops a message sequence started by a `messages` command. It will also cancel any messages with specified `messagesName` that will appear in the call session in the future.


        This is a non-blocking command.'
      required:
      - command
      - messagesName
      properties:
        command:
          type: string
          const: stopMessages
          description: Command to stop playing messages
        messagesName:
          type: string
          description: Name of the message sequence to stop, as set by `messagesName` in the `messages` command.
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
      examples:
      - command: stopMessages
        messagesName: my-messages
    projectId:
      title: Project ID
      type: string
      format: uuid
      description: The `Id` of the project associated with the call.
      examples:
      - 5c5bf2b1-35ae-4825-ab89-457e07bb60e6
    sipFrom:
      type: object
      additionalProperties: false
      title: SIP Origin
      required:
      - type
      - sip
      properties:
        type:
          type: string
          const: SIP
          description: Indicates the call originated from a SIP (Session Initiation Protocol) endpoint.
        sip:
          type: object
          additionalProperties: false
          required:
          - endpoint
          properties:
            endpoint:
              type: string
              description: SIP URI of the originating endpoint. Both `sip:` (unencrypted) and `sips:` (TLS-encrypted) schemes are supported.
              format: uri
              pattern: '^sips?:'
              maxLength: 192
            displayName:
              type: string
              description: Display name presented to the called party as the caller identity. Transmitted as the display name part of the SIP `From` header (for example, `Alice <sip:alice@example.com>`).
              maxLength: 64
              example: Alice
      examples:
      - type: SIP
        sip:
          endpoint: sip:user@example.com
          displayName: Alice
    to:
      title: To
      description: Call destination - Phone Number or Stream URI
      oneOf:
      - $ref: '#/components/schemas/phone'
      - $ref: '#/components/schemas/sip'
      - $ref: '#/components/schemas/stream'
      - $ref: '#/components/schemas/voiceRelay'
      discriminator:
        propertyName: type
        mapping:
          PHONE: '#/components/schemas/phone'
          SIP: '#/components/schemas/sip'
          STREAM: '#/components/schemas/stream'
          VOICE_RELAY: '#/components/schemas/voiceRelay'
    stopRecording:
      type: object
      additionalProperties: false
      title: Stop Recording
      description: Stops a recording previously started by a `startRecording` command. This is a non-blocking command — execution continues to the next command in the sequence immediately after the stop is initiated.
      required:
      - command
      - recordingName
      properties:
        command:
          type: string
          const: stopRecording
          description: Command to stop recording on the channel
        recordingName:
          type: string
          description: Name of the recording to stop, as set by `recordingName` in the `startRecording` command.
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-recording
    menu:
      type: object
      additionalProperties: false
      title: Run menus
      description: 'Defines a set of named menus and executes them starting from startMenu. This is a blocking command — execution waits for the menu to complete before proceeding to the next command.


        Each menu item configures prompts, input collection, timeout handling, and repeat behavior.'
      required:
      - command
      - startMenu
      - menus
      properties:
        command:
          type: string
          const: menu
          description: Executes menu-based input collection using the configured menu definitions.
        startMenu:
          type: string
          minLength: 1
          maxLength: 16
          description: Name of the menu to execute first. Must match a key in menus.
        menus:
          type: object
          propertyNames:
            type: string
            maxLength: 16
          description: Map of menu definitions keyed by menu name.
          additionalProperties:
            $ref: '#/components/schemas/menuItem'
      examples:
      - command: menu
        startMenu: main
        menus:
          main:
            prompt:
              allowBargeIn: true
              messages:
              - type: SAY
                say:
                  text: Press 1 for sales or 2 for support.
                  voiceName: Emma
            repeatPrompt:
              allowBargeIn: true
              messages:
              - type: SAY
                say:
                  text: Invalid option. Press 1 for sales or 2 for support.
                  voiceName: Emma
            inputTimeoutDurationSeconds: 5
            repeatCount: 2
            minimumInputLength: 1
            maximumInputLength: 1
            inputMethods:
            - DTMF
            matches:
              '1':
              - command: messages
                messages:
                - type: SAY
                  say:
                    text: Connecting to sales.
                    voiceName: Emma
              - command: dial
                callName: sales
                to:
                  type: PHONE
                  phone:
                    number: '+15551234567'
              '2':
              - command: messages
                messages:
                - type: SAY
                  say:
                    text: Connecting to support.
                    voiceName: Emma
              - command: dial
                callName: support
                to:
                  type: PHONE
                  phone:
                    number: '+15557654321'
            onFail:
            - command: messages
              messages:
              - type: SAY
                say:
                  text: Sorry, no valid selection was received.
                  voiceName: Emma
            - command: hangup
    stream:
      type: object
      additionalProperties: false
      title: Stream
      description: Routes the call to a WebSocket stream endpoint for real-time audio processing.
      required:
      - type
      - stream
      properties:
        type:
          type: string
          const: STREAM
          description: Routes the call to a WebSocket stream endpoint for real-time audio processing.
        stream:
          type: object
          additionalProperties: false
          required:
          - endpoint
          properties:
            endpoint:
              type: string
              description: WebSocket endpoint that will accept the incoming connection for real-time audio streaming. Must be a valid WebSocket URL using either `ws://` or `wss://` (recommended). The URL must be reachable from the public internet and capable of handling the negotiated stream protocol.
              example: wss://example.com
            streamOptions:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  description: Defines the version of the stream protocol.
                  default: 1
                  example: 1
                codec:
                  type: string
                  const: PCM
                  description: 'Defines the audio codec/format used for the stream audio payload.


                    Currently, only `PCM` is supported (uncompressed raw audio). Use `sampleRate` to configure the sampling rate for the stream.'
                sampleRate:
                  type: integer
                  description: "Defines the audio sampling rate (Hz) used for the stream.\n\nFor calls that traverse the PSTN, audio is typically sampled at 8 kHz, so using a higher value will not improve perceived quality. \nHigher sample rates can be useful for non-PSTN scenarios (for example, SIP/streaming paths), but will increase bandwidth usage and processing load."
                  enum:
                  - 8000
                  - 16000
                  - 24000
                  - 44100
                  - 48000
                  - 96000
                  x-enumDescriptions:
                    '8000': 8 kHz (standard for PSTN calls)
                    '16000': 16 kHz (wideband audio)
                    '24000': 24 kHz (super-wideband audio)
                    '44100': 44.1 kHz (CD quality audio)
                    '48000': 48 kHz (professional audio quality)
                    '96000': 96 kHz (high-resolution audio)
                  default: 8000
                  example: 16000
            callHeaders:
              $ref: '#/components/schemas/callHeaders'
          examples:
          - endpoint: wss://example.com
            streamOptions:
              version: 1
              codec: PCM
              sampleRate: 8000
            callHeaders:
            - key: my-key
              value: my-key-value
      examples:
      - type: STREAM
        stream:
          endpoint: wss://example.com
          streamOptions:
            version: 1
            codec: PCM
            sampleRate: 16000
          callHeaders:
          - key: my-key
            value: my-key-value
    svamlCommands:
      type: array
      title: SVAML Commands
      description: 'An ordered list of SVAML v2 (Sinch Voice Application Markup Language) commands that describe a call flow. Commands are executed sequentially in the order they are defined.


        **Blocking vs. non-blocking:** Some commands block execution until they complete (`pause`, `webhook`, `menu`, `gotoMenu`), while others return immediately and run in parallel (`dial`, `messages`, `amd`, `answer`, `hangup`, `startRecording`, `stopRecording`, `bridgeCall`, `stopMessages`). Each command''s description specifies its behavior.


        **Nesting scope:** Commands that appear inside event handlers (e.g., `dial.events.onAnswer`, `messages.events.onFinish`) form independent sequences and execute in their own context — they are not continuations of the parent sequence.'
      items:
        $ref: '#/components/schemas/svamlCommand'
    sip:
      type: object
      additionalProperties: false
      title: SIP Endpoint
      required:
      - type
      - sip
      properties:
        type:
          type: string
          const: SIP
          description: Routes the call to a SIP (Session Initiation Protocol) endpoint.
        sip:
          type: object
          additionalProperties: false
          required:
          - endpoint
          properties:
            endpoint:
              type: string
              description: SIP URI of the destination endpoint. Both `sip:` (unencrypted) and `sips:` (TLS-encrypted) schemes are supported.
              format: uri
              maxLength: 256
              pattern: '^sips?:'
            transport:
              type: string
              description: 'Transport protocol to use for the SIP signalling channel.


                If omitted, the platform selects a default based on the URI scheme: `UDP` for `sip:` and `TLS` for `sips:`. Setting this explicitly overrides that default — for example, to force `TCP` for a `sip:` URI or to use `TLS` without switching to the `sips:` scheme.'
              enum:
              - UDP
              - TCP
              - TLS
              x-enumDescriptions:
                UDP: Connectionless transport. Lowest overhead; suitable for most standard SIP deployments.
                TCP: Connection-oriented transport. More reliable for large SIP messages or NAT traversal scenarios.
                TLS: Encrypted transport. Provides confidentiality and integrity for SIP signalling.
            callHeaders:
              $ref: '#/components/schemas/sipCallHeaders'
      examples:
      - type: SIP
        sip:
          endpoint: sip:user@example.com
          transport: TCP
          callHeaders:
          - key: X-Correlation-Id
            value: '12345'
          - key: X-Call-Routing
            value: forwarded
    voiceRelay:
      type: object
      additionalProperties: false
      title: Voice Relay
      description: Routes the call through the Voice Relay service, enabling real-time speech-to-text (STT) and text-to-speech (TTS) via a WebSocket connection to the application backend.
      required:
      - type
      - voiceRelay
      properties:
        type:
          type: string
          const: VOICE_RELAY
          description: Connects to the Voice Relay service to enable STT and TTS services...
        voiceRelay:
          type: object
          additionalProperties: false
          required:
          - endpoint
          - ttsVoice
          - sttLanguage
          properties:
            endpoint:
              type: string
              format: uri
              description: URL to the server that will accept the web-socket request
              example: wss://acme.com/agent
            enableInterruptions:
              type: boolean
              description: 'Allow "barge-in" during text-to-speech (TTS) playback.


                When `true`, TTS playback is interrupted as soon as inbound speech is detected, unless the currently playing content is marked as uninterruptible.


                When `false`, TTS playback continues uninterrupted, but an interruption signal is still sent over the WebSocket so the client application can choose to stop playback manually if needed.'
              default: true
              example: true
            ttsVoice:
              description: "Name of the voice to be used when synthesizing speech. \n\nThis is the default voice used, if no override voice is provided in the web-socket TTS message."
              $ref: '#/components/schemas/voiceName'
            sttLanguage:
              type: string
              pattern: ^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$
              description: 'BCP-47 language tag used for speech-to-text transcription of the inbound audio.


                This value determines which language model is used for transcription.'
              example: en-US
            callHeaders:
              $ref: '#/components/schemas/callHeaders'
      examples:
      - type: VOICE_RELAY
        voiceRelay:
          endpoint: wss://acme.com/agent
          enableInterruptions: true
          ttsVoice: Emma
          sttLanguage: en-US
          callHeaders:
          - key: my-key
            value: my-key-value
    messages:
      type: object
      additionalProperties: false
      title: Messages
      description: "Plays one or more messages on the call. Multiple messages in the array are played sequentially in order.\n\nThis is a non-blocking command — the next command in the sequence executes immediately while messages play in parallel. \nPlayback outcomes are handled via the `events` property. The `onFinish` event can be used to run a command after all messages complete."
      required:
      - command
      - messages
      properties:
        command:
          type: string
          const: messages
          description: Command to play a message on the channel
        messagesName:
          type: string
          description: 'Name of the message for identification and reference within the call session.


            This name is used to uniquely identify the message and must be unique within the current call session.

            This name can be referenced in other commands (e.g., `stopMessages`) to control this specific message.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-messages
        messages:
          $ref: '#/components/schemas/typesOfMessages'
        events:
          $ref: '#/components/schemas/messageEvents'
      examples:
      - command: messages
        messagesName: greeting-sequence
        messages:
        - type: SAY
          say:
            text: Hello! Your call is being connected.
            voiceName: Emma
        - type: PLAY
          play:
            url: https://example.com/audio/hold-music.mp3
        - type: SAY
          say:
            text: <speak><prosody volume="-6dB">Thank you for waiting.</prosody></speak>
            format: SSML
            voiceName: Emma
    badRequest:
      title: Bad Request
      description: Returned when the request is malformed or contains invalid parameters.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/bad-request
          title:
            const: Bad Request
          detail:
            example: The request body is invalid or malformed.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    amd:
      type: object
      additionalProperties: false
      title: Answering Machine Detection
      description: 'AMD (Answering Machine Detection) command to detect what answered the call. Possible outcomes are: human, machine, beep, or unknown.


        This is a non-blocking command — the next command in the sequence executes immediately while detection runs in parallel. Results are delivered via the `events` property.'
      required:
      - command
      properties:
        command:
          type: string
          const: amd
          description: Command to run Answering Machine Detection on the call
        events:
          $ref: '#/components/schemas/amdEvents'
      examples:
      - command: amd
        events:
          onHuman:
          - command: pause
            durationMilliseconds: 1000
          - command: bridgeCall
            bridgeName: my-bridge
          onBeep:
          - command: messages
            messagesName: my-amd-messages
            messages:
            - type: SAY
              say:
                text: Hello, this is a test message
                voiceName: Emma
    message:
      type: object
      title: Message
      description: A single message item. The required payload depends on `type`.
      oneOf:
      - $ref: '#/components/schemas/messageSay'
      - $ref: '#/components/schemas/messagePlay'
      discriminator:
        propertyName: type
        mapping:
          SAY: '#/components/schemas/messageSay'
          PLAY: '#/components/schemas/messagePlay'
    phone:
      type: object
      additionalProperties: false
      title: Phone
      description: Routes the call to a phone number on the Public Switched Telephone Network (PSTN).
      required:
      - type
      - phone
      properties:
        type:
          type: string
          const: PHONE
          description: Routes the call to a phone number on the Public Switched Telephone Network (PSTN). The number must be in E.164 format.
        phone:
          type: object
          additionalProperties: false
          required:
          - number
          properties:
            number:
              $ref: '#/components/schemas/phoneNumber'
      examples:
      - type: PHONE
        phone:
          number: '+4673522488'
    forbidden:
      title: Forbidden
      description: Returned when the authenticated identity does not have permission to perform the requested operation.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/forbidden
          title:
            const: Forbidden
          detail:
            example: The request was rejected.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    recordingType:
      title: Recording Type
      description: The type of recording to perform.
      type: string
      enum:
      - COMBINED
      - INBOUND
      - OUTBOUND
      x-enumDescriptions:
        COMBINED: Record inbound and outbound voice streams.
        INBOUND: Record inbound voice stream only.
        OUTBOUND: Record outbound voice stream only.
      default: COMBINED
    svamlDescriptionResponse:
      type: object
      additionalProperties: false
      description: Response containing a human-readable description of the SVAML call flow.
      properties:
        description:
          type: string
          description: Human-readable description of the call flow.
      examples:
      - description: "A new call with name 'pstn' will be initiated to number +46701234567 with max duration set to 45 minutes.\n * on answer:\n    1. A TTS message will be played using the voice Emily.\n    2. The call will be recorded.\n    3. The call will be added to the 'main' bridge\n    4. A new call with name 'stream' will be initiated to the stream endpoint wss://acme.se/\n      * on answer:\n          1. The call will be added to the 'main' bridge\n      * on hangup:\n          1. The call with name 'pstn' will be disconnected\n  * on hangup:\n      1. The call with name 'stream' will be disconnected"
    menuPrompt:
      type: object
      additionalProperties: false
      title: Menu Prompt
      description: Prompt configuration for menu playback, including prompt messages and barge-in behavior.
      required:
      - messages
      properties:
        allowBargeIn:
          type: boolean
          description: 'Controls whether input can interrupt prompt playback.


            When enabled, playback stops as soon as input is detected and the input is evaluated immediately if matching conditions are met.


            When disabled, input is still collected during playback and evaluated after playback finishes.'
          default: true
        messages:
          $ref: '#/components/schemas/typesOfMessages'
    menuItem:
      type: object
      additionalProperties: false
      title: Menu Item
      description: 'Defines a single menu step, including prompts, input handling rules, input-to-command matches, and failure handling.


        Each collected input is matched against the values in the `matches` property.

        If no match succeeds, the `onFail` commands are executed.


        If neither `matches` nor `onFail` is defined and the service call behavior is set to `WEBHOOK`, a webhook request is sent including the collected input.'
      properties:
        prompt:
          $ref: '#/components/schemas/menuPrompt'
          description: 'Prompt played when this menu starts.


            This prompt is also used as the repeat prompt when repeatPrompt is not defined for the menu.'
        repeatPrompt:
          $ref: '#/components/schemas/menuPrompt'
          description: 'Prompt played when the menu is repeated.


            Repeats occur when input times out or when the provided input does not match any menu match item.'
        inputTimeoutDurationSeconds:
          type: integer
          description: Maximum number of seconds to wait for user input before the input attempt times out.
          minimum: 1
          maximum: 60
          default: 5
          example: 10
        repeatCount:
          type: integer
          description: 'Maximum number of times the menu is repeated.


            A repeat occurs when input times out or when the provided input does not match any menu match item.'
          minimum: 0
          maximum: 10
          default: 2
          example: 3
        minimumInputLength:
          type: integer
          description: Minimum number of input characters required before the menu evaluates the collected input.
          minimum: 1
          maximum: 100
          default: 1
          example: 3
        maximumInputLength:
          type: integer
          description: Maximum number of input characters that triggers the menu to evaluate the collected input.
          minimum: 1
          maximum: 100
          default: 1
          example: 10
        terminatingSequence:
          type: string
          pattern: ^[0-9*#]+$
          description: 'Character sequence that signals the end of input and triggers immediate evaluation.


            Useful when variable-length input is allowed and shorter valid options should be submitted without waiting for timeout or maximum length.


            The terminating sequence value is included in the evaluated input.'
          maxLength: 10
        inputMethods:
          type: array
          description: Input methods accepted for this menu when collecting user input.
          default:
          - DTMF
          items:
            type: string
            enum:
            - DTMF
            x-enumDescriptions:
              DTMF: Collect input from keypad tones (Dual-Tone Multi-Frequency).
        matches:
          type: object
          description: 'Items matched against the collected input. Maximum number of allowed match expressions is 50.


            Defined as a dictionary where each property name is a literal or a regular expression string.


            Values are evaluated in the order they are defined.'
          maxProperties: 50
          propertyNames:
            type: string
            minLength: 1
            maxLength: 256
            description: 'A regular expression or literal string to match against the collected user input. Must not be empty.


              Property keys are evaluated sequentially in the order defined. The first key that matches the input will trigger its associated SVAML commands.


              **Note**: Use `\\*` to match the DTMF star tone (*).'
          additionalProperties:
            $ref: '#/components/schemas/svamlCommands'
        onFail:
          $ref: '#/components/schemas/svamlCommands'
          description: 'SVAML commands executed when the menu fails to collect a matching input.


            This handler runs after the repeat limit is reached without any input matching a menu match item.'
    recordingDestination:
      title: Recording Destination
      type: string
      description: Select target service to receive recorded and transcribed files
      enum:
      - AWS
      - GCP
      - AZURE
      x-enumDescriptions:
        AWS: Store recordings in Amazon Web Services S3 bucket. Use `s3` as schema for the URL.
        GCP: Store recordings in Google Cloud Platform Storage. Use `gs` as schema for the URL.
        AZURE: Store recordings in Microsoft Azure Blob Storage.  Use `azure` as schema for the URL.
      default: AWS
      examples:
      - AWS
    messageEvents:
      type: object
      additionalProperties: false
      title: Message Events
      description: 'SVAML commands to execute based on message playback outcomes.

        '
      properties:
        onFinish:
          description: 'Commands to execute when all messages in the sequence have finished playing.

            '
          $ref: '#/components/schemas/svamlCommands'
    webhookFallbackUrl:
      title: Webhook Fallback URL
      type: string
      format: uri
      description: 'Fallback webhook URL used when the primary webhook URL fails.


        A failed request is re-sent to this URL immediately. After repeated consecutive failures of the primary URL, requests are sent only here until the primary URL recovers.


        See *Timeouts and failover* in the **Webhooks** section for the authoritative algorithm.'
      examples:
      - https://example.com/fallback
    validateSvamlRequest:
      type: object
      additionalProperties: false
      description: 'Request payload for validating a SVAML document before using it in a call.


        Use `validationType` to control how strictly the payload is checked.'
      required:
      - svaml
      properties:
        svaml:
          $ref: '#/components/schemas/svamlInput'
          description: The SVAML payload to validate.
        validationType:
          type: string
          default: NORMAL
          description: Controls how strictly the SVAML payload is validated.
          enum:
          - NORMAL
          - STRICT
          x-enumDescriptions:
            NORMAL: Applies the same validation rules used when initiating a call. Unknown or extra properties are ignored.
            STRICT: Applies stricter validation rules. Returns errors for any properties that are not recognised or not expected in the given context.
