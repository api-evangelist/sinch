        required:
        - key
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[-A-Za-z0-9.!%*_+`'~]+$
            description: Name of the SIP header.
            example: X-Correlation-Id
          value:
            type: string
            maxLength: 255
            description: Value of the SIP header.
            example: '12345'
