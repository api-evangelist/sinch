          description: Command to start recording on the channel
        recordingName:
          type: string
          description: 'Identifier for this recording within the session. Must be unique across active recordings in the session.


            Other commands (e.g., `stopRecording`) reference this name to target a specific recording.


            Setting the recording name is useful for stopping the recording using the `stopRecording` command. If name is not set, recording can only be stopped when the call is disconnected.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-recording
        recordingOptions:
          $ref: '#/components/schemas/recordingOptions'
        events:
          $ref: '#/components/schemas/recordingEvents'
      examples:
      - command: startRecording
        recordingName: customer-support-recording
        recordingOptions:
          format: MP3
          recordingType: COMBINED
          destination: AWS
          destinationUrl: s3://voice-recordings-prod/calls
          credentials: accessKeyId:secretAccessKey:eu-central-1
