                    resolution: Please check if the WhatsApp Business Account is correct, or don't provide the WhatsApp Business Account in the request for this project.
                not_found_waba_id-2:
                  summary: NotFoundWabaIdError
                  value:
                    errorCode: not_found_waba_id
                    message: Not found wabaId.
                    resolution: Verify that exist any WhatsApp Business Account for sub account / project.
                too_many_waba_id-3:
                  summary: TooManyWabaIdError
                  value:
                    errorCode: too_many_waba_id
                    message: Too many wabaId.
                    resolution: We can't automatically select WhatsApp Business Account for this project, please provide WhatsApp Business Account in the request.
                waba_id_used-4:
