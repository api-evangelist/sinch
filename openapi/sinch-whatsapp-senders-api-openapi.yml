components:
  schemas:
    WhatsappSenderMetadataFieldDto:
      type: object
      properties:
        value:
          type: string
          description: Requested value of the field.
          uniqueItems: false
        status:
          x-enumDescriptions:
            APPROVED: The profile field modification has been approved and applied.
            DEFERRED: The profile field modification has been deferred and will be evaluated later.
            DELETED: The profile field modification has been removed and is no longer active.
            EXPIRED: The profile field modification expired prior to completion.
            PENDING: The profile field modification is currently awaiting review or system processing.
            REJECTED: The profile field modification has been reviewed and rejected.
            RESERVED: The requested field parameter value is reserved but has not yet received final approval.
            UNRECOGNIZED: The value returned by an upstream system is not recognized by this API version.
            UNSPECIFIED: The operational status of the field modification is unspecified.
          description: Current approval status of the field.
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/WhatsappWhatsAppSenderFieldUpdateStatusEnum'
        rejectionReason:
          type: string
          description: Reason for rejection if the field update was rejected.
          uniqueItems: false
      required:
      - status
    WhatsappSenderNotificationTypeEnum:
      type: string
      enum:
      - ACTIVE
      - COMMENT_ADDED
      - CREATED
      - DRAFT
      - EDITED
      - ERROR
      - IN_PROGRESS
      - INACTIVE
      - REGISTERED
      - REJECTED
      - VERIFIED
    WhatsappSenderMetadataDto:
      type: object
      properties:
        displayName:
          description: Approval status of the sender display name.
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/WhatsappSenderMetadataFieldDto'
        username:
          description: Approval status of the sender username.
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/WhatsappSenderMetadataFieldDto'
    WhatsappConversationApiAppDto:
      type: object
      properties:
        id:
          type: string
          description: ID of the app
          uniqueItems: false
        projectId:
          type: string
          description: ID of the app project
          uniqueItems: false
        region:
          x-enumDescriptions:
            BR: The application operates within the Brazil region.
            EU: The application operates within the Europe region.
            US: The application operates within the United States region.
            UNRECOGNIZED: The value returned by an upstream system is not recognized by this API version.
          description: App region.
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/WhatsappConversationApiAppRegionsEnum'
        channelStatus:
          x-enumDescriptions:
            ACTIVE: The channel integration is active and operating as expected.
            FAILING: The channel integration is failing and requires manual attention or troubleshooting.
            PENDING: The channel integration setup or synchronization is pending completion.
            UNRECOGNIZED: The value returned by an upstream system is not recognized by this API version.
          description: Status of the channel credentials integration.
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/WhatsappConversationAppChannelIntegrationStatusEnum'
      required:
      - id
      - projectId
      - region
    WhatsappSenderInputMetaLocalStoragesEnum:
      type: string
      enum:
      - AE
      - AU
      - BH
      - BR
      - CA
      - CH
      - DE
      - GB
      - ID
      - IN
      - JP
      - KR
      - SG
      - US
      - ZA
      description: Region sender store the data in Meta. If not provided, the default value set for the chosen region will be used.
    WhatsappCommentInputDto:
      type: object
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 65535
          uniqueItems: false
