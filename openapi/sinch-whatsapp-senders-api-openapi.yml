          - $ref: '#/components/schemas/WhatsappSenderChangesDetailsDto'
            description: For update sender
          description: The pending changes to sender details and information
          uniqueItems: false
        errorReason:
          type: string
          description: Error reason if sender is in state `ERROR`.
          uniqueItems: false
        errorCode:
          x-enumDescriptions:
            CANNOT_ASSIGN_CREDIT_LINE: Indicates the provisioning system failed to allocate an active financial credit line configuration.
            CANNOT_ASSIGN_SYSTEM_USER: Indicates the system failed to map an active system user credential reference to the resource context.
            CANNOT_CREATE_NEW_WHATSAPP_SENDER: Indicates a structural failure occurred during the initialization of the WhatsApp channel.
            CANNOT_CREATE_WABA_FOR_BUSINESS: Indicates the automated registration workflow failed to instantiate a new WhatsApp Business Account (WABA).
            CANNOT_GET_DETAILS_FOR_CLOUD_API: Indicates an upstream communication breakdown prevented fetching active Cloud API configuration parameters.
            CANNOT_GET_WABA_DETAILS: Indicates system query layers failed to retrieve account metadata from the core WhatsApp business registry.
            CANNOT_REGISTER_NEW_WHATSAPP_SENDER: Indicates the downstream carrier gateway rejected the initial registration request block.
            CANNOT_REGISTER_TO_CLOUD_API: Indicates the system could not link the communication profile context with Meta Cloud API nodes.
            CANNOT_SUBSCRIBE_TO_CLOUD_API: Indicates the background event handler failed to bind operational event listeners on the Cloud API cluster.
            CANNOT_SUBSCRIBE_TO_WEBHOOK: Indicates the streaming broker layer rejected the integration callback subscription sequence.
            DUPLICATES_ON_SENDER_PHONE_NUMBER: Indicates the provided phone number identifier is already mapped to another active routing terminal.
            FAILED_TO_FETCH_APPROVED_MESSAGE_TEMPLATES: Indicates an operational query failure prevented compiling the list of certified payload templates.
            MULTIPLE_WABA_FOR_PROJECT_ID: Indicates a project boundary isolation violation where multiple WABA assets exist for a single project context.
            NO_CERTIFICATE_AVAILABLE: Indicates the system lacks a valid cryptographic handshake or validation certificate to proceed.
            NO_NOVA_ACCOUNT_ID: The internal financial node identifier property is missing or null.
            NO_PRICING_PLAN: The billing rate plan or pricing schema pointer is missing from the request context.
            NO_PROJECT_ID: The project boundary isolation reference identifier is missing or null.
            NO_VERIFIED_PHONE_NUMBER: The request payload contains no verified phone number pointers capable of routing.
            REQUESTED_PHONE_NUMBER_OR_COUNTRY_CODE_CONFLICT: Requested phone number or country code are not the same as assigned in WABA.
            NOT_VERIFIED_REQUESTED_PHONE_NUMBER: The targeted phone number resource context has not completed verified lifecycle milestones.
            NOT_VERIFY_BUSINESS_VIA_WHATSAPP: The Meta ecosystem rejected compliance verification for the associated business organization.
            NOVA_ACCOUNT_ID_CONFLICT: The input financial node identifier conflicts with an existing persistent registration.
            PROJECT_ID_CONFLICT: The input project boundary reference identifier conflicts with an existing persistent registration.
            SENDER_HAS_BEEN_DELETED: The designated channel entity footprint has already undergone a permanent cascading deletion sequence.
            WABA_CONNECTED_TO_ANOTHER_PROJECT: The specified WhatsApp Business Account is actively locked to a separate project isolation layer.
            UNKNOWN_ERROR: An unclassified internal processing error occurred within the orchestration tier.
            UNRECOGNIZED: The value returned by an upstream system is not recognized by this API version.
          description: Error code if sender is in state `ERROR`.
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/WhatsappSenderErrorCodeEnum'
      required:
      - status
