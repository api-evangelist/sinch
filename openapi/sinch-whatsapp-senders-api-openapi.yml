      description: 'Creates a sender for a project. The possible combinations of region, business manager and hosting type are the following


        | Region | | SINCH_BR | SINCH_MX | SINCH_UK |

        | --------- | -- | --- | --- | --- |

        | BR | Embedded (ES) | ✅ Supported | ✅ Supported | ❌ Unsupported |

        | | Partner-initiated | ✅ Supported | ✅ Supported | ❌ Unsupported |

        | EU | Embedded (ES) | ❌ Unsupported | ❌ Unsupported | ✅ Supported |

        | | Partner-initiated | ❌ Unsupported | ❌ Unsupported | ✅ Supported |

        | US | Embedded (ES) | ✅ Supported | ✅ Supported | ✅ Supported |

        | | Partner-initiated | ✅ Supported | ✅ Supported | ✅ Supported |'
      operationId: WhatsappSendersController_createSender_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      requestBody:
        required: true
        description: Sender data
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/WhatsappSenderInputEsDto'
              - $ref: '#/components/schemas/WhatsappInputSenderPhoneProvisioningDto'
              - $ref: '#/components/schemas/WhatsappInputSenderPartnerInitiatedDto'
              - $ref: '#/components/schemas/WhatsappSenderInputDtoDeprecated'
            examples:
              es:
                summary: Body request for ES
                description: "\n        Example body request to create an ES.\n        "
                value:
                  region: EU
                  metaLocalStorage: DE
                  wabaId: '11111111111111'
                  phoneNumberId: '222222222222222'
                  authenticationCode: 123asdf123
              phoneProvisioning:
                summary: Body request for new-number sender flow
                description: "\n      Example body request to create a sender with provisioned phone number.\n      "
                value:
                  details:
                    countryCode: '49'
                    phoneNumber: '1701234567'
                    displayName: Demo sender
              partnerInitiated:
                summary: Body request for Partner Initiated Sender
                description: "\n      Example body request to create a partner-initiated sender.\n      "
                value:
                  region: EU
                  metaLocalStorage: DE
                  phoneNumberProvider: CUSTOMER
                  details:
                    countryCode: '48'
                    phoneNumber: '777777777'
                    displayName: Test name
                    description: Test description
                    vertical: EDUCATION
                    email: test@test.com
                    address: Test address
                    websiteOne: https://example-1.com
                    about: Test about
                    photoUrl: https://example.com/photos/1.png
              esWithFacebookToken:
                summary: Body request for ES with Facebook token [Deprecated]
                description: "\n        Example body request to create an ES. [Deprecated]\n        "
                value:
                  region: EU
                  metaLocalStorage: DE
                  wabaId: '11111111111111'
                  phoneNumberId: '222222222222222'
                  facebookAccessToken: FACEBOOK_TOKEN
                  name: Example name
                  details:
                    displayName: Test name
                    description: Test description
                    vertical: EDUCATION
                    email: test@test.com
                    address: Test address
                    websiteOne: https://example-1.com
                    about: Test about
                    photoUrl: https://example.com/photos/1.png
              esWithFacebookCode:
                summary: Body request for ES with Facebook code [Deprecated]
                description: "\n        Example body request to create an ES. [Deprecated]\n        "
                value:
                  region: EU
