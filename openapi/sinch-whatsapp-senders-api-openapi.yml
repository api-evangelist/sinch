openapi: 3.2.0
info:
  title: Provisioning WhatsApp Senders API
  description: A WhatsApp Sender is also referred to as a 'Business Profile' or a WhatsApp channel. The WhatsApp Sender endpoint allows you to create a Sender through Meta's Embedded sign up. A Sender must be provisioned for you as a consumer of the WhatsApp API to send messages to your end users.
  version: 1.2.117
servers:
- url: https://provisioning.api.sinch.com
  description: Production server
security:
- BasicAuth: []
  BearerAuth: []
  OAuth2Production: []
tags:
- name: WhatsApp Senders
  description: A WhatsApp Sender is also referred to as a 'Business Profile' or a WhatsApp channel. The WhatsApp Sender endpoint allows you to create a Sender through Meta's Embedded sign up. A Sender must be provisioned for you as a consumer of the WhatsApp API to send messages to your end users.
paths:
  /v1/projects/{projectId}/whatsapp/senders:
    get:
      description: Returns a paginated list of senders for the specified project. If no page token is supplied then the first `50` will be returned.
      operationId: WhatsappSendersController_listSenders_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: pageToken
        required: false
        in: query
        schema:
          type: string
        description: The page token if retrieving the next page from a previous query.
      - name: pageSize
        required: false
        in: query
        schema:
          type: number
          minimum: 1
          maximum: 100
        description: The page size requested.
      - name: filterStates
        required: false
        in: query
        description: Optionally query for sender by states.
        x-enumDescriptions:
          ACTIVE: The sender identity is active and ready to dispatch messages.
          IN_PROGRESS: The configuration or provisioning sequence for the sender identity is currently in progress.
          INACTIVE: The sender identity exists within the system but is currently not active.
          PENDING_VERIFICATION: The sender identity awaits completion of the formal verification and compliance loop.
          SUSPENDED: The sender identity has been temporarily suspended due to administrative or policy restrictions.
          ERROR: The sender identity has encountered an operational failure and requires technical troubleshooting.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappSenderStatesEnum'
      - name: filterStatuses
        required: false
        in: query
        description: Optionally query for sender by statuses.
        x-enumDescriptions:
          DRAFT: The modifications to the sender identity are saved as a draft only.
          ERROR: The modifications to the sender identity failed and require technical troubleshooting or a manual retry.
          IN_PROGRESS: The modifications to the sender identity have been submitted and are still processing.
          MULTIPLE_WABA_ERROR: This status is deprecated and retained exclusively for backward compatibility layers.
          REJECTED: The modifications to the sender identity have been reviewed and rejected.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappSenderStatusesEnum'
      responses:
        '200':
          description: List of senders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSenderListDto'
              examples:
                response:
                  summary: List response
                  description: "\n    Response with senders.\n    "
                  value:
                    totalSize: 2
                    pageSize: 50
                    senders:
                    - id: cf11794a-6a5e-4a12-b103-da79bd378bf1
                      state: ACTIVE
                      details:
                        displayName: Test name
                        description: Test description
                        vertical: PROFESSIONAL_SERVICES
                        email: test@test.com
                        address: Test address
                        about: Test about
                        websiteOne: https://example-1.com
                        photoUrl: https://example.com/photos/1.png
                      metadata:
                        displayName:
                          value: New Display Name
                          status: PENDING
                      created: '2023-01-19T13:11:08.204Z'
