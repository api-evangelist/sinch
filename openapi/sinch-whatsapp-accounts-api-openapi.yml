openapi: 3.2.0
info:
  title: Provisioning WhatsApp Accounts API
  description: The WhatsApp accounts endpoint lets you create and update WhatsApp accounts as well as get account activity and leave comments.
  version: 1.2.117
servers:
- url: https://provisioning.api.sinch.com
  description: Production server
security:
- BasicAuth: []
  BearerAuth: []
  OAuth2Production: []
tags:
- name: WhatsApp Accounts
  description: The WhatsApp accounts endpoint lets you create and update WhatsApp accounts as well as get account activity and leave comments.
paths:
  /v1/projects/{projectId}/whatsapp:
    get:
      description: Returns an account for a project.
      operationId: WhatsappAccountsController_getAccount_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappAccountDto'
              examples:
                response:
                  summary: Get response
                  description: "\n    Response with an account.\n    "
                  value:
                    state: ONBOARDED
                    isEmbeddedSignup: false
                    businessManager: SINCH_UK
                    wabaId: '1234567890'
                    details:
                      companyLegalName: Legal name of company
                      wabaName: Legal name of company
                      clientBusinessManagerId: '1234567890'
                    wabaMaxPriceOnboarded: false
                    wabaEnabledForInsights: false
                    wabaEnabledForDirectSend: false
                    compatibleRegions:
                    - eu
                    - us
                    currency: EUR
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                account_not_found-0:
                  summary: AccountNotFoundError
                  value:
                    errorCode: account_not_found
                    message: Account not found.
                    resolution: Verify that the parameters are correct.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                account_data_is_corrupt-0:
                  summary: AccountDataIsCorruptError
                  value:
                    errorCode: account_data_is_corrupt
                    message: Account data is corrupt.
                    resolution: Please contact support.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: Get account for project
      tags:
      - WhatsApp Accounts
      x-badges:
      - name: GA
        position: after
        color: green
    post:
      callbacks:
        Comment:
          '{$request.body#webhooks.target}':
            post:
              summary: Comment on account
              description: "\n        Received when a comment has been added to the account.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event in this case `WHATSAPP_ACCOUNT_COMMENT_ADDED`.
                          type: string
                        payload:
                          description: Account at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappAccountDto'
                        comment:
                          description: Comment for account.
                          type: string
                      required:
                      - type
                      - payload
                      - comment
                    example:
                      type: WHATSAPP_ACCOUNT_COMMENT_ADDED
                      payload:
                        state: ONBOARDED
                        isEmbeddedSignup: false
                        businessManager: SINCH_UK
                        wabaId: '1234567890'
                        details:
                          companyLegalName: Legal name of company
                          wabaName: Legal name of company
                          clientBusinessManagerId: '1234567890'
                        wabaMaxPriceOnboarded: false
                        wabaEnabledForInsights: false
                        wabaEnabledForDirectSend: false
                        compatibleRegions:
                        - eu
                        - us
                        currency: EUR
                      comment: Example comment
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        Onboard:
          '{$request.body#webhooks.target}':
            post:
              summary: Account onboarded
              description: "\n        Received when an Account is onboarded.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event in this case `WHATSAPP_ACCOUNT_ONBOARDED`.
                          type: string
                        payload:
                          description: Account at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappAccountDto'
                        comment:
                          description: Comment for account.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_ACCOUNT_ONBOARDED
                      payload:
                        state: ONBOARDED
                        isEmbeddedSignup: false
                        businessManager: SINCH_UK
                        wabaId: '1234567890'
                        details:
                          companyLegalName: Legal name of company
                          wabaName: Legal name of company
                          clientBusinessManagerId: '1234567890'
                        wabaMaxPriceOnboarded: false
                        wabaEnabledForInsights: false
                        wabaEnabledForDirectSend: false
                        compatibleRegions:
                        - eu
                        - us
                        currency: EUR
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        Rejected:
          '{$request.body#webhooks.target}':
            post:
              summary: Account rejected
              description: "\n        Received when an Account is rejected.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event in this case `WHATSAPP_ACCOUNT_REJECTED`.
                          type: string
                        payload:
                          description: Account at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappAccountDto'
                        comment:
                          description: Comment for account.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_ACCOUNT_REJECTED
                      payload:
                        isEmbeddedSignup: false
                        businessManager: SINCH_UK
                        wabaId: '1234567890'
                        changes:
                          status: REJECTED
                          details:
                            companyLegalName: Legal name of company
                            wabaName: Legal name of company
                            clientBusinessManagerId: '1234567890'
                        wabaMaxPriceOnboarded: false
                        compatibleRegions:
                        - eu
                        - us
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        PendingVerification:
          '{$request.body#webhooks.target}':
            post:
              summary: Account pending verification
              description: "\n        Received when an Account is in pending verification.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event in this case `WHATSAPP_ACCOUNT_PENDING_VERIFICATION`.
                          type: string
                        payload:
                          description: Account at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappAccountDto'
                        comment:
                          description: Comment for account.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_ACCOUNT_PENDING_VERIFICATION
                      payload:
                        isEmbeddedSignup: false
                        businessManager: SINCH_UK
                        wabaId: '1234567890'
                        changes:
                          status: PENDING_FACEBOOK_VERIFICATION
                          details:
                            companyLegalName: Legal name of company
                            wabaName: Legal name of company
                            clientBusinessManagerId: '1234567890'
                        wabaMaxPriceOnboarded: false
                        compatibleRegions:
                        - eu
                        - us
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        BusinessDailyLimitChanged:
          '{$request.body#webhooks.target}':
            post:
              summary: Account daily limit changed
              description: "\n        Received when Account daily limit has been changed by Meta.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event in this case `WHATSAPP_ACCOUNT_DAILY_LIMIT_CHANGED`.
                          type: string
                        payload:
                          description: Account at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappAccountDto'
                        comment:
                          description: Comment for account.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_ACCOUNT_DAILY_LIMIT_CHANGED
                      payload:
                        state: ONBOARDED
                        isEmbeddedSignup: false
                        businessManager: SINCH_BR
                        wabaId: '1234567890'
                        details:
                          companyLegalName: Legal name of company
                          wabaName: Legal name of company
                          clientBusinessManagerId: '1234567890'
                        wabaMaxPriceOnboarded: false
                        wabaEnabledForInsights: true
                        wabaEnabledForDirectSend: false
                        compatibleRegions:
                        - br
                        primaryBusinessLocation: BR
                        currency: EUR
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        WabaInformationChanged:
          '{$request.body#webhooks.target}':
            post:
              summary: Account business information changed
              description: "\n        Received when Account has some of its business information changed by Meta.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event in this case `WHATSAPP_WABA_ACCOUNT_CHANGED`.
                          type: string
                        payload:
                          description: Account at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappAccountDto'
                        comment:
                          description: Comment for account.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_WABA_ACCOUNT_CHANGED
                      payload:
                        state: ONBOARDED
                        isEmbeddedSignup: false
                        businessManager: SINCH_BR
                        wabaId: '1234567890'
                        details:
                          companyLegalName: Legal name of company
                          wabaName: Legal name of company
                          clientBusinessManagerId: '1234567890'
                        wabaMaxPriceOnboarded: false
                        wabaEnabledForInsights: true
                        wabaEnabledForDirectSend: false
                        compatibleRegions:
                        - br
                        primaryBusinessLocation: BR
                        currency: EUR
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
      description: Create the WhatsApp account for the project. Each project can only have one account.
      operationId: WhatsappAccountsController_createAccount_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      requestBody:
        required: true
        description: Account data
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/WhatsappInputAccountPartnerInitiatedDto'
              - $ref: '#/components/schemas/WhatsappInputAccountDtoDeprecated'
            examples:
              input:
                summary: Body request
                description: "\n    Example body request to create an account.\n      "
                value:
                  companyLegalName: Legal name of company
                  clientBusinessManagerId: '1234567890'
              partnerInitiated:
                summary: Body request - Partner Initiated
                description: "\n    Example body request to create a partner-initiated account.\n      "
                value:
                  clientBusinessManagerId: '1234567890'
                  businessManager: SINCH_UK
                  wabaName: Legal name of company
                  senderDetails:
                    displayName: My Sender Name
                    businessCategory: OTC_DRUGS
                    region: EU
                    metaLocalStorage: BH
      responses:
        '201':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappAccountDto'
              examples:
                pending:
                  summary: Create response
                  description: "\n    Response when successfully creating an account.\n    "
                  value:
                    isEmbeddedSignup: false
                    businessManager: SINCH_UK
                    wabaId: '1234567890'
                    changes:
                      status: IN_PROGRESS
                      details:
                        companyLegalName: Legal name of company
                        wabaName: Legal name of company
                        clientBusinessManagerId: '1234567890'
                    wabaMaxPriceOnboarded: false
                    compatibleRegions:
                    - eu
                    - us
                onboarded:
                  summary: Create response
                  description: "\n    Response when successfully created an account.\n    "
                  value:
                    state: ONBOARDED
                    isEmbeddedSignup: false
                    businessManager: SINCH_UK
                    wabaId: '1234567890'
                    details:
                      companyLegalName: Legal name of company
                      wabaName: Legal name of company
                      clientBusinessManagerId: '1234567890'
                    wabaMaxPriceOnboarded: false
                    wabaEnabledForInsights: false
                    wabaEnabledForDirectSend: false
                    compatibleRegions:
                    - eu
                    - us
                    currency: EUR
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                invalid_input-0:
                  summary: InvalidInputError
                  value:
                    errorCode: invalid_input
                    message: Invalid input.
                    resolution: Correct the validation errors and submit again.
                    additionalInformation:
                      validationErrors:
                      - companyLegalName must be a string
                invalid_business_manager_for_environment-1:
                  summary: InvalidBusinessManagerForEnvironmentError
                  value:
                    errorCode: invalid_business_manager_for_environment
                    message: Invalid business manager for environment.
                    resolution: Verify that business manager is valid for environment. Allowed business managers for environment SINCH_AMERICA, SINCH_UK.
                invalid_payload-2:
                  summary: InvalidPayloadError
                  value:
                    errorCode: invalid_payload
                    message: Invalid payload.
                    resolution: Correct payload and submit again.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                project_not_found-0:
                  summary: ProjectNotFoundError
                  value:
                    errorCode: project_not_found
                    message: Project not found.
                    resolution: Verify that the projectId is correct.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                account_exists-0:
                  summary: AccountExistsError
                  value:
                    errorCode: account_exists
                    message: Account already exists.
                    resolution: There can only be one WhatsApp account for each project. Choose another one project to create a new WhatsApp account.
                account_data_is_corrupt-1:
                  summary: AccountDataIsCorruptError
                  value:
                    errorCode: account_data_is_corrupt
                    message: Account data is corrupt.
                    resolution: Please contact support.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: Create account for project
      tags:
      - WhatsApp Accounts
      x-badges:
      - name: GA
        position: after
        color: green
    delete:
      description: 'Deletes the account for a project.


        Deleting an account is only possible if there is no sender assigned to the account.'
      operationId: WhatsappAccountsController_deleteAccount_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      responses:
        '204':
          description: Account deleted
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                project_not_initialized-0:
                  summary: ProjectNotInitializedError
                  value:
                    errorCode: project_not_initialized
                    message: Project not initialized for WhatsApp.
                    resolution: Verify that the project ID is correct and that it has been onboarded for WhatsApp.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                account_has_senders-0:
                  summary: AccountHasSendersError
                  value:
                    errorCode: account_has_senders
                    message: Account has senders.
                    resolution: Delete senders before deleting the account.
                    additionalInformation:
                      projectId: 6a13764f-97ab-4584-b7f2-4b2d11a0ce59
                      senderIds:
                      - 437f8791-69ec-42af-9271-59b86b80178d
                      - 62550a35-2307-4ff1-86e4-41b0cbc7b7cb
                account_has_sender_changes-1:
                  summary: AccountHasSenderChangesError
                  value:
                    errorCode: account_has_sender_changes
                    message: Account has pending sender changes.
                    resolution: All sender changes must be resolved before deleting the account. If the error persists, please contact support.
                    additionalInformation:
                      projectId: 6a13764f-97ab-4584-b7f2-4b2d11a0ce59
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                template_could_not_delete_drafts-0:
                  summary: TemplateCouldNotDeleteDraftsError
                  value:
                    errorCode: template_could_not_delete_drafts
                    message: Couldn't delete template drafts.
                    resolution: Please try again later, if the error persists, please contact support.
                internal_error-1:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: Delete account for project
      tags:
      - WhatsApp Accounts
      x-badges:
      - name: Closed Beta
        position: after
        color: red
    patch:
      description: 'Update an account.


        It is only possible to update an account that has been rejected. After update the status will be set to `IN_PROGRESS`.'
      operationId: WhatsappAccountsController_updateAccount_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      requestBody:
        required: true
        description: Supported account fields to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappInputUpdateAccountDto'
            examples:
              input:
                summary: Body request
                description: "\n      Example body request to update an account.\n      "
                value:
                  companyLegalName: Updated legal name of company
                  wabaName: Updated legal name of company
                  clientBusinessManagerId: '1234567890'
              partnerInitiated:
                summary: Body request - Partner Initiated
                description: "\n      Example body request to update an account using Partner Initiated flow.\n      "
                value:
                  companyLegalName: Updated legal name of company
                  wabaName: Updated legal name of company
                  clientBusinessManagerId: '1234567890'
                  senderDetails:
                    displayName: Updated display name
                    businessCategory: NON_PROFIT
                    region: BR
