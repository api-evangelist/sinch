    TemplateReference:
      type: object
      title: Template reference with concrete parameter values
      description: The referenced template can be an omnichannel template stored in Conversation API Template Store as an AppMessage. You may also reference external channel-specific templates, such as a WhatsApp Business Template. Note that channel-specific template references are not supported when populating the `explicit_channel_omni_message` field.
      required:
      - template_id
      properties:
        version:
          type: string
          description: 'Used to specify what version of a template to use. Required when using `omni_channel_override` and `omni_template` fields.

            This will be used in conjunction with `language_code`. Note that, when referencing omni-channel templates using the [Sinch Customer Dashboard](https://dashboard.sinch.com/), the latest version of a given omni-template can be identified by populating this field with `latest`.'
        language_code:
          description: 'The BCP-47 language code, such as `en_US` or `sr_Latn`.

            For more information, see http://www.unicode.org/reports/tr35/#Unicode_locale_identifier. English is the default `language_code`.

            Note that, while many API calls involving templates accept either the dashed format (`en-US`) or the underscored format (`en_US`), some channel specific templates (for example, WhatsApp channel-specific templates) only accept the underscored format. Note that this field is required for WhatsApp channel-specific templates.'
          type: string
        parameters:
          description: 'Required if the template has parameters. Concrete values must

            be present for all defined parameters

            in the template. Parameters can be different for

            different versions and/or languages of the template.'
          type: object
          additionalProperties:
            type: string
        template_id:
          description: The ID of the template. Note that, in the case of WhatsApp channel-specific templates, this field must be populated by the name of the template.
          type: string
    CalendarMessageField:
