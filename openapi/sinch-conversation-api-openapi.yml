      summary: Inject Event Request
      value:
        id: string
        direction: TO_APP
        channel_identity:
          channel: MESSENGER
          identity: '{{FACEBOOK_USER_NAME}}'
          app_id: '{{APP_ID}}'
        app_event:
          composing_event: {}
        accept_time: YYYY-MM-DDTHH:MM:SS
    updateConversationRequest:
      summary: Update a conversation
      value:
        app_id: 'string '
        metadata: string
        active_channel: WHATSAPP
        active: true
    injectMessageRequest:
      summary: Inject a message into a specific conversation
      value:
        direction: TO_CONTACT
        channel_identity:
          channel: '{{CHANNEL_NAME}}'
          identity: '{{CHANNEL_IDENTITY}}'
        app_message:
          text_message:
            text: string
        contact_id: string
        accept_time: YYYY-MM-DDTHH:MM:SS
    injectEventResponse:
      summary: Inject event response
      value:
        event_id: string
        accepted_time: YYYY-MM-DDTHH:MM:SS
