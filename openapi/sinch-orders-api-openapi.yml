  /v1/projects/{projectId}/us/brands/{brandId}/orders/{orderId}/resendConfirmationEmail:
    post:
      x-sinch-stability: preview
      description: 'Resends the brand registration confirmation email to the end-customer. Certain product verification processes require the end-customer''s approval via email to complete a brand''s registration for a specific use case. If the end-customer has lost or did not receive the original email, you can call this endpoint to trigger a resend, enabling them to finalize the registration process.


        This action can only be requested if the order is in a PENDING state. Furthermore, this functionality is currently available only for 10DLC/RCS (TCR) registration processes.'
      operationId: brandOrderResendConfirmationEmail
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Brand ID reference
        name: brandId
        required: true
        schema:
          type: string
      - in: path
        description: Order ID
        name: orderId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandOrder'
              example:
                brandOrderId: '212421442412'
                brandId: b1c7ccbf-919d-462f-8587-dec95a1b11ee
                status: PENDING
                metadataName: US_10DLC_TCR_PRIVATE_BRAND_REGISTRATION
                logs: []
                channels: []
                thirdPartyMetadata: []
                pricing:
                  amount: '5.00'
                  currencyCode: USD
                callbackUrl: https://example.com/callback
                createTime: '2024-01-15T10:00:00Z'
                updateTime: '2024-01-15T10:06:00Z'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'BAD_REQUEST: Any validation error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          content:
            application/problem+json:
