  /v1/projects/{projectId}/us/brands/{brandId}/orders/{orderId}/verifyOtp:
    post:
      x-sinch-stability: preview
      description: 'Verifies the One-Time Password (OTP) received by the brand''s registered mobile phone number to complete the US_10DLC_TCR_SOLE_PROPRIETOR order. After creating the order, an OTP is automatically sent via SMS to the mobilePhoneNumber associated with the brand. Submit the OTP code using this endpoint to finalise the registration.


        Important Requirement: To successfully receive the OTP, the brand''s mobilePhoneNumber must be a valid United States (US) or Canadian (CA) phone number.'
      summary: Verify OTP code for 10DLC Sole Proprietor verification
      tags:
      - Orders
      security:
      - OAuth2:
        - write
      operationId: brandOrderVerifyOtp
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Brand ID reference
        name: brandId
        required: true
        schema:
          type: string
      - in: path
        description: Order ID
        name: orderId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: OTP received in the mobilePhoneNumber after creating the brand order.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandOrderOtpRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandOrder'
              example:
                brandOrderId: '212421442412'
                brandId: b1c7ccbf-919d-462f-8587-dec95a1b11ee
                status: COMPLETED
                metadataName: US_10DLC_TCR_SOLE_PROPRIETOR
                logs: []
                channels:
                - TENDLC
                thirdPartyMetadata:
                - name: TCR_BRAND_ID
                  value: B123ABC
                pricing:
                  amount: '5.50'
                  currencyCode: USD
                callbackUrl: https://example.com/callback
                createTime: '2024-01-15T10:00:00Z'
                updateTime: '2024-01-15T10:10:00Z'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'BAD_REQUEST: Any validation error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
