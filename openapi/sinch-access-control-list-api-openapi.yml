openapi: 3.2.0
info:
  title: Elastic SIP Trunk Access Control List API
  description: This document provides a detailed user guide and reference documentation on the Sinch Elastic SIP Trunk API.
  version: 1.0.0
  license:
    name: MIT
    url: https://www.sinch.com/toc
  contact:
    email: support@sinch.com
    name: support at sinch
servers:
- url: https://elastic-trunking.api.sinch.com
security:
- Basic: []
- OAuth2.0: []
tags:
- name: Access Control List
  description: 'The Access Control List (ACL) endpoint has operations that allow you to create, view, update, and remove ACLs.

    You use ACLs to control which IP addresses can send traffic to your SIP trunk. You can create multiple ACLs and assign them to multiple SIP trunks. In order to make outbound calls you need to have at least one ACL set up.'
  x-displayName: Access Control Lists
paths:
  /v1/projects/{projectId}/accessControlLists:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
      - Access Control List
      summary: List ACLs
      description: Fetches the list of Access Control List entries.
      operationId: getAccessControlList
      responses:
        '200':
          description: The list of ACL entries
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    accessControlLists:
                      type: array
                      items:
                        $ref: '#/components/schemas/AccessControlList'
                - $ref: '#/components/schemas/Pagination'
              examples:
                listAcls:
                  $ref: '#/components/examples/aclListResponse'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.list({});\n    if (response.data.length === 0) {\n      console.log('No ACLs found.');\n      return;\n    }\n    console.log(`✅ Found ${response.data.length} ACLs.`);\n    response.data.forEach((acl) => {\n      console.log(acl);\n    });\n  } catch (err) {\n    console.error('❌ Failed to list the ACLs:');\n    console.error(err);\n  }\n}\n\nmain();\n"
    post:
      tags:
      - Access Control List
      summary: Create an ACL
      description: Create an access control list entry with at least one IP address or IP range.
      operationId: createAccessControlList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessControlList'
            examples:
              createNewAcl:
                $ref: '#/components/examples/createAclReq'
      responses:
        '200':
          description: The list of access control list entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlList'
              examples:
                createNewAcl:
                  $ref: '#/components/examples/createAclRes'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try{\n    const response = await sinch.elasticSipTrunking.accessControlList.create({\n      createAccessControlListBody: {\n        name: 'My new ACL',\n        ipRanges: [\n          {\n            description: 'Location 1',\n            ipAddress: '15.15.15.15',\n            range: 20,\n          },\n        ],\n      },\n    });\n    console.log('✅ Successfully created the ACL.');\n    console.log(JSON.stringify(response, null, 2));\n  } catch (err) {\n    console.error('❌ Failed to create the ACL:');\n    console.error(err);\n  }\n}\n\nmain();\n"
  /v1/projects/{projectId}/accessControlLists/{id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: id
      in: path
      description: The ID of the access control list entry.
      required: true
      schema:
        type: string
    get:
      tags:
      - Access Control List
      operationId: getAccessListById
      summary: Get access control list
      description: Return an access control list by its ID.
      responses:
        '200':
          description: The returned access control list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlList'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the ACL to retrieve\n  const aclId = 'ACL_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.get({\n      id: aclId,\n    });\n    console.log('✅ Successfully retrieved the ACL.');\n    console.log(JSON.stringify(response, null, 2));\n  } catch (err) {\n    console.error(`❌ Failed to retrieve the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
    put:
      tags:
      - Access Control List
      summary: Update ACL
      description: Create an access control list entry with at least one IP address or IP range.
      operationId: updateAccessControlList
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Your name for the access control list entry.
                  example: LA Office
                enabled:
                  type: boolean
                  description: Whether the access control list entry is enabled. You can use this to disable a list temporarily without deleting it.
                  default: true
                ipRanges:
                  type: array
                  description: An array of all the IP ranges to update.
                  items:
                    $ref: '#/components/schemas/IpRange'
            examples:
              updateAcl:
                $ref: '#/components/examples/updateAclReq'
      responses:
        '200':
          description: The list of access control list entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlList'
              examples:
                updateAcl:
                  $ref: '#/components/examples/updateAclRes'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the ACL to update\n  const aclId = 'ACL_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.update({\n      id: aclId,\n      updateAccessControlListRequestBody: {\n        name: 'Updated ACL name',\n        enabled: false,\n      },\n    });\n    console.log('✅ Successfully updated the ACL.');\n    console.log(JSON.stringify(response, null, 2));\n  } catch (err) {\n    console.error(`❌ Failed to update the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
    delete:
      description: Delete an access control list entry.
      summary: Delete ACL
      operationId: deleteAccessControlList
      tags:
      - Access Control List
      responses:
        '204':
          description: No Content
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the ACL to delete\n  const aclId = 'ACL_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    await sinch.elasticSipTrunking.accessControlList.delete({\n      id: aclId,\n    });\n    console.log(`✅ Successfully deleted the ACL with ID ${aclId}.`);\n  } catch (err) {\n    console.error(`❌ Failed to delete the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
  /v1/projects/{projectId}/accessControlLists/{id}/trunks:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: id
      in: path
      description: The ID of the access control list entry.
      required: true
      schema:
        type: string
    get:
      summary: Get trunks for ACL
      description: Returns a list of all trunks which use the specified access control list.
      operationId: trunksByACL
      tags:
      - Access Control List
      responses:
        '200':
          description: The list of trunks which use the access control list.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    trunks:
                      type: array
                      items:
                        $ref: '#/components/schemas/SipTrunk'
                - $ref: '#/components/schemas/Pagination'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ACL ID you want to list SIP Trunks for\n  const aclId = 'ACL_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.listTrunks({\n      id: aclId,\n    });\n    if (response.data.length === 0) {\n      console.log(`No SIP Trunks found for the ACL with ID ${aclId}.`);\n      return;\n    }\n    console.log(`✅ Found ${response.data.length} SIP Trunks for the ACL with ID ${aclId}.`);\n    response.data.forEach((trunk) => {\n      console.log(trunk);\n    });\n  } catch (err) {\n    console.error(`❌ Failed to list the SIP Trunks for the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
  /v1/projects/{projectId}/accessControlLists/{accessControlListId}/ipRanges:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: accessControlListId
      in: path
      description: The ID of the access control list entry. that you want to work with
      required: true
      schema:
        type: string
    post:
      operationId: addIpRangeToAccessControlList
      description: Add an IP range to an access control list entry.
      summary: Add IP range to ACL
      tags:
      - Access Control List
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpRange'
            examples:
              addIpRange:
                $ref: '#/components/examples/addIpRangeReq'
      responses:
        '200':
          description: The list of IP ranges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRange'
              examples:
                addIpRange:
                  $ref: '#/components/examples/addIpRangeRes'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the ACL to which to add an IP range\n  const aclId = 'ACL_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.addIpRange({\n      accessControlListId: aclId,\n      addIpRangeRequestBody: {\n        description: 'IP range name',\n        ipAddress: '11.12.13.14',\n        range: 27,\n      },\n    });\n    console.log('✅ Successfully added IP range to ACL:');\n    console.log(JSON.stringify(response, null, 2));\n  } catch (err) {\n    console.error(`❌ Failed to add IP range to the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
    get:
      operationId: getIpRangesForAccessControlList
      summary: List all IP ranges for ACL
      description: Get all IP ranges for an access control list entry.
      tags:
      - Access Control List
      responses:
        '200':
          description: The list of IP ranges
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    ipRanges:
                      type: array
                      description: The list of IP ranges
                      items:
                        $ref: '#/components/schemas/IpRange'
                - $ref: '#/components/schemas/Pagination'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the ACL to list the IP ranges from\n  const aclId = 'ACL_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.listIpRanges({\n      accessControlListId: aclId,\n    });\n    if (response.data.length === 0) {\n      console.log(`No IP ranges found for the ACL with ID ${aclId}.`);\n      return;\n    }\n    console.log(`✅ Found ${response.data.length} IP ranges for ACL with ID ${aclId}.`);\n    response.data.forEach((ipRange) => {\n      console.log(ipRange);\n    });\n  } catch (err) {\n    console.error(`❌ Failed to list the IP ranges for the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
  /v1/projects/{projectId}/accessControlLists/{accessControlListId}/ipRanges/{ipRangeId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: accessControlListId
      in: path
      description: The ID of the access control list entry that you want to update.
      required: true
      schema:
        type: string
    - name: ipRangeId
      in: path
      description: The ID of the IP range that you want to update.
      required: true
      schema:
        type: string
    delete:
      operationId: deleteIpRangeFromAccessControlList
      summary: Delete IP range from ACL
      tags:
      - Access Control List
      description: Remove an IP range to an access control list entry.
      responses:
        '204':
          description: IP range deleted
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the ACL to delete the IP range from\n  const aclId = 'ACL_ID';\n  // The IP Range ID you want to delete from the ACL\n  const ipRangeId = 'IP_RANGE_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    await sinch.elasticSipTrunking.accessControlList.deleteIpRange({\n      accessControlListId: aclId,\n      ipRangeId: ipRangeId,\n    });\n    console.log(`✅ Successfully deleted the IP range ${ipRangeId} from the ACL with ID ${aclId}.`);\n  } catch (err) {\n    console.error(`❌ Failed to delete the IP range ${ipRangeId} from the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
    put:
      description: Update an IP range to an access control list entry.
      operationId: updateIpRangeFromAccessControlList
      summary: Update IP range
      tags:
      - Access Control List
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpRange'
            examples:
              updateIpRange:
                $ref: '#/components/examples/updateIpRangeReq'
      responses:
        '200':
          description: The updated IP range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRange'
              examples:
                updateIpRange:
                  $ref: '#/components/examples/updateAclRes'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ACL ID you want to update ACL from\n  const aclId = 'ACL_ID';\n  // The IP Range ID you want to update\n  const ipRangeId = 'IP_RANGE_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.accessControlList.updateIpRange({\n      accessControlListId: aclId,\n      ipRangeId: ipRangeId,\n      updateIpRangeRequestBody: {\n        ipAddress: '11.12.13.14',\n        range: 27,\n      },\n    });\n    console.log('✅ Successfully updated the IP Range.');\n    console.log(JSON.stringify(response, null, 2));\n  } catch (err) {\n    console.error(`❌ Failed to update the IP Range ${ipRangeId} in the ACL with ID ${aclId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
  /v1/projects/{projectId}/trunks/{trunkId}/accessControlLists:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: trunkId
      in: path
      description: The ID of the trunk that you want to work with
      required: true
      schema:
        type: string
    post:
      operationId: addAccessControlListToTrunk
      description: Add an access control list entry to a trunk.
      summary: Add ACL to a trunk
      tags:
      - Access Control List
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accessControlListIds:
                  type: array
                  description: Array of AccessControlList ids
                  items:
                    type: string
                    description: The ID of the access control list entry.
            examples:
              addAcl:
                $ref: '#/components/examples/addTrunkAclReq'
      responses:
        '200':
          description: The list of access control list entries
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    accessControlListIds:
                      type: array
                      description: Array of AccessControlList ids
                      items:
                        type: string
                        description: The ID of the access control list entry on assigned to trunk after update.
              examples:
                addAcl:
                  $ref: '#/components/examples/addTrunkAclRes'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The SIP Trunk ID you want to add ACLs to\n  const sipTrunkId = 'SIP_TRUNK_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try{\n    const response = await sinch.elasticSipTrunking.accessControlList.addToTrunk({\n      trunkId: sipTrunkId,\n      addAccessControlListToTrunkRequestBody: {\n        accessControlListIds: [\n          'AN_ACL_ID_TO_ADD',\n          'ANOTHER_ACL_ID_TO_ADD',\n        ],\n      },\n    });\n    console.log('✅ Successfully added the ACLs to the SIP Trunk.');\n    console.log(JSON.stringify(response, null, 2));\n  } catch (err) {\n    console.error(`❌ Failed to add the ACLs to the SIP Trunk with ID ${sipTrunkId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
    get:
      description: Get all access control list entries for a trunk.
      summary: List all ACLs for a trunk
      operationId: getAccessControlListsForTrunk
      tags:
      - Access Control List
      responses:
        '200':
          description: The list of access control list entries
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    accessControlListIds:
                      type: array
                      description: Array of AccessControlList ids
                      items:
                        type: string
                        description: The ID of the access control list entry.
                - $ref: '#/components/schemas/Pagination'
              examples:
                listTrunkAcls:
                  $ref: '#/components/examples/listTrunkAcls'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The SIP Trunk ID you want to list ACLs for\n  const sipTrunkId = 'SIP_TRUNK_ID';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try{\n    const response = await sinch.elasticSipTrunking.accessControlList.listForTrunk({\n      trunkId: sipTrunkId,\n    });\n    if (response.data.length === 0) {\n      console.log(`No ACLs found for the SIP Trunk with ID ${sipTrunkId}.`);\n      return;\n    }\n    console.log(`✅ Found ${response.data.length} ACLs for the SIP Trunk with ID ${sipTrunkId}.`);\n    response.data.forEach((acl) => {\n      console.log(acl);\n    });\n  } catch (err) {\n    console.error(`❌ Failed to list the ACLs for the SIP Trunk with ID ${sipTrunkId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
  /v1/projects/{projectId}/trunks/{trunkId}/accessControlLists/{accessControlListId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - name: trunkId
      in: path
      description: The ID of the trunk that you want to work with
      required: true
      schema:
        type: string
    - name: accessControlListId
      in: path
