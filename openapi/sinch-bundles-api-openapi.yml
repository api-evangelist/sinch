openapi: 3.2.0
info:
  title: Provisioning Bundles API
  description: The bundles endpoint allows you to create and manage bundles of account resources.
  version: 1.2.117
servers:
- url: https://provisioning.api.sinch.com
  description: Production server
security:
- BasicAuth: []
  BearerAuth: []
  OAuth2Production: []
tags:
- name: Bundles
  description: The bundles endpoint allows you to create and manage bundles of account resources.
paths:
  /v1/projects/{projectId}/bundles:
    get:
      description: Returns a paginated list of bundles for a given project, optionally filtered by SMS App IDs, Conversation App IDs, or bundle states. If no page token is supplied then the first `10` will be returned.
      operationId: BundlesBundlesController_list_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: pageToken
        required: false
        in: query
        schema:
          type: string
        description: The page token if retrieving the next page from a previous query.
      - name: pageSize
        required: false
        in: query
        schema:
          type: number
          minimum: 1
          maximum: 25
        description: The page size requested.
      - name: filterConvAppIds
        required: false
        in: query
        description: Optional query for filtering by Conversation App IDs.
        schema:
          type: array
          items:
            type: string
      - name: filterSmsAppIds
        required: false
        in: query
        description: Optional query for filtering by SMS App IDs.
        schema:
          type: array
          items:
            type: string
      - name: filterStates
        required: false
        in: query
        description: Optional query for filtering by bundle states.
        x-enumDescriptions:
          DONE: The service setup has completed successfully.
          FAILED: The service setup failed and requires troubleshooting or manual retry.
          IN_PROGRESS: The service setup is currently executing.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BundlesBundleServicesStateEnum'
      responses:
        '200':
          description: List of bundles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesListBundlesDto'
              examples:
                response:
                  summary: List response
                  description: "\n    Response with sms apps.\n    "
                  value:
                    totalSize: 1
                    pageSize: 10
                    bundles:
                    - id: 62a02dd40000000000000000
                      projectId: ea026751-3edf-40a9-ad93-1b382bd60a78
                      name: Sample response
                      region: US
                      subproject:
                        id: ea026751-3edf-40a9-ad93-1b382bd60a78
                        name: Sample response
                        parentProjectId: 18bbdcc8-117d-42f0-85cc-e30462c49404
                        status: PENDING
                      smsApp:
                        id: 54e5eb6cae6242c88c132c8da8bb1072
                        smsServiceId: d84b09da00fb4b76ff63f2fcea8d46c7
                        name: Sample response
                        status: PENDING_ADD
                        regions:
                        - US
                        test: false
                      convApp:
                        id: 31c12b1042d14b37ae96df96bb13575b
                        name: Sample response
                        processingMode: CONVERSATION
                      webhooks:
                      - id: 7c60ce550f1d40198d5ffb113d58591b
                        projectId: ea026751-3edf-40a9-ad93-1b382bd60a78
                        target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                        triggers:
                        - BUNDLE_DONE
                      state: IN_PROGRESS
                    - id: 55402ee30230777000098701
                      projectId: 6b48c78b-b924-433d-9b7d-2bb2a30e7d56
                      name: Bundle name
                      region: US
                      subproject:
                        id: 6b48c78b-b924-433d-9b7d-2bb2a30e7d56
                        name: Subproject name
                        parentProjectId: 8c9148fa-8f4e-46f6-8229-565ce0f527be
                        status: READY
                      smsApp:
                        id: 64efff6cae6242c88cfee38da8bb8976
                        smsServiceId: 566544da00fb4b769008f2fcea9067e3
                        name: SMS App name
                        status: ACTIVE
                        regions:
                        - US
                        test: false
                      convApp:
                        id: aa252b10e5614b37ff96df96bb560092
                        name: Conversation App name
                        processingMode: CONVERSATION
                      webhooks:
                      - id: 9981ce550f1dfea0005ffb113d581434
                        projectId: 6b48c78b-b924-433d-9b7d-2bb2a30e7d56
                        target: https://webhook.site/de85df25-f474-4997-b50d-264955e3cedb
                        triggers:
                        - BUNDLE_DONE
                      state: DONE
                      webhookDeliveryStatuses:
                      - webhookId: 9981ce550f1dfea0005ffb113d581434
                        date: '2026-06-24T11:54:15.123Z'
                        httpStatusCode: 200
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                invalid_page_token-0:
                  summary: InvalidPageTokenError
                  value:
                    errorCode: invalid_page_token
                    message: Invalid page token.
                    resolution: The page token to use is provided in the previous query response, for new queries simply leave this field undefined.
                invalid_page_size-1:
                  summary: InvalidPageSizeError
                  value:
                    errorCode: invalid_page_size
                    message: Page size must be numeric.
                    resolution: Use a integer value for pageSize parameter.
                invalid_id_format-2:
                  summary: InvalidIdFormatError
                  value:
                    errorCode: invalid_id_format
                    message: Id is not in the expected format.
                    resolution: projectId param is in the wrong format. Confirm that you're sending the correct value.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: List bundles by projectId
      tags:
      - Bundles
      x-badges:
      - name: GA
        position: after
        color: green
    post:
      callbacks:
        BundleDone:
          '{$request.body#webhooks.target}':
            post:
              summary: Bundle Done Event
              description: "\n        When a bundle is completed, the system makes a `POST` request to the specified callback URL.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, will always be `BUNDLE_DONE` for this callback.
                          type: string
                        payload:
                          description: Bundle data representing the completed form.
                          allOf:
                          - $ref: '#/components/schemas/BundlesBundlesDto'
                      required:
                      - type
                      - payload
                    example:
                      type: BUNDLE_DONE
                      payload:
                        id: 62a02dd40000000000000000
                        projectId: ea026751-3edf-40a9-ad93-1b382bd60a78
                        name: Sample response
                        region: US
                        subproject:
                          id: ea026751-3edf-40a9-ad93-1b382bd60a78
                          name: Sample response
                          parentProjectId: 18bbdcc8-117d-42f0-85cc-e30462c49404
                          status: READY
                        smsApp:
                          id: 54e5eb6cae6242c88c132c8da8bb1072
                          smsServiceId: d84b09da00fb4b76ff63f2fcea8d46c7
                          name: Sample response
                          status: ACTIVE
                          regions:
                          - US
                          test: false
                        convApp:
                          id: 31c12b1042d14b37ae96df96bb13575b
                          name: Sample response
                          processingMode: CONVERSATION
                          smsChannelStatus: PENDING
                        webhooks:
                        - id: 7c60ce550f1d40198d5ffb113d58591b
                          projectId: ea026751-3edf-40a9-ad93-1b382bd60a78
                          target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                          triggers:
                          - BUNDLE_DONE
                        state: DONE
                        webhookDeliveryStatuses:
                        - webhookId: 7c60ce550f1d40198d5ffb113d58591b
                          date: '2025-02-14T10:54:15.676Z'
                          httpStatusCode: 200
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
      description: Creates a new bundle of resources based on the input work order.
      operationId: BundlesBundlesController_create_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      requestBody:
        required: true
        description: Example Bundle create requests
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/BundlesInputBundlesDto'
            examples:
              small:
                summary: Small example
                description: "\n    Small example to create a subproject, SMS App and Conversation App. The webhooks for Conversation API and Provisioning API are examples and can be extended.\n    "
                value:
                  name: Small bundle example
                  region: US
                  subproject: true
                  smsApp: true
                  convApp:
                    name: Conversation App Example
                    webhooks:
                    - target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                      secret: secret
                      triggers:
                      - MESSAGE_DELIVERY
                    processingMode: DISPATCH
                    retentionPolicy:
                      retentionPolicyType: MESSAGE_EXPIRE_POLICY
                      ttl: 7
                    consentManagerSettings:
                      mode: PRIMARY
                  webhooks:
                  - target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                    secret: secret
                    triggers:
                    - BUNDLE_DONE
              minimal:
                summary: Minimal example
                description: "\n    Minimal example to create a subproject, SMS App and Conversation App. This will not register any webhooks which will have to be done separately.\n    "
                value:
                  name: Minimal bundle example
                  region: US
                  subproject: true
                  smsApp: true
                  convApp: true
              full:
                summary: Full example
                description: "\n    Full example with all options filled in. The webhooks for Conversation API and Provisioning API are examples and can be extended.\n    "
                value:
                  name: Full bundle example
                  region: US
                  subproject:
                    name: Subproject Example
                    labels:
                      env: testing
                      team: QA-team
                  smsApp:
                    name: Sms App Example
                  convApp:
                    name: Conversation App Example
                    webhooks:
                    - target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                      secret: secret
                      triggers:
                      - MESSAGE_DELIVERY
                    processingMode: DISPATCH
                    retentionPolicy:
                      retentionPolicyType: MESSAGE_EXPIRE_POLICY
                      ttl: 7
                    consentManagerSettings:
                      mode: PRIMARY
                  webhooks:
                  - target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                    secret: secret
                    triggers:
                    - BUNDLE_DONE
                  testNumber: true
      responses:
        '201':
          description: Responds with the bundle created. At time of response the bundle might not be completed. To receive the complete payload register a webhook for the `BUNDLE_DONE` trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesBundlesDto'
              examples:
                notReady:
                  summary: Pending response
                  description: "\n    Response if the SMS App is not ready. This is the most likely response.\n    "
                  value:
                    id: 62a02dd40000000000000000
                    projectId: ea026751-3edf-40a9-ad93-1b382bd60a78
                    name: Sample response
                    region: US
                    subproject:
                      id: ea026751-3edf-40a9-ad93-1b382bd60a78
                      name: Sample response
                      parentProjectId: 18bbdcc8-117d-42f0-85cc-e30462c49404
                      status: PENDING
                    smsApp:
                      id: 54e5eb6cae6242c88c132c8da8bb1072
                      smsServiceId: d84b09da00fb4b76ff63f2fcea8d46c7
                      name: Sample response
                      status: PENDING_ADD
                      regions:
                      - US
                      test: false
                    convApp:
                      id: 31c12b1042d14b37ae96df96bb13575b
                      name: Sample response
                      processingMode: CONVERSATION
                    webhooks:
                    - id: 7c60ce550f1d40198d5ffb113d58591b
                      projectId: ea026751-3edf-40a9-ad93-1b382bd60a78
                      target: https://webhook.site/d614d077-302a-4e0b-a06a-276923f7d8d4
                      triggers:
                      - BUNDLE_DONE
                    state: IN_PROGRESS
                ready:
                  summary: Completed response
                  description: "\n    Response if the SMS App is ready. The data is the same as the callback payload.\n    "
                  value:
                    id: 55402ee30230777000098701
                    projectId: 6b48c78b-b924-433d-9b7d-2bb2a30e7d56
                    name: Bundle name
                    region: US
                    subproject:
                      id: 6b48c78b-b924-433d-9b7d-2bb2a30e7d56
                      name: Subproject name
                      parentProjectId: 8c9148fa-8f4e-46f6-8229-565ce0f527be
                      status: READY
                    smsApp:
                      id: 64efff6cae6242c88cfee38da8bb8976
                      smsServiceId: 566544da00fb4b769008f2fcea9067e3
                      name: SMS App name
                      status: ACTIVE
                      regions:
                      - US
                      test: false
                    convApp:
                      id: aa252b10e5614b37ff96df96bb560092
                      name: Conversation App name
                      processingMode: CONVERSATION
                    webhooks:
                    - id: 9981ce550f1dfea0005ffb113d581434
                      projectId: 6b48c78b-b924-433d-9b7d-2bb2a30e7d56
                      target: https://webhook.site/de85df25-f474-4997-b50d-264955e3cedb
                      triggers:
                      - BUNDLE_DONE
                    state: DONE
                    webhookDeliveryStatuses:
                    - webhookId: 9981ce550f1dfea0005ffb113d581434
                      date: '2026-06-24T11:54:15.123Z'
                      httpStatusCode: 200
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                invalid_input-0:
                  summary: InvalidInputError
                  value:
                    errorCode: invalid_input
                    message: Invalid input.
                    resolution: Correct the validation errors and submit again.
                    additionalInformation:
                      validationErrors:
                      - subproject must be boolean or object
                invalid_payload-1:
                  summary: InvalidPayloadError
                  value:
                    errorCode: invalid_payload
                    message: Invalid payload.
                    resolution: Correct payload and submit again.
                no_services_to_create-2:
                  summary: NoServicesToCreateError
                  value:
                    errorCode: no_services_to_create
                    message: No services to create.
                    resolution: Add at least one service to create.
                missing_name-3:
                  summary: MissingNameError
                  value:
                    errorCode: missing_name
                    message: Missing name for bundles.
                    resolution: Make sure you have given a separate service name or principal.
                invalid_webhooks-4:
                  summary: InvalidWebhooksError
                  value:
                    errorCode: invalid_webhooks
                    message: Unable to create webhooks.
                    resolution: Please try again.
                invalid_staging_bundles_input_region-5:
                  summary: InvalidStagingBundlesInputRegionError
                  value:
                    errorCode: invalid_staging_bundles_input_region
                    message: Invalid bundles region for staging.
                    resolution: Verify that bundles region is valid for staging. Allowed bundles regions for staging EU, US.
                parent_sms_bespoke_price-6:
                  summary: ParentSmsBespokePriceError
                  value:
                    errorCode: parent_sms_bespoke_price
                    message: Parent SMS service has bespoke pricing.
                    resolution: SMS apps cannot be copied from a parent project that has bespoke pricing configured.
                target_project_not_subproject-7:
                  summary: TargetProjectNotSubprojectError
                  value:
                    errorCode: target_project_not_subproject
                    message: Target project is not a subproject.
                    resolution: Copying an SMS app from a parent is only supported when the target project is a subproject.
                parent_sms_not_route_assisted-8:
                  summary: ParentSmsNotRouteAssistedError
                  value:
                    errorCode: parent_sms_not_route_assisted
                    message: Parent SMS service is not route assisted.
                    resolution: SMS apps can only be copied from a parent project whose SMS service is route assisted.
                conversation_app_already_connected_to_sms_app-9:
                  summary: ConversationAppAlreadyConnectedToSmsAppError
                  value:
                    errorCode: conversation_app_already_connected_to_sms_app
                    message: Conversation App is already connected to an SMS App.
                    resolution: Use the SMS App that is already connected to the Conversation App or disconnect the currently connected SMS App before connecting another SMS App.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                forbidden_payload-0:
                  summary: ForbiddenPayloadError
                  value:
                    errorCode: forbidden_payload
                    message: Forbidden payload.
                    resolution: Please ensure that you have permission to use that payload.
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                conversation_app_not_found-0:
                  summary: ConversationAppNotFoundError
                  value:
                    errorCode: conversation_app_not_found
                    message: Conversation App not found.
                    resolution: Verify that the appId is correct.
                sms_app_not_found-1:
                  summary: SmsAppNotFoundError
                  value:
                    errorCode: sms_app_not_found
                    message: SmsApp not found.
                    resolution: Verify that the appId is correct.
                default_sms_app_not_found-2:
                  summary: DefaultSmsAppNotFoundError
                  value:
                    errorCode: default_sms_app_not_found
                    message: Default SmsApp not found.
                    resolution: Create SmsApp in test mode to use in request.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                webhook_exists-0:
                  summary: WebhookExistsError
                  value:
                    errorCode: webhook_exists
                    message: Webhook with the provided target already exists.
                    resolution: Webhooks must have a unique target. Change the target and submit again.
                conversation_app_is_already_in_bundles_process-1:
                  summary: ConversationAppIsAlreadyInBundlesProcessError
                  value:
                    errorCode: conversation_app_is_already_in_bundles_process
                    message: Conversation App is already in Bundles process.
                    resolution: Please select another conversationAppId for which the request is to be made.
                default_sms_app_already_exists-2:
                  summary: DefaultSmsAppAlreadyExistsError
                  value:
                    errorCode: default_sms_app_already_exists
                    message: Default SmsApp already exists.
                    resolution: Please contact with support.
                more_than_one_sms_app-3:
                  summary: MoreThanOneSmsAppError
                  value:
                    errorCode: more_than_one_sms_app
                    message: More than one SmsApp.
                    resolution: Please select the smsAppId for which the request is to be made.
                sms_app_is_already_linked_to_conversation_app-4:
                  summary: SmsAppIsAlreadyLinkedToConversationAppError
                  value:
                    errorCode: sms_app_is_already_linked_to_conversation_app
                    message: SmsApp is already linked to ConversationApp.
                    resolution: Please select another smsAppId for which the request is to be made.
                sms_app_is_already_in_bundles_process-5:
                  summary: SmsAppIsAlreadyInBundlesProcessError
                  value:
                    errorCode: sms_app_is_already_in_bundles_process
                    message: SmsApp is already in Bundles process.
                    resolution: Please select another smsAppId for which the request is to be made.
                allowed_only_for_default_test_sms_app-6:
                  summary: AllowedOnlyForDefaultTestSmsAppError
                  value:
                    errorCode: allowed_only_for_default_test_sms_app
                    message: Allowed only for default test SMS app.
                    resolution: Verify that the SMS app is marked as defaultTest.
                not_allowed_for_subproject-7:
                  summary: NotAllowedForSubprojectError
                  value:
                    errorCode: not_allowed_for_subproject
                    message: Not allowed for subproject.
                    resolution: Verify that the subproject is eligible for test numbers.
                not_allowed_for_non_test_account-8:
                  summary: NotAllowedForNonTestAccountError
                  value:
                    errorCode: not_allowed_for_non_test_account
                    message: Not allowed for non test account.
                    resolution: Verify that the account is a test account.
                only_one_test_number_allowed-9:
                  summary: OnlyOneTestNumberAllowedError
                  value:
                    errorCode: only_one_test_number_allowed
                    message: Only one active test number is allowed per project.
                    resolution: Verify that there are no other active test numbers in the project.
        '424':
          description: FailedDependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                webhook_limit_reached-0:
                  summary: WebhookLimitReachedError
                  value:
                    errorCode: webhook_limit_reached
                    message: Number of webhooks has reached the limit.
                    resolution: Delete some webhooks to be able to add more.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesPapiErrorDto'
              examples:
                failed_to_create_subproject-0:
                  summary: FailedToCreateSubprojectError
                  value:
                    errorCode: failed_to_create_subproject
                    message: Failed to create subproject.
                    resolution: Please try again.
                failed_to_create_sms_service-1:
                  summary: FailedToCreateSmsServiceError
                  value:
                    errorCode: failed_to_create_sms_service
                    message: Failed to create sms service.
                    resolution: Please try again.
                failed_to_create_conversation_service-2:
                  summary: FailedToCreateConversationServiceError
                  value:
                    errorCode: failed_to_create_conversation_service
                    message: Failed to create conversation service.
                    resolution: Please try again.
                internal_error-3:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: Create bundle for project
      tags:
      - Bundles
      x-badges:
      - name: GA
        position: after
        color: green
  /v1/projects/{projectId}/bundles/{bundleId}:
    get:
      description: Retrieve created bundle and resources created.
      operationId: BundlesBundlesController_get_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: bundleId
        required: true
        in: path
        description: The unique ID of the bundle.
        schema:
          type: string
      responses:
        '200':
          description: Responds with the bundle created. At time of response the bundle might not be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundlesBundlesDto'
              examples:
                notReady:
                  summary: Pending response
                  description: "\n    Response if the SMS App is not ready. This is the most likely response.\n    "
                  value:
