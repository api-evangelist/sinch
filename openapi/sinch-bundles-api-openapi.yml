          example: true
          description: "\nSubproject resource block.\n\nIf set to true, a subproject will be created under the provided projectId with default name from the root object. Optionally a different name can be specified as well as labels on the project.\n\nIf not provided or set to false, a subproject will not be created and instead all resources will be created under the projectId provided in the request.\n  "
          uniqueItems: false
        smsApp:
          oneOf:
          - $ref: '#/components/schemas/BundlesInputBundlesSmsAppDto'
          - type: boolean
            description: Set to `true` to use default values. Set to `false` or omit to not create an SMS app.
          example: true
          description: "\nSMS Application resource block.\n\nIf set to true, an SMS Application will be created under the project or subproject specified. Optionally a different name can specified.\n\nIf not provided or set to false, an SMS Application will not be created.\n  "
          uniqueItems: false
        convApp:
