      - region
    BundlesConversationAppWebhooksInputDto:
      type: object
      properties:
        target:
          type: string
          maxLength: 742
          description: The target url where events should be sent to. The conversation-api.*.sinch.com subdomains are forbidden.
          uniqueItems: false
        triggers:
          type: array
          x-enumDescriptions:
            BATCH_DELIVERY_REPORT_FULL: Triggers when a complete batch delivery report payload is ready for dispatch.
            BATCH_DELIVERY_REPORT_SUMMARY: Triggers when a summary representation of a batch delivery report is generated.
            BATCH_STATUS_UPDATE: Triggers when the general state of a message batch updates.
            BILLING_CREDIT_LIMIT_BREACHED: Triggers when the associated account breaches its pre-configured billing credit boundary.
            CAPABILITY: Triggers when the operational capabilities of a target contact identity are updated.
            CHANNEL_EVENT: Triggers when an isolated event occurs on an active communication channel.
            CONSENT_BATCH_COMPLETE: Triggers when the bulk processing configuration for user consent data completes execution.
            CONTACT_CREATE: Triggers when a completely new contact identity profile is registered.
            CONTACT_DELETE: Triggers when an existing contact identity profile is removed from storage.
            CONTACT_IDENTITIES_DUPLICATION: Triggers when identical unique fields are detected across multiple customer records.
            CONTACT_MERGE: Triggers when independent user identity footprints consolidate into a single record.
            CONTACT_UPDATE: Triggers when specific configuration attributes on a profile are updated.
            CONVERSATION_DELETE: Triggers when an active or historic interaction footprint is purged from log data.
            CONVERSATION_START: Triggers when a fresh interaction loop initializes with a target identity.
            CONVERSATION_STOP: Triggers when an ongoing session loop explicitly terminates or expires.
            EVENT_DELIVERY: Triggers when a system or channel action event is successfully dispatched to the target.
            EVENT_INBOUND: Triggers when an external system or user action payload enters the API processing cycle.
            MESSAGE_DELIVERY: Triggers when a communication text or rich data asset successfully targets the destination node.
            MESSAGE_INBOUND: Triggers when an incoming communication piece from an end-user hits the messaging gateway.
            MESSAGE_INBOUND_SMART_CONVERSATION_REDACTION: Triggers when a message object undergoes automated sensitive data scrubbing prior to ingestion.
            MESSAGE_SUBMIT: Triggers when an explicit delivery request is initially registered by the API ingestion layer.
            OPT_IN: Triggers when a client record submits a confirmation to receive notifications.
            OPT_OUT: Triggers when a client record revokes baseline authorization to receive outbound communication.
            RECORD_NOTIFICATION: Triggers when an internal system audit log changes state.
            SMART_CONVERSATION: Triggers when natural language workflows process automated contextual interaction variables.
            UNSUPPORTED: Triggers when an incoming trigger structure fails validation criteria.
          uniqueItems: true
          maxLength: 20
          description: An array of triggers that should trigger the webhook and result in an event being sent to the target url.
          items:
            $ref: '#/components/schemas/BundlesWebhooksInputWebhookTriggerEnum'
        secret:
          type: string
          description: Optional secret used to sign contents of webhooks sent by the Conversation API. You can then use the secret to verify the signature.
          uniqueItems: false
        targetType:
          x-enumDescriptions:
            DISMISS: Drops the payload without executing delivery attempts to any destinations.
            GRPC: Routes the payload directly via an active gRPC stream connection.
            HTTP: Dispatches the payload via a standard HTTP POST callback configuration.
          description: Conversation API webhook target type.
          default: HTTP
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/BundlesInputWebhookTargetTypesEnum'
      required:
      - target
      - triggers
    BundlesConversationAppConsentManagerSettingsDto:
      type: object
      properties:
        mode:
          x-enumDescriptions:
            DISABLED: The consent manager integration is disabled.
            PRIMARY: The consent manager utilizes the primary data governance tracking mode.
            SECONDARY: The consent manager utilizes the secondary data governance fallback tracking mode.
            UNRECOGNIZED: The value returned by an upstream system is not recognized by this API version.
          description: "\nConversation API consent manager settings mode.\n    "
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/BundlesConversationAppConsentManagerSettingsModesEnum'
      required:
      - mode
    BundlesWebhookInputDto:
      type: object
      properties:
        target:
          type: string
          description: A valid target url where events should be sent to.
          maxLength: 742
          minLength: 1
          format: url
          uniqueItems: false
        secret:
          type: string
          description: Secret to be used to sign contents of webhooks sent by the provisioning API. You can then use the secret to verify the signature. Please not that secret should have a high entropy to be considered secure.
          maxLength: 128
          minLength: 1
          uniqueItems: false
        triggers:
