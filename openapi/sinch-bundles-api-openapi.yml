            WHATSAPP_ACCOUNT_PENDING_VERIFICATION: Webhook event triggered when a WhatsApp account is pending verification.
            WHATSAPP_ACCOUNT_REJECTED: Webhook event triggered when a WhatsApp account is rejected.
            WHATSAPP_ACCOUNT_COMMENT_ADDED: Webhook event triggered when a new comment is added to a WhatsApp account.
            WHATSAPP_ACCOUNT_DAILY_LIMIT_CHANGED: Webhook event triggered when a WhatsApp account daily messaging limit changes.
            WHATSAPP_WABA_ACCOUNT_CHANGED: Webhook event triggered when the linked WhatsApp Business Account changes.
            WHATSAPP_SENDER_ACTIVE: Webhook event triggered when a WhatsApp sender becomes active.
            WHATSAPP_SENDER_INACTIVE: Webhook event triggered when a WhatsApp sender becomes inactive.
            WHATSAPP_SENDER_REJECTED: Webhook event triggered when a WhatsApp sender is rejected.
            WHATSAPP_SENDER_DELETED: Webhook event triggered when a WhatsApp sender is deleted.
            WHATSAPP_SENDER_DISPLAY_NAME_UPDATED: Webhook event triggered when a WhatsApp sender display name is updated.
            WHATSAPP_SENDER_ERROR: Webhook event triggered when a WhatsApp sender enters an error state.
            WHATSAPP_SENDER_PENDING_VERIFICATION: Webhook event triggered when a WhatsApp sender is pending verification.
            WHATSAPP_SENDER_COMMENT_ADDED: Webhook event triggered when a new comment is added to a WhatsApp sender.
            WHATSAPP_SENDER_DAILY_LIMIT_CHANGED: Webhook event triggered when a WhatsApp sender daily messaging limit changes.
            WHATSAPP_SENDER_QUALITY_RATING_CHANGED: Webhook event triggered when a WhatsApp sender quality rating changes.
