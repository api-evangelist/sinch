openapi: 3.2.0
info:
  title: Sinch Calls API
  x-refined-note:
  - x-sinch-standards-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Calls across 5 of this provider''s published API definitions: sinch-elastic-sip-trunking-api-openapi.yaml, sinch-voice-api-openapi.yaml, sinch-voice-api-v2-openapi.yaml, original-sinch-voice-openapi.yml, sinch-voice-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://elastic-trunking.api.sinch.com
- url: https://calling.api.sinch.com
  description: redirected by Sinch to an appropriate region
- url: https://calling-use1.api.sinch.com
  description: United States
- url: https://calling-euc1.api.sinch.com
  description: Europe
- url: https://calling-sae1.api.sinch.com
  description: South America
- url: https://calling-apse1.api.sinch.com
  description: Southeast Asia 1
- url: https://calling-apse2.api.sinch.com
  description: Southeast Asia 2
- url: https://voice.api.sinch.com
  description: Endpoint which enables consuming the Voice API globally - Redirected by Sinch to the closest region.
- url: https://us1.voice.api.sinch.com
  description: North America 1 - East
- url: https://br1.voice.api.sinch.com
  description: South America 1 - East
- url: https://eu1.voice.api.sinch.com
  description: Europe 1 - Central
- url: https://sg1.voice.api.sinch.com
  description: Asia Pacific 1 - Southeast
- url: https://au1.voice.api.sinch.com
  description: Australia & Oceania 1 - Southeast
tags:
- name: Calls
  description: The `/calls` endpoint has operations that allow you to retrieve call history and details about calls made or received using EST.
paths:
  /v1/projects/{projectId}/calls:
    get:
      summary: Find calls
      description: Find calls by query parameters.
      operationId: findCalls
      tags:
      - Calls
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: from
        in: query
        description: A phone number that you want to use to filter results. You can pass a partial number to get all calls sent to numbers that start with the number you passed.
        required: false
        schema:
          type: string
          format: phonenumber
      - name: to
        in: query
        description: Only include calls made to this number or address. You can pass a partial number to get all calls sent to numbers that start with the number you passed.
        required: false
        schema:
          type: string
          format: phonenumber
      - name: trunkId
        in: query
        description: Only include calls made from this trunk.
        required: false
        schema:
          type: string
      - name: createTime
        description: 'Filter calls based on  `createTime`. You make the query more precise, fewer results will be returned.

          For example, 2021-02-01 will return all calls from the first of February 2021, and 2021-02-01T14:00:00Z will return all calls after 14:00 on the first of February.

          This field also supports <= and >= to search for calls in a range ?createTime>=2021-10-01&createTime<=2021-10-30 to get a list if calls for october 2021

          It is also possible to submit partial dates for example createTime=2021-02 will return all calls for February


          ***Defaults to 24 hours***


          ***Internal notes***

          If a customer submits = and not <> we should add min and max for the date range

          psueodo sql


          ```

          createTime = 2021-02-01

          select * from calls where createTime >= 2021-02-01 and createTime <= 2021-02-01T23:59:59Z


          createTime = 2021-02-01T08

          select * from calls where createTime >= 2021-02-01T08:00:00 and createTime <= 2021-02-01T08:59:59Z

          ```


          but if they submit < or > we should just use the value they submitted and parse it a complete date'
        required: false
        in: query
        schema:
          type: string
          example: '2021-02-01'
          default: now-24h
      - name: callResult
        in: query
        description: only include calls by on the callResult(s), example callResult=COMPLETED will return all calls which have completed normally.
        required: false
        schema:
          $ref: '#/components/schemas/CallResult'
      - name: direction
        in: query
        description: only include calls by on the direction(s), example direction=INBOUND,OUTBOUND will return all calls that are inbound or outbound.
        required: false
        schema:
          type: string
          description: Filter results based on the call direction.
          enum:
          - INBOUND
          - OUTBOUND
          x-ga-description: Describes whether the call was `INBOUND` *to* your Sinch number or was `OUTBOUND` and made *from* your Sinch number. An `INBOUND` call can also come from a SIP infrastructure or an application built using the Sinch SDK. An `OUTBOUND` call can be placed to a SIP infrastructure or an application built using the Sinch SDK.
          x-enumDescriptions:
            INBOUND: Somebody called your Sinch number.
            OUTBOUND: You called somebody from your SIP device.
      - name: page
        in: query
        description: The page you want to fetch
        schema:
          type: string
      - name: size
        in: query
        description: The maximum number of items to return per request. The default is 100 and the maximum is 1000. If you need to export larger amounts and pagination is not suitable for you can use the Export function in the dashboard.
        schema:
          type: integer
          maximum: 1000
          minimum: 1
      responses:
        '200':
          description: Call result response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    calls:
                      type: array
                      description: The list of calls that matches the query parameters.
                      items:
                        $ref: '#/components/schemas/Call'
                - $ref: '#/components/schemas/Pagination'
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // Replace with a valid 'from' number in your call history\n  const fromFilter = '+1781';\n  // Replace with one of: 'COMPLETED', 'NO_ANSWER', 'CANCEL', 'BUSY', 'FAILED'\n  const callResultFilter = 'FAILED';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.calls.find({\n      from: fromFilter,\n      callResult: callResultFilter,\n    });\n    if (response.data.length === 0) {\n      console.log('No calls found matching your criteria.');\n      return;\n    }\n    console.log(`✅ Found ${response.data.length} calls.`);\n    response.data.forEach((call) => {\n      console.log(call);\n    });\n  } catch (err) {\n    console.error('❌ Failed to find calls:');\n    console.error(err);\n  }\n}\n\nmain();\n"
      security:
      - Basic: []
      - OAuth2.0: []
    servers:
    - url: https://elastic-trunking.api.sinch.com
  /v1/projects/{projectId}/calls/export:
    get:
      tags:
      - Calls
      summary: Export call records
      description: Export call records for a project. This returns a comma separate value (CSV) response. You can specify which records to export using the query parameters.
      operationId: exportCallRecords
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: from
        in: query
        description: A phone number that you want to use to filter results. You can pass a partial number to get all calls sent to numbers that start with the number you passed.
        required: false
        schema:
          type: string
          format: phonenumber
      - name: to
        in: query
        description: Only include calls made to this number or address. You can pass a partial number to get all calls sent to numbers that start with the number you passed.
        required: false
        schema:
          type: string
          format: phonenumber
      - name: trunkId
        in: query
        description: Only include calls made from this trunk.
        required: false
        schema:
          type: string
      - name: createTime
        description: 'Filter calls based on  `createTime`. You make the query more precise, fewer results will be returned.

          For example, 2021-02-01 will return all calls from the first of February 2021, and 2021-02-01T14:00:00Z will return all calls after 14:00 on the first of February.

          This field also supports <= and >= to search for calls in a range ?createTime>=2021-10-01&createTime<=2021-10-30 to get a list if calls for october 2021

          It is also possible to submit partial dates for example createTime=2021-02 will return all calls for February


          ***Defaults to 24 hours***'
        required: false
        in: query
        style: form
        explode: true
        schema:
          type: string
          example: '2021-02-01'
          default: now-24h
      - name: callResult
        in: query
        description: only include calls by on the callResult(s), example callResult=COMPLETED will return all calls which have completed normally.
        required: false
        style: form
        explode: false
        schema:
          $ref: '#/components/schemas/CallResult'
      - name: direction
        in: query
        description: only include calls by on the direction(s), example direction=INBOUND,OUTBOUND will return all calls that are inbound or outbound.
        required: false
        style: form
        explode: false
        schema:
          type: string
          description: Filter results based on the call direction. Describes whether the call was `INBOUND` *to* your Sinch number or was `OUTBOUND` and made *from* your Sinch number. An `INBOUND` call can also come from a SIP infrastructure or an application built using the Sinch SDK. An `OUTBOUND` call can be placed to a SIP infrastructure or an application built using the Sinch SDK.
          enum:
          - INBOUND
          - OUTBOUND
          x-enumDescriptions:
            INBOUND: Somebody called your Sinch number.
            OUTBOUND: You called somebody from your SIP device.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: fromCountryCode
        in: query
        required: false
        description: Set this if you want to filter on the country of the caller phone number.
        schema:
          type: string
          example: US
      - name: toCountryCode
        in: query
        required: false
        description: Set this if you want to filter on the country of the callee phone number.
        schema:
          type: string
          example: CA
      - name: emergencyOnly
        in: query
        required: false
        description: Set this if you want to filter on emergency calls or not.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          x-enumDescriptions:
            'true': Include only emergency calls.
            'false': Include all calls.
      - name: region
        in: query
        required: false
        description: Set this is you want to filter calls based on the region.
        schema:
          type: string
          example: us-east
      - name: projectIds
        in: query
        required: false
        description: Set this if you want to include calls from other projects.
        schema:
          type: string
      - name: fileName
        in: query
        required: false
        schema:
          type: string
      - name: groupId
        in: query
        required: false
        description: Set this if you want to filter calls based on the group ID.
        schema:
          type: string
          example: e234bd85-8uv5-44a2-a973-1f705a0960f5@vp3-i-06a73121dc26a8906.xmpp.vpc
      - name: parentId
        in: query
        required: false
        description: Set this if you want to filter calls based on the call's parent ID.
        schema:
          type: string
          example: 9128525b-7273-123f-73ae-0225d0254abb
      - name: relationshipType
        in: query
        required: false
        description: The type of relationship the call has, for example, an initial call or a child call.
        schema:
          type: string
          example: initial
      - name: hasChildren
        in: query
        required: false
        description: Set this if you want to filter on calls with children or not.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          x-enumDescriptions:
            'true': Include only calls with children.
            'false': Include all calls.
      responses:
        '200':
          description: OK
          content:
            application/csv:
              schema:
                type: string
      x-codeSamples:
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // Replace with a valid 'from' number in your call history\n  const fromFilter = '+1440';\n  // Replace with one of: 'COMPLETED', 'NO_ANSWER', 'CANCEL', 'BUSY', 'FAILED'\n  const callResultFilter = 'FAILED';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.elasticSipTrunking.calls.export({\n      from: fromFilter,\n      callResult: callResultFilter,\n    });\n    console.log('✅ Successfully exported the call records.');\n    console.log(response);\n  } catch (err) {\n    console.error('❌ Failed to export the call records:');\n    console.error(err);\n  }\n}\n\nmain();\n"
      security:
      - Basic: []
      - OAuth2.0: []
    servers:
    - url: https://elastic-trunking.api.sinch.com
  /v1/projects/{projectId}/calls/records/{pcapId}/pcap:
    get:
      tags:
      - Calls
      summary: Get PCAPs by ID
      description: Return PCAPs by the PCAP ID. Returns a .pcap file of the requested call to download. You can find the PCAP ID in the response from '/calls' endpoint. PCAPs are only available for calls from within the last 10 days.
      operationId: getPcap
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: pcapId
        in: path
        description: The ID of the PCAP you want to retrieve.
        required: true
        schema:
          type: string
          example: 0a81e938-07bd-1240-8487-0ecf41868d11
      - name: direction
        in: query
        description: Request a PCAP for the call leg specified by the direction. If this query parameter is not included, the default behavior is to return OUTBOUND calls.
        required: false
        schema:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          x-enumDescriptions:
            INBOUND: Somebody called your Sinch number.
            OUTBOUND: You called somebody from your SIP device.
          default: OUTBOUND
      responses:
        '200':
          description: The .pcap file.
          content:
            application/octet-stream: {}
      security:
      - Basic: []
      - OAuth2.0: []
    servers:
    - url: https://elastic-trunking.api.sinch.com
  /calling/v1/calls/id/{callId}:
    parameters:
    - $ref: '#/components/parameters/callId'
    patch:
      tags:
      - Calls
      summary: Update a call in progress
      description: 'This method is used to manage ongoing, connected calls. This method uses SVAML in the request body to perform various tasks related to the call. For more information about SVAML, see the Callback API documentation.


        This method can only be used for calls that originate from or terminate to PSTN or SIP networks.'
      operationId: Calling_UpdateCall
      requestBody:
        $ref: '#/components/requestBodies/updateCall'
      responses:
        '204':
          description: A success response, or an [Error](https://developers.sinch.com/docs/voice/api-reference/errors/).
      x-codeSamples:
      - lang: Java
        source: "/**\n * Sinch Java Snippet\n *\n * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java\n *\n * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details\n */\npackage voice.calls;\n\nimport com.sinch.sdk.SinchClient;\nimport com.sinch.sdk.domains.voice.api.v1.CallsService;\nimport com.sinch.sdk.domains.voice.models.v1.calls.request.CallUpdateRequest;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.action.ManagedCallSvamlAction;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.action.SvamlActionHangup;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.instruction.SvamlInstruction;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.instruction.SvamlInstructionSay;\nimport com.sinch.sdk.models.Configuration;\nimport java.util.Collection;\nimport java.util.Collections;\nimport java.util.logging.Logger;\nimport utils.Settings;\n\npublic class Update {\n\n  private static final Logger LOGGER = Logger.getLogger(Update.class.getName());\n\n  public static void main(String[] args) {\n\n    String applicationKey = Settings.getApplicationKey().orElse(\"MY_APPLICATION_KEY\");\n    String applicationSecret = Settings.getApplicationSecret().orElse(\"MY_APPLICATION_SECRET\");\n\n    // The ID of the call to update\n    String callId = \"CALL_ID\";\n    // The instruction to be performed\n    SvamlInstruction instruction = SvamlInstructionSay.builder().setText(\"Goodbye\").build();\n    // The instruction to add to the call\n    ManagedCallSvamlAction action = SvamlActionHangup.SVAML_ACTION_HANGUP;\n\n    Configuration configuration =\n        Configuration.builder()\n            .setApplicationKey(applicationKey)\n            .setApplicationSecret(applicationSecret)\n            .build();\n\n    SinchClient client = new SinchClient(configuration);\n\n    CallsService callsService = client.voice().v1().calls();\n\n    LOGGER.info(String.format(\"Updating call with ID '%s'\", callId));\n\n    Collection<SvamlInstruction> instructions = Collections.singletonList(instruction);\n\n    CallUpdateRequest request =\n        CallUpdateRequest.builder().setInstructions(instructions).setAction(action).build();\n\n    callsService.update(callId, request);\n\n    LOGGER.info(\"Done\");\n  }\n}\n"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const applicationKey = process.env.SINCH_APPLICATION_KEY ?? 'MY_APPLICATION_KEY';\n  const applicationSecret = process.env.SINCH_APPLICATION_SECRET ?? 'MY_APPLICATION_SECRET';\n\n  // The ID of the call to update\n  const callId = 'CALL_ID';\n\n  const sinch = new SinchClient({ applicationKey, applicationSecret });\n\n  try {\n    await sinch.voice.calls.update({\n      callId,\n      updateCallRequestBody: {\n        instructions: [\n          {\n            name: 'sendDtmf',\n            value: '1234#',\n          },\n        ],\n        action: {\n          name: 'hangup',\n        },\n      },\n    });\n    console.log(`✅ Successfully updated call with ID ${callId}.`);\n  } catch (err) {\n    console.error(`❌ Failed to update call with ID ${callId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
      security:
      - Basic: []
      - Signed: []
    get:
      tags:
      - Calls
      summary: Get information about a call
      description: 'You can retrieve information about an ongoing or completed call using a call ID. You can find the call ID of an ongoing call by viewing the response object from a callout request. You can find the call ID of a completed call by looking at your call logs in your Sinch Dashboard.


        Note: You can only use this method for calls that terminate to PSTN or SIP networks from an In-app call.'
      operationId: Calling_GetCallResult
      responses:
        '200':
          description: A success response, or an [Error](https://developers.sinch.com/docs/voice/api-reference/errors/).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCallResponseObj'
      x-codeSamples:
      - lang: Java
        source: "/**\n * Sinch Java Snippet\n *\n * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java\n *\n * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details\n */\npackage voice.calls;\n\nimport com.sinch.sdk.SinchClient;\nimport com.sinch.sdk.domains.voice.api.v1.CallsService;\nimport com.sinch.sdk.domains.voice.models.v1.calls.response.CallInformation;\nimport com.sinch.sdk.models.Configuration;\nimport java.util.logging.Logger;\nimport utils.Settings;\n\npublic class Get {\n\n  private static final Logger LOGGER = Logger.getLogger(Get.class.getName());\n\n  public static void main(String[] args) {\n\n    String applicationKey = Settings.getApplicationKey().orElse(\"MY_APPLICATION_KEY\");\n    String applicationSecret = Settings.getApplicationSecret().orElse(\"MY_APPLICATION_SECRET\");\n\n    // The ID of the call to retrieve\n    String callId = \"CALL_ID\";\n\n    Configuration configuration =\n        Configuration.builder()\n            .setApplicationKey(applicationKey)\n            .setApplicationSecret(applicationSecret)\n            .build();\n\n    SinchClient client = new SinchClient(configuration);\n\n    CallsService callsService = client.voice().v1().calls();\n\n    LOGGER.info(String.format(\"Get information for call with ID '%s'\", callId));\n\n    CallInformation response = callsService.get(callId);\n\n    LOGGER.info(\"Response: \" + response);\n  }\n}\n"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const applicationKey = process.env.SINCH_APPLICATION_KEY ?? 'MY_APPLICATION_KEY';\n  const applicationSecret = process.env.SINCH_APPLICATION_SECRET ?? 'MY_APPLICATION_SECRET';\n\n  // The ID of the call to retrieve\n  const callId = 'CALL_ID';\n\n  const sinch = new SinchClient({ applicationKey, applicationSecret });\n\n  try {\n    const response = await sinch.voice.calls.get({ callId });\n    console.log('✅ Successfully retrieved call.');\n    console.log(`Response:\\n${JSON.stringify(response, null, 2)}`);\n  } catch (err) {\n    console.error(`❌ Failed to retrieve call with ID ${callId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
      security:
      - Basic: []
      - Signed: []
    servers:
    - url: https://calling.api.sinch.com
      description: redirected by Sinch to an appropriate region
    - url: https://calling-use1.api.sinch.com
      description: United States
    - url: https://calling-euc1.api.sinch.com
      description: Europe
    - url: https://calling-sae1.api.sinch.com
      description: South America
    - url: https://calling-apse1.api.sinch.com
      description: Southeast Asia 1
    - url: https://calling-apse2.api.sinch.com
      description: Southeast Asia 2
  /calling/v1/calls/id/{callId}/leg/{callLeg}:
    parameters:
    - $ref: '#/components/parameters/callId'
    - $ref: '#/components/parameters/callLeg'
    patch:
      tags:
      - Calls
      summary: Manage Call with `callLeg`
      description: 'This method is used to manage ongoing, connected calls. This method is only used when using the `PlayFiles` and `Say` instructions in the request body. This method uses SVAML in the request body to perform various tasks related to the call. For more information about SVAML, see the Callback API documentation.


        Note: You can only use this method for calls that originate from or terminate to PSTN or SIP networks.'
      operationId: Calling_ManageCallWithCallLeg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PATCHSVAMLRequestBody'
            examples:
              hangupExample:
                value:
                  instructions:
                  - name: say
                    text: Hello, the call is over, hanging up now.  Goodbye
                    locale: en-US
                  action:
                    name: hangup
              continueExample:
                $ref: '#/components/examples/continue'
              parkExample:
                $ref: '#/components/examples/park'
              playFilesExample:
                $ref: '#/components/examples/playFiles'
              sayExample:
                $ref: '#/components/examples/say'
              sendDtmfExample:
                $ref: '#/components/examples/sendDtmf'
              setCookieExample:
                $ref: '#/components/examples/setCookie'
              answerExample:
                $ref: '#/components/examples/answer'
              startRecordingExample:
                $ref: '#/components/examples/startRecording'
              stopRecordingExample:
                $ref: '#/components/examples/stopRecording'
              ivrExample:
                value:
                  instructions:
                  - name: playFiles
                    ids:
                    - welcome
                    locale: en-US
                  action:
                    name: hangup
      responses:
        '200':
          description: A success response, or an [Error](https://developers.sinch.com/docs/voice/api-reference/errors/).
          content:
            application/json:
              example:
                content: 200 Successful response
      x-codeSamples:
      - lang: Java
        source: "/**\n * Sinch Java Snippet\n *\n * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java\n *\n * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details\n */\npackage voice.calls;\n\nimport com.sinch.sdk.SinchClient;\nimport com.sinch.sdk.domains.voice.api.v1.CallsService;\nimport com.sinch.sdk.domains.voice.models.v1.calls.request.CallLeg;\nimport com.sinch.sdk.domains.voice.models.v1.calls.request.CallUpdateRequest;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.action.ManagedCallSvamlAction;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.action.SvamlActionHangup;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.instruction.SvamlInstruction;\nimport com.sinch.sdk.domains.voice.models.v1.svaml.instruction.SvamlInstructionSay;\nimport com.sinch.sdk.models.Configuration;\nimport java.util.Collection;\nimport java.util.Collections;\nimport java.util.logging.Logger;\nimport utils.Settings;\n\npublic class ManageWithCallLeg {\n\n  private static final Logger LOGGER = Logger.getLogger(ManageWithCallLeg.class.getName());\n\n  public static void main(String[] args) {\n\n    String applicationKey = Settings.getApplicationKey().orElse(\"MY_APPLICATION_KEY\");\n    String applicationSecret = Settings.getApplicationSecret().orElse(\"MY_APPLICATION_SECRET\");\n\n    // The ID of the call to manage\n    String callId = \"CALL_ID\";\n    // The call leg to manage\n    CallLeg callLeg = CallLeg.CALLEE;\n\n    Configuration configuration =\n        Configuration.builder()\n            .setApplicationKey(applicationKey)\n            .setApplicationSecret(applicationSecret)\n            .build();\n\n    SinchClient client = new SinchClient(configuration);\n\n    CallsService callsService = client.voice().v1().calls();\n\n    LOGGER.info(String.format(\"Manage call with ID '%s'\", callId));\n\n    ManagedCallSvamlAction action = SvamlActionHangup.SVAML_ACTION_HANGUP;\n\n    Collection<SvamlInstruction> instructions =\n        Collections.singletonList(\n            SvamlInstructionSay.builder()\n                .setText(\"Hello, the call is over, hanging up now. Goodbye\")\n                .build());\n\n    CallUpdateRequest request =\n        CallUpdateRequest.builder().setInstructions(instructions).setAction(action).build();\n\n    callsService.manageWithCallLeg(callId, callLeg, request);\n\n    LOGGER.info(\"Done\");\n  }\n}\n"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const applicationKey = process.env.SINCH_APPLICATION_KEY ?? 'MY_APPLICATION_KEY';\n  const applicationSecret = process.env.SINCH_APPLICATION_SECRET ?? 'MY_APPLICATION_SECRET';\n\n  // The ID of the call to manage\n  const callId = 'CALL_ID';\n  // The call leg to manage: 'caller', 'callee' or 'both\n  const callLeg = 'callee';\n\n  const sinch = new SinchClient({ applicationKey, applicationSecret });\n\n  try {\n    await sinch.voice.calls.manageWithCallLeg({\n      callId,\n      callLeg,\n      manageWithCallLegRequestBody: {\n        instructions: [\n          {\n            name: 'say',\n            text: 'Hello, the call is over, hanging up now. Goodbye',\n          },\n        ],\n        action: {\n          name: 'hangup',\n        },\n      },\n    });\n    console.log(`✅ Successfully managed call with ID ${callId} using call leg.`);\n  } catch (err) {\n    console.error(`❌ Failed to manage call with ID ${callId} using call leg:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
