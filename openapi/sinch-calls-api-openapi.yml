  /v2/projects/{projectId}/sessions/{sessionId}/calls/{callName}:
    patch:
      tags:
      - Calls
      summary: Patch an ongoing call by session ID and call name
      description: Interact with an ongoing call identified by its session and call name by submitting a set of SVAML commands. Use this to force disconnect, play messages, bridge with another call, or perform other call control actions.
      operationId: patchCallBySessionAndName
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/idempotencyKey'
      - name: callName
        in: path
        required: true
        description: The name of the call leg within the session, as assigned by the `callName` property in the `dial` command.
        schema:
          type: string
          example: origin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/callPatchRequest'
      responses:
        '202':
          description: Commands accepted for processing.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-codeSamples:
      - lang: Python
        source: "\"\"\"\nSinch Python Snippet\n\nThis snippet is available at https://github.com/sinch/sinch-sdk-python/tree/main/examples/snippets\n\"\"\"\n\nimport os\n\nfrom dotenv import load_dotenv\n\nfrom sinch import SinchClient\n\nload_dotenv()\n\nsinch_client = SinchClient(\n    project_id=os.environ.get(\"SINCH_PROJECT_ID\") or \"MY_PROJECT_ID\",\n    key_id=os.environ.get(\"SINCH_KEY_ID\") or \"MY_KEY_ID\",\n    key_secret=os.environ.get(\"SINCH_KEY_SECRET\") or \"MY_KEY_SECRET\",\n)\n\n# The ID of the session the call leg belongs to\nsession_id = \"SESSION_ID\"\n\n# The name of the call leg within the session\ncall_name = \"CALL_NAME\"\n\n# The SVAML commands to interact with the ongoing call\ncommands = [{\"command\": \"hangup\"}]\n\nsinch_client.voice.v2.calls.interact_by_call_name(\n    session_id=session_id, call_name=call_name, commands=commands\n)\n\nprint(\"Successfully submitted commands to the call.\")\n"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The ID of the session that contains the call\n  const sessionId = 'SESSION_ID';\n  // The name of the call leg within the session, as assigned by the `callName` property in the `dial` command\n  const callName = 'CALL_NAME';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    await sinch.voice.v2.calls.interactByCallName({\n      sessionId,\n      callName,\n      callPatchRequestBody: {\n        commands: [\n          {\n            command: 'hangup',\n          },\n        ],\n      },\n    });\n    console.log(`✅ Successfully submitted SVAML commands for the Voice v2 call named ${callName} in session ${sessionId}.`);\n  } catch (err) {\n    console.error(`❌ Failed to interact with the Voice v2 call named ${callName} in session ${sessionId}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
      security:
      - BasicAuth: []
      - SinchOAuth2: []
