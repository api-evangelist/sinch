components:
  schemas:
    Pagination:
      type: object
      readOnly: true
      properties:
        totalItems:
          type: integer
          readOnly: true
          format: int32
          description: Total size of the result.
          example: 10000
        pageNumber:
          readOnly: true
          type: string
          description: The token to be used for listing the next page
          example: '1'
        size:
          type: integer
          readOnly: true
          format: int32
          description: The number of items per page. default is 1000
          example: 2000
    CallResult:
      description: The result of the call.
      readOnly: true
      type: string
      example: COMPLETED
      enum:
      - COMPLETED
      - NO_ANSWER
      - CANCEL
      - BUSY
      - FAILED
      x-enumDescriptions:
        COMPLETED: The call was completed successfully.
        NO_ANSWER: The call timeout before the recipient answered.
        CANCEL: The call was canceled.
        BUSY: The recipient was busy.
        FAILED: The call failed.
    Call:
      description: The call resource represents an inbound or outbound connection between Sinch and a supported device
      type: object
      properties:
        callId:
          type: string
          description: The unique identifier of the call.
          format: ULID
        to:
          x-version: 1
          x-PII: true
          type: string
          description: 'For `INBOUND` calls, this is the Sinch number the phone dialed.

            For `OUTBOUND` calls, this is the phone number you want to make a call to.

            Formatted according e164 format.'
        from:
          x-version: 1
          x-PII: true
          x-v1: breaking
          type: string
          x-mvp-description: 'The call''s origination, formatted according to the call''s `callType`. For calls to the telephone network, this is a phone number in [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537) format, including the leading `+`.

            <b>Note:</b> If you do not include the `from` property, the call is made from the number or identifier configured as the default for your application or service.'
          description: 'For `INBOUND` calls, this is the number of the person calling. When making an outbound call set this to the your Sinch number you want to show up as Caller Id.

            The call''s origination, formatted according to the call''s `callType`. For calls in the telephone network,

            this is a phone number in [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537) format, including the leading `+`.'
          format: phoneNumber
          example: '+14155553434'
        direction:
          x-version: 1
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          readOnly: true
          x-PII: false
          x-v1: false
          description: Describes whether the call was `INBOUND` *to* your Sinch number or was `OUTBOUND` and made *from* your Sinch number.
          x-enumDescriptions:
            INBOUND: Someone called your Sinch number.
            OUTBOUND: Someone called from your SIP device.
        answerTime:
          x-version: 1
          readOnly: true
          x-PII: false
          x-V1: breaking
          type: string
          format: date-time
          description: Time when call was answered
          example: '2021-11-01T23:26:50Z'
        endTime:
          x-version: 1
          readOnly: true
          type: string
          format: date-time
          x-PII: false
          x-V1: breaking
          description: The time the call ended
          example: '2021-11-01T23:29:50Z'
        durationSeconds:
          x-version: 1
          x-PII: false
          x-V1: breaking
          description: The duration of the call in seconds. For inbound calls, this is the time from when the call started until the call ended. For outbound calls, this is the time from when the call was answered until the call ended.
          readOnly: true
          type: integer
          example: 45
        callResult:
          $ref: '#/components/schemas/CallResult'
        pricePerMinute:
          description: The price per minute for this call.
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        billingDurationSeconds:
          x-version: 1
          readOnly: true
          description: The duration of the call adjusted with the billing period.
          type: integer
          example: 60
        price:
          x-version: 1
          description: The total price for this call. This field is populated when the call ends.
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        createTime:
          x-version: 1
          readOnly: true
          x-PII: false
          x-v1: true
