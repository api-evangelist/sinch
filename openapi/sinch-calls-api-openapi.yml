      x-codeSamples:
      - lang: Python
        source: "\"\"\"\nSinch Python Snippet\n\nThis snippet is available at https://github.com/sinch/sinch-sdk-python/tree/main/examples/snippets\n\"\"\"\n\nimport os\n\nfrom dotenv import load_dotenv\n\nfrom sinch import SinchClient\n\nload_dotenv()\n\nsinch_client = SinchClient(\n    project_id=os.environ.get(\"SINCH_PROJECT_ID\") or \"MY_PROJECT_ID\",\n    key_id=os.environ.get(\"SINCH_KEY_ID\") or \"MY_KEY_ID\",\n    key_secret=os.environ.get(\"SINCH_KEY_SECRET\") or \"MY_KEY_SECRET\",\n)\n\n# The Sinch phone number to call from\nfrom_phone_number = (\n    os.environ.get(\"SINCH_PHONE_NUMBER\") or \"MY_SINCH_PHONE_NUMBER\"\n)\n\n# The phone number of the recipient to call\nto_phone_number = \"RECIPIENT_PHONE_NUMBER\"\n\n# The command dialing out to the recipient\ndial_command = {\n    \"command\": \"dial\",\n    \"call_name\": \"Python_SDK_Snippet_Call\",\n    \"from_\": {\"type\": \"PHONE\", \"phone\": {\"number\": from_phone_number}},\n    \"to\": {\"type\": \"PHONE\", \"phone\": {\"number\": to_phone_number}},\n    \"events\": {\n        \"on_answer\": [\n            {\n                \"command\": \"messages\",\n                \"messages\": [\n                    {\n                        \"type\": \"SAY\",\n                        \"say\": {\n                            \"text\": \"Hello, your call is now connected.\",\n                            \"voice_name\": \"Emma\",\n                        },\n                    }\n                ],\n            }\n        ],\n        \"on_hangup\": [{\"command\": \"hangup\"}],\n    },\n}\n\n# The SVAML commands describing the call flow\ncommands = [dial_command]\n\nresponse = sinch_client.voice.v2.calls.start(commands=commands)\n\nprint(f\"Call Successfully started.\\n{response}\")\n"
      - lang: Node.js
        source: "/**\n * Sinch Node.js Snippet\n * See: https://github.com/sinch/sinch-sdk-node/examples/snippets\n */\nimport { SinchClient } from '@sinch/sdk-core';\nimport * as dotenv from 'dotenv';\ndotenv.config();\n\nasync function main() {\n  const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';\n  const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';\n  const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';\n\n  // The phone number to be used as the caller ID, in E.164 format (e.g., +12025550123)\n  const sinchPhoneNumber = process.env.SINCH_PHONE_NUMBER || 'MY_SINCH_PHONE_NUMBER';\n  // The phone number you want to call, in E.164 format (e.g., +12025550123)\n  const recipientPhoneNumber = 'RECIPIENT_PHONE_NUMBER';\n\n  const sinch = new SinchClient({ projectId, keyId, keySecret });\n\n  try {\n    const response = await sinch.voice.v2.calls.start({\n      createCallRequestBody: {\n        commands: [\n          {\n            command: 'dial',\n            callName: 'Node_SDK_Snippet_Call',\n            from: {\n              type: 'PHONE',\n              phone: {\n                number: sinchPhoneNumber,\n              },\n            },\n            to: {\n              type: 'PHONE',\n              phone: {\n                number: recipientPhoneNumber,\n              },\n            },\n            dialTimeoutDurationSeconds: 30,\n            events: {\n              onAnswer: [\n                {\n                  command: 'messages',\n                  messages: [\n                    {\n                      type: 'SAY',\n                      say: {\n                        text: 'Hello, your call is now connected.',\n                        voiceName: 'Emma',\n                      },\n                    },\n                  ],\n                },\n              ],\n              onHangup: [\n                {\n                  command: 'hangup',\n                },\n              ],\n            },\n          },\n        ],\n      },\n    });\n    console.log(`✅ Successfully started a Voice v2 call to ${recipientPhoneNumber}.`);\n    console.log(`Response:\\n${JSON.stringify(response, null, 2)}`);\n  } catch (err) {\n    console.error(`❌ Failed to start a Voice v2 call to ${recipientPhoneNumber}:`);\n    console.error(err);\n  }\n}\n\nmain();\n"
