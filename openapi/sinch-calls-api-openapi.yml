          example: USD
        amount:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          description: The monetary amount as a string to preserve precision. Supports up to 4 decimal places (e.g., "10.5000", "0.9999").
          example: '0.0123'
    paginationLinks:
      type: object
