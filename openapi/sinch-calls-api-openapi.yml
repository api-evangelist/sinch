          description: URI that identifies the problem type and links to the corresponding error documentation.
        title:
          type: string
          description: Human-readable short summary of the problem type.
        detail:
          type: string
          description: Human-readable explanation of the specific problem occurrence.
        instance:
          type: string
          description: URI reference that identifies the specific occurrence of the problem (typically the request path).
    callResult_2:
      title: Call Result
      description: 'The outcome/state of the call.


        This field includes both **transitional** states (during call setup and execution) and **final** states (when the call has ended).'
      type: string
      enum:
      - QUEUED
      - INITIATED
      - IN_PROGRESS
      - COMPLETED
      - REJECTED
      - NO_ANSWER
      - CANCEL
      - BUSY
      - FAILED
      x-enumDescriptions:
        QUEUED: The call is queued for initiation. This is a transitional state.
        INITIATED: The call is connecting but the recipient has not yet answered. This is a transitional state.
        IN_PROGRESS: The call has been answered and is in progress. This is a transitional state.
        COMPLETED: The call was answered and is ended. This is a final state.
        REJECTED: The call was rejected by the recipient.
        NO_ANSWER: The call was not answered by the recipient.
        CANCEL: The call was cancelled.
        BUSY: The call was not answered because the recipient was busy.
        FAILED: The call could not be completed.
      examples:
      - IN_PROGRESS
    callResponse:
      x-category: call
      x-usage: call
      type: object
      additionalProperties: false
      title: Callout response
      description: 'Response returned after initiating an outbound call or a batch of call sessions.


        Contains identifiers for the created session and associated project/service. `batchId` is included only when the request started a batch operation.'
      required:
      - projectId
      - serviceId
      - sessionId
      properties:
        projectId:
          $ref: '#/components/schemas/projectId'
        serviceId:
          $ref: '#/components/schemas/serviceId'
        sessionId:
          $ref: '#/components/schemas/sessionId'
        batchId:
          $ref: '#/components/schemas/batchId'
    sip:
      type: object
      additionalProperties: false
      title: SIP Endpoint
      required:
      - type
      - sip
      properties:
        type:
          type: string
          const: SIP
          description: Routes the call to a SIP (Session Initiation Protocol) endpoint.
        sip:
          type: object
          additionalProperties: false
          required:
          - endpoint
          properties:
            endpoint:
              type: string
              description: SIP URI of the destination endpoint. Both `sip:` (unencrypted) and `sips:` (TLS-encrypted) schemes are supported.
              format: uri
              maxLength: 256
              pattern: '^sips?:'
            transport:
              type: string
              description: 'Transport protocol to use for the SIP signalling channel.


                If omitted, the platform selects a default based on the URI scheme: `UDP` for `sip:` and `TLS` for `sips:`. Setting this explicitly overrides that default — for example, to force `TCP` for a `sip:` URI or to use `TLS` without switching to the `sips:` scheme.'
              enum:
              - UDP
              - TCP
              - TLS
              x-enumDescriptions:
                UDP: Connectionless transport. Lowest overhead; suitable for most standard SIP deployments.
                TCP: Connection-oriented transport. More reliable for large SIP messages or NAT traversal scenarios.
                TLS: Encrypted transport. Provides confidentiality and integrity for SIP signalling.
            callHeaders:
              $ref: '#/components/schemas/sipCallHeaders'
      examples:
      - type: SIP
        sip:
          endpoint: sip:user@example.com
          transport: TCP
          callHeaders:
          - key: X-Correlation-Id
            value: '12345'
          - key: X-Call-Routing
            value: forwarded
    messages:
      type: object
      additionalProperties: false
      title: Messages
      description: "Plays one or more messages on the call. Multiple messages in the array are played sequentially in order.\n\nThis is a non-blocking command — the next command in the sequence executes immediately while messages play in parallel. \nPlayback outcomes are handled via the `events` property. The `onFinish` event can be used to run a command after all messages complete."
      required:
      - command
      - messages
      properties:
        command:
          type: string
          const: messages
          description: Command to play a message on the channel
        messagesName:
          type: string
          description: 'Name of the message for identification and reference within the call session.


            This name is used to uniquely identify the message and must be unique within the current call session.

            This name can be referenced in other commands (e.g., `stopMessages`) to control this specific message.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-messages
        messages:
          $ref: '#/components/schemas/typesOfMessages'
        events:
          $ref: '#/components/schemas/messageEvents'
      examples:
      - command: messages
        messagesName: greeting-sequence
        messages:
        - type: SAY
          say:
            text: Hello! Your call is being connected.
            voiceName: Emma
        - type: PLAY
          play:
            url: https://example.com/audio/hold-music.mp3
        - type: SAY
          say:
            text: <speak><prosody volume="-6dB">Thank you for waiting.</prosody></speak>
            format: SSML
            voiceName: Emma
    serviceId:
      title: Service ID
      type: string
      format: uuid
      description: The ID of the service used.
      examples:
      - 6e124178-c29d-46a5-943c-5c2ae544aade
    requestParameters:
      type: array
      title: Command Parameter Sets
      description: 'An array of parameter objects that define values for dynamic placeholders in commands. Each object represents a set of parameters for a single queued call.


        Use these parameters to inject customer-defined values into your SVAML commands, enabling personalized call flows without modifying the base command structure.'
      items:
        $ref: '#/components/schemas/requestParameter'
    messageEvents:
      type: object
