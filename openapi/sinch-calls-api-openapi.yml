      description: 'Indicates the origin/source of the call.


        This describes **how the call was initiated** (PSTN or via the API).'
      enum:
      - PHONE
      - SIP
      - SERVER
      x-enumDescriptions:
        PHONE: The call originated from the telephone network (PSTN).
        SIP: The call originated from a SIP trunk.
        SERVER: The call originated through the Sinch API.
      examples:
      - PHONE
    menu:
      type: object
      additionalProperties: false
      title: Run menus
      description: 'Defines a set of named menus and executes them starting from startMenu. This is a blocking command — execution waits for the menu to complete before proceeding to the next command.


        Each menu item configures prompts, input collection, timeout handling, and repeat behavior.'
      required:
      - command
      - startMenu
      - menus
      properties:
        command:
          type: string
          const: menu
          description: Executes menu-based input collection using the configured menu definitions.
        startMenu:
          type: string
          minLength: 1
          maxLength: 16
          description: Name of the menu to execute first. Must match a key in menus.
        menus:
          type: object
          propertyNames:
            type: string
            maxLength: 16
          description: Map of menu definitions keyed by menu name.
          additionalProperties:
            $ref: '#/components/schemas/menuItem'
      examples:
      - command: menu
        startMenu: main
        menus:
          main:
            prompt:
              allowBargeIn: true
              messages:
              - type: SAY
                say:
                  text: Press 1 for sales or 2 for support.
                  voiceName: Emma
            repeatPrompt:
              allowBargeIn: true
              messages:
              - type: SAY
                say:
                  text: Invalid option. Press 1 for sales or 2 for support.
                  voiceName: Emma
            inputTimeoutDurationSeconds: 5
            repeatCount: 2
            minimumInputLength: 1
            maximumInputLength: 1
            inputMethods:
            - DTMF
            matches:
              '1':
              - command: messages
                messages:
                - type: SAY
                  say:
                    text: Connecting to sales.
                    voiceName: Emma
              - command: dial
                callName: sales
                to:
                  type: PHONE
                  phone:
                    number: '+15551234567'
              '2':
              - command: messages
                messages:
                - type: SAY
                  say:
                    text: Connecting to support.
                    voiceName: Emma
              - command: dial
                callName: support
                to:
                  type: PHONE
                  phone:
                    number: '+15557654321'
            onFail:
            - command: messages
              messages:
              - type: SAY
                say:
                  text: Sorry, no valid selection was received.
                  voiceName: Emma
            - command: hangup
    money:
