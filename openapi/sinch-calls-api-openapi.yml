    callType:
      title: Call Type
      x-category: call
      x-usage: call
      type: string
      description: 'The type of channel used for the call.


        This value indicates what kind of endpoint the call is connected to (PSTN phone number or WebSocket stream).'
      enum:
      - PHONE
      - SIP
      - STREAM
      - VOICE_RELAY
      x-enumDescriptions:
        PHONE: A call from or to the telephone network.
        SIP: A call from or to a SIP endpoint.
        STREAM: A call to a stream.
        VOICE_RELAY: A call to voice relay service.
      examples:
      - PHONE
    svamlCommand:
      title: SVAML Command
      type: object
      description: 'A single SVAML (Sinch Voice Application Markup Language) command that controls call behavior.


        The `command` property acts as a discriminator and determines which command schema applies. When multiple commands appear in a `svamlCommands` array, they execute sequentially in order.


        **Available commands:**

        - `dial` — Initiate an outbound call leg within the session.

        - `messages` — Play one or more TTS or audio messages on the call.

        - `stopMessages` — Stop a currently playing message sequence.

        - `webhook` — Trigger a mid-call webhook to the application backend for dynamic call control.

        - `amd` — Detect whether the call was answered by a human or an answering machine.

        - `hangup` — End the call or a specific call leg within the session.

        - `answer` — Explicitly answer an incoming call leg before executing further commands.

        - `pause` — Delay script execution without affecting call audio.

        - `startRecording` — Begin recording the call.

        - `stopRecording` — Stop an active call recording.

        - `bridgeCall` — Add the call to a named bridge for multi-party audio.

        - `menu` — Run menu-based input collection and route the call based on collected input.

        - `gotoMenu` — Switch execution to another named menu within the current menu context.'
      oneOf:
      - $ref: '#/components/schemas/amd'
      - $ref: '#/components/schemas/dial'
      - $ref: '#/components/schemas/messages'
      - $ref: '#/components/schemas/stopMessages'
      - $ref: '#/components/schemas/webhook'
      - $ref: '#/components/schemas/hangup'
      - $ref: '#/components/schemas/answer'
      - $ref: '#/components/schemas/pause'
      - $ref: '#/components/schemas/startRecording'
      - $ref: '#/components/schemas/stopRecording'
      - $ref: '#/components/schemas/bridgeCall'
      - $ref: '#/components/schemas/menu'
      - $ref: '#/components/schemas/gotoMenu'
      discriminator:
        propertyName: command
        mapping:
          amd: '#/components/schemas/amd'
          dial: '#/components/schemas/dial'
          messages: '#/components/schemas/messages'
          stopMessages: '#/components/schemas/stopMessages'
          webhook: '#/components/schemas/webhook'
          hangup: '#/components/schemas/hangup'
          answer: '#/components/schemas/answer'
          pause: '#/components/schemas/pause'
          startRecording: '#/components/schemas/startRecording'
          stopRecording: '#/components/schemas/stopRecording'
          bridgeCall: '#/components/schemas/bridgeCall'
          menu: '#/components/schemas/menu'
          gotoMenu: '#/components/schemas/gotoMenu'
    batchOptions:
      title: Batch Options
      type: object
      additionalProperties: false
      description: Options for batch dialing
      properties:
        maxCps:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
          description: 'Requested maximum call initiation rate, in calls per second (CPS), for this batch.

            Actual CPS may be lower depending on routing, carrier, and platform capacity, as well as account limitations.'
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 10800
          default: 10800
          description: 'Batch time-to-live (TTL). The maximum amount of time the platform will keep attempting to start queued call sessions in this batch.

            When the TTL expires, any call sessions that have not yet been initiated will stop being processed (calls already in progress are not affected).'
      examples:
      - maxCps: 5
        ttlSeconds: 90
    sipCallHeaders:
      type: array
      description: Custom SIP headers to be sent in the call setup.
      maxItems: 16
      items:
        type: object
        additionalProperties: false
        required:
        - key
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[-A-Za-z0-9.!%*_+`'~]+$
            description: Name of the SIP header.
            example: X-Correlation-Id
          value:
            type: string
            maxLength: 255
            description: Value of the SIP header.
            example: '12345'
      examples:
      - - key: X-Correlation-Id
          value: '12345'
        - key: X-Call-Routing
          value: forwarded
    callEvents:
      type: object
      additionalProperties: false
      title: Call Events Webhook
      description: Webhook to handle call events, used when callBehaviors are set to WEBHOOK
      properties:
        onAnswer:
          description: SVAML commands to be executed when the call is answered
          $ref: '#/components/schemas/svamlCommands'
        onBusy:
          description: SVAML commands to be executed when the call is busy
          $ref: '#/components/schemas/svamlCommands'
        onReject:
          description: SVAML commands to be executed when the call is rejected
          $ref: '#/components/schemas/svamlCommands'
        onTimeout:
          description: SVAML commands to be executed when the call is timed out
          $ref: '#/components/schemas/svamlCommands'
        onHangup:
          description: SVAML commands to be executed when the call is hung up
          $ref: '#/components/schemas/svamlCommands'
        onFailure:
          description: SVAML commands to be executed when the call fails
          $ref: '#/components/schemas/svamlCommands'
    unauthorized:
      title: Unauthorized
      description: Returned when authentication fails — the token is missing, invalid, or expired.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/unauthorized
          title:
            const: Unauthorized
          detail:
            example: The token is missing, invalid, or has expired.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    stopMessages:
      type: object
      additionalProperties: false
      title: Stop Messages
      description: 'Stops a message sequence started by a `messages` command. It will also cancel any messages with specified `messagesName` that will appear in the call session in the future.


        This is a non-blocking command.'
      required:
      - command
      - messagesName
      properties:
        command:
          type: string
          const: stopMessages
          description: Command to stop playing messages
        messagesName:
          type: string
          description: Name of the message sequence to stop, as set by `messagesName` in the `messages` command.
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
      examples:
      - command: stopMessages
        messagesName: my-messages
    projectId:
      title: Project ID
      type: string
      format: uuid
      description: The `Id` of the project associated with the call.
      examples:
      - 5c5bf2b1-35ae-4825-ab89-457e07bb60e6
    stopRecording:
      type: object
      additionalProperties: false
      title: Stop Recording
      description: Stops a recording previously started by a `startRecording` command. This is a non-blocking command — execution continues to the next command in the sequence immediately after the stop is initiated.
      required:
      - command
      - recordingName
      properties:
        command:
          type: string
          const: stopRecording
          description: Command to stop recording on the channel
        recordingName:
          type: string
          description: Name of the recording to stop, as set by `recordingName` in the `startRecording` command.
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-recording
    batchId:
      title: Batch ID
      type: string
      format: ulid
      description: The ID of the batch.
      examples:
      - 01BX5ZZKBKACTAV9WEVGEMMVRC
    voiceRelay:
      type: object
      additionalProperties: false
      title: Voice Relay
      description: Routes the call through the Voice Relay service, enabling real-time speech-to-text (STT) and text-to-speech (TTS) via a WebSocket connection to the application backend.
      required:
      - type
      - voiceRelay
      properties:
        type:
          type: string
          const: VOICE_RELAY
          description: Connects to the Voice Relay service to enable STT and TTS services...
        voiceRelay:
          type: object
          additionalProperties: false
          required:
          - endpoint
          - ttsVoice
          - sttLanguage
          properties:
            endpoint:
              type: string
              format: uri
              description: URL to the server that will accept the web-socket request
              example: wss://acme.com/agent
            enableInterruptions:
              type: boolean
              description: 'Allow "barge-in" during text-to-speech (TTS) playback.


                When `true`, TTS playback is interrupted as soon as inbound speech is detected, unless the currently playing content is marked as uninterruptible.


                When `false`, TTS playback continues uninterrupted, but an interruption signal is still sent over the WebSocket so the client application can choose to stop playback manually if needed.'
              default: true
              example: true
            ttsVoice:
              description: "Name of the voice to be used when synthesizing speech. \n\nThis is the default voice used, if no override voice is provided in the web-socket TTS message."
              $ref: '#/components/schemas/voiceName'
            sttLanguage:
              type: string
              pattern: ^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$
              description: 'BCP-47 language tag used for speech-to-text transcription of the inbound audio.


                This value determines which language model is used for transcription.'
              example: en-US
            callHeaders:
              $ref: '#/components/schemas/callHeaders'
      examples:
      - type: VOICE_RELAY
        voiceRelay:
          endpoint: wss://acme.com/agent
          enableInterruptions: true
          ttsVoice: Emma
          sttLanguage: en-US
          callHeaders:
          - key: my-key
            value: my-key-value
    message:
      type: object
      title: Message
      description: A single message item. The required payload depends on `type`.
      oneOf:
      - $ref: '#/components/schemas/messageSay'
      - $ref: '#/components/schemas/messagePlay'
      discriminator:
        propertyName: type
        mapping:
          SAY: '#/components/schemas/messageSay'
          PLAY: '#/components/schemas/messagePlay'
    phone:
      type: object
      additionalProperties: false
      title: Phone
      description: Routes the call to a phone number on the Public Switched Telephone Network (PSTN).
      required:
      - type
      - phone
      properties:
        type:
          type: string
          const: PHONE
          description: Routes the call to a phone number on the Public Switched Telephone Network (PSTN). The number must be in E.164 format.
        phone:
          type: object
          additionalProperties: false
          required:
          - number
          properties:
            number:
              $ref: '#/components/schemas/phoneNumber'
      examples:
      - type: PHONE
        phone:
          number: '+4673522488'
    forbidden:
      title: Forbidden
      description: Returned when the authenticated identity does not have permission to perform the requested operation.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/forbidden
          title:
            const: Forbidden
          detail:
            example: The request was rejected.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    recordingType:
      title: Recording Type
      description: The type of recording to perform.
      type: string
      enum:
      - COMBINED
      - INBOUND
      - OUTBOUND
      x-enumDescriptions:
        COMBINED: Record inbound and outbound voice streams.
        INBOUND: Record inbound voice stream only.
        OUTBOUND: Record outbound voice stream only.
      default: COMBINED
    paginationMeta:
      type: object
      additionalProperties: false
      required:
      - totalCount
      - pageCount
      title: Pagination Metadata
      description: 'Metadata about the paginated list response.

        '
      properties:
        totalCount:
          type: integer
          description: Total number of items across all pages.
          example: 100
        pageCount:
          type: integer
          description: Total number of pages.
          example: 5
    paymentRequired:
      title: Payment Required
      description: Returned when the account has insufficient balance or credit to complete the request.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/payment-required
          title:
            const: Account Suspended
          detail:
            example: No available balance/credit for this billing account.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    pause:
      type: object
      additionalProperties: false
      title: Pause
      description: 'Delays execution of the next command in the sequence for a specified duration. This is a blocking command — no further commands execute until the pause completes.


        The pause does not affect call audio; the call remains connected and audio continues uninterrupted.'
      required:
      - command
      - durationMilliseconds
      properties:
        command:
          type: string
          const: pause
          description: Pause execution.
        durationMilliseconds:
          type: integer
          minimum: 1
          description: Duration of the pause in milliseconds.
          example: 1000
      examples:
      - command: pause
        durationMilliseconds: 1500
    dial:
      type: object
      additionalProperties: false
      title: Dial
      description: 'Initiates a new outbound call leg within the current session.


        This is a non-blocking command — the next command in the sequence executes immediately while the call is being established in parallel. Call lifecycle events (answer, busy, reject, timeout, hangup, failure) are handled via the `events` property.


        The `from` and `to` endpoint types should ideally match. If they differ, the platform attempts to convert the `from` value to be compatible with the `to` type. For example, PSTN supports only E.164 phone numbers, so a SIP address such as `sip:46701234567@acme.se` can be converted to an E.164 number. If the `from` value cannot be converted, it defaults to null (anonymous).'
      required:
      - command
      - to
      properties:
        command:
          type: string
          const: dial
          description: Command to initiate a new call
        callName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: outgoing
          description: 'Identifier for this call leg within the session. Must be unique across all active call legs in the session.


            Other commands (e.g., `hangup`) can reference this name to target this specific leg.'
        from:
          $ref: '#/components/schemas/from'
        to:
          $ref: '#/components/schemas/to'
        dialTimeoutDurationSeconds:
          type: integer
          minimum: 1
          maximum: 60
          description: Maximum time in seconds to wait for the call to be answered. If the timeout expires without an answer, the `onTimeout` event is triggered.
          example: 15
        maxCallDurationSeconds:
          type: integer
          minimum: 1
          maximum: 14400
          description: Maximum duration of the call in seconds. The call is terminated automatically when this limit is reached.
          example: 3600
        events:
          $ref: '#/components/schemas/callEvents'
      examples:
      - command: dial
        callName: destination
        from:
          type: PHONE
          phone:
            number: '+15551234567'
        to:
          type: PHONE
          phone:
            number: '+15559876543'
        dialTimeoutDurationSeconds: 30
        maxCallDurationSeconds: 3600
        events:
          onAnswer:
          - command: messages
            messages:
            - type: SAY
              say:
                text: Your call has connected.
                voiceName: Emma
    bridgeCall:
      type: object
      additionalProperties: false
      title: Add call to bridge
      description: 'Adds the current call to a bridge, enabling bidirectional audio communication with other calls in the same session. This is a non-blocking command — execution continues to the next command in the sequence immediately after the call joins the bridge.


        Bridges are created automatically when referenced by name. If a bridge with the specified name already exists, the call joins that bridge; otherwise, a new bridge is created.'
      required:
      - command
      - bridgeName
      properties:
        command:
          type: string
          const: bridgeCall
          description: Command to add the call to a bridge
        bridgeName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          description: Name of the bridge to join. If no bridge with this name exists in the session, a new one is created automatically.
      examples:
      - command: bridgeCall
        bridgeName: my_bridge
    callHeaders:
      type: array
      description: Custom headers to be sent in the call setup.
      maxItems: 16
      items:
        type: object
        additionalProperties: false
        required:
        - key
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '[\x20-\x7e\t]+$'
            description: Name of the header.
            example: headerKey
          value:
            type: string
            maxLength: 255
            pattern: '[\x20-\x7e\t]*$'
            description: Value of the header.
            example: headerValue
      examples:
      - - key: headerKey
          value: headerValue
        - key: anotherKey
          value: anotherValue
    webhook:
      type: object
      additionalProperties: false
      title: Webhook
      description: 'Triggers a mid-call webhook to the application backend, allowing it to return a new set of SVAML commands that control the remainder of the call flow.


        This is a blocking command — execution pauses until a response is received from the webhook endpoint. The next command in the sequence runs only after the backend responds. Webhook requests use a 5-second timeout. If a `fallbackUrl` is provided, a failed request is re-sent to it — see *Timeouts and failover* in the **Webhooks** section for the authoritative algorithm.'
      required:
      - command
      - webhookName
      - url
      properties:
        command:
          type: string
          const: webhook
          description: Command to trigger a mid-call webhook
        webhookName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^\S+$
          description: 'Name for this webhook event. When triggered, the webhook request''s `event` property will contain this name prepended with `call.webhook.`.


            For example, if `webhookName` is set to `"my.custom.event"`, the event will be delivered as `"call.webhook.my.custom.event"`.'
        url:
          type: string
          description: URL of the webhook endpoint to send the mid-call event to.
          format: uri
        fallbackUrl:
          $ref: '#/components/schemas/webhookFallbackUrl'
      examples:
      - command: webhook
        webhookName: my.custom.event
        url: https://example.com/webhook
        fallbackUrl: https://example.com/fallback
    callDirection:
      title: Call Direction
      type: string
      description: Indicates the direction of the call.
      enum:
      - INBOUND
      - OUTBOUND
      x-enumDescriptions:
        INBOUND: A call initiated towards the Sinch Calling Platform.
        OUTBOUND: A call initiated from the Sinch Calling Platform.
      examples:
      - OUTBOUND
    startRecording:
      type: object
      additionalProperties: false
      title: Start Recording
      required:
      - command
      - recordingOptions
      description: Starts recording the call. This is a non-blocking command — execution continues to the next command in the sequence immediately after recording begins.
      properties:
        command:
          type: string
          const: startRecording
          description: Command to start recording on the channel
        recordingName:
          type: string
          description: 'Identifier for this recording within the session. Must be unique across active recordings in the session.


            Other commands (e.g., `stopRecording`) reference this name to target a specific recording.


            Setting the recording name is useful for stopping the recording using the `stopRecording` command. If name is not set, recording can only be stopped when the call is disconnected.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-recording
        recordingOptions:
          $ref: '#/components/schemas/recordingOptions'
        events:
          $ref: '#/components/schemas/recordingEvents'
      examples:
      - command: startRecording
        recordingName: customer-support-recording
        recordingOptions:
          format: MP3
          recordingType: COMBINED
          destination: AWS
          destinationUrl: s3://voice-recordings-prod/calls
          credentials: accessKeyId:secretAccessKey:eu-central-1
          transcriptionOptions:
            isEnabled: true
            locale: en-US
        events:
          onFinish:
          - command: hangup
          onFailure:
          - command: messages
            messages:
            - type: SAY
              say:
                text: Recording could not be started for this call.
                voiceName: Emma
    messagePlay:
      type: object
      title: Play Message
      description: An audio file playback message item. The platform fetches and plays the audio file at the provided URL on the call.
      additionalProperties: false
      required:
      - type
      - play
      properties:
        type:
          type: string
          const: PLAY
          description: Audio file playback during the call.
        play:
          type: object
          additionalProperties: false
          title: Play
          required:
          - url
          properties:
            url:
              type: string
              description: URL of the media to send
      examples:
      - type: PLAY
        play:
          url: https://example.com/media.mp3
    callPatchRequest:
      x-category: call
      x-usage: call
      type: object
      additionalProperties: false
      title: Call Patch Request
      description: Request body for patching an ongoing call with SVAML commands.
      required:
      - commands
      properties:
        commands:
          $ref: '#/components/schemas/svamlCommands'
      examples:
      - commands:
        - command: hangup
    hangup:
      type: object
      additionalProperties: false
      description: 'Ends a call leg. This is a non-blocking command — execution continues to the next command in the sequence even though the call has been ended. The `onHangup` event is triggered for the call leg that was ended.


        Any subsequent commands that target the ended call leg (such as `messages` or other media commands) are valid but will not be executed. Commands that operate independently — such as initiating a new call with `dial` — will execute normally. This makes it possible, for example, to end one call and immediately start another within the same sequence.'
      title: Hangup
      required:
      - command
      properties:
        command:
          type: string
          const: hangup
          description: Hangup call
        callName:
          type: string
          description: 'Name of the call leg to end, as set by `callName` in the `dial` command.


            If omitted, the current call leg is ended.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: origin
      examples:
      - command: hangup
        callName: origin
    internalServerError:
      title: Internal Server Error
      description: Returned when an unexpected error occurs on the server.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/internal-server-error
          title:
            const: Internal Server Error
          detail:
            example: An unexpected error occurred on the server.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    CallInformation:
      type: object
      properties:
        from:
          type: string
          description: The caller number
        to:
          type: string
          description: The callee number
        domain:
          type: string
          description: The call domain
        callId:
          type: string
          description: The unique call identifier
        duration:
          type: integer
          description: The call duration in seconds
        status:
          type: string
          description: The current call status
        result:
          type: string
          description: The call result
        reason:
          type: string
          description: The reason for call disconnection
        timestamp:
          type: string
          format: date-time
          description: When the call was initiated
        userRate:
          $ref: '#/components/schemas/Price'
        debit:
          $ref: '#/components/schemas/Price'
    Price:
      type: object
      properties:
        currencyId:
          type: string
          description: The currency code
        amount:
          type: number
          description: The amount
    SVAMLControl:
      type: object
      properties:
        action:
          type: object
