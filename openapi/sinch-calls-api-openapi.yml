          x-enumDescriptions:
            stopRecording: The `stopRecording` instruction.
          enum:
          - stopRecording
          default: stopRecording
    svaml.instruction.sendDtmf:
      type: object
      description: Plays DTMF tones in the call.
      required:
      - name
      properties:
        name:
          type: string
          description: The `name` property. Must have the value `sendDtmf`.
          x-enumDescriptions:
            sendDtmf: The `sendDtmf` instruction.
          enum:
          - sendDtmf
          default: sendDtmf
        value:
          type: string
          description: 'A string that determines the DTMF tones to play to the callee when the call is picked up.

            Valid characters are: `0-9`, `#`, and `w`. `w` renders a 500ms pause. For example, the string `ww1234#w#`, plays a 1 second pause, the DTMF tones for `1`, `2`, `3`, `4`, and `#`, followed by a 500ms pause and finally the `#` tone.

            This is useful if the callout destination requires a conference PIN code or an extension. If there is a calling party, it will hear progress while the DTMF is sent.'
          example: ww1234#w#
    mxpDestination:
      type: string
      description: Type `userName` used for data endpoints.
      x-enumDescriptions:
        username: A username for data endpoints.
        Username: A username for data endpoints.
      enum:
      - username
      - Username
      example: username
    problemDetails:
      title: Problem Details
      description: Base error response schema following [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) (Problem Details for HTTP APIs). All error responses use this structure.
      x-category: response
      x-usage: http-response
      type: object
      additionalProperties: false
