      title: Pagination Links
      description: 'Pagination links for navigating through pages of results in a paginated list response.


        Available link properties:

        - `first` - Absolute URI of the first page

        - `last` - Absolute URI of the last page

        - `next` - Absolute URI of the next page (omitted if this is the last page)

        - `prev` - Absolute URI of the previous page (omitted if this is the first page)

        - `self` - Absolute URI of the current page

        '
      properties:
        first:
          type: string
          format: uri
          description: Absolute URI of the first page.
          example: https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=1&pageSize=20
        last:
          type: string
          format: uri
          description: Absolute URI of the last page.
          example: https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=5&pageSize=20
        next:
          type: string
          format: uri
          description: Absolute URI of the next page (omitted if this is the last page).
          example: https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=3&pageSize=20
        prev:
          type: string
          format: uri
          description: Absolute URI of the previous page (omitted if this is the first page).
          example: https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=1&pageSize=20
        self:
          type: string
          format: uri
          description: Absolute URI of the current page.
          example: https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=2&pageSize=20
    callReason:
      title: Call Reason
      description: 'Reason explaining **why** the call ended in the given `callResult`.


        `callResult` describes **what** happened (state/outcome). `callReason` provides additional context about the

        underlying cause (for example, who terminated the call, routing issues, or validation errors).'
      type: string
      enum:
      - OK
      - NOT_AVAILABLE
      - CALLER_HANGUP
      - CALLEE_HANGUP
      - MANAGER_HANGUP
      - DID_NOT_FOUND
      - INVALID_SCRIPT
      - UNKNOWN_PRODUCT
      - NO_MORE_ROUTES
      - ERROR
      x-enumDescriptions:
        OK: The call was completed successfully.
        NOT_AVAILABLE: The callee was not available.
        CALLER_HANGUP: The caller hung up the call.
        CALLEE_HANGUP: The callee hung up the call.
        MANAGER_HANGUP: The call was ended by the call manager.
        DID_NOT_FOUND: The DID number was not found.
        INVALID_SCRIPT: The SVAML script was invalid.
        UNKNOWN_PRODUCT: The product associated with the call is unknown.
        NO_MORE_ROUTES: There are no more routes to complete the call.
        ERROR: An error occurred during the call.
      examples:
      - OK
    recordingFormat:
      title: Recording Format
      description: Audio format for this recording.
      type: string
      enum:
      - MP3
      - WAV
      x-enumDescriptions:
        MP3: MPEG Audio Layer III compressed audio format.
        WAV: Waveform Audio File Format, uncompressed audio.
      default: MP3
      examples:
      - MP3
    callRequest:
      x-category: call
      x-usage: call
      type: object
      additionalProperties: false
      title: Callout requests
      description: 'Request payload to initiate an outbound call or a batch of outbound call sessions.

        If parameters are provided a batch of call sessions will be initiated. BatchOptions are only valid in that mode. If not provided, default values of each batch option will be used.'
      required:
      - commands
      properties:
        commands:
          $ref: '#/components/schemas/svamlCommands'
        parameters:
          $ref: '#/components/schemas/requestParameters'
        batchOptions:
          $ref: '#/components/schemas/batchOptions'
      examples:
      - commands:
        - command: dial
          callName: origin
          from:
            type: PHONE
            phone:
              number: '+4673522480'
          to:
            type: PHONE
            phone:
              number: '+4673522488'
          dialTimeoutDurationSeconds: 45
          maxCallDurationSeconds: 3600
          events:
            onAnswer:
            - command: messages
              messages:
              - type: SAY
                say:
                  text: Hello, you are going to be connected to our Echo service. Say something and you should be able to hear yourself.
                  format: TEXT
                  voiceName: Brian
            - command: bridgeCall
              bridgeName: bridge
            - command: dial
              callName: destination
              to:
                type: STREAM
                stream:
                  endpoint: ws://echo/
              dialTimeoutDurationSeconds: 45
              maxCallDurationSeconds: 60
              events:
                onAnswer:
                - command: bridgeCall
                  bridgeName: bridge
                onHangup:
                - command: hangup
                  callName: origin
            onHangup:
            - command: hangup
              callName: destination
    phoneNumber:
      title: Phone Number
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      minLength: 3
      maxLength: 16
      description: E.164 Phone number
      examples:
      - '+4673522488'
    from:
      description: Call origin - Phone Number or SIP endpoint
      oneOf:
      - $ref: '#/components/schemas/phone'
      - $ref: '#/components/schemas/sipFrom'
      discriminator:
        propertyName: type
        mapping:
          PHONE: '#/components/schemas/phone'
          SIP: '#/components/schemas/sipFrom'
    tooManyRequests:
      title: Too Many Requests
      description: Returned when the request rate limit has been exceeded. Retry after the duration indicated in the `Retry-After` response header.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/too-many-requests
          title:
            const: Too Many Requests
          detail:
            example: Rate limit exceeded. Please slow down your request rate and retry after the indicated period.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls
    transcriptionOptions:
      title: Transcription Options
      description: Configuration for automatic speech-to-text transcription of the recording.
      type: object
      additionalProperties: false
      required:
      - isEnabled
      properties:
        isEnabled:
          type: boolean
          description: If true, the recording will be transcribed to text.
          example: true
        locale:
          type: string
          description: Language code in BCP-47 format.
          default: en-US
          example: en-US
    answer:
      type: object
      additionalProperties: false
      title: Answer
      description: Answers an inbound call leg. This is a non-blocking command — execution continues to the next command in the sequence immediately after the answer is initiated.
      required:
      - command
      properties:
        command:
          type: string
          const: answer
          description: Answer call
      examples:
      - command: answer
    requestParameter:
      type: object
      maxProperties: 10000
      propertyNames:
        type: string
        minLength: 1
        maxLength: 32
      additionalProperties:
        type: string
      title: Request Parameters
      description: Dictionary of customer-defined parameters to be passed to the commands.
      examples:
      - numberA: '+4564973655'
        numberB: '+4564973657'
    sipFrom:
      type: object
      additionalProperties: false
      title: SIP Origin
      required:
      - type
      - sip
      properties:
        type:
          type: string
          const: SIP
          description: Indicates the call originated from a SIP (Session Initiation Protocol) endpoint.
        sip:
          type: object
          additionalProperties: false
          required:
          - endpoint
          properties:
            endpoint:
              type: string
              description: SIP URI of the originating endpoint. Both `sip:` (unencrypted) and `sips:` (TLS-encrypted) schemes are supported.
              format: uri
              pattern: '^sips?:'
              maxLength: 192
            displayName:
              type: string
              description: Display name presented to the called party as the caller identity. Transmitted as the display name part of the SIP `From` header (for example, `Alice <sip:alice@example.com>`).
              maxLength: 64
              example: Alice
      examples:
      - type: SIP
        sip:
          endpoint: sip:user@example.com
          displayName: Alice
    to:
      title: To
      description: Call destination - Phone Number or Stream URI
      oneOf:
      - $ref: '#/components/schemas/phone'
      - $ref: '#/components/schemas/sip'
      - $ref: '#/components/schemas/stream'
      - $ref: '#/components/schemas/voiceRelay'
      discriminator:
        propertyName: type
        mapping:
          PHONE: '#/components/schemas/phone'
          SIP: '#/components/schemas/sip'
          STREAM: '#/components/schemas/stream'
          VOICE_RELAY: '#/components/schemas/voiceRelay'
    notFound:
      title: Not Found
      description: Returned when the requested resource does not exist.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/not-found
          title:
            const: Not Found
          detail:
            example: The requested resource was not found.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    stream:
      type: object
      additionalProperties: false
      title: Stream
      description: Routes the call to a WebSocket stream endpoint for real-time audio processing.
      required:
      - type
      - stream
      properties:
        type:
          type: string
          const: STREAM
          description: Routes the call to a WebSocket stream endpoint for real-time audio processing.
        stream:
          type: object
          additionalProperties: false
          required:
          - endpoint
          properties:
            endpoint:
              type: string
              description: WebSocket endpoint that will accept the incoming connection for real-time audio streaming. Must be a valid WebSocket URL using either `ws://` or `wss://` (recommended). The URL must be reachable from the public internet and capable of handling the negotiated stream protocol.
              example: wss://example.com
            streamOptions:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  description: Defines the version of the stream protocol.
                  default: 1
                  example: 1
                codec:
                  type: string
                  const: PCM
                  description: 'Defines the audio codec/format used for the stream audio payload.


                    Currently, only `PCM` is supported (uncompressed raw audio). Use `sampleRate` to configure the sampling rate for the stream.'
                sampleRate:
                  type: integer
                  description: "Defines the audio sampling rate (Hz) used for the stream.\n\nFor calls that traverse the PSTN, audio is typically sampled at 8 kHz, so using a higher value will not improve perceived quality. \nHigher sample rates can be useful for non-PSTN scenarios (for example, SIP/streaming paths), but will increase bandwidth usage and processing load."
                  enum:
                  - 8000
                  - 16000
                  - 24000
                  - 44100
                  - 48000
                  - 96000
                  x-enumDescriptions:
                    '8000': 8 kHz (standard for PSTN calls)
                    '16000': 16 kHz (wideband audio)
                    '24000': 24 kHz (super-wideband audio)
                    '44100': 44.1 kHz (CD quality audio)
                    '48000': 48 kHz (professional audio quality)
                    '96000': 96 kHz (high-resolution audio)
                  default: 8000
                  example: 16000
            callHeaders:
              $ref: '#/components/schemas/callHeaders'
          examples:
          - endpoint: wss://example.com
            streamOptions:
              version: 1
              codec: PCM
              sampleRate: 8000
            callHeaders:
            - key: my-key
              value: my-key-value
      examples:
      - type: STREAM
        stream:
          endpoint: wss://example.com
          streamOptions:
            version: 1
            codec: PCM
            sampleRate: 16000
          callHeaders:
          - key: my-key
            value: my-key-value
    svamlCommands:
      type: array
      title: SVAML Commands
      description: 'An ordered list of SVAML v2 (Sinch Voice Application Markup Language) commands that describe a call flow. Commands are executed sequentially in the order they are defined.


        **Blocking vs. non-blocking:** Some commands block execution until they complete (`pause`, `webhook`, `menu`, `gotoMenu`), while others return immediately and run in parallel (`dial`, `messages`, `amd`, `answer`, `hangup`, `startRecording`, `stopRecording`, `bridgeCall`, `stopMessages`). Each command''s description specifies its behavior.


        **Nesting scope:** Commands that appear inside event handlers (e.g., `dial.events.onAnswer`, `messages.events.onFinish`) form independent sequences and execute in their own context — they are not continuations of the parent sequence.'
      items:
        $ref: '#/components/schemas/svamlCommand'
    badRequest:
      title: Bad Request
      description: Returned when the request is malformed or contains invalid parameters.
      allOf:
      - $ref: '#/components/schemas/problemDetails'
      - type: object
        properties:
          type:
            const: https://api.sinch.com/docs/errors/bad-request
          title:
            const: Bad Request
          detail:
            example: The request body is invalid or malformed.
          instance:
            example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    amd:
      type: object
      additionalProperties: false
      title: Answering Machine Detection
      description: 'AMD (Answering Machine Detection) command to detect what answered the call. Possible outcomes are: human, machine, beep, or unknown.


        This is a non-blocking command — the next command in the sequence executes immediately while detection runs in parallel. Results are delivered via the `events` property.'
      required:
      - command
      properties:
        command:
          type: string
          const: amd
          description: Command to run Answering Machine Detection on the call
        events:
          $ref: '#/components/schemas/amdEvents'
      examples:
      - command: amd
        events:
          onHuman:
          - command: pause
            durationMilliseconds: 1000
          - command: bridgeCall
            bridgeName: my-bridge
          onBeep:
          - command: messages
            messagesName: my-amd-messages
            messages:
            - type: SAY
              say:
                text: Hello, this is a test message
                voiceName: Emma
    menuItem:
      type: object
      additionalProperties: false
      title: Menu Item
      description: 'Defines a single menu step, including prompts, input handling rules, input-to-command matches, and failure handling.


        Each collected input is matched against the values in the `matches` property.

        If no match succeeds, the `onFail` commands are executed.


        If neither `matches` nor `onFail` is defined and the service call behavior is set to `WEBHOOK`, a webhook request is sent including the collected input.'
      properties:
        prompt:
          $ref: '#/components/schemas/menuPrompt'
          description: 'Prompt played when this menu starts.


            This prompt is also used as the repeat prompt when repeatPrompt is not defined for the menu.'
        repeatPrompt:
          $ref: '#/components/schemas/menuPrompt'
          description: 'Prompt played when the menu is repeated.


            Repeats occur when input times out or when the provided input does not match any menu match item.'
        inputTimeoutDurationSeconds:
          type: integer
          description: Maximum number of seconds to wait for user input before the input attempt times out.
          minimum: 1
          maximum: 60
          default: 5
          example: 10
        repeatCount:
          type: integer
          description: 'Maximum number of times the menu is repeated.


            A repeat occurs when input times out or when the provided input does not match any menu match item.'
          minimum: 0
          maximum: 10
          default: 2
          example: 3
        minimumInputLength:
          type: integer
          description: Minimum number of input characters required before the menu evaluates the collected input.
          minimum: 1
          maximum: 100
          default: 1
          example: 3
        maximumInputLength:
          type: integer
          description: Maximum number of input characters that triggers the menu to evaluate the collected input.
          minimum: 1
          maximum: 100
          default: 1
          example: 10
        terminatingSequence:
          type: string
          pattern: ^[0-9*#]+$
          description: 'Character sequence that signals the end of input and triggers immediate evaluation.


            Useful when variable-length input is allowed and shorter valid options should be submitted without waiting for timeout or maximum length.


            The terminating sequence value is included in the evaluated input.'
          maxLength: 10
        inputMethods:
          type: array
          description: Input methods accepted for this menu when collecting user input.
          default:
          - DTMF
          items:
            type: string
            enum:
            - DTMF
            x-enumDescriptions:
              DTMF: Collect input from keypad tones (Dual-Tone Multi-Frequency).
        matches:
          type: object
          description: 'Items matched against the collected input. Maximum number of allowed match expressions is 50.


            Defined as a dictionary where each property name is a literal or a regular expression string.


            Values are evaluated in the order they are defined.'
          maxProperties: 50
          propertyNames:
            type: string
            minLength: 1
            maxLength: 256
            description: 'A regular expression or literal string to match against the collected user input. Must not be empty.


              Property keys are evaluated sequentially in the order defined. The first key that matches the input will trigger its associated SVAML commands.


              **Note**: Use `\\*` to match the DTMF star tone (*).'
          additionalProperties:
            $ref: '#/components/schemas/svamlCommands'
        onFail:
          $ref: '#/components/schemas/svamlCommands'
          description: 'SVAML commands executed when the menu fails to collect a matching input.


            This handler runs after the repeat limit is reached without any input matching a menu match item.'
    voiceName:
