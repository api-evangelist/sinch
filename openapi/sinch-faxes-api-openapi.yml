          description: The document file to fax
        serviceId:
          type: string
          description: The fax service to use
  examples:
    SendFileAsFaxWithCoverPage:
      summary: Send a fax with cover page
      value:
        to: '+14155552222'
        file: //path/to/file.pdf
        coverPageId: 12312kj312kl3j12k3j
