openapi: 3.2.0
info:
  title: Provisioning WhatsApp Templates API
  description: The WhatsApp template endpoint offers a way for you to manage your WhatsApp templates that can be used with the Conversation API. The WhatsApp templates are a requirement to send the initial outbound messages in the WhatsApp API.
  version: 1.2.117
servers:
- url: https://provisioning.api.sinch.com
  description: Production server
security:
- BasicAuth: []
  BearerAuth: []
  OAuth2Production: []
tags:
- name: WhatsApp Templates
  description: The WhatsApp template endpoint offers a way for you to manage your WhatsApp templates that can be used with the Conversation API. The WhatsApp templates are a requirement to send the initial outbound messages in the WhatsApp API.
paths:
  /v1/projects/{projectId}/whatsapp/templates:
    get:
      description: Returns a paginated list of templates for the specified project. If no page token is supplied then the first `50` templates are returned in alphabetical order.
      operationId: WhatsappTemplatesController_listTemplates_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: pageToken
        required: false
        in: query
        schema:
          type: string
        description: The page token if retrieving the next page from a previous query.
      - name: pageSize
        required: false
        in: query
        schema:
          type: number
          minimum: 1
          maximum: 1000
        description: The page size requested.
      - name: fieldMask
        required: false
        in: query
        description: Field masks are a way for API callers to list the fields that a request should return.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappTemplateDtoFieldMaskPathsEnum'
      - name: filterStates
        required: false
        in: query
        description: Optionally query for sender by states.
        x-enumDescriptions:
          APPROVED: The template is approved and available for use.
          DISABLED: The template has been disabled and is restricted from outbound messaging operations.
          PAUSED: The template is temporarily paused and cannot be utilized until explicitly resumed.
          PENDING: The template is queued and currently awaiting approval or processing milestones.
          REJECTED: The template was rejected and cannot be used.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappTemplateStatesEnum'
      - name: filterStatuses
        required: false
        in: query
        description: Optionally query for sender by statuses.
        x-enumDescriptions:
          DRAFT: The template changes are saved as a draft only.
          IN_PROGRESS: The template changes have been submitted and are still processing.
          REJECTED: The template changes have been reviewed and rejected.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappTemplateStatusesEnum'
      - name: templateAnalyticsDateRange
        required: false
        in: query
        description: The date range to retrieve template analytics for. Fallback to DAY if none is set.
        x-enumDescriptions:
          DAY: Filters metrics collection to include data from the last 24 hours.
          MONTH: Filters metrics collection to include data from the last 30 days.
          QUARTER: Filters metrics collection to include data from the last 90 days.
          WEEK: Filters metrics collection to include data from the last 7 days.
        schema:
          $ref: '#/components/schemas/WhatsappTemplateAnalyticsDateRangesEnum'
      - name: templateName
        required: false
        in: query
        description: Optionally query for template by name. Will return all templates with names that begin with the query string.
        schema:
          type: string
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/WhatsappTemplateListDto'
                - $ref: '#/components/schemas/WhatsappPartialTemplateListDto'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                project_not_initialized-0:
                  summary: ProjectNotInitializedError
                  value:
                    errorCode: project_not_initialized
                    message: Project not initialized for WhatsApp.
                    resolution: Verify that the project ID is correct and that it has been onboarded for WhatsApp.
                invalid_page_size-1:
                  summary: InvalidPageSizeError
                  value:
                    errorCode: invalid_page_size
                    message: Page size must be numeric.
                    resolution: Use a integer value for pageSize parameter.
                invalid_page_token-2:
                  summary: InvalidPageTokenError
                  value:
                    errorCode: invalid_page_token
                    message: Invalid page token.
                    resolution: The page token to use is provided in the previous query response, for new queries simply leave this field undefined.
                invalid_filter_states-3:
                  summary: InvalidFilterStatesError
                  value:
                    errorCode: invalid_filter_states
                    message: Invalid filterStates.
                    resolution: Verify that the filterStates used are supported by the Provisioning API.
                    additionalInformation:
                      supportedCodes: APPROVED, DISABLED, PAUSED, PENDING, REJECTED
                invalid_filter_statuses-4:
                  summary: InvalidFilterStatusesError
                  value:
                    errorCode: invalid_filter_statuses
                    message: Invalid filter statuses.
                    resolution: Verify that the filterStatuses used are supported by the Provisioning API.
                    additionalInformation:
                      supportedCodes: DRAFT, IN_PROGRESS, REJECTED
                invalid_fields-5:
                  summary: InvalidFieldsError
                  value:
                    errorCode: invalid_fields
                    message: Invalid fields.
                    resolution: Verify that the fields used are supported by the Provisioning API.
                    additionalInformation:
                      supportedCodes: whatsappId, state, name, language, category, rejectionCode, qualityScore, changes, changes.status, changes.allowCategoryChange, changes.details, changes.details.components, changes.details.components.0.type, changes.details.components.0.format, changes.details.components.0.text, changes.details.components.0.example, changes.details.components.0.example.url, changes.details.components.0.examples, changes.details.components.0.addSecurityRecommendation, changes.details.components.0.codeExpirationMinutes, changes.details.components.0.buttons, changes.details.components.0.buttons.0.type, changes.details.components.0.buttons.0.text, changes.details.components.0.buttons.0.phoneNumber, changes.details.components.0.buttons.0.url, changes.details.components.0.buttons.0.example, changes.details.components.0.buttons.0.otpType, changes.details.components.0.buttons.0.autofillText, changes.details.components.0.buttons.0.packageName, changes.details.components.0.buttons.0.signatureHash, changes.details.components.0.buttons.0.supportedApps, changes.details.components.0.buttons.0.supportedApps.0.packageName, changes.details.components.0.buttons.0.supportedApps.0.signatureHash, changes.details.components.0.buttons.0.zeroTapTermsAccepted, changes.details.components.0.buttons.0.flowId, changes.details.components.0.buttons.0.flowAction, changes.details.components.0.buttons.0.navigateScreen, changes.details.components.0.hasExpiration, changes.details.messageSendTtlSeconds, changes.details.optimization, details, details.components, details.components.0.type, details.components.0.format, details.components.0.text, details.components.0.example, details.components.0.example.url, details.components.0.examples, details.components.0.addSecurityRecommendation, details.components.0.codeExpirationMinutes, details.components.0.buttons, details.components.0.buttons.0.type, details.components.0.buttons.0.text, details.components.0.buttons.0.phoneNumber, details.components.0.buttons.0.url, details.components.0.buttons.0.example, details.components.0.buttons.0.otpType, details.components.0.buttons.0.autofillText, details.components.0.buttons.0.packageName, details.components.0.buttons.0.signatureHash, details.components.0.buttons.0.supportedApps, details.components.0.buttons.0.supportedApps.0.packageName, details.components.0.buttons.0.supportedApps.0.signatureHash, details.components.0.buttons.0.zeroTapTermsAccepted, details.components.0.buttons.0.flowId, details.components.0.buttons.0.flowAction, details.components.0.buttons.0.navigateScreen, details.components.0.hasExpiration, details.messageSendTtlSeconds, details.optimization, analytics, analytics.0.sent, analytics.0.delivered, analytics.0.read, analytics.0.start, analytics.0.end, analytics.0.buttons, analytics.0.buttons.0.type, analytics.0.buttons.0.content, analytics.0.buttons.0.clicks, isMetaGenerated
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: List all templates in project
      tags:
      - WhatsApp Templates
      x-badges:
      - name: GA
        position: after
        color: green
    post:
      callbacks:
        Comment:
          '{$request.body#webhooks.target}':
            post:
              summary: WhatsApp Template received a comment
              description: "\n      Callback sent when a comment is placed on a template.\n      "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, in this case `WHATSAPP_TEMPLATE_COMMENT_ADDED`.
                          type: string
                        payload:
                          description: Template at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappTemplateDto'
                        comment:
                          description: Comment for template.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_TEMPLATE_COMMENT_ADDED
                      payload:
                        name: My WhatsApp Template
                        category: UTILITY
                        language: EN_US
                        qualityScore: QUALITY_SCORE_GREEN
                        changes:
                          status: DRAFT
                          details:
                            components:
                            - type: HEADER
                              format: TEXT
                              text: Save {{1}}% on your next purchase!
                              examples:
                              - '20'
                            - type: HEADER
                              format: DOCUMENT
                              examples:
                              - url: https://example.com/photos/1.png
                            - type: HEADER
                              format: LOCATION
                            - type: BODY
                              text: Good morning {{1}}, your package has arrived.
                              examples:
                              - Mr. Smith
                              addSecurityRecommendation: true
                            - type: FOOTER
                              text: To track your order please click the 'Track Your Order' button
                              codeExpirationMinutes: 5
                            - type: BUTTONS
                              buttons:
                              - type: PHONE_NUMBER
                                text: Example text.
                                phoneNumber: +48 777 777777
                              - type: URL
                                text: Example test
                                url: https://www.my-website.com?name={{1}}
                                examples:
                                - https://www.my-website.com?name=john
                              - type: QUICK_REPLY
                                text: Track Your Order
                              - type: OTP
                                otpType: COPY_CODE
                                text: Example text.
                              - type: REQUEST_CONTACT_INFO
                                text: Share Contact Info
                              - type: ORDER_DETAILS
                                text: Copy Pix code
                              - type: COPY_CODE
                                text: Copy offer code
                                examples:
                                - WINTER27
                            - type: CAROUSEL
                              cards:
                              - components:
                                - type: HEADER
                                  format: IMAGE
                                  examples:
                                  - url: https://example.com/photos/1.png
                                - type: BODY
                                  text: Good morning {{1}}, your package has arrived.
                                  examples:
                                  - Mr. Smith
                                - type: BUTTONS
                                  buttons:
                                  - type: URL
                                    text: Example test
                                    url: https://www.my-website.com?name={{1}}
                                    examples:
                                    - https://www.my-website.com?name=john
                                  - type: QUICK_REPLY
                                    text: Track Your Order
                                  - type: PHONE_NUMBER
                                    text: Example text.
                                    phoneNumber: +48 777 777777
                            messageSendTtlSeconds: 60
                            optimization:
                              bidAmount: 500
                              bidStrategy: BID_STRATEGY_LOWEST_COST_WITH_BID_CAP
                              bidCountryMultiplierOverrides:
                                US: '1.2'
                                GB: '1.1'
                        analytics: []
                        isMetaGenerated: false
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        Approved:
          '{$request.body#webhooks.target}':
            post:
              summary: WhatsApp Template approved
              description: "\n        Callback sent when a template is approved.\n        "
              parameters:
              - in: header
