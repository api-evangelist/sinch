  /v1/projects/{projectId}/whatsapp/templates/{templateName}:
    get:
      description: Returns a paginated list of templates for the specified project and name. If no page token is supplied then the first `50` templates are returned in alphabetical order.
      operationId: WhatsappTemplatesController_listTemplatesByName_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: templateName
        required: true
        in: path
        description: The unique name of the template.
        schema:
          type: string
      - name: pageToken
        required: false
        in: query
        schema:
          type: string
        description: The page token if retrieving the next page from a previous query.
      - name: pageSize
        required: false
        in: query
        schema:
          type: number
          minimum: 1
          maximum: 1000
        description: The page size requested.
      - name: fieldMask
        required: false
        in: query
        description: Field masks are a way for API callers to list the fields that a request should return.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappTemplateDtoFieldMaskPathsEnum'
      - name: templateAnalyticsDateRange
