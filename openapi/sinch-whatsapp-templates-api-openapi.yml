              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, in this case WHATSAPP_TEMPLATE_DELETED.
                          type: string
                      required:
                      - type
                    example:
                      type: WHATSAPP_TEMPLATE_DELETED
                      payload:
                        whatsappId: '123456'
                        name: My WhatsApp Template
                        category: UTILITY
                        language: EN_US
                        qualityScore: QUALITY_SCORE_GREEN
                        details:
                          components:
                          - type: HEADER
                            format: TEXT
                            text: Save {{1}}% on your next purchase!
                            examples:
                            - '20'
                          messageSendTtlSeconds: 60
                          optimization:
                            bidAmount: 500
                            bidStrategy: BID_STRATEGY_LOWEST_COST_WITH_BID_CAP
                            bidCountryMultiplierOverrides:
                              US: '1.2'
                              GB: '1.1'
                        analytics: []
                        isMetaGenerated: false
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        QualityScoreUpdated:
          '{$request.body#webhooks.target}':
            post:
              summary: WhatsApp Template quality score updated
              description: "\n        Callback sent when a template quality score changed.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, in this case `WHATSAPP_TEMPLATE_QUALITY_SCORE_UPDATED`.
                          type: string
                        payload:
                          description: Template at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/WhatsappTemplateDto'
                        comment:
                          description: Comment for template.
                          type: string
                      required:
                      - type
                      - payload
                    example:
                      type: WHATSAPP_TEMPLATE_QUALITY_SCORE_UPDATED
                      payload:
                        whatsappId: '123456'
                        name: My WhatsApp Template
                        state: APPROVED
                        category: UTILITY
                        language: EN_US
                        qualityScore: QUALITY_SCORE_GREEN
                        details:
                          components:
                          - type: HEADER
                            format: TEXT
                            text: Save {{1}}% on your next purchase!
                            examples:
                            - '20'
                          messageSendTtlSeconds: 60
                          optimization:
                            bidAmount: 500
                            bidStrategy: BID_STRATEGY_LOWEST_COST_WITH_BID_CAP
                            bidCountryMultiplierOverrides:
                              US: '1.2'
                              GB: '1.1'
