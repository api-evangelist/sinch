components:
  schemas:
    ListWebhooksResponse:
      type: object
      properties:
        webhooks:
          type: array
          description: List of webhooks belonging to a specific project ID and app ID
          items:
            $ref: '#/components/schemas/Webhook'
    ClientCredentials:
      type: object
      description: Optional. Used for OAuth2 authentication.
      required:
      - client_id
      - client_secret
      - endpoint
      properties:
        client_id:
          description: The Client ID that will be used in the OAuth2 Client Credentials flow.
          type: string
        client_secret:
          description: The Client Secret that will be used in the OAuth2 Client Credentials flow.
          type: string
          format: password
        endpoint:
          description: The endpoint that will be used in the OAuth2 Client Credentials flow. Expected to return a JSON with an access token and `expires_in` value (in seconds). The `expires_in` value, which must be a minimum of 30 seconds and a maximum of 3600 seconds, is how long Sinch will save the access token before asking for a new one.
          type: string
        scope:
          description: 'Optional. Space-separated string per RFC 6749. Used to limit the access granted by the token.

            Max length: 1024 characters.

            If blank or omitted, this is not included in the token request.

            '
          type: string
          maxLength: 1024
        response_type:
          description: 'Optional. When granting `client_credentials`, this is generally omitted. If you do provide a value, it will be forwarded to your OAuth provider as-is.

            Max length: 64 characters.

            '
          type: string
          maxLength: 64
        token_request_type:
          description: 'Optional. Controls how `client_id` and `client_secret` are sent to the token endpoint. Either `BASIC` or `FORM`. If not set or unrecognized, `BASIC` is used by default.

            '
          type: string
          x-enumDescriptions:
            BASIC: Sent using the HTTP Authorization header (Basic auth). In this case, `client_id` and `client_secret` are NOT included in the form body.
            FORM: Sent in the form body as `client_id` and `client_secret`. No Authorization header is added.
          enum:
          - BASIC
          - FORM
          default: BASIC
    Webhook:
      description: Represents a destination for receiving callbacks from the Conversation API.
      type: object
      title: Webhook
      required:
      - target
      properties:
        app_id:
          description: The app that this webhook belongs to.
          type: string
        client_credentials:
          $ref: '#/components/schemas/ClientCredentials'
        id:
          description: The ID of the webhook.
          type: string
          readOnly: true
        secret:
          description: 'Optional secret be used to sign contents of webhooks sent by the Conversation API.

            You can then use the secret to verify the signature.'
          type: string
          format: password
        target:
          description: 'The target url where events should be sent to.

            Maximum URL length is 742.

            The conversation-api.*.sinch.com subdomains are forbidden.'
          type: string
        target_type:
          $ref: '#/components/schemas/WebhookTargetType'
        triggers:
          description: 'An array of triggers that should trigger the webhook and result in an

            event being sent to the target url.

            Refer to the list of [Webhook Triggers](https://developers.sinch.com/docs/conversation/callbacks/#webhook-triggers)

            for a complete list.'
          type: array
          items:
            $ref: '#/components/schemas/WebhookTrigger'
