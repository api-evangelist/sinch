    callType:
      title: Call Type
      x-category: call
      x-usage: call
      type: string
      description: 'The type of channel used for the call.


        This value indicates what kind of endpoint the call is connected to (PSTN phone number or WebSocket stream).'
      enum:
      - PHONE
      - SIP
      - STREAM
      - VOICE_RELAY
      x-enumDescriptions:
        PHONE: A call from or to the telephone network.
        SIP: A call from or to a SIP endpoint.
        STREAM: A call to a stream.
        VOICE_RELAY: A call to voice relay service.
      examples:
      - PHONE
    pause:
      type: object
      additionalProperties: false
      title: Pause
      description: 'Delays execution of the next command in the sequence for a specified duration. This is a blocking command — no further commands execute until the pause completes.


        The pause does not affect call audio; the call remains connected and audio continues uninterrupted.'
      required:
      - command
      - durationMilliseconds
      properties:
        command:
          type: string
          const: pause
          description: Pause execution.
        durationMilliseconds:
          type: integer
          minimum: 1
          description: Duration of the pause in milliseconds.
          example: 1000
      examples:
      - command: pause
        durationMilliseconds: 1500
    dial:
      type: object
      additionalProperties: false
      title: Dial
      description: 'Initiates a new outbound call leg within the current session.


        This is a non-blocking command — the next command in the sequence executes immediately while the call is being established in parallel. Call lifecycle events (answer, busy, reject, timeout, hangup, failure) are handled via the `events` property.


        The `from` and `to` endpoint types should ideally match. If they differ, the platform attempts to convert the `from` value to be compatible with the `to` type. For example, PSTN supports only E.164 phone numbers, so a SIP address such as `sip:46701234567@acme.se` can be converted to an E.164 number. If the `from` value cannot be converted, it defaults to null (anonymous).'
      required:
      - command
      - to
      properties:
        command:
          type: string
          const: dial
          description: Command to initiate a new call
        callName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: outgoing
          description: 'Identifier for this call leg within the session. Must be unique across all active call legs in the session.


            Other commands (e.g., `hangup`) can reference this name to target this specific leg.'
        from:
          $ref: '#/components/schemas/from'
        to:
          $ref: '#/components/schemas/to'
        dialTimeoutDurationSeconds:
          type: integer
          minimum: 1
          maximum: 60
          description: Maximum time in seconds to wait for the call to be answered. If the timeout expires without an answer, the `onTimeout` event is triggered.
          example: 15
        maxCallDurationSeconds:
          type: integer
          minimum: 1
          maximum: 14400
          description: Maximum duration of the call in seconds. The call is terminated automatically when this limit is reached.
          example: 3600
        events:
          $ref: '#/components/schemas/callEvents'
      examples:
      - command: dial
        callName: destination
        from:
          type: PHONE
          phone:
            number: '+15551234567'
        to:
          type: PHONE
          phone:
            number: '+15559876543'
        dialTimeoutDurationSeconds: 30
        maxCallDurationSeconds: 3600
        events:
          onAnswer:
          - command: messages
            messages:
            - type: SAY
              say:
                text: Your call has connected.
                voiceName: Emma
    callId:
      title: Call ID
      type: string
      format: ulid
      description: The `Id`` of the call.
      examples:
      - 01ARZ3NDEKTSV4RRFFQ69G5FAA
    recordingFormat:
      title: Recording Format
      description: Audio format for this recording.
      type: string
      enum:
      - MP3
      - WAV
      x-enumDescriptions:
        MP3: MPEG Audio Layer III compressed audio format.
        WAV: Waveform Audio File Format, uncompressed audio.
      default: MP3
      examples:
      - MP3
    call:
      type: object
      additionalProperties: false
      title: Call Resource
      description: Call details
      required:
      - callId
      - projectId
      - serviceId
      - sessionId
      - direction
      - originationType
      - callType
      - callResult
      - startTime
      - callRate
      - callResourceUrl
      properties:
        callId:
          $ref: '#/components/schemas/callId'
        projectId:
          $ref: '#/components/schemas/projectId'
        serviceId:
          $ref: '#/components/schemas/serviceId'
        sessionId:
          $ref: '#/components/schemas/sessionId'
        callName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          description: 'The name identifying this call leg within the session, as assigned by the `callName` property in the `dial` command or in the SVAML response to an incoming call webhook.


            Omitted for calls that were not assigned a name.'
          example: origin
        bridgeName:
          type: string
          description: The name of the bridge the call belongs to. Omitted for calls not assigned to any bridge.
          example: my-bridge
        batchId:
          $ref: '#/components/schemas/batchId'
        from:
          $ref: '#/components/schemas/from'
        to:
          $ref: '#/components/schemas/to'
        startTime:
          type: string
          format: date-time
          description: Timestamp (RFC 3339) indicating when the call was created and call setup was initiated (start of the call attempt).
          example: '2025-01-01 00:00:00+00:00'
        updateTime:
          type: string
          format: date-time
          description: 'Timestamp (RFC 3339) indicating when the call was last updated.


            Omitted if no updates were performed on this call.'
          example: '2025-01-01 00:00:00+00:00'
        callType:
          $ref: '#/components/schemas/callType'
        direction:
          $ref: '#/components/schemas/callDirection'
        answerTime:
          type: string
          format: date-time
          description: 'Timestamp (RFC 3339) indicating when the call was answered.


            Omitted if the call was not answered.'
          example: '2025-01-01 00:00:00+00:00'
        endTime:
          type: string
          format: date-time
          description: 'Timestamp (RFC 3339) indicating when the call ended.


            Omitted for ongoing calls.'
          example: '2025-01-01 00:00:00+00:00'
        callDurationSeconds:
          type: integer
          description: Duration of the call in seconds
          example: 42
        callResult:
          $ref: '#/components/schemas/callResult'
        callReason:
          $ref: '#/components/schemas/callReason'
        originationType:
          $ref: '#/components/schemas/originationType'
        callRate:
          $ref: '#/components/schemas/money'
          description: The rate charged for this call, expressed as a monetary amount **per minute** in the specified currency.
        callResourceUrl:
          type: string
          format: uri
          description: Absolute URI to this call resource. Use this URL to retrieve the call details
          example: https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01AN4Z07BY79KA1307SR9X4MV3
    recordingEvents:
      type: object
      additionalProperties: false
      title: Recording Events
      description: 'SVAML commands to execute based on recording lifecycle outcomes.

        '
      properties:
        onFinish:
          description: 'Commands to execute when the recording is successfully stopped. Note that this does not mean that the file is delivered to the configured destination yet.

            '
          $ref: '#/components/schemas/svamlCommands'
        onFailure:
          description: 'Commands to execute if the recording fails to start. If omitted, failures are silently ignored and the call flow continues.

            '
          $ref: '#/components/schemas/svamlCommands'
    bridgeCall:
      type: object
      additionalProperties: false
      title: Add call to bridge
      description: 'Adds the current call to a bridge, enabling bidirectional audio communication with other calls in the same session. This is a non-blocking command — execution continues to the next command in the sequence immediately after the call joins the bridge.


        Bridges are created automatically when referenced by name. If a bridge with the specified name already exists, the call joins that bridge; otherwise, a new bridge is created.'
      required:
      - command
      - bridgeName
      properties:
        command:
          type: string
          const: bridgeCall
          description: Command to add the call to a bridge
        bridgeName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          description: Name of the bridge to join. If no bridge with this name exists in the session, a new one is created automatically.
      examples:
      - command: bridgeCall
        bridgeName: my_bridge
    svamlCommand:
      title: SVAML Command
      type: object
      description: 'A single SVAML (Sinch Voice Application Markup Language) command that controls call behavior.


        The `command` property acts as a discriminator and determines which command schema applies. When multiple commands appear in a `svamlCommands` array, they execute sequentially in order.


        **Available commands:**

        - `dial` — Initiate an outbound call leg within the session.

        - `messages` — Play one or more TTS or audio messages on the call.

        - `stopMessages` — Stop a currently playing message sequence.

        - `webhook` — Trigger a mid-call webhook to the application backend for dynamic call control.

        - `amd` — Detect whether the call was answered by a human or an answering machine.

        - `hangup` — End the call or a specific call leg within the session.

        - `answer` — Explicitly answer an incoming call leg before executing further commands.

        - `pause` — Delay script execution without affecting call audio.

        - `startRecording` — Begin recording the call.

        - `stopRecording` — Stop an active call recording.

        - `bridgeCall` — Add the call to a named bridge for multi-party audio.

        - `menu` — Run menu-based input collection and route the call based on collected input.

        - `gotoMenu` — Switch execution to another named menu within the current menu context.'
      oneOf:
      - $ref: '#/components/schemas/amd'
      - $ref: '#/components/schemas/dial'
      - $ref: '#/components/schemas/messages'
      - $ref: '#/components/schemas/stopMessages'
      - $ref: '#/components/schemas/webhook'
      - $ref: '#/components/schemas/hangup'
      - $ref: '#/components/schemas/answer'
      - $ref: '#/components/schemas/pause'
      - $ref: '#/components/schemas/startRecording'
      - $ref: '#/components/schemas/stopRecording'
      - $ref: '#/components/schemas/bridgeCall'
      - $ref: '#/components/schemas/menu'
      - $ref: '#/components/schemas/gotoMenu'
      discriminator:
        propertyName: command
        mapping:
          amd: '#/components/schemas/amd'
          dial: '#/components/schemas/dial'
          messages: '#/components/schemas/messages'
          stopMessages: '#/components/schemas/stopMessages'
          webhook: '#/components/schemas/webhook'
          hangup: '#/components/schemas/hangup'
          answer: '#/components/schemas/answer'
          pause: '#/components/schemas/pause'
          startRecording: '#/components/schemas/startRecording'
          stopRecording: '#/components/schemas/stopRecording'
          bridgeCall: '#/components/schemas/bridgeCall'
          menu: '#/components/schemas/menu'
          gotoMenu: '#/components/schemas/gotoMenu'
    gotoMenu:
      type: object
      additionalProperties: false
      title: Goto Menu
      description: 'Switches execution to another menu within the current menu context. The menu name must be a menu defined in the `menu` command. This is a blocking command — execution waits for the menu to complete before proceeding to the next command.


        **Important**: this command can only be called within a menu execution context.'
      required:
      - command
      - menuName
      properties:
        command:
          type: string
          const: gotoMenu
          description: Switch execution to another menu within the current menu context.
        menuName:
          type: string
          description: Name of the target menu to execute next. Must match a key in menus.
          minLength: 1
          maxLength: 16
    callHeaders:
      type: array
      description: Custom headers to be sent in the call setup.
      maxItems: 16
      items:
        type: object
        additionalProperties: false
        required:
        - key
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '[\x20-\x7e\t]+$'
            description: Name of the header.
            example: headerKey
          value:
            type: string
            maxLength: 255
            pattern: '[\x20-\x7e\t]*$'
            description: Value of the header.
            example: headerValue
      examples:
      - - key: headerKey
          value: headerValue
        - key: anotherKey
          value: anotherValue
    svamlInput:
      type: object
      additionalProperties: false
      title: SVAML Input
      description: A SVAML v2 (Sinch Voice Application Markup Language) document describing a call flow. Contains the ordered list of commands to execute, an optional call name, and optional event handlers.
      required:
      - commands
      properties:
        commands:
          allOf:
          - $ref: '#/components/schemas/svamlCommands'
          minItems: 1
          description: The ordered list of SVAML commands to execute. Contains at least one command.
        callName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: incoming
          description: Name of the call.
        events:
          type: object
          description: Commands to execute on specific events for this call.
          properties:
            onHangup:
              $ref: '#/components/schemas/svamlCommands'
              description: SVAML commands to be executed when the call is hung up.
    sipCallHeaders:
      type: array
      description: Custom SIP headers to be sent in the call setup.
      maxItems: 16
      items:
        type: object
        additionalProperties: false
        required:
        - key
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[-A-Za-z0-9.!%*_+`'~]+$
            description: Name of the SIP header.
            example: X-Correlation-Id
          value:
            type: string
            maxLength: 255
            description: Value of the SIP header.
            example: '12345'
      examples:
      - - key: X-Correlation-Id
          value: '12345'
        - key: X-Call-Routing
          value: forwarded
    sessionId:
      title: Session ID
      type: string
      format: ulid
      description: The ID of the session.
      examples:
      - 01BX5ZZKBKACTAV9WEVGEMMVRB
    messageSay:
      type: object
      title: Say Message
      description: A text-to-speech (TTS) message item. The platform synthesizes the provided text into speech and plays it on the call.
      additionalProperties: false
      required:
      - type
      - say
      properties:
        type:
          type: string
          const: SAY
          description: Text-to-speech message to be played during the call.
        say:
          type: object
          additionalProperties: false
          title: Say
          required:
          - text
          - voiceName
          properties:
            text:
              type: string
              description: 'The text to be synthesized into speech.


                If `format` is `TEXT` (default), provide plain text.

                If `format` is `SSML`, provide a valid SSML document (for example, `<speak>...</speak>`).'
              maxLength: 600
              example: Hello world
            format:
              type: string
              description: Format of the message
              enum:
              - TEXT
              - SSML
              x-enumDescriptions:
                TEXT: Plain text format for the message.
                SSML: Speech Synthesis Markup Language format for advanced text-to-speech control.
              default: TEXT
            voiceName:
              description: The name of the voice to use for text-to-speech synthesis.
              $ref: '#/components/schemas/voiceName'
      examples:
      - type: SAY
        say:
          text: Hello, this is a test message
          voiceName: Emma
      - type: SAY
        say:
          text: <speak><prosody volume="-6dB">Hello, this is a test message</prosody></speak>
          format: SSML
          voiceName: Brian
    callEvents:
      type: object
      additionalProperties: false
      title: Call Events Webhook
      description: Webhook to handle call events, used when callBehaviors are set to WEBHOOK
      properties:
        onAnswer:
          description: SVAML commands to be executed when the call is answered
          $ref: '#/components/schemas/svamlCommands'
        onBusy:
          description: SVAML commands to be executed when the call is busy
          $ref: '#/components/schemas/svamlCommands'
        onReject:
          description: SVAML commands to be executed when the call is rejected
          $ref: '#/components/schemas/svamlCommands'
        onTimeout:
          description: SVAML commands to be executed when the call is timed out
          $ref: '#/components/schemas/svamlCommands'
        onHangup:
          description: SVAML commands to be executed when the call is hung up
          $ref: '#/components/schemas/svamlCommands'
        onFailure:
          description: SVAML commands to be executed when the call fails
          $ref: '#/components/schemas/svamlCommands'
    webhook:
      type: object
      additionalProperties: false
      title: Webhook
      description: 'Triggers a mid-call webhook to the application backend, allowing it to return a new set of SVAML commands that control the remainder of the call flow.


        This is a blocking command — execution pauses until a response is received from the webhook endpoint. The next command in the sequence runs only after the backend responds. Webhook requests use a 5-second timeout. If a `fallbackUrl` is provided, a failed request is re-sent to it — see *Timeouts and failover* in the **Webhooks** section for the authoritative algorithm.'
      required:
      - command
      - webhookName
      - url
      properties:
        command:
          type: string
          const: webhook
          description: Command to trigger a mid-call webhook
        webhookName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^\S+$
          description: 'Name for this webhook event. When triggered, the webhook request''s `event` property will contain this name prepended with `call.webhook.`.


            For example, if `webhookName` is set to `"my.custom.event"`, the event will be delivered as `"call.webhook.my.custom.event"`.'
        url:
          type: string
          description: URL of the webhook endpoint to send the mid-call event to.
          format: uri
        fallbackUrl:
          $ref: '#/components/schemas/webhookFallbackUrl'
      examples:
      - command: webhook
        webhookName: my.custom.event
        url: https://example.com/webhook
        fallbackUrl: https://example.com/fallback
    phoneNumber:
      title: Phone Number
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      minLength: 3
      maxLength: 16
      description: E.164 Phone number
      examples:
      - '+4673522488'
    from:
      description: Call origin - Phone Number or SIP endpoint
      oneOf:
      - $ref: '#/components/schemas/phone'
      - $ref: '#/components/schemas/sipFrom'
      discriminator:
        propertyName: type
        mapping:
          PHONE: '#/components/schemas/phone'
          SIP: '#/components/schemas/sipFrom'
    callDirection:
      title: Call Direction
      type: string
      description: Indicates the direction of the call.
      enum:
      - INBOUND
      - OUTBOUND
      x-enumDescriptions:
        INBOUND: A call initiated towards the Sinch Calling Platform.
        OUTBOUND: A call initiated from the Sinch Calling Platform.
      examples:
      - OUTBOUND
    startRecording:
      type: object
      additionalProperties: false
      title: Start Recording
      required:
      - command
      - recordingOptions
      description: Starts recording the call. This is a non-blocking command — execution continues to the next command in the sequence immediately after recording begins.
      properties:
        command:
          type: string
          const: startRecording
          description: Command to start recording on the channel
        recordingName:
          type: string
          description: 'Identifier for this recording within the session. Must be unique across active recordings in the session.


            Other commands (e.g., `stopRecording`) reference this name to target a specific recording.


            Setting the recording name is useful for stopping the recording using the `stopRecording` command. If name is not set, recording can only be stopped when the call is disconnected.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: my-recording
        recordingOptions:
          $ref: '#/components/schemas/recordingOptions'
        events:
          $ref: '#/components/schemas/recordingEvents'
      examples:
      - command: startRecording
        recordingName: customer-support-recording
        recordingOptions:
          format: MP3
          recordingType: COMBINED
          destination: AWS
          destinationUrl: s3://voice-recordings-prod/calls
          credentials: accessKeyId:secretAccessKey:eu-central-1
          transcriptionOptions:
            isEnabled: true
            locale: en-US
        events:
          onFinish:
          - command: hangup
          onFailure:
          - command: messages
            messages:
            - type: SAY
              say:
                text: Recording could not be started for this call.
                voiceName: Emma
    messagePlay:
      type: object
      title: Play Message
      description: An audio file playback message item. The platform fetches and plays the audio file at the provided URL on the call.
      additionalProperties: false
      required:
      - type
      - play
      properties:
        type:
          type: string
          const: PLAY
          description: Audio file playback during the call.
        play:
          type: object
          additionalProperties: false
          title: Play
          required:
          - url
          properties:
            url:
              type: string
              description: URL of the media to send
      examples:
      - type: PLAY
        play:
          url: https://example.com/media.mp3
    hangup:
      type: object
      additionalProperties: false
      description: 'Ends a call leg. This is a non-blocking command — execution continues to the next command in the sequence even though the call has been ended. The `onHangup` event is triggered for the call leg that was ended.


        Any subsequent commands that target the ended call leg (such as `messages` or other media commands) are valid but will not be executed. Commands that operate independently — such as initiating a new call with `dial` — will execute normally. This makes it possible, for example, to end one call and immediately start another within the same sequence.'
      title: Hangup
      required:
      - command
      properties:
        command:
          type: string
          const: hangup
          description: Hangup call
        callName:
          type: string
          description: 'Name of the call leg to end, as set by `callName` in the `dial` command.


            If omitted, the current call leg is ended.'
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          example: origin
      examples:
      - command: hangup
        callName: origin
    transcriptionOptions:
      title: Transcription Options
      description: Configuration for automatic speech-to-text transcription of the recording.
      type: object
      additionalProperties: false
      required:
      - isEnabled
      properties:
        isEnabled:
          type: boolean
          description: If true, the recording will be transcribed to text.
          example: true
        locale:
          type: string
          description: Language code in BCP-47 format.
          default: en-US
          example: en-US
    WebhookList:
      type: object
      properties:
        webhooks:
          type: array
