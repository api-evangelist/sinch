webhooks:
  OrderUpdated:
    post:
      operationId: order
      summary: Order Updated
      description: This is a webhook that will be called when an order is updated, it will contain the order and the status of the order.
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderWebhookStatusEvent'
            example:
              type: ORDER_UPDATED
              orderId: '897867'
              order:
                customerOrderReference: '123456'
                desiredPortSchedule:
                  desiredPortDate: '2024-09-24'
                  desiredPortTime: 09:00:00
                status: PENDING
                onDemandActivation: false
                phoneNumbers:
                - phoneNumber: '+12345678901'
                  portOutInfo:
                    existingPortOutPin: '1234'
                  endUser:
                    name: John Doe
                    streetName: Main St
                    streetNum: '123'
                    city: Anytown
                    state: NY
                    zipCode: '12345'
                  voiceConfiguration:
                    type: EST
                    trunkId: '123456'
    servers:
    - url: https://porting.api.sinch.com/v1/projects/{projectId}
      description: v1.0 of the porting API
      variables:
        projectId:
          description: The project with which you are working.
          default: YOUR_project_id
  NumbersActivated:
    post:
      operationId: numbersActivated
      summary: Number activated
      description: This notification occurs if at least one number on the port order was activated.
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberStatusWebhookStatusEvent'
            example:
              type: NUMBERS_ACTIVATED
              orderId: '897867'
              phoneNumbers:
              - phoneNumber: '+12345678901'
                status: ACTIVATED
                activatedDate: '2024-09-24T14:00:00Z'
    servers:
    - url: https://porting.api.sinch.com/v1/projects/{projectId}
      description: v1.0 of the porting API
      variables:
        projectId:
          description: The project with which you are working.
          default: YOUR_project_id
  NumbersConfirmed:
    post:
      operationId: NumbersConfirmed
      summary: Number confirmed
      description: This notification occurs when at least one number on the port order was confirmed. This notification also occurs when the number is ready to be activated and `onDemandActivation` was set to true or if it will be activated at the specified confirmation date.
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberStatusWebhookStatusEvent'
            example:
              type: NUMBERS_CONFIRMED
              orderId: '897867'
              phoneNumbers:
              - phoneNumber: '+12345678901'
                status: CONFIRMED
                confirmedDate: '2024-09-24T12:00:00Z'
    servers:
    - url: https://porting.api.sinch.com/v1/projects/{projectId}
      description: v1.0 of the porting API
      variables:
        projectId:
          description: The project with which you are working.
          default: YOUR_project_id
  NumbersRejected:
    post:
      operationId: NumbersRejected
      summary: Number Rejected
      description: This notification occurs if at least one number on the port order was rejected. Look at rejected reasons for more details on what went wrong.
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
