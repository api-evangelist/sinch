          type: boolean
          description: 'Whether regulations in the number''s region require supplementary documentation (for example, business or identity documents) to buy numbers of this type. The value is determined by the regulatory requirements for the number''s region and number type, so it''s the same for every number of that type in that region.


            If `true`, use the [Number Order](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order) API to buy the number: call "Lookup number requirements" to find out exactly which information and documents are required, then provide them with the order''s registration and attachment endpoints before submitting the order.'
          readOnly: true
      description: The phone numbers that are available to be rented in [dashboard.sinch.com](https://dashboard.sinch.com/numbers/buy-numbers) or via the public numbers API.
