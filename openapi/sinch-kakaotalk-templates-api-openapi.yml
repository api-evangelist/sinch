components:
  schemas:
    KakaotalkButtonDto:
      type: object
      properties:
        ordering:
          type: number
          description: Button sequence
          uniqueItems: false
        type:
          x-enumDescriptions:
            APP_LINK: Launches a deep link to open a specific target within a mobile application.
            BOT_FOR_CONSULTATION: Initializes an interactive support or automated consultation flow with a chat bot.
            BOT_KEYWORD: Submits a predefined automated keyword response block back to the chat bot.
            BOT_TRANSFER: Transfers the current communication context directly into a bot interaction sequence.
            BUSINESS_FORM: Launches an embedded native Kakao business questionnaire or lead collection form.
            BUTTON_TYPE_UNSPECIFIED: The configuration properties for the button type are unspecified.
            CHANNEL_ID_ADDED: Triggers a native prompt encouraging the end-user to subscribe to or add the Kakao channel.
            DELIVERY_SEARCH: Redirects the user to external delivery tracking metrics or shipping cargo lookups.
            IMAGE_SECURE_TRANSMISSION_PLUGIN_ID: Launches a secure verification plugin context dedicated to image file transmission.
            MESSAGE_DELIVERY: Advances the template execution loop to continue the underlying message delivery flow.
            ONE_CLICK_PAYMENT_PLUGIN: Launches an integrated native plug-in interface to complete a one-click payment checkout.
            PERSONAL_INFORMATION_USE_PLUGIN_ID: Launches a secure personal data governance plugin to gather explicit user privacy consent.
            WEB_LINK: Launches a target external URL routing path inside a web browser environment.
            UNRECOGNIZED: The value returned by an upstream system is not recognized by this API version.
          description: Button type
          uniqueItems: false
          allOf:
          - $ref: '#/components/schemas/KakaotalkKakaoTalkButtonTypeEnum'
