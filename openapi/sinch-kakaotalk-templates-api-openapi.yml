openapi: 3.2.0
info:
  title: Provisioning KakaoTalk Templates API
  description: The KakaoTalk template endpoint offers a way for you to manage your KakaoTalk templates that can be used with the Conversation API.
  version: 1.2.117
servers:
- url: https://provisioning.api.sinch.com
  description: Production server
security:
- BasicAuth: []
  BearerAuth: []
  OAuth2Production: []
tags:
- name: KakaoTalk Templates
  description: The KakaoTalk template endpoint offers a way for you to manage your KakaoTalk templates that can be used with the Conversation API.
paths:
  /v1/projects/{projectId}/kakaotalk/senders/{plusFriendId}/templates:
    get:
      description: Returns a paginated list of templates for the specified project. If no page token is supplied then the first `50` templates are returned in alphabetical order.
      operationId: KakaotalkTemplatesController_listTemplates_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: plusFriendId
        required: true
        in: path
        description: The unique ID of the sender.
        schema:
          type: string
      - name: filterStates
        required: false
        in: query
        description: Optionally query for template by states.
        x-enumDescriptions:
          APPROVED: The template is approved and available for use.
          REJECTED: The template was rejected and cannot be used.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/KakaotalkTemplateStatesEnum'
      - name: filterStatuses
        required: false
        in: query
        description: Optionally query for template by statuses.
        x-enumDescriptions:
          DRAFT: The template changes are saved as a draft only.
          IN_PROGRESS: The template changes have been submitted and are still processing.
          REJECTED: The template changes have been reviewed and rejected.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/KakaotalkTemplateStatusesEnum'
      - name: pageSize
        required: false
        in: query
        schema:
          type: number
          minimum: 1
          maximum: 1000
        description: The page size requested.
      - name: pageToken
        required: false
        in: query
        schema:
          type: string
        description: The page token if retrieving the next page from a previous query.
      - name: templateName
        required: false
        in: query
        description: Optionally query for template by name. Will return all templates with names that begin with the query string.
        schema:
          type: string
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkTemplateListDto'
              examples:
                response:
                  summary: List response
                  description: "\n    Response with templates.\n    "
                  value:
                    totalSize: 2
                    pageSize: 50
                    templates:
                    - id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                      code: S7yFqaKqJ8tsnBZH2CEd
                      state: APPROVED
                      details:
                        language: EN
                        messageType: BASIC
                        emphasizeType: EMPHASIZE_TYPE_NONE
                        categoryCode: '001001'
                        securityFlag: false
                        name: Example name
                        content: Example content
                        extra: Example extra
                        ad: Example ad
                        title: Example title
                        subtitle: Example subtitle
                        imageName: Example image name
                        imageUrl: https://example-image-url.com
                        buttons:
                        - ordering: 1
                          type: APP_LINK
                          name: Example Name
                          linkMo: https://example-link-mo.com
                          linkPc: https://example-link-pc.com
                          schemeIos: https://example-scheme-ios.com
                          schemeAndroid: https://example-scheme-android.com
                      created: '2023-02-24T10:19:31.372Z'
                      modified: '2023-02-24T10:19:31.372Z'
                    - id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                      code: S7yFqaKqJ8tsnBZH2CEd
                      state: APPROVED
                      details:
                        language: EN
                        messageType: BASIC
                        emphasizeType: EMPHASIZE_TYPE_NONE
                        categoryCode: '001001'
                        securityFlag: false
                        name: Example name
                        content: Example content
                        extra: Example extra
                        ad: Example ad
                        title: Example title
                        subtitle: Example subtitle
                        imageName: Example image name
                        imageUrl: https://example-image-url.com
                        buttons:
                        - ordering: 1
                          type: APP_LINK
                          name: Example Name
                          linkMo: https://example-link-mo.com
                          linkPc: https://example-link-pc.com
                          schemeIos: https://example-scheme-ios.com
                          schemeAndroid: https://example-scheme-android.com
                      changes:
                        status: IN_PROGRESS
                        details:
                          language: EN
                          messageType: BASIC
                          emphasizeType: EMPHASIZE_TYPE_NONE
                          categoryCode: '001001'
                          securityFlag: false
                          name: Example name
                          content: Example content
                          extra: Example extra
                          ad: Example ad
                          title: Example title
                          subtitle: Example subtitle
                          imageName: Example image name
                          imageUrl: https://example-image-url.com
                          buttons:
                          - ordering: 1
                            type: APP_LINK
                            name: Example Name
                            linkMo: https://example-link-mo.com
                            linkPc: https://example-link-pc.com
                            schemeIos: https://example-scheme-ios.com
                            schemeAndroid: https://example-scheme-android.com
                      created: '2023-02-24T10:19:31.372Z'
                      modified: '2023-02-24T10:19:31.372Z'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                project_not_initialized-0:
                  summary: ProjectNotInitializedError
                  value:
                    errorCode: project_not_initialized
                    message: Project not initialized for KakaoTalk.
                    resolution: Verify that the project ID is correct and that it has been onboarded for KakaoTalk.
                invalid_page_size-1:
                  summary: InvalidPageSizeError
                  value:
                    errorCode: invalid_page_size
                    message: Page size must be numeric.
                    resolution: Use a integer value for pageSize parameter.
                invalid_page_token-2:
                  summary: InvalidPageTokenError
                  value:
                    errorCode: invalid_page_token
                    message: Invalid page token.
                    resolution: The page token to use is provided in the previous query response, for new queries simply leave this field undefined.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                sender_not_found-0:
                  summary: SenderNotFoundError
                  value:
                    errorCode: sender_not_found
                    message: Sender not found.
                    resolution: Verify that the parameters are correct.
                template_not_found-1:
                  summary: TemplateNotFoundError
                  value:
                    errorCode: template_not_found
                    message: Template not found.
                    resolution: Verify that the parameters are correct.
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: List all templates in project
      tags:
      - KakaoTalk Templates
      x-badges:
      - name: GA
        position: after
        color: green
    post:
      callbacks:
        Comment:
          '{$request.body#webhooks.target}':
            post:
              summary: KakaoTalk Template received a comment
              description: "\n        Callback sent when a comment is placed on a template.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, in this case `KAKAOTALK_TEMPLATE_COMMENT_ADDED`.
                          type: string
                        payload:
                          description: Template at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/KakaotalkTemplateDto'
                        comment:
                          description: Comment for template.
                          type: string
                      required:
                      - type
                      - payload
                      - comment
                    example:
                      type: KAKAOTALK_TEMPLATE_COMMENT_ADDED
                      payload:
                        id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                        code: S7yFqaKqJ8tsnBZH2CEd
                        changes:
                          status: DRAFT
                          details:
                            language: EN
                            messageType: BASIC
                            emphasizeType: EMPHASIZE_TYPE_NONE
                            categoryCode: '001001'
                            securityFlag: false
                            name: Example name
                            content: Example content
                            extra: Example extra
                            ad: Example ad
                            title: Example title
                            subtitle: Example subtitle
                            imageName: Example image name
                            imageUrl: https://example-image-url.com
                            buttons:
                            - ordering: 1
                              type: APP_LINK
                              name: Example Name
                              linkMo: https://example-link-mo.com
                              linkPc: https://example-link-pc.com
                              schemeIos: https://example-scheme-ios.com
                              schemeAndroid: https://example-scheme-android.com
                        created: '2023-02-24T10:19:31.372Z'
                        modified: '2023-02-24T10:19:31.372Z'
                      comment: new template comment
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        Approved:
          '{$request.body#webhooks.target}':
            post:
              summary: KakaoTalk Template approved
              description: "\n        Callback sent when a template is approved.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, in this case `KAKAOTALK_TEMPLATE_APPROVED`.
                          type: string
                        payload:
                          description: Template at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/KakaotalkTemplateDto'
                      required:
                      - type
                      - payload
                    example:
                      type: KAKAOTALK_TEMPLATE_APPROVED
                      payload:
                        id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                        code: S7yFqaKqJ8tsnBZH2CEd
                        state: APPROVED
                        details:
                          language: EN
                          messageType: BASIC
                          emphasizeType: EMPHASIZE_TYPE_NONE
                          categoryCode: '001001'
                          securityFlag: false
                          name: Example name
                          content: Example content
                          extra: Example extra
                          ad: Example ad
                          title: Example title
                          subtitle: Example subtitle
                          imageName: Example image name
                          imageUrl: https://example-image-url.com
                          buttons:
                          - ordering: 1
                            type: APP_LINK
                            name: Example Name
                            linkMo: https://example-link-mo.com
                            linkPc: https://example-link-pc.com
                            schemeIos: https://example-scheme-ios.com
                            schemeAndroid: https://example-scheme-android.com
                        created: '2023-02-24T10:19:31.372Z'
                        modified: '2023-02-24T10:19:31.372Z'
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
        Rejected:
          '{$request.body#webhooks.target}':
            post:
              summary: KakaoTalk Template rejected
              description: "\n        Callback sent when a template is rejected.\n        "
              parameters:
              - in: header
                name: x-sinch-webhook-signature
                schema:
                  type: string
                  format: SHA256-hash
                example: Jc88RMjzkxPoy/fCPiL+iy7osojuUgawpjl1g6H38O8=
              - in: header
                name: x-sinch-webhook-signature-algorithm
                schema:
                  type: string
                  const: HmacSHA256
                  x-enumDescriptions:
                    HmacSHA256: The HMAC SHA-256 signature algorithm used to validate webhook authenticity.
                  uniqueItems: false
                example: HmacSHA256
              - in: header
                name: x-sinch-webhook-signature-nonce
                schema:
                  type: string
                example: 01EAW2BNWCG9DC13RS582V0ZQ3
              - in: header
                name: x-sinch-webhook-signature-timestamp
                schema:
                  type: string
                  format: timestamp
                example: '1592227387'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        type:
                          description: Type of event, in this case `KAKAOTALK_TEMPLATE_REJECTED`.
                          type: string
                        payload:
                          description: Template at time of callback.
                          allOf:
                          - $ref: '#/components/schemas/KakaotalkTemplateDto'
                      required:
                      - type
                      - payload
                    example:
                      type: KAKAOTALK_TEMPLATE_REJECTED
                      payload:
                        id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                        code: S7yFqaKqJ8tsnBZH2CEd
                        state: REJECTED
                        details:
                          language: EN
                          messageType: BASIC
                          emphasizeType: EMPHASIZE_TYPE_NONE
                          categoryCode: '001001'
                          securityFlag: false
                          name: Example name
                          content: Example content
                          extra: Example extra
                          ad: Example ad
                          title: Example title
                          subtitle: Example subtitle
                          imageName: Example image name
                          imageUrl: https://example-image-url.com
                          buttons:
                          - ordering: 1
                            type: APP_LINK
                            name: Example Name
                            linkMo: https://example-link-mo.com
                            linkPc: https://example-link-pc.com
                            schemeIos: https://example-scheme-ios.com
                            schemeAndroid: https://example-scheme-android.com
                        created: '2023-02-24T10:19:31.372Z'
                        modified: '2023-02-24T10:19:31.372Z'
              responses:
                '200':
                  description: Response to callback will be ignored. The call will retry if unsuccessful.
      description: Creates a new template with the request data.
      operationId: KakaotalkTemplatesController_createTemplate_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: plusFriendId
        required: true
        in: path
        description: The unique ID of the sender.
        schema:
          type: string
      requestBody:
        required: true
        description: Template data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaotalkInputTemplateDto'
            examples:
              minimal:
                summary: Minimum example
                description: "\n    Minimum body to create a template.\n    "
                value:
                  details:
                    name: Example name
                    content: Example content
                    language: EN
              full:
                summary: Full example
                description: "\n    Full body to create a template.\n    "
                value:
                  status: SUBMIT
                  details:
                    language: EN
                    messageType: BASIC
                    emphasizeType: EMPHASIZE_TYPE_NONE
                    categoryCode: '001001'
                    securityFlag: false
                    name: Example name
                    content: Example content
                    extra: Example extra
                    title: Example title
                    subtitle: Example subtitle
                    imageName: Example image name
                    imageUrl: https://example-image-url.com
                    buttons:
                    - ordering: 1
                      type: APP_LINK
                      name: Example Name
                      linkMo: https://example-link-mo.com
                      linkPc: https://example-link-pc.com
                      schemeIos: https://example-scheme-ios.com
                      schemeAndroid: https://example-scheme-android.com
      responses:
        '201':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkTemplateDto'
              examples:
                response:
                  summary: Create response
                  description: "\n    Response when successfully creating a template.\n    "
                  value:
                    id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                    code: S7yFqaKqJ8tsnBZH2CEd
                    changes:
                      status: IN_PROGRESS
                      details:
                        language: EN
                        messageType: BASIC
                        emphasizeType: EMPHASIZE_TYPE_NONE
                        categoryCode: '001001'
                        securityFlag: false
                        name: Example name
                        content: Example content
                        extra: Example extra
                        ad: Example ad
                        title: Example title
                        subtitle: Example subtitle
                        imageName: Example image name
                        imageUrl: https://example-image-url.com
                        buttons:
                        - ordering: 1
                          type: APP_LINK
                          name: Example Name
                          linkMo: https://example-link-mo.com
                          linkPc: https://example-link-pc.com
                          schemeIos: https://example-scheme-ios.com
                          schemeAndroid: https://example-scheme-android.com
                    created: '2023-02-24T10:19:31.372Z'
                    modified: '2023-02-24T10:19:31.372Z'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                project_not_initialized-0:
                  summary: ProjectNotInitializedError
                  value:
                    errorCode: project_not_initialized
                    message: Project not initialized for KakaoTalk.
                    resolution: Verify that the project ID is correct and that it has been onboarded for KakaoTalk.
                template_invalid_category_code-1:
                  summary: TemplateInvalidCategoryCodeError
                  value:
                    errorCode: template_invalid_category_code
                    message: Invalid template category code.
                    resolution: Verify that the template category code used is supported for the provided project.
                invalid_payload-2:
                  summary: InvalidPayloadError
                  value:
                    errorCode: invalid_payload
                    message: Invalid payload.
                    resolution: Correct payload and submit again.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                unauthorized_error-0:
                  summary: UnauthorizedErrorError
                  value:
                    errorCode: unauthorized_error
                    message: Unauthorized error.
                    resolution: Verify that projectId is correct.
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                sender_not_found-0:
                  summary: SenderNotFoundError
                  value:
                    errorCode: sender_not_found
                    message: Sender not found.
                    resolution: Verify that the parameters are correct.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                template_exists-0:
                  summary: TemplateExistsError
                  value:
                    errorCode: template_exists
                    message: Template already exists.
                    resolution: Templates must have unique name. Change name and submit again.
        '424':
          description: FailedDependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                template_kakaotalk_validation_error-0:
                  summary: TemplateKakaotalkValidationErrorError
                  value:
                    errorCode: template_kakaotalk_validation_error
                    message: 'Template kakaoTalk validation error: Some details from provider'
                    resolution: Please try again later. If template is saved as draft, try to submit the template again. If option "saveDraftOnFailure" is specified as "false", try the request again.
                    additionalInformation: {}
                template_kakaotalk_validation_error-1:
                  summary: TemplateKakaotalkValidationErrorError
                  value:
                    errorCode: template_kakaotalk_validation_error
                    message: 'Template kakaoTalk validation error: Some details from provider'
                    resolution: Please try again later. If template is saved as draft, try to submit the template again. If option "saveDraftOnFailure" is specified as "false", try the request again.
                    additionalInformation:
                      templateCode: AX5NnkwWABRXG7LjDBGa
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                internal_error-0:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support. If template is saved as draft, try to submit the template again. If option "saveDraftOnFailure" is specified as "false", try the request again.
                    additionalInformation: {}
                internal_error-1:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support. If template is saved as draft, try to submit the template again. If option "saveDraftOnFailure" is specified as "false", try the request again.
                    additionalInformation:
                      templateCode: templateCode
                internal_error-2:
                  summary: InternalErrorError
                  value:
                    errorCode: internal_error
                    message: Internal server error.
                    resolution: Please wait and try again, if the error persist please contact support.
      summary: Create a template in project
      tags:
      - KakaoTalk Templates
      x-badges:
      - name: GA
        position: after
        color: green
  /v1/projects/{projectId}/kakaotalk/senders/{plusFriendId}/templates/{templateCode}:
    get:
      description: Returns a template for a project, with the specified name and language.
      operationId: KakaotalkTemplatesController_get_v1
      parameters:
      - name: projectId
        required: true
        in: path
        description: The unique ID of the project. You can find this on the <a href="https://dashboard.sinch.com/">Sinch Dashboard</a>.
        schema:
          type: string
      - name: plusFriendId
        required: true
        in: path
        description: The unique ID of the sender.
        schema:
          type: string
      - name: templateCode
        required: true
        in: path
        description: The unique name of the template.
        schema:
          type: string
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkTemplateDto'
              examples:
                response:
                  summary: Get response
                  description: "\n    Response when successfully creating a template.\n    "
                  value:
                    id: 1a76b24e-bead-4c72-b468-6c3bdfff0ee6
                    code: S7yFqaKqJ8tsnBZH2CEd
                    state: APPROVED
                    details:
                      language: EN
                      messageType: BASIC
                      emphasizeType: EMPHASIZE_TYPE_NONE
                      categoryCode: '001001'
                      securityFlag: false
                      name: Example name
                      content: Example content
                      extra: Example extra
                      ad: Example ad
                      title: Example title
                      subtitle: Example subtitle
                      imageName: Example image name
                      imageUrl: https://example-image-url.com
                      buttons:
                      - ordering: 1
                        type: APP_LINK
                        name: Example Name
                        linkMo: https://example-link-mo.com
                        linkPc: https://example-link-pc.com
                        schemeIos: https://example-scheme-ios.com
                        schemeAndroid: https://example-scheme-android.com
                    created: '2023-02-24T10:19:31.372Z'
                    modified: '2023-02-24T10:19:31.372Z'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaotalkPapiErrorDto'
              examples:
                project_not_initialized-0:
                  summary: ProjectNotInitializedError
                  value:
                    errorCode: project_not_initialized
