        scType:
          description: Short Code type. It is required for Short Code product verification US_SC_REGISTRY and it determines the type of Short Code that will be requested in the order. Vanity Short Codes are custom and can be chosen by the customer, while Random Short Codes are assigned by the provider without customer input. When VANITY is selected, scText must be provided with the list of requested short codes.
          type: string
          enum:
          - VANITY
          - RANDOM
          x-enumDescriptions:
            VANITY: Vanity Short Code
            RANDOM: Random Short Code
        scText:
          type: string
          description: Comma separated list of potential vanity short codes requested by the customer, in order of preference. Required when scType is VANITY. Optional otherwise for Short Code verification.
          examples:
          - We need 11111, if not available please provide SINCH
