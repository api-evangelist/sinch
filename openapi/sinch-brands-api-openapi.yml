openapi: 3.2.0
info:
  title: Sinch Brands API
  x-refined-note:
  - x-sinch-standards-version differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged brands across 3 of this provider''s published API definitions: sinch-brands-api-openapi.yaml, sinch-compliance-brands-api-openapi.yaml, original-sinch-brands-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Production server
  url: https://brand.registrations.api.sinch.com
- description: Production server. Data processed and stored within Europe.
  url: https://compliance.api.sinch.com
- url: https://brands.api.sinch.com
  description: Global Production Server
tags:
- description: Create and manage Customer Brands
  name: Brands
  x-displayName: Brands
paths:
  /v1/projects/{projectId}/brands:
    post:
      description: The endpoint creates a new brand for the specified project in draft status. Drafts are not validated against the brand type format, this is done at submission. A brand in draft status is editable.
      operationId: createBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brand'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'BAD_REQUEST: Any validation error'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Create a brand
      tags:
      - Brands
    get:
      description: The endpoint receives as path param project id. If the project exists, the list of brands for the project is returned. Additional filters can be applied as query params. By default, ARCHIVED brands are not returned. To include them, the status filter must be used.
      operationId: listBrands
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        description: The brand status to filter the brands.
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BrandStatus'
      - in: query
        description: The brand metadata type to filter the brands
        name: brandType
        required: false
        schema:
          $ref: '#/components/schemas/BrandType'
      - in: query
        name: orderBy
        description: 'Ordering of the results: field name with an optional order separated by a comma. Fields that support ordering are ''brandName'', ''status'', ''createTime'', ''updateTime'' with possible ordering ''desc'' or ''asc'''
        schema:
          type: string
        example: brandName,asc
      - in: query
        name: pageSize
        description: Size of the page to be returned.
        schema:
          format: int32
          type: integer
        example: 100
      - in: query
        name: pageToken
        description: Page token to request subsequent pages when using pagination. This should be the value generated by the system in a previous list request.
        schema:
          type: string
      - in: query
        name: brandName
        description: Filter brands by brand name.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListBrandResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - read
      summary: List brands for a project
      tags:
      - Brands
    servers:
    - description: Production server
      url: https://brand.registrations.api.sinch.com
  /v1/projects/{projectId}/brands/{brandId}:
    get:
      description: The endpoint receives as path param project id and brand id. If the project and brand exist, the details of the brand are returned.
      operationId: getBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Customer's brand id
        name: brandId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project or brand id introduced does not exist.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - read
      summary: Get a brand by project and brand id
      tags:
      - Brands
    delete:
      description: The endpoint receives as path param project id and brand id. If the project and brand exist, the brand is deleted.
      operationId: deleteBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Customer's brand id
        name: brandId
        required: true
        schema:
          type: string
      responses:
        '200':
          content: {}
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project or brand id introduced does not exist.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Delete a brand by project and brand id
      tags:
      - Brands
    put:
      description: The endpoint receives as path param project id and brand id. If the project and brand exist, the brand is updated. Only NEW and PENDING_REVIEW brands can be updated.
      operationId: updateBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Customer's brand id
        name: brandId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'BAD_REQUEST: Any validation error'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project or brand id introduced does not exist.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Update a brand by project and brand id
      tags:
      - Brands
    servers:
    - description: Production server
      url: https://brand.registrations.api.sinch.com
  /v1/projects/{projectId}/brands/{brandId}:submit:
    post:
      description: The endpoint submit the brand for validation. The brand must be in DRAFT or INCOMPLETE status. The brand is validated against the brand type format and the status is updated accordingly (PENDING_REVIEW from INCOMPLETE, NEW from DRAFT).
      operationId: submitBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Customer's brand id
        name: brandId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'BAD_REQUEST: Any validation error'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Submit a brand
      tags:
      - Brands
      callbacks:
        Brand Status Update:
          '{$request.body#/callbackUrl}':
            post:
              description: The endpoint receives a callback when the brand status is updated. To receive callback notifications, the customer must provide a callback URL in the create Brand request body. The callback URL must be a valid URL and must be reachable from Sinch. Read brands callback configuration documentation for more details.
              summary: Callback for brand status update
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CallbackEventBody'
              responses:
                '200':
                  description: OK
                4XX:
                  description: Customer has refused callback event for any reason.
              security:
              - hmacAuth: []
    servers:
    - description: Production server
      url: https://brand.registrations.api.sinch.com
  /v1/projects/{projectId}/brands:submit:
    post:
      description: The endpoint creates and submits a new brand for the specified project in new status. The brand is validated against the brand type format.
      operationId: createAndSubmitBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brand'
        required: true
      responses:
        '200':
          description: Brand created and submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'BAD_REQUEST: Brand validation error'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Create and submit a brand
      tags:
      - Brands
    servers:
    - description: Production server
      url: https://brand.registrations.api.sinch.com
  /v1/projects/{projectId}/brand-metadata:
    get:
      description: Given a brand type in a query param, this endpoint returns the metadata required to build the brand registration form. The metadata is based on different brand categories that contain different set of attributes. Each attribute comes with its own set of validation rules.
      operationId: getBrandMetadata
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        description: The brand type for which the metadata is requested.
        name: brandType
        required: true
        schema:
          $ref: '#/components/schemas/BrandType'
      responses:
        '200':
          description: Successfully retrieved Brand Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandMetadata'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: Brand Metadata type not found'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - read
      summary: Get brand metadata
      tags:
      - Brands
    servers:
    - description: Production server
      url: https://brand.registrations.api.sinch.com
  /v1/projects/{projectId}/us/brands:
    post:
      x-sinch-stability: preview
      description: 'Creates a new Draft Brand in US with the request data.


        Note: The `Idempotency-Key` header is not supported in this version. Submitting the same request twice may create duplicate resources. Callers are responsible for deduplicating on their end. Idempotency-Key support will be added when this operation reaches Stable stability.'
      operationId: postV1ProjectsByProjectIdUsBrands
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Brand object to be created. The request body must include all the required fields for the brand creation, as well as the optional field contentProvider that indicates whether the brand is a Content Provider or a standard Brand. Depending on the value of this field, the brand will follow different registration processes and will have access to different types of orders and products.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
      responses:
        '201':
          description: Brand created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand_2'
              example:
                brandId: b1c7ccbf-919d-462f-8587-dec95a1b11ee
                displayName: Alpha Adventures Corp.
                status: DRAFT
                legalCompanyName: Alpha Adventures Corp.
                entityType: CORPORATION
                verticalType: RETAIL
                country: US
                street: 129 MacDougal Street, Manhattan
                city: New York
                state: New York
                zip: '10012'
                taxCountry: US
                federalTaxId: '123456789'
                website: https://www.alphaadventures.com
                companyEmail: contact@alphaadventures.com
                contactEmail: contact@alphaadventures.com
                contentProvider: false
                channels: []
                attachments: []
                logs: []
                createTime: '2024-01-15T10:00:00Z'
                updateTime: '2024-01-15T10:00:00Z'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'BAD_REQUEST: Any validation error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Creates a new Draft Brand in US with the request data
      tags:
      - Brands
      x-operation-id-source: normalized
      x-operation-id-original: createBrand
    get:
      x-sinch-stability: preview
      description: List existing brands according to the specified filters.
      operationId: getV1ProjectsByProjectIdUsBrands
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        description: The brand status to filter the brands.
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BrandStatus_2'
      - in: query
        name: displayName
        description: Filter brands by brand name.
        schema:
          type: string
      - in: query
        description: Filter by specific channel available.
        name: channelName
        required: false
        schema:
          $ref: '#/components/schemas/Channel'
      - in: query
        name: contentProvider
        description: Optional boolean flag to filter by content provider. If true, it returns content providers. If false, it returns standard brands. Default is false.
        schema:
          type: boolean
          default: false
      - in: query
        name: thirdPartyMetadataId
        description: Filter brands by an external system's identifier, such as a 10DLC or US Short Code Registry brand ID. Matches against the `value` of any `thirdPartyMetadata` entry (see the `ThirdPartyElement` schema) on any of the brand's registration processes, regardless of which `name` (e.g. `TCR_BRAND_ID`, `gch_brand_id`) it was stored under.
        schema:
          type: string
      - in: query
        name: sort
        description: 'Sorting of the results using SQL-like syntax: comma-separated field names with an optional '':desc'' or '':asc'' suffix. Fields that support sorting are ''displayName'', ''status'', ''createTime'', ''updateTime''. Defaults to ascending order when no suffix is provided.'
        schema:
          type: string
        example: displayName,status:desc
      - in: query
        name: pageSize
        description: Size of the page to be returned. Default is 20. Maximum is 100.
        schema:
          format: int32
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      - in: query
        name: pageToken
        description: Page token to request subsequent pages when using pagination. This should be the value generated by the system in a previous list request.
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Pagination links per RFC 8288. A `rel="next"` link is present when there are more results. Absence of a `next` link indicates the last page.
              schema:
                type: string
                example: <https://compliance.api.sinch.com/v1/projects/{projectId}/us/brands?pageToken=abc123>; rel="next"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBrandResponse_2'
              example:
                brands:
                - brandId: b1c7ccbf-919d-462f-8587-dec95a1b11ee
                  displayName: Alpha Adventures Corp.
                  status: DRAFT
                  channels: []
                  createTime: '2024-01-15T10:00:00Z'
                  updateTime: '2024-01-15T10:00:00Z'
                links:
                  next: https://compliance.api.sinch.com/v1/projects/proj-123/us/brands?pageToken=eyJsYXN0SWQiOiJiMWM3Y2NiZiJ9
                meta:
                  totalCount: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - read
      summary: List brands for a project
      tags:
      - Brands
      x-operation-id-source: normalized
      x-operation-id-original: listBrands
    servers:
    - description: Production server. Data processed and stored within Europe.
      url: https://compliance.api.sinch.com
  /v1/projects/{projectId}/us/brands/import:
    post:
      x-sinch-stability: preview
      description: 'This endpoint allows you to import a brand that has already been registered through another reseller or directly by the end-customer, enabling you to manage it through your account. To initiate the transfer, you must specify one of the available import options (IMPORT_TCR_BRAND or IMPORT_GCH_BRAND) and provide the brand''s unique ID from its original registry.


        Upon receiving the request, the system will copy the brand''s information from the source and create an import order that includes all existing third-party metadata from the original registration. Depending on the brand''s original registry, an email will be sent to the brand''s registered contact address to approve or deny the import request.


        Please note that an imported brand cannot be directly modified or updated through our system. For example, a brand imported via IMPORT_GCH_BRAND cannot have its Short Code registration details changed, although it can be extended for other services like 10DLC if required. All maintenance and update operations for the brand remain the responsibility of the original register.'
      operationId: importBrand
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Import Brand request body. It includes the import option to be used and the unique identifier of the brand in its original registry. Depending on the import option selected, the required identifier will differ, for IMPORT_TCR_BRAND, the required identifier is the 10DLC Brand ID; for IMPORT_GCH_BRAND, the required identifier is the US Short Code Registry Account ID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBrandRequest'
      responses:
        '201':
          description: Brand import initiated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBrandResponse'
              example:
                brandId: b1c7ccbf-919d-462f-8587-dec95a1b11ee
                brandOrderId: '212421442412'
                brandOwnerContactEmail: jo***@alphaadventures.com
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'BAD_REQUEST: Any validation error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError_2'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
      - OAuth2:
        - write
      summary: Imports an existing Brand in US
      tags:
      - Brands
    servers:
    - description: Production server. Data processed and stored within Europe.
      url: https://compliance.api.sinch.com
  /v1/projects/{projectId}/us/brands/{brandId}:
    get:
      x-sinch-stability: preview
      description: The endpoint receives as path param project id and brand id. If the project and brand exist, the details of the brand are returned.
      operationId: getV1ProjectsByProjectIdUsBrandsByBrandId
      parameters:
      - in: path
        description: Customer's project id
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        description: Customer's brand id
        name: brandId
        required: true
        schema:
          type: string
      responses:
