    sendOmniTemplate:
      summary: Send message using an omnichannel template
      value:
        app_id: '{APP_ID}'
        recipient:
          identified_by:
            channel_identities:
            - channel: '{CHANNEL}'
              identity: '{IDENTITY}'
        message:
          template_message:
            omni_template:
              template_id: YOUR_omni_template_id
              version: latest
              language_code: en_US
              parameters: {}
