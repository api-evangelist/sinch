openapi: 3.0.1
info:
  title: Chatlayer Analytics API
  version: 1.0.0
  contact:
    name: Support
    url: www.sinch.com
    email: support@sinch.com
externalDocs:
  description: Learn more
  url: https://developers.sinch.com/docs/chatlayer-analytics/
servers:
  - url: https://analytics.api.chatlayer.ai
    description: Europe
  - url: https://analytics.api.prod.us-east4.gcp.chatlayer.ai
    description: US
  - url: https://analytics.api.prod.asia-south1.gcp.chatlayer.ai
    description: APAC
  - url: https://analytics.api.prod.sa-east1.gcp.chatlayer.ai
    description: South America
security:
  - basicAuth: []
paths:
  /v1/apps/{app_id}/logs/stream:
    get:
      tags:
        - Apps
      operationId: Analytics_ListAppIntegrationsLogs
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          description: >-
            The maximum number of logs to return.

            The service may return fewer than this value.

            The maximum value allowed is 100; value above 100 will be coerced to
            100.
          schema:
            type: integer
            format: int32
        - name: page_token
          in: query
          description: >-
            A page token, received from a previous
            ListAppIntegrationsLogsRequest call.

            Provide this to retrieve a subsequent page.
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppIntegrationsLogsResponse'
  /v1/bots/{bot_id}/conversations:
    get:
      tags:
        - Conversations
      summary: Get conversation analytics
      operationId: Analytics_GetConversations
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Identifies the bot version.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the data series.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the data series, exclusive.
          required: true
          schema:
            type: string
        - name: channel_type
          in: query
          description: Filter by specific channels, multiple values separated by comma.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: language
          in: query
          description: Filter by specific languages, multiple values separated by comma.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: bucket
          in: query
          description: |-
            Time interval in which results will be grouped.
            Supported values are 1h,1d,1w. The interval should be smaller
            than the range specified in the  [start_time,end_time)
          schema:
            type: string
        - name: group_by
          in: query
          description: Group by a specific category. Can be channel_type or language
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationsResponse'
  /v1/bots/{bot_id}/conversations/insights:
    get:
      tags:
        - Conversations
      operationId: Analytics_GetConversationsInsights
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Identifies the bot version.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the data series.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the data series, exclusive.
          required: true
          schema:
            type: string
        - name: channel_type
          in: query
          description: Filter by specific channels, multiple values separated by comma.
          schema:
            type: string
        - name: language
          in: query
          description: Filter by specific languages, multiple values separated by comma.
          schema:
            type: string
        - name: stat
          in: query
          description: >-
            The stat to return, one of 'num_conversations', 'duration_seconds',
            'num_messages'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationsInsightsResponse'
  /v1/bots/{bot_id}/conversations/{conversation_id}/flow:
    get:
      tags:
        - Conversations
      operationId: Analytics_GetConversationFlow
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot
          required: true
          schema:
            type: string
        - name: conversation_id
          in: path
          description: Identifies the conversation
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date of the a range containing the conversation
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The end date of the a range containing the conversation
          required: true
          schema:
            type: string
        - name: message_id
          in: query
          description: >-
            Identifies a message withing a conversation. Optional.

            When specified only the transitions for the given message will be
            included
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationFlowResponse'
  /v1/bots/{bot_id}/events/attributes/{attribute_key}/values:
    post:
      tags:
        - Events
      operationId: Analytics_GetEventAttributeValues
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
        - name: attribute_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventAttributeValuesResponse'
  /v1/bots/{bot_id}/events/definitions:
    get:
      tags:
        - Events
      operationId: Analytics_ListEventDefinitions
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
        - name: page_token
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
        - name: team_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventDefinitionsResponse'
    post:
      tags:
        - Events
      operationId: Analytics_CreateEventDefinition
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                description:
                  type: string
                team_id:
                  type: string
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventDefinitionResponse'
  /v1/bots/{bot_id}/events/funnel:
    post:
      tags:
        - Events
      operationId: Analytics_ComputeEventsFunnel
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
                - end_time
                - start_time
                - steps
                - version
              type: object
              properties:
                version:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelStep'
                breakdown_property:
                  type: string
                order_type:
                  title: one of 'strict' or  'sequential'
                  type: string
                  default: sequential
                properties:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelStepFilter'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeFunnelResponse'
  /v1/bots/{bot_id}/events/stream:
    get:
      tags:
        - Events
      operationId: Analytics_ListEvents
      parameters:
        - name: bot_id
          in: path
          description: The ID of the bot
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: The version of the bot (either DRAFT or LIVE)
          required: true
          schema:
            type: string
        - name: page_size
          in: query
          description: >-
            The maximum number of events to return.

            The service may return fewer than this value.

            The maximum value allowed is 100; value above 100 will be coerced to
            100.
          schema:
            type: integer
            format: int32
        - name: page_token
          in: query
          description: |-
            A page token, received from a previous ListEvent call.
            Provide this to retrieve a subsequent page.
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the events, inclusive.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the events, exclusive.
          required: true
          schema:
            type: string
        - name: event
          in: query
          description: >-
            The event name to filter on. When provided, only occurences of that
            given event will be returned
          schema:
            type: string
        - name: conversation_id
          in: query
          description: >-
            The conversation to filter on. When provided, only events for the
            given conversation will be returned
          schema:
            type: string
        - name: user_id
          in: query
          description: >-
            The user to filter on. When provided, only events for the given user
            will be returned
          schema:
            type: string
        - name: campaign_id
          in: query
          description: >-
            The campaign to filter on. When provided, only events for the given
            campaign will be returned
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventsResponse'
    post:
      tags:
        - Events
      operationId: Analytics_ListEventsWithFilters
      parameters:
        - name: bot_id
          in: path
          description: The ID of the bot
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
                - end_time
                - start_time
                - version
              type: object
              properties:
                version:
                  title: The version of the bot (either DRAFT or LIVE)
                  type: string
                page_size:
                  type: integer
                  description: >-
                    The maximum number of events to return.

                    The service may return fewer than this value.

                    The maximum value allowed is 100; value above 100 will be
                    coerced to 100.
                  format: int32
                page_token:
                  type: string
                  description: |-
                    A page token, received from a previous ListEvent call.
                    Provide this to retrieve a subsequent page.
                start_time:
                  type: string
                  description: >-
                    The starting date for the time range of the events,
                    inclusive.
                end_time:
                  type: string
                  description: The ending date for the time range of the events, exclusive.
                event:
                  title: >-
                    The event name to filter on. When provided, only occurences
                    of that given event will be returned
                  type: string
                conversation_id:
                  title: >-
                    The conversation to filter on. When provided, only events
                    for the given conversation will be returned
                  type: string
                user_id:
                  title: >-
                    The user to filter on. When provided, only events for the
                    given user will be returned
                  type: string
                campaign_id:
                  title: >-
                    The campaign to filter on. When provided, only events for
                    the given campaign will be returned
                  type: string
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttributeFilter'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventsResponse'
  /v1/bots/{bot_id}/events/track:
    post:
      tags:
        - Events
      operationId: Analytics_TrackEvent
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                version:
                  type: string
                user_id:
                  type: string
                event:
                  type: string
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                context:
                  $ref: '#/components/schemas/TrackEventRequestContext'
                timestamp:
                  type: string
                  format: date-time
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackEventResponse'
  /v1/bots/{bot_id}/flows:
    get:
      tags:
        - Flows
      operationId: Analytics_GetFlows
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Identifies the bot version.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the data series.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the data series, exclusive.
          required: true
          schema:
            type: string
        - name: channel_type
          in: query
          description: Filter by specific channels, multiple values separated by comma.
          schema:
            type: string
        - name: language
          in: query
          description: Filter by specific languages, multiple values separated by comma.
          schema:
            type: string
        - name: path
          in: query
          description: >-
            Filter by specific path, multiple values with each value specifying
            the nodes in that path.
              eg. path[0]=somepath&path[1]=someOtherPath
               or path=somepath&path=someOtherPath
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFlowsResponse'
  /v1/bots/{bot_id}/flows/funnel:
    post:
      tags:
        - Flows
      operationId: Analytics_ComputeFlowFunnel
      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
                - end_time
                - start_time
                - steps
                - version
              type: object
              properties:
                version:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelStep'
                breakdown_property:
                  type: string
                order_type:
                  title: one of 'strict' or  'sequential'
                  type: string
                  default: sequential
                properties:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelStepFilter'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeFunnelResponse'
  /v1/bots/{bot_id}/flows/{step_id}:
    get:
      tags:
        - Flows
      operationId: Analytics_GetFlowStepDetails
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
            type: string
        - name: step_id
          in: path
          description: Filter by specific step in the flow identified by dialogstate id
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Identifies the bot version.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the data series.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the data series, exclusive.
          required: true
          schema:
            type: string
        - name: channel_type
          in: query
          description: Filter by specific channels, multiple values separated by comma.
          schema:
            type: string
        - name: language
          in: query
          description: Filter by specific languages, multiple values separated by comma.
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFlowStepDetailsResponse'
  /v1/bots/{bot_id}/flows/{step_id}/edges:
    get:
      tags:
        - Flows
      operationId: Analytics_GetFlowStepEdges
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
            type: string
        - name: step_id
          in: path
          description: Filter by specific step in the flow identified by dialogstate id
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Identifies the bot version.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the data series.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the data series, exclusive.
          required: true
          schema:
            type: string
        - name: channel_type
          in: query
          description: Filter by specific channels, multiple values separated by comma.
          schema:
            type: string
        - name: language
          in: query
          description: Filter by specific languages, multiple values separated by comma.
          schema:
            type: string
        - name: type
          in: query
          description: The edge type to return, one of 'sources' or 'targets'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFlowStepEdgesResponse'
  /v1/bots/{bot_id}/intents:
    get:
      tags:
        - Intents
      summary: Get most used intents
      operationId: Analytics_GetIntents
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Identifies the bot version.
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: The starting date for the time range of the data series.
          required: true
          schema:
            type: string
        - name: end_time
          in: query
          description: The ending date for the time range of the data series, exclusive.
          required: true
          schema:
            type: string
        - name: channel_type
          in: query
          description: Filter by specific channels, multiple values separated by comma.
          schema:
            type: string
        - name: language
          in: query
          description: Filter by specific languages, multiple values separated by comma.
          schema:
            type: string
        - name: bucket
          in: query
          description: |-
            Time interval in which results will be grouped.
            Supported values are 1h,1d,1w. The interval should be smaller
            than the range specified in the  [start_time,end_time)
          schema:
            type: string
        - name: after
          in: query
          description: Pagination cursor
          schema:
            type: string
        - name: before
          in: query
          description: Pagination cursor
          schema:
            type: string
        - name: first
          in: query
          description: First x items. Used in combination with after
          schema:
            type: integer
            format: int64
        - name: last
          in: query
          description: Last x items. Used in combination with before
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIntentsResponse'
  /v1/bots/{bot_id}/intents/insights:
    get:
      tags:
        - Intents
      operationId: Analytics_GetIntentInsights
      parameters:
        - name: bot_id
          in: path
