components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Generate your access token on the [Chatlayer
        platform](https://app.chatlayer.ai/settings/api-access/tokens).
  schemas:
    AttributeFilter:
      type: object
      properties:
        key:
          type: string
        operator:
          type: string
        value:
          type: array
          items:
            type: string
    CampaignInfo:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        medium:
          type: string
        name:
          type: string
        content:
          type: string
        term:
          type: string
    ComputeFunnelResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepResultByCohort'
    CreateEventDefinitionResponse:
      type: object
      properties:
        event_definition:
          $ref: '#/components/schemas/EventDefinition'
    CreateSubscriptionResponse:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
    EchoRequest:
      required:
        - message
      type: object
      properties:
        message:
          title: The message to echo back
          type: string
    EchoResponse:
      type: object
      properties:
        message:
          title: The echoed message
          type: string
    Edge:
      type: object
      properties:
        count:
          title: Total number of times this edge was traversed
          type: integer
          format: int64
        id:
          title: The id of the destination/source step (Deprecated)
          type: string
        type:
          title: The type of the destination/source step (Deprecated)
          type: string
        from_step:
          $ref: '#/components/schemas/Step'
        to_step:
          $ref: '#/components/schemas/Step'
    EventDefinition:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        bot_id:
          type: string
        event:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        volume_30_day:
          type: integer
          format: int32
    FlowStep:
      type: object
      properties:
        occurrences:
          type: integer
          description: The number of times this flow step occurred.
          format: int64
        id:
          type: string
          description: >-
            Identifies a bot dialog or a dropoff if the special value "DROPOFF
            is used.
    FlowTransition:
      type: object
      properties:
        id:
          type: string
        from_step:
          $ref: '#/components/schemas/Step'
        to_step:
          $ref: '#/components/schemas/Step'
        depth:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
    FunnelStep:
      type: object
      properties:
        order:
          type: integer
          format: int32
        event_id:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepFilter'
    FunnelStepFilter:
      type: object
      properties:
        key:
          type: string
        operator:
          type: string
        type:
          type: string
        value:
          type: array
          items:
            type: string
    FunnelStepResult:
      type: object
      properties:
        event_id:
          type: string
        count:
          type: integer
          format: int32
        order:
          type: integer
          format: int64
        breakdown_value:
          type: string
    FunnelStepResultByCohort:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepResult'
    GetConversationFlowResponse:
      type: object
      properties:
        bot_id:
          type: string
