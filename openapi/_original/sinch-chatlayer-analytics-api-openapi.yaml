  /v1/bots/{bot_id}/knowledge_base/tags:
    get:
      tags:
        - KnowledgeBase
      operationId: Analytics_GetKnowledgeBaseTagsInsights
      parameters:
        - name: bot_id
          in: path
          description: Identifies the bot.
          required: true
          schema:
