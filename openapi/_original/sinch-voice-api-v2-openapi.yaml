        callResourceUrl:
          type: string
          format: uri
          description: >-
            Absolute URI to this call resource. Use this URL to retrieve the
            call details
          example: >-
            https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01AN4Z07BY79KA1307SR9X4MV3
    callBehaviors:
      x-category: call
      x-usage: call
      title: Call Behaviors
      description: Defines how calls are handled for this service
      oneOf:
        - $ref: '#/components/schemas/callBehaviorsNone'
        - $ref: '#/components/schemas/callBehaviorsWebhook'
        - $ref: '#/components/schemas/callBehaviorsStatic'
      discriminator:
        propertyName: type
        mapping:
          NONE: '#/components/schemas/callBehaviorsNone'
          WEBHOOK: '#/components/schemas/callBehaviorsWebhook'
          STATIC: '#/components/schemas/callBehaviorsStatic'
      examples:
        - type: WEBHOOK
          webhook:
            url: https://example.com/webhook
            fallbackUrl: https://example.com/fallback
    callBehaviorsNone:
      type: object
      additionalProperties: false
      title: Call Behaviors (None)
      description: >-
        No call behavior is configured for the service. Incoming calls will not
        be handled and outbound calls can still be initiated via the API.
      required:
        - type
      properties:
        type:
          type: string
          const: NONE
          description: No call behavior is configured.
      examples:
        - type: NONE
    callBehaviorsWebhook:
      type: object
      additionalProperties: false
      title: Call Behaviors (Webhook)
      description: >-
        Calls are handled dynamically by sending webhook events to the
        configured URL. The backend responds with SVAML commands that control
        the call flow in real time.
      required:
        - type
        - webhook
      properties:
        type:
          type: string
          const: WEBHOOK
          description: Calls are handled by sending webhook requests to the configured URL.
        webhook:
          $ref: '#/components/schemas/webhookConfiguration'
      examples:
        - type: WEBHOOK
          webhook:
            url: https://example.com/webhook
            fallbackUrl: https://example.com/fallback
    callBehaviorsStatic:
      type: object
      additionalProperties: false
      title: Call Behaviors (Static)
      description: >-
        Calls are handled using a predefined static SVAML script. The commands
        are executed for every call on this service, without any backend
        involvement.
      required:
        - type
        - static
      properties:
        type:
          type: string
          const: STATIC
          description: Calls are handled using predefined static SVAML commands.
        static:
          $ref: '#/components/schemas/svamlInput'
      examples:
        - type: STATIC
