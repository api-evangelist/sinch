            instance:
              example: /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls
    call:
      type: object
      additionalProperties: false
      title: Call Resource
      description: Call details
      required:
        - callId
        - projectId
        - serviceId
        - sessionId
        - direction
        - originationType
        - callType
        - callResult
        - startTime
        - callRate
        - callResourceUrl
      properties:
        callId:
          $ref: '#/components/schemas/callId'
        projectId:
          $ref: '#/components/schemas/projectId'
        serviceId:
          $ref: '#/components/schemas/serviceId'
        sessionId:
          $ref: '#/components/schemas/sessionId'
        callName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\S+$
          description: >-
            The name identifying this call leg within the session, as assigned
            by the `callName` property in the `dial` command or in the SVAML
            response to an incoming call webhook.


            Omitted for calls that were not assigned a name.
          example: origin
        bridgeName:
          type: string
          description: >-
            The name of the bridge the call belongs to. Omitted for calls not
            assigned to any bridge.
          example: my-bridge
        batchId:
          $ref: '#/components/schemas/batchId'
        from:
          $ref: '#/components/schemas/from'
        to:
          $ref: '#/components/schemas/to'
        startTime:
          type: string
          format: date-time
          description: >-
            Timestamp (RFC 3339) indicating when the call was created and call
            setup was initiated (start of the call attempt).
          example: '2025-01-01 00:00:00+00:00'
        updateTime:
          type: string
          format: date-time
          description: |-
            Timestamp (RFC 3339) indicating when the call was last updated.

            Omitted if no updates were performed on this call.
          example: '2025-01-01 00:00:00+00:00'
        callType:
          $ref: '#/components/schemas/callType'
        direction:
          $ref: '#/components/schemas/callDirection'
        answerTime:
          type: string
          format: date-time
          description: |-
            Timestamp (RFC 3339) indicating when the call was answered.

            Omitted if the call was not answered.
          example: '2025-01-01 00:00:00+00:00'
        endTime:
          type: string
          format: date-time
          description: |-
            Timestamp (RFC 3339) indicating when the call ended.

            Omitted for ongoing calls.
          example: '2025-01-01 00:00:00+00:00'
        callDurationSeconds:
          type: integer
          description: Duration of the call in seconds
          example: 42
        callResult:
          $ref: '#/components/schemas/callResult'
        callReason:
          $ref: '#/components/schemas/callReason'
        originationType:
          $ref: '#/components/schemas/originationType'
        callRate:
