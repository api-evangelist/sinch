            instance:
              example: >-
                /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    tooManyRequests:
      title: Too Many Requests
      description: >-
        Returned when the request rate limit has been exceeded. Retry after the
