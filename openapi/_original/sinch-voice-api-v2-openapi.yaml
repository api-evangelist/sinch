        onUnknown:
          description: SVAML commands to be executed when an unknown event is detected
          $ref: '#/components/schemas/svamlCommands'
    messageEvents:
      type: object
      additionalProperties: false
      title: Message Events
      description: |
        SVAML commands to execute based on message playback outcomes.
      properties:
        onFinish:
          description: >
            Commands to execute when all messages in the sequence have finished
            playing.
          $ref: '#/components/schemas/svamlCommands'
    callResult:
      title: Call Result
      description: >-
        The outcome/state of the call.


        This field includes both **transitional** states (during call setup and
        execution) and **final** states (when the call has ended).
      type: string
      enum:
        - QUEUED
        - INITIATED
        - IN_PROGRESS
        - COMPLETED
        - REJECTED
        - NO_ANSWER
        - CANCEL
        - BUSY
        - FAILED
      x-enumDescriptions:
        QUEUED: The call is queued for initiation. This is a transitional state.
        INITIATED: >-
          The call is connecting but the recipient has not yet answered. This is
          a transitional state.
        IN_PROGRESS: >-
          The call has been answered and is in progress. This is a transitional
          state.
        COMPLETED: The call was answered and is ended. This is a final state.
        REJECTED: The call was rejected by the recipient.
        NO_ANSWER: The call was not answered by the recipient.
        CANCEL: The call was cancelled.
        BUSY: The call was not answered because the recipient was busy.
        FAILED: The call could not be completed.
      examples:
        - IN_PROGRESS
    callReason:
      title: Call Reason
      description: >-
        Reason explaining **why** the call ended in the given `callResult`.


        `callResult` describes **what** happened (state/outcome). `callReason`
        provides additional context about the

        underlying cause (for example, who terminated the call, routing issues,
        or validation errors).
      type: string
      enum:
        - OK
        - NOT_AVAILABLE
        - CALLER_HANGUP
        - CALLEE_HANGUP
        - MANAGER_HANGUP
        - DID_NOT_FOUND
        - INVALID_SCRIPT
        - UNKNOWN_PRODUCT
        - NO_MORE_ROUTES
        - ERROR
      x-enumDescriptions:
        OK: The call was completed successfully.
        NOT_AVAILABLE: The callee was not available.
        CALLER_HANGUP: The caller hung up the call.
        CALLEE_HANGUP: The callee hung up the call.
        MANAGER_HANGUP: The call was ended by the call manager.
        DID_NOT_FOUND: The DID number was not found.
        INVALID_SCRIPT: The SVAML script was invalid.
        UNKNOWN_PRODUCT: The product associated with the call is unknown.
        NO_MORE_ROUTES: There are no more routes to complete the call.
        ERROR: An error occurred during the call.
      examples:
        - OK
    sessionStates:
      title: Session States
      description: >-
        The state of the current session. Sessions can either be in a
        "transitional" or "final" state.  Sessions in a transitional state are
        ongoing. Sessions in a final state have will not send any  more events.
      readOnly: true
      type: string
      enum:
        - QUEUED
        - IN_PROGRESS
        - COMPLETED
        - EXPIRED
      x-enumDescriptions:
        QUEUED: >-
          The session is queued, no calls have been initiated for this session.
          This is a transitional state.
        IN_PROGRESS: >-
          At least one call has been initiated or received for this session.
          This is a transitional state.
        COMPLETED: The session was completed. This is a final state.
        EXPIRED: >-
          The call session was not initiated before the batch time-to-live (TTL)
          elapsed. This is a final state.
      examples:
        - COMPLETED
    callId:
