tags:
  - name: Services
    description: >-
      Services represent sets of configuration values and groupings for managing
      calls, such as service profiles, routing rules, and project settings.
      Services can be created, updated, and deleted via the API to organize call
      flows and endpoints.


      Service is the way you can manage your voice calls. Each service has its
      own configuration, including webhook URLs, default caller IDs, and other
      settings that control how calls are handled.


      ### Default Services

      When a new project is created a default service is automatically generated
      under this project. A default cannot be deleted directly, in order to
      delete a default service you must first promote another service to be the
      default one.


      When performing some Voice API operations, you may choose not to specify a
      serviceId, in which case the default service will be used. If you have
      multiple services, you can specify which one to use by providing its
      serviceId in the request.


      **If your account was created before the release of the voice API v2**,
      you may not have a service created under your projects. In this case, you
      must create a new one and set it as the default before you can use the
      programmable voice product within this project. You can do this via the
      API or the Dashboard.


      This can be useful if customers want to point a group of numbers to a
      particular incoming call URL, or want to record all calls for one voice
      service but not for the other.


      ### Dashboard

      Voice services and their settings can be managed via the
      [Dashboard](https://dashboard.sinch.com/voice-v2/services).
  - name: Batches
    description: >-
      A batch represents a group of call sessions initiated together as a single
      operation. 


      Batches are useful for scenarios like outbound campaigns, notifications,
      or any use case requiring multiple calls to be placed concurrently with
      controlled pacing.


      ### Key Features

      - **Rate limiting**: Control the maximum calls per second (CPS) to manage
      load and comply with carrier requirements

      - **TTL (Time-to-Live)**: Set a maximum time window for initiating queued
      calls

      - **Monitoring**: Track batch execution state including completed, failed,
      in-progress, and queued calls

      - **Cancellation**: Stop processing queued calls while allowing
      in-progress calls to complete
  - name: Calls
    description: >-
      Calls are the core resource for voice interactions. The API supports
      creating, retrieving, updating, and deleting calls, and accessing call
      metadata, state, and participants.


      A `Call` resource represents a connection between a voice channel and
      Sinch.


      Using this resource, customers can initiate a call, fetch information
      about a completed call, fetch a list of calls made to and from the [Voice
      service](/docs/voice-2.0/api-reference/voice/services/), and redirect or
      end a call in progress.


      A call always has a `direction`, either *inbound* or *outbound*. The
      direction of the call dictates when and how the call can be controlled.


      An **outbound** call is created when a DIAL command is invoked. Outbound
      calls can be controlled by supplying
      [SVAMLv2](/docs/voice-2.0/api-reference/svaml) commands when creating the
      call, via the responses to the call's webhooks, or by sending a `PATCH`
      request.


      An **inbound** call is created when the service receives a call via one of
      the Sinch voice channels [Phone, In-App, SIP, Streams]. To handle incoming
      calls, a service webhook must be configured via the [services
      API](/docs/voice-2.0/api-reference/voice/services) or the
      [dashboard](https://dashboard.sinch.com/voice).
  - name: Sessions
    description: >-
      A session represents a single interaction between a user and the Sinch
      Voice API. Sessions can be used to track the state of a call, including
      its duration, participants, and any associated metadata.
  - name: Payloads
    description: >-
      SVAML (Sinch Voice API Markup Language) is a JSON-based markup language
      used to define call flows and control the behavior of voice calls in the
      Sinch Voice API. It allows developers to specify commands that dictate how
      calls are handled, including dialing, playing messages, gathering input,
      and more.


      SVAML is used in various contexts within the Voice API, including:

      - **Call Creation**: When initiating outbound calls via the API.

      - **Webhooks**: When responding to call events with commands to control
      the ongoing call flow.

      - **Batch Calls**: When defining call flows for multiple calls in a batch
      operation.
  - name: Webhooks
    description: >-
      The Sinch Voice platform delivers real-time call event notifications to a
      configured webhook URL via HTTP POST requests.

      The receiving endpoint responds with [SVAML
      commands](/docs/voice-2.0/api-reference/svaml) that control the ongoing
      call flow.


      ## Request Format


      Webhook requests conform to the [CloudEvents
      1.0](https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/spec.md)
      specification using **HTTP binary content mode**:

      - CloudEvent metadata is carried as `ce-*` HTTP headers (see parameters
      below).

      - The request body contains only the event data payload (`call` object),
      encoded as `application/json`.


      ## When webhooks are triggered


      - **Incoming calls**: When a call arrives on a service configured with a
      webhook URL. Services using static SVAML behavior (`STATIC`) do not
      trigger this webhook.

      - **Call events**: When the service is configured with a webhook URL
      **and** the SVAML command does not have an `events` property defined. If
      the `events` property is present — even if empty — no webhook is triggered
      for that command's events. For example, a `dial` command with no `events`
      property will trigger a webhook when the call is answered; a `dial`
      command with `events: {}` will not.

      - **Custom events**: When a `webhook` SVAML command is executed explicitly
      during a call.


      ## Response


      The endpoint must return HTTP `200` with a JSON body containing SVAML
      commands to execute next, or an empty `commands` array to take no action.


      ## Timeouts and failover


      - Sinch enforces a **5-second response timeout**. Slow responses may
      affect call quality.

      - Webhook requests are **blocking**: execution of the call flow pauses
      until the endpoint responds, and the next command runs once a response has
      been received.

      - Webhook URLs are configured on the service via the [Services
      API](/docs/voice-2.0/api-reference/voice/services) or the
      [Dashboard](https://dashboard.sinch.com/voice/services). The `webhook`
      SVAML command carries its own `url` and `fallbackUrl` for mid-call events.


      ### What counts as a failure


      A delivery attempt has failed when: 

      - The endpoint returns a non-successful status code.

      - The endpoint does not respond within the 5-second timeout.

      - Returned body does not contain proper SVAML commands.


      Because the call flow is blocked while waiting, a delivery that ends with
      a failure disconnects the call. This happens when the primary URL fails
      and no `fallbackUrl` is configured, or when both the primary URL and the
      `fallbackUrl` fail.


      ### Failover algorithm


      This section is the authoritative description of how the webhook URL is
      selected. When a `fallbackUrl` is configured:


      1. Requests are sent to the primary `url`.

      2. If a request to the primary URL fails, that same event is re-sent
      immediately to the `fallbackUrl`. The primary URL continues to be used for
      subsequent requests.

      3. After several **consecutive failures** (exact number may vary) of the
      primary URL, the primary URL is bypassed and requests are sent only to the
      `fallbackUrl`. This avoids incurring the timeout on every request.

      4. While the primary URL is bypassed it is retried once every **60
      seconds**. The interval is counted from the last failure of the primary
      URL that triggers the bypass. Each unsuccessful retry restarts the
      60-second clock. As soon as a retry succeeds the primary URL is restored
      and processing returns to step 1.


      If no `fallbackUrl` is configured, a failed request is not retried and the
      event is not delivered.


      ### Delivery guarantees


      Because a failed request is re-sent to the fallback URL, the same event
      can be delivered more than once — for example when the primary endpoint
      received and processed the request but responded too slowly. Webhook
      handlers should be idempotent and deduplicate on the `ce-id` and
      `ce-source` header pair.
paths:
  /v2/projects/{projectId}/calls:
    get:
      tags:
        - Calls
      summary: List calls made with Sinch Voice API
      description: List and filter calls made with Sinch
      operationId: listCalls
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: serviceId
          description: The ID of the service.
          required: false
          schema:
            $ref: '#/components/schemas/serviceId'
        - in: query
          name: from
          description: >-
            Only include calls where `from` matches this origin.  For inbound
            calls, this is the caller; for outbound calls, this is the calling
            party.
          required: false
          schema:
            type: string
            example: '+15551234567'
        - in: query
          name: to
          description: >-
            Only include calls where `to` matches this destination. For inbound
            calls, this is the called party; for outbound calls, this is the
            callee/recipient.
          required: false
          schema:
            type: string
            example: '+15551234568'
        - in: query
          name: callType
          description: |-
            Only include calls of the specified type.

            If omitted, calls of all types are included.
          required: false
          schema:
            $ref: '#/components/schemas/callType'
        - in: query
          name: startTime
          description: >-
            Only include calls that started **at or after** `startTime`.


            Use a more precise timestamp to narrow the results. For example:

            - `2025-02-01` matches calls starting from 2025-02-01T00:00:00Z

            - `2025-02-01T14:00:00Z` matches calls starting from 14:00:00Z on
            2025-02-01
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-02-01T14:00:00Z'
        - in: query
          name: endTime
          description: >-
            Only include calls that ended **before** `endTime` (exclusive).


            Use a more precise timestamp to narrow the results. For example:

            - `2025-03-01` matches calls ending up to 2025-03-01T00:00:00Z

            - `2025-03-01T14:00:00Z` matches calls ending up to 14:00:00Z on
            2025-03-01
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-03-01T14:00:00Z'
        - in: query
          name: callResult
          description: >-
            Filter results to only include calls whose `callResult` matches the
            specified value.


            If omitted, calls with any result are included.
          required: false
          schema:
            $ref: '#/components/schemas/callResult'
        - in: query
          name: callReason
          description: >-
            Filter results to only include calls whose `callReason` matches the
            specified value.


            If omitted, calls with any reason are included.
          required: false
          schema:
            $ref: '#/components/schemas/callReason'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: A list of calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/callsList'
              example:
                calls:
                  - callId: 01ARZ3NDEKTSV4RRFFQ69G5FAA
                    projectId: 5c5bf2b1-35ae-4825-ab89-457e07bb60e6
                    serviceId: 6e124178-c29d-46a5-943c-5c2ae544aade
                    sessionId: 01BX5ZZKBKACTAV9WEVGEMMVRB
                    direction: OUTBOUND
                    originationType: SERVER
                    callType: PHONE
                    callResult: COMPLETED
                    callReason: CALLEE_HANGUP
                    startTime: '2025-02-10T09:00:00Z'
                    answerTime: '2025-02-10T09:00:05Z'
                    endTime: '2025-02-10T09:00:47Z'
                    callDurationSeconds: 42
                    from:
                      type: PHONE
                      phone:
                        number: '+15551234567'
                    to:
                      type: PHONE
                      phone:
                        number: '+15551234568'
                    callRate:
                      currencyCode: USD
                      amount: '0.0123'
                    callResourceUrl: >-
                      https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
                  - callId: 01BX5ZZKBKACTAV9WEVGEMMVRD
                    projectId: 5c5bf2b1-35ae-4825-ab89-457e07bb60e6
                    serviceId: 6e124178-c29d-46a5-943c-5c2ae544aade
                    sessionId: 01BX5ZZKBKACTAV9WEVGEMMVRE
                    direction: INBOUND
                    originationType: PHONE
                    callType: PHONE
                    callResult: IN_PROGRESS
                    startTime: '2025-02-10T09:05:00Z'
                    answerTime: '2025-02-10T09:05:08Z'
                    from:
                      type: PHONE
                      phone:
                        number: '+15559876543'
                    to:
                      type: PHONE
                      phone:
                        number: '+15551234567'
                    callRate:
                      currencyCode: USD
