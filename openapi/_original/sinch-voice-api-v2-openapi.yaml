      tags:
        - Services
      summary: Update a voice service
      description: >
        Updates an existing service resource with the provided properties. Only
        the fields included in the request body will be modified; omitted fields
        remain unchanged.


        To set a service as the default for the project, include `"isDefault":
        true` in the request. 

        Note that each project can have only one default service. Setting a new
        default will automatically remove the default status from the previously
        designated service.

        `"isDefault": false` is invalid and **will not** be accepted by the API.
      operationId: updateService
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateService'
            examples:
              webhooksExample:
                summary: Adding webhook callback behavior
                value:
                  description: Service with webhooks
                  callBehavior:
                    type: WEBHOOK
                    webhook:
                      url: https://example.com/webhook
                      fallbackUrl: https://example.com/fallback
              staticExample:
                summary: Adding static SVAML callback behavior
                value:
                  description: Service with static SVAML
                  callBehavior:
                    type: STATIC
                    static:
                      callName: incoming
                      commands:
                        - command: answer
                        - command: messages
                          messages:
                            - type: SAY
                              say:
                                text: >-
                                  Your call is working fine! This call will be
                                  disconnected.
                                voiceName: Emma
                          events:
                            onFinish:
                              - command: hangup
              noneExample:
                summary: Removing callback behavior
                value:
                  description: Service with no callback behavior
                  callBehavior:
                    type: NONE
      responses:
        '200':
          description: Service updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceResponse'
              example:
                serviceId: 6e124178-c29d-46a5-943c-5c2ae544aade
                projectId: 5c5bf2b1-35ae-4825-ab89-457e07bb60e6
                createTime: '2025-01-01T00:00:00Z'
                updateTime: '2025-06-01T09:15:00Z'
                name: My Voice Service
                description: Updated service description
                isDefault: true
                callBehavior:
                  type: WEBHOOK
                  webhook:
                    url: https://example.com/webhook
                    fallbackUrl: https://example.com/fallback
