            title:
              const: Account Suspended
            detail:
              example: No available balance/credit for this billing account.
            instance:
              example: >-
                /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    forbidden:
      title: Forbidden
