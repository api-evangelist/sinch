    money:
      title: Money
      description: A monetary amount with an associated currency code.
      type: object
      additionalProperties: false
      required:
        - currencyCode
        - amount
      properties:
        currencyCode:
          type: string
          description: >-
            The 3-letter currency code defined in [ISO
            4217](https://www.iso.org/iso-4217-currency-codes.html).
          example: USD
        amount:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          description: >-
            The monetary amount as a string to preserve precision. Supports up
            to 4 decimal places (e.g., "10.5000", "0.9999").
          example: '0.0123'
    paginationLinks:
      type: object
      additionalProperties: false
      required:
        - first
        - last
        - self
      title: Pagination Links
      description: >
        Pagination links for navigating through pages of results in a paginated
        list response.


        Available link properties:

        - `first` - Absolute URI of the first page

        - `last` - Absolute URI of the last page

        - `next` - Absolute URI of the next page (omitted if this is the last
        page)

        - `prev` - Absolute URI of the previous page (omitted if this is the
        first page)

        - `self` - Absolute URI of the current page
      properties:
        first:
          type: string
          format: uri
          description: Absolute URI of the first page.
          example: >-
            https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=1&pageSize=20
        last:
          type: string
          format: uri
          description: Absolute URI of the last page.
          example: >-
            https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=5&pageSize=20
        next:
          type: string
          format: uri
          description: Absolute URI of the next page (omitted if this is the last page).
          example: >-
            https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=3&pageSize=20
        prev:
          type: string
          format: uri
          description: >-
            Absolute URI of the previous page (omitted if this is the first
            page).
          example: >-
            https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=1&pageSize=20
        self:
          type: string
          format: uri
          description: Absolute URI of the current page.
          example: >-
            https://voice.api.sinch.com/v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls?page=2&pageSize=20
    paginationMeta:
      type: object
      additionalProperties: false
      required:
        - totalCount
        - pageCount
      title: Pagination Metadata
      description: |
        Metadata about the paginated list response.
      properties:
        totalCount:
          type: integer
          description: Total number of items across all pages.
          example: 100
        pageCount:
          type: integer
          description: Total number of pages.
          example: 5
    callPatchRequest:
      x-category: call
