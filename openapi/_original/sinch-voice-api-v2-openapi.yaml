        onFailure:
          description: SVAML commands to be executed when the call fails
          $ref: '#/components/schemas/svamlCommands'
    amdEvents:
      type: object
      additionalProperties: false
      title: AMD Events
      description: >-
        SVAML commands to execute based on the answering machine detection
