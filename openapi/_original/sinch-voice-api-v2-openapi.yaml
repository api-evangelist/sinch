components:
  responses:
    '400':
      description: Invalid request parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/badRequest'
    '401':
      description: Authentication failed — token missing, invalid, or expired.
      headers:
        WWW-Authenticate:
          description: >-
            RFC 7235 challenge. Indicates the required authentication scheme
            and, for expired tokens, provides an error hint.
          schema:
            type: string
            example: >-
              Bearer realm="sinch", error="invalid_token",
              error_description="Token has expired"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/unauthorized'
    '402':
      description: Payment required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/paymentRequired'
    '403':
      description: Forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/forbidden'
    '404':
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/notFound'
    '409':
      description: Resource with the same name already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/conflict'
    '429':
      description: Too many requests — rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          required: false
          schema:
            type: integer
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/tooManyRequests'
    '500':
      description: Internal server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/internalServerError'
  schemas:
    problemDetails:
      title: Problem Details
      description: >-
        Base error response schema following [RFC
        9457](https://www.rfc-editor.org/rfc/rfc9457) (Problem Details for HTTP
        APIs). All error responses use this structure.
      x-category: response
      x-usage: http-response
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - detail
        - instance
      properties:
        type:
          type: string
          description: >-
            URI that identifies the problem type and links to the corresponding
            error documentation.
        title:
          type: string
          description: Human-readable short summary of the problem type.
        detail:
          type: string
          description: Human-readable explanation of the specific problem occurrence.
        instance:
          type: string
          description: >-
            URI reference that identifies the specific occurrence of the problem
            (typically the request path).
    unauthorized:
      title: Unauthorized
      description: >-
        Returned when authentication fails — the token is missing, invalid, or
        expired.
      allOf:
        - $ref: '#/components/schemas/problemDetails'
        - type: object
          properties:
            type:
              const: https://api.sinch.com/docs/errors/unauthorized
            title:
              const: Unauthorized
            detail:
              example: The token is missing, invalid, or has expired.
            instance:
              example: >-
                /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    badRequest:
      title: Bad Request
      description: Returned when the request is malformed or contains invalid parameters.
      allOf:
        - $ref: '#/components/schemas/problemDetails'
        - type: object
          properties:
            type:
              const: https://api.sinch.com/docs/errors/bad-request
            title:
              const: Bad Request
            detail:
              example: The request body is invalid or malformed.
            instance:
              example: >-
                /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    conflict:
      title: Conflict
      description: >-
        Returned when a resource with the same name already exists in the
        project.
      allOf:
        - $ref: '#/components/schemas/problemDetails'
        - type: object
          properties:
            type:
              const: https://api.sinch.com/docs/errors/conflict
            title:
              const: Duplicate resource name
            detail:
              example: A resource with the name already exists in this project.
            instance:
              example: >-
                /v2/projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/calls/01ARZ3NDEKTSV4RRFFQ69G5FAA
    paymentRequired:
      title: Payment Required
      description: >-
        Returned when the account has insufficient balance or credit to complete
