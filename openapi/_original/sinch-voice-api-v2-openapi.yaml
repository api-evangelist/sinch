      required:
        - commands
      properties:
        commands:
          $ref: '#/components/schemas/svamlCommands'
      examples:
        - commands:
            - command: hangup
    callRequest:
      x-category: call
      x-usage: call
      type: object
      additionalProperties: false
      title: Callout requests
      description: >-
        Request payload to initiate an outbound call or a batch of outbound call
        sessions.

        If parameters are provided a batch of call sessions will be initiated.
        BatchOptions are only valid in that mode. If not provided, default
        values of each batch option will be used.
      required:
        - commands
      properties:
        commands:
          $ref: '#/components/schemas/svamlCommands'
        parameters:
          $ref: '#/components/schemas/requestParameters'
        batchOptions:
          $ref: '#/components/schemas/batchOptions'
      examples:
        - commands:
            - command: dial
              callName: origin
              from:
                type: PHONE
                phone:
                  number: '+4673522480'
              to:
                type: PHONE
                phone:
                  number: '+4673522488'
              dialTimeoutDurationSeconds: 45
              maxCallDurationSeconds: 3600
              events:
                onAnswer:
                  - command: messages
                    messages:
                      - type: SAY
                        say:
                          text: >-
                            Hello, you are going to be connected to our Echo
                            service. Say something and you should be able to
                            hear yourself.
                          format: TEXT
                          voiceName: Brian
                  - command: bridgeCall
                    bridgeName: bridge
                  - command: dial
                    callName: destination
                    to:
                      type: STREAM
                      stream:
                        endpoint: ws://echo/
                    dialTimeoutDurationSeconds: 45
                    maxCallDurationSeconds: 60
                    events:
                      onAnswer:
                        - command: bridgeCall
                          bridgeName: bridge
                      onHangup:
                        - command: hangup
                          callName: origin
                onHangup:
                  - command: hangup
                    callName: destination
    callResponse:
      x-category: call
      x-usage: call
      type: object
      additionalProperties: false
      title: Callout response
      description: >-
        Response returned after initiating an outbound call or a batch of call
        sessions.


        Contains identifiers for the created session and associated
        project/service. `batchId` is included only when the request started a
        batch operation.
      required:
        - projectId
        - serviceId
        - sessionId
      properties:
        projectId:
          $ref: '#/components/schemas/projectId'
        serviceId:
          $ref: '#/components/schemas/serviceId'
        sessionId:
          $ref: '#/components/schemas/sessionId'
        batchId:
          $ref: '#/components/schemas/batchId'
    batchDetails:
      title: Batch details
      description: >-
        Detailed per-session view of a batch call operation. Contains one entry
        for each call session in the batch, including the session identifier and
        its current execution state.
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                format: ulid
                description: >-
                  Unique identifier of the call session within the batch. This
                  identifies the session, not an individual call. Use it with 
                  `/v2/projects/{projectId}/sessions/{sessionId}` to retrieve
                  full session details.
              state:
                $ref: '#/components/schemas/sessionStates'
          examples:
            - - id: 01F8Z5J4X2G9Y3J4X2G9Y3J4X2G9
                state: COMPLETED
              - id: 01F8Z5J4X2G9Y3J4X2G9Y3J4X5YJ
                state: IN_PROGRESS
    batchSummary:
      title: Batch Summary
      description: >-
        Summary of a batch call operation, including counts of call sessions by
        state and overall progress.
      type: object
      additionalProperties: false
      required:
        - batchId
        - sessionCount
        - queued
        - inProgress
        - completed
        - expired
        - requestedCps
      properties:
        batchId:
          type: string
          format: ulid
          description: >-
            Unique identifier of the batch call operation (ULID).

            Use this value to retrieve the batch details ([GET]
            `/v2/projects/{projectId}/batches/{batchId}/details`) or stop
            processing ([DELETE] `/v2/projects/{projectId}/batches/{batchId}`).
        sessionCount:
          type: integer
          example: 100
          description: Total number of call sessions requested in this batch.
        endTime:
          type: string
          format: date-time
          description: >-
            Timestamp (RFC 3339) when the batch finished processing (all call
            sessions reached a final state). Returns


            Omitted if the batch is still in progress or has not completed yet.
        queued:
          type: integer
          example: 5
          description: >-
            Number of call sessions that are queued and waiting to be initiated
            (not yet in progress).
        inProgress:
          type: integer
          example: 2
          description: Number of call sessions that are in progress.
        completed:
          type: integer
          example: 93
          description: Number of call sessions that have completed successfully.
        expired:
          type: integer
          example: 0
          description: >-
            Number of queued call sessions that were not initiated before the
            batch TTL (`ttlSeconds`) elapsed and therefore expired.
        ttlSeconds:
          type: integer
          description: >-
            Batch time-to-live (TTL) in seconds. The maximum amount of time the
            platform will keep attempting to start queued call sessions in this
            batch.

            When the TTL expires, any call sessions that have not yet been
            initiated will stop being processed (calls already in progress are
            not affected).
          example: 10800
        requestedCps:
          type: integer
          example: 10
          description: >-
            Requested maximum call initiation rate, in calls per second (CPS),
            for this batch.

            Actual CPS may be lower depending on routing, carrier, and platform
            capacity, as well as account limitations.
    batchStopResponse:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          description: State of the batch processing cancellation request
          enum:
            - STOP_REQUESTED
          x-enumDescriptions:
            STOP_REQUESTED: >-
              Batch call processing cancellation requested. No new calls will be
              initiated.
    session:
      x-category: session
      x-usage: session
      type: object
      additionalProperties: false
      title: Session Resource
      description: >-
        A session represents the complete lifecycle of a voice interaction
        initiated through the Voice API.


        A session can contain one or more related call legs (for example, an
        original outbound call plus additional dials or transfers triggered by
        SVAML commands). 

        Use the `calls` array to inspect all call legs associated with the
        session and `state` to determine whether the session is still ongoing or
        has reached a final state.
      required:
        - sessionId
        - projectId
        - serviceId
        - calls
        - createTime
        - state
      properties:
        sessionId:
          $ref: '#/components/schemas/sessionId'
        projectId:
          $ref: '#/components/schemas/projectId'
        serviceId:
          $ref: '#/components/schemas/serviceId'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/call'
        createTime:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp (RFC 3339) indicating when the session was created.
          example: '2025-01-01 00:00:00+00:00'
        updateTime:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Timestamp (RFC 3339) indicating when the session was last updated.

            Omitted if no updates were performed on this session.
          example: '2025-01-01 00:00:00+00:00'
        endTime:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Timestamp (RFC 3339) indicating when the session ended.

            Omitted for ongoing sessions.
          example: '2025-01-01 00:00:00+00:00'
        state:
          $ref: '#/components/schemas/sessionStates'
    webhookRequest:
      x-category: webhooks
      x-usage: call
      type: object
      additionalProperties: false
      title: Webhook event payload
      description: The event payload delivered to the webhook endpoint.
      required:
        - event
        - call
      properties:
        event:
          description: >-
            Identifies the type of call event that triggered this webhook
            notification.

            Call-related webhook events always start with `call.` followed by
            the type of event that triggered them. Events triggered by the
            `webhook` SVAML command are dynamic and follow the pattern
            `call.webhook.<webhookName>`.
          oneOf:
            - type: string
              enum:
                - call.incoming
                - call.answered
                - call.busy
                - call.rejected
                - call.timeout
                - call.hangup
                - call.failed
                - call.amd.human
                - call.amd.machine
                - call.amd.beep
                - call.amd.unknown
                - call.message.finished
                - call.recording.finished
                - call.recording.failed
                - call.menu
              x-enumDescriptions:
                call.incoming: >-
                  Triggered when an inbound call arrives on a service configured
                  with a webhook URL.
                call.answered: Triggered when an outbound call is answered by the recipient.
                call.busy: Triggered when the outbound call recipient is busy.
                call.rejected: Triggered when the outbound call is rejected by the recipient.
                call.timeout: >-
                  Triggered when the outbound call was not answered within the
                  dial timeout.
                call.hangup: Triggered when the call is disconnected.
                call.failed: Triggered when the call could not be set up.
                call.amd.human: >-
                  Triggered when answering machine detection determines that a
                  human answered the call.
                call.amd.machine: >-
                  Triggered when answering machine detection determines that a
                  machine answered the call.
                call.amd.beep: >-
                  Triggered when answering machine detection detects a voicemail
                  beep.
                call.amd.unknown: >-
                  Triggered when answering machine detection cannot determine
                  whether a human, machine, or beep was detected.
                call.message.finished: >-
                  Triggered when all messages in a `messages` sequence have
                  finished playing.
                call.recording.finished: >-
                  Triggered when a recording is successfully stopped. This event
                  does not guarantee that the recorded file has been delivered
                  to the configured destination yet.
                call.recording.failed: Triggered when recording could not be started.
                call.menu: >-
                  Triggered when a menu completes and input is received from the
                  user or the menu fails.
            - type: string
              pattern: ^call\.webhook\.
              description: >-
                Dynamic event name from a `webhook` SVAML command, prefixed with
                `call.webhook.`.
          example: call.incoming
        call:
          description: The current state of the call at the time the event was triggered.
          $ref: '#/components/schemas/call'
        menu:
          type: object
          description: >-
            Information about the menu interaction that triggered the webhook,
            including the menu name and the input sequence received from the
            user.


            This property is also included for webhooks triggered by the
            `webhook` command within a menu context.
          required:
            - menuName
            - input
          properties:
            menuName:
              type: string
              description: The name of the menu that triggered this webhook event.
            input:
              type: string
              description: The input sequence gathered from the user by the menu.
    webhookResponse:
      type: object
      title: Webhook Response
      description: >-
        A SVAML document returned in response to a webhook.


        **Note:** `callName` and `events` only take effect in responses to
        webhooks triggered by an incoming call. In responses to other webhook
        types, they are ignored.
      allOf:
        - $ref: '#/components/schemas/svamlInput'
    callDirection:
      title: Call Direction
      type: string
      description: Indicates the direction of the call.
      enum:
