      allOf:
        - $ref: '#/components/schemas/problemDetails'
        - type: object
          properties:
            type:
              const: https://api.sinch.com/docs/errors/too-many-requests
            title:
              const: Too Many Requests
            detail:
              example: >-
                Rate limit exceeded. Please slow down your request rate and
