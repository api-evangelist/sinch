  parameters:
    projectId:
      name: projectId
      description: The ID of the project.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/projectId'
    sessionId:
      name: sessionId
      description: The ID of the session.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/sessionId'
    pageSize:
      in: query
      name: pageSize
      description: Number of items to be returned on each page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    page:
      in: query
      name: page
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    serviceId:
      name: serviceId
      description: The ID of the service.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/serviceId'
    serviceIdQuery:
      name: serviceId
      description: The ID of the service.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/serviceId'
    callId:
      name: callId
      description: The ID of the call.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/callId'
    batchId:
      name: batchId
      description: The ID of the batch.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/batchId'
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 16
        maxLength: 128
      required: false
      description: >-
        Client-generated idempotency key to safely retry requests. The server
        uses this key to recognize retries of the same request. If a request
        with the same key is received within 10 minutes, the server returns the
        cached response from the original request. Using a random UUID (v4) is
        strongly recommended.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |-
        Use HTTP Basic authentication.

        - **Username**: the **Access Key ID**
        - **Password**: the **Access Key Secret**

        Send credentials in the `Authorization` header:

        `Authorization: Basic <base64(AccessKeyId:AccessKeySecret)>`

        Create and manage access keys in the Dashboard:
        https://dashboard.sinch.com/settings/access-keys
    SinchOAuth2:
      type: oauth2
      description: >-
        OAuth 2.0 **Client Credentials** grant (recommended for production).


        Exchange the **Access Key ID** (`client_id`) and **Access Key Secret**

        (`client_secret`) for a short-lived Bearer token.


        Tokens typically expire after **3600 seconds**. When the token expires,

        request a new one using the same `tokenUrl`. There is no separate

        refresh token in the client credentials flow — simply re-authenticate.


        Access keys are managed in the Dashboard:
        https://dashboard.sinch.com/settings/access-keys
      flows:
        clientCredentials:
          tokenUrl: https://auth.sinch.com/oauth2/token
          refreshUrl: https://auth.sinch.com/oauth2/token
          scopes: {}
webhooks:
  call.webhook:
    description: Webhook request sent from the Voice Platform to the customer's backend.
    post:
      tags:
        - Webhooks
      summary: Call webhook
      description: >-
        Receives webhook notifications for call events from the Voice Platform.


        ### Request signing


        Every webhook request is signed by the Voice Platform so that the
        receiving

        endpoint can verify that the request was sent by Sinch and was not
        altered in

        transit.


        The signature is carried in the `Authorization` header, using the
        `service`

        authentication scheme. The header value is the service identifier and
        the

        signature, separated by a colon:


        ```

        Authorization: service <serviceId>:<signature>

        ```


        | Element | Description |

        | --- | --- |

        | `<serviceId>` | Identifier of the service the webhook belongs to.
        Matches the `serviceId` segment of the `ce-source` header and the
        `call.serviceId` field of the request body. |

        | `<signature>` | Base64-encoded HMAC-SHA256 hash of the canonical
        request string, keyed with the service secret. |


        #### Signature


        ```

        signature = Base64( HMAC-SHA256( secretBytes, UTF8(stringToSign) ) )

        ```


        `secretBytes` is the 16-byte binary value of the service secret, and the
        signed

        message is the UTF-8 encoding of `stringToSign`.


        The service secret is issued as a Base64 string, for example

        `F5wrP9SKYU6w8sbZXkp7GA==`. Base64-decoding it yields the 16 bytes of

        `secretBytes`. The decoded bytes are used as the HMAC key — signing with
        the

        characters of the Base64 string instead produces a different, invalid
        signature.


        #### Canonical string


        `stringToSign` is the concatenation of five parts. Each of the first
        four parts

        is terminated by a single line feed (`\n`); the last part is not
        followed by a

        line feed.


        ```

        POST

        {contentMd5}

        {contentType}

        x-timestamp:{timestamp}

        {path}

        ```


        | Part | Value |

        | --- | --- |

        | Method | The HTTP method, always `POST` for webhook requests. |

        | `{contentMd5}` | `Base64( MD5( UTF8(body) ) )` — the Base64-encoded
        MD5 digest of the raw request body. Empty when the request carries no
        body. |

        | `{contentType}` | The full value of the `Content-Type` header,
        including its parameters, for example `application/json; charset=utf-8`.
        Empty when the request carries no body. |

        | `{timestamp}` | The verbatim value of the `x-timestamp` request
        header, an ISO 8601 UTC timestamp with seven fractional-second digits,
        for example `2026-04-01T12:00:00.0000000Z`. The literal prefix
        `x-timestamp:` is part of the canonical string. |

        | `{path}` | The absolute path of the configured webhook URL, without
        scheme, host, query string or fragment, for example `/voice-webhooks`. |


        The MD5 digest acts as a checksum of the body inside the canonical
        string. The

        integrity and authenticity guarantee is provided by the HMAC-SHA256
        signature

        computed over that string.


        The CloudEvents (`ce-*`) headers are not covered by the signature.


        #### Example


        A request delivered to `https://example.com/voice-webhooks` with the
        body


        ```json

        {"event":"call.incoming","call":{"callId":"01AN4Z07BY79KA1307SR9X4MV3"}}

        ```


        `Content-Type: application/json; charset=utf-8` and

        `x-timestamp: 2026-04-01T12:00:00.0000000Z` produces the canonical
        string


        ```

        POST

        CH5/FnzqzRJ81QlTLGAhAw==

        application/json; charset=utf-8

        x-timestamp:2026-04-01T12:00:00.0000000Z

        /voice-webhooks

        ```


        With the service secret `F5wrP9SKYU6w8sbZXkp7GA==`, the resulting header
        is


        ```

        Authorization: service
        a74b1566-0f18-4f8e-9c23-8e6b5df8fd3e:EWFtVTrykdhMTdyYSbn40GBJpf5UBeggO9T99sdwLyY=

        ```


        #### Verification


        1. Split the `Authorization` header value into the service identifier
        and the
           signature.
        2. Rebuild `stringToSign` from the received request, using the raw
        request body
           exactly as delivered, before any parsing, re-serialization or whitespace
           normalization.
        3. Recompute the signature with the secret of the identified service and
        compare
           it to the received value using a constant-time comparison.
        4. Reject the request when the two values differ.

        5. Reject requests whose `x-timestamp` lies outside an accepted
        clock-skew
           window, to limit replay of previously valid requests.
      operationId: callWebhook
      parameters:
        - name: ce-specversion
          in: header
          required: true
          schema:
            type: string
            const: '1.0'
          description: CloudEvents specification version.
        - name: ce-type
          in: header
          required: true
          schema:
            type: string
            const: com.sinch.voice.call.control.v1
          description: CloudEvents event type.
        - name: ce-source
          in: header
          required: true
          schema:
            type: string
            example: >-
              projects/5c5bf2b1-35ae-4825-ab89-457e07bb60e6/services/6e124178-c29d-46a5-943c-5c2ae544aade
          description: >-
            URI identifying the context where the event originated. Format:
            `projects/{projectId}/services/{serviceId}`.
        - name: ce-id
          in: header
          required: true
          schema:
            type: string
            format: uuid
            example: cb0c6a68-53de-4590-94a1-6e95df89fbac
          description: >-
            Unique identifier for this event instance. Use together with
            `ce-source` for deduplication.
        - name: ce-time
          in: header
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-04-01T12:00:00+00:00'
          description: Timestamp (RFC 3339) when the event occurred.
        - name: x-timestamp
          in: header
          required: true
          schema:
            type: string
            example: '2026-04-01T12:00:00.0000000Z'
          description: >-
            Timestamp (ISO 8601, UTC) applied by the Voice Platform when the
            request was signed. Covered by the `Authorization` signature and
            required to recompute it.
