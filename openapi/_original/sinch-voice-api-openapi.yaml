        A SVAML response to an Prompt Input Event that plays a message to the
        callee and then hangs up the call.
      value:
        instructions:
          - name: say
            text: Thank you for pressing 1. This call will now end.
            locale: en-US
        action:
          name: hangup
    AceHangupResponse:
      summary: Hangup response SVAML
      description: >-
        A SVAML response to an Answered Call Event that plays a message to the
        callee and then hangs up the call.
      value:
        instructions:
          - name: say
            text: This is a call from Sinch. This call will now end.
            locale: en-US
        action:
          name: hangup
    AcePlayMenuResponse:
      summary: Play menu response SVAML
      description: >-
        A SVAML response to an Answered Call Event that plays a menu to the
        callee.
      value:
        action:
          name: runMenu
          barge: true
          menus:
            - id: main
              mainPrompt: >-
                #tts[This is the main menu. Press 1 for support or 2 to continue
                to the next menu.]
              options:
                - dtmf: '1'
                  action: return(support)
                - dtmf: '2'
                  action: menu(sub)
            - id: sub
              mainPrompt: '#tts[This is the sub menu. Enter your 4-digit PIN]'
              repeatPrompt: '#tts[Please enter your 4-digit pin.]'
              repeats: 3
              maxDigits: 4
    IceSayResponse:
      summary: Say response SVAML
      description: >-
        A SVAML response to an Incoming Call Event that plays a message to the
        caller and then hangs up the call.
      value:
        instructions:
          - name: say
            text: Thank you for calling Sinch! This call will now end.
        action:
          name: hangup
