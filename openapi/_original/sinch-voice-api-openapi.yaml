  requestBodies:
    updateCall:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PATCHSVAMLRequestBody'
          examples:
            hangupExample:
              $ref: '#/components/examples/hangupExample'
            continueExample:
              $ref: '#/components/examples/continue'
            parkExample:
              $ref: '#/components/examples/park'
            playFilesExample:
              $ref: '#/components/examples/playFiles'
            sayExample:
              $ref: '#/components/examples/say'
            sendDtmfExample:
              $ref: '#/components/examples/sendDtmf'
            setCookieExample:
              $ref: '#/components/examples/setCookie'
            answerExample:
              $ref: '#/components/examples/answer'
            startRecordingExample:
              $ref: '#/components/examples/startRecording'
            stopRecordingExample:
              $ref: '#/components/examples/stopRecording'
    calloutRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CalloutRequest'
          examples:
            ttsCalloutRequestCall:
              $ref: '#/components/examples/ttsCalloutRequestCall'
            ttsCalloutRequestPrompt:
              $ref: '#/components/examples/ttsCalloutRequestPrompt'
            ttsCalloutRequestPlayFile:
              $ref: '#/components/examples/ttsCalloutRequestPlayFile'
            confCalloutRequest:
              $ref: '#/components/examples/confCalloutRequest'
            customCalloutRequest:
              $ref: '#/components/examples/customCalloutRequest'
            customCalloutAmdRequest:
              $ref: '#/components/examples/customCalloutAMDRequest'
  parameters:
    number:
      in: path
      name: number
      schema:
        type: string
      required: true
      description: The phone number you want to query.
      example: '+46730170101'
    callId:
      in: path
      name: callId
      schema:
        type: string
      required: true
      description: >-
        The unique identifier of the call. This value is generated by the
        system.
      example: 4398599d1ba84ef3bde0a82dfb61abed
    conferenceId:
      in: path
      name: conferenceId
      schema:
        type: string
      required: true
      description: The unique identifier of the conference. The user sets this value.
      example: MyConfId
    applicationkey:
      name: applicationkey
      in: path
      schema:
        type: string
      required: true
      description: The unique identifying key of the application.
      example: 94983f76-1161-6655-9515-4785c7b67dd8
    callLeg:
      name: callLeg
      in: path
      schema:
        type: string
        enum:
          - caller
          - callee
          - both
        x-enumDescriptions:
          caller: The outgoing call line.
          callee: The receiving call line.
          both: Both lines.
      required: true
      description: >-
        Specifies which part of the call will be managed. This option is used
        only by the `PlayFiles` and `Say` instructions to indicate which channel
        the sound will be played on. Valid options are `caller`, `callee` or
        `both`. If not specified, the default value is `caller`.<br><Warning>The
        `callLeg` identifier is ignored for calls that are part of a conference
        and calls initiated using the Callout API.</Warning>
      example: caller
    type:
      in: path
      name: type
      schema:
        type: string
      required: true
      description: >-
        The type of endpoint on which you want to report. The value can be
        either `number` or `username`.
      example: number
    endpoint:
      in: path
      name: endpoint
      schema:
        type: string
      required: true
      description: >-
        The value of the endpoint of the call. For calls on the PSTN, this is a
        phone number. For app-to-app calls, this is a username.
      example: '+46730170101'
    domain:
      in: query
      name: domain
      schema:
        type: string
      required: true
      description: >-
        An optional parameter that specifies the terminating pattern. Can be
        either `data` or `pstn`.
      example: data
    id:
      in: path
      name: id
      schema:
        type: string
      required: true
      description: >-
        A predefined ID string. This must be set up in cooperation with the
        Sinch support team.
      example: currentCalls
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          description: A summary of the HTTP error code and error type.
          example: 404 Not Found
        errorCode:
          type: string
          description: The HTTP error code.
          example: '40400'
        message:
          type: string
          description: A simple description of the cause of the error.
          example: Call not found
        reference:
          type: string
          description: >-
            If applicable, a reference ID for support to use with diagnosing the
            error.
          example: a2028355-5164-41b6-aae9-2b8a546e0784
    callResult:
      type: string
      x-enumDescriptions:
        N/A: Not applicable
        ANSWERED: The call was answered.
        BUSY: The line called was busy.
        NOANSWER: The line called failed to answer.
        FAILED: The call failed.
      enum:
        - N/A
        - ANSWERED
        - BUSY
        - NOANSWER
        - FAILED
      description: Contains the result of a call.
      example: ANSWERED
    destinationPstn:
      type: object
      description: The type of device and number or endpoint to call.
      required:
        - type
        - endpoint
      properties:
        type:
          $ref: '#/components/schemas/pstnDestination'
        endpoint:
          type: string
          description: If the type is `number` the value of the endpoint is a phone number.
          format: e164 for numbers
          example: '+12125550123'
    destinationMxp:
      type: object
      description: The type of device and number or endpoint to call.
      required:
        - type
        - endpoint
      properties:
        type:
          $ref: '#/components/schemas/mxpDestination'
        endpoint:
          type: string
          description: For type `userName` the value is the username for a data endpoint.
          format: user name
          example: myUserName
    destinationSip:
      type: object
      description: The type of device and number or endpoint to call.
      required:
        - type
        - endpoint
      properties:
        type:
          $ref: '#/components/schemas/sipDestination'
        endpoint:
          type: string
          description: For type `sip` the value is the SIP address for a SIP endpoint.
          format: sip address
          example: +19876543210@example.sip.sinch.com
    destinationDid:
      type: object
      description: The type of device and phone number called.
      required:
        - type
        - endpoint
      properties:
        type:
          $ref: '#/components/schemas/didDestination'
        endpoint:
          type: string
          description: Number that the caller has called
          example: '+3197121281500'
    destinationWebSocket:
      type: object
      description: Specifies where to route the Stream call.
      required:
        - type
        - endpoint
      properties:
        type:
          type: string
          description: >-
            This attribute defines the streaming protocol - currently only
            `Websocket` is supported.
          enum:
            - Websocket
          x-enumDescriptions:
            Websocket: Use websocket stream protocol
          example: Websocket
        endpoint:
          type: string
          description: The Stream/Websocket server address.
          example: wss://yourcompany.com/websocket-server
    destination:
      type: object
      description: Known destination
      oneOf:
        - $ref: '#/components/schemas/destinationDid'
        - $ref: '#/components/schemas/destinationMxp'
        - $ref: '#/components/schemas/destinationPstn'
        - $ref: '#/components/schemas/destinationSip'
      discriminator:
        propertyName: type
        mapping:
          did: '#/components/schemas/destinationDid'
          username: '#/components/schemas/destinationMxp'
          Username: '#/components/schemas/destinationMxp'
          number: '#/components/schemas/destinationPstn'
          Number: '#/components/schemas/destinationPstn'
          sip: '#/components/schemas/destinationSip'
    updateNumbers:
      type: object
      example:
        numbers:
          - '+14151112223333'
        applicationkey: 11983f76-12c8-1111-9515-4785c7b67ca8
        capability: voice
      properties:
        numbers:
          type: array
          description: The phone number or list of numbers in E.164 format.
          items:
            type: string
          minItems: 1
          maxItems: 100
          example:
            - '+14151112223333'
            - '+14151112223333'
        applicationkey:
          description: >-
            indicates the application where the number(s) will be assigned. If
            empty, the application key that is used to sign the request will be
            used.
          type: string
          example: 11983f76-12c8-1111-9515-4785c7b67ca8
        capability:
          description: >-
            indicates the DID capability that needs to be assigned to the chosen
            application. Please note that the DID needs to support the selected
            capability.
          allOf:
            - $ref: '#/components/schemas/capability'
    unassignNumbers:
      type: object
      example:
        numbers: '+14151112223333'
        applicationkey: 11983f76-12c8-1111-9515-4785c7b67ca8
        capability: voice
      properties:
        number:
          type: string
          description: >-
            The phone number in E.164 format
            (https://community.sinch.com/t5/Glossary/E-164/ta-p/7537)
          example: '+14151112223333'
        applicationkey:
          description: >-
            Indicates the application where the number(s) was assigned. If
            empty, the application key that is used to sign the request will be
            used.
          type: string
          example: 11983f76-12c8-1111-9515-4785c7b67ca8
        capability:
          description: >-
            (optional) indicates the DID capability that was assigned to the
            chosen application. Please note that the DID needs to support the
            selected capability.
          allOf:
            - $ref: '#/components/schemas/capability'
    getCallResponseObj:
      type: object
      properties:
        from:
          oneOf:
            - $ref: '#/components/schemas/destinationMxp'
            - $ref: '#/components/schemas/destinationPstn'
            - $ref: '#/components/schemas/destinationSip'
        to:
          oneOf:
            - $ref: '#/components/schemas/destinationMxp'
            - $ref: '#/components/schemas/destinationPstn'
            - $ref: '#/components/schemas/destinationSip'
        domain:
          type: string
          x-enumDescriptions:
            pstn: The Public Switched Telephone Network, or a normal phone call.
          enum:
            - pstn
          description: Must be `pstn` for PSTN.
          example: pstn
        callId:
          type: string
          description: The unique identifier of the call.
        duration:
          type: integer
          description: The duration of the call in seconds.
        status:
          type: string
          x-enumDescriptions:
            ONGOING: Call status is `ONGOING`
            FINAL: Call status is `FINAL`
          enum:
            - ONGOING
            - FINAL
          description: The status of the call. Either `ONGOING` or `FINAL`
          example: ONGOING
        result:
          $ref: '#/components/schemas/callResult'
        reason:
          type: string
          x-enumDescriptions:
            N/A: Not available.
            TIMEOUT: Timed out.
            CALLERHANGUP: Caller hung up.
            CALLEEHANGUP: Callee hung up.
            BLOCKED: The call was blocked.
            NOCREDITPARTNER: No credit available.
            MANAGERHANGUP: The Sinch server ended the call.
            CANCEL: Call was canceled.
            GENERALERROR: A general error.
            INVALIDSVAMLACTION: Call could not be completed due to invalid SVAML response.
          enum:
            - N/A
            - TIMEOUT
            - CALLERHANGUP
            - CALLEEHANGUP
            - BLOCKED
            - NOCREDITPARTNER
            - MANAGERHANGUP
            - CANCEL
            - GENERALERROR
            - INVALIDSVAMLACTION
          description: Contains the reason why a call ended.
        timestamp:
          type: string
          format: date-time
          description: The date and time of the call.
        custom:
          type: string
          description: >-
            A string that can be used to pass custom information related to the
            call.
        userRate:
          $ref: '#/components/schemas/price'
        debit:
          $ref: '#/components/schemas/price'
    callbacks:
      type: object
      properties:
        url:
          description: Contains primary and or fallback callback URLs
          type: object
          properties:
            primary:
              type: string
              description: Your primary callback URL
              example: https://primary.yourcallback.com/
            fallback:
              type: string
              description: >-
                Your fallback callback URL (returned if configured). It is used
                only if Sinch platform gets a timeout or error from your primary
                callback URL.
              example: https://fallback.yourcallback.com/
    getQueryNumber:
      type: object
      properties:
        number:
          type: object
          description: The number item object.
          properties:
            countryId:
              type: string
              description: The ISO 3166-1 formatted country code.
              example: SE
            numberType:
              type: string
              x-enumDescriptions:
                Unknown: Unknown number type.
                Fixed: A fixed number.
                Mobile: A mobile number.
                Other: A type other than fixed or mobile.
              enum:
                - Unknown
                - Fixed
                - Mobile
                - Other
              description: The type of the number.
              example: Fixed
            normalizedNumber:
              type: string
              description: The number in E.164 format.
              example: '+46730170101'
            restricted:
              type: boolean
              description: Concerns whether the call is restricted or not.
              example: false
            rate:
              $ref: '#/components/schemas/price'
    getRecordingFileInfo:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
        createdOn:
          type: string
          format: timestamp
        expiresOn:
          type: string
          format: timestamp
        headers:
          type: object
    getNumbersResponseObj:
      type: object
      properties:
        numbers:
          type: array
          description: >-
            The object type. Will always be list of numbers, associated
            application keys and capabilities
          items:
            type: object
            properties:
              number:
                type: string
                description: Numbers that you own in E.164 format.
                example: '+11400000000'
              applicationkey:
                type: string
                description: >-
                  Indicates the application where the number(s) will be
                  assigned. If no number is assigned the applicationkey will not
                  be returned.
              capability:
                $ref: '#/components/schemas/capability'
    getConferenceInfoResponse:
      type: object
      description: >-
        The response returns information about the participants in the
        conference.
      properties:
        participants:
          type: array
          items:
            type: object
            properties:
              cli:
                type: string
                description: >-
                  The phone number of the PSTN participant that was connected in
                  the conference, or whatever was passed as CLI for data
                  originated/terminated calls.
                example: '+46708168731'
              id:
                type: string
                description: >-
                  The callId of the call leg that the participant joined the
                  conference.
                example: abcabcabcabca
              duration:
                type: integer
                description: >-
                  The number of seconds that the participant has been connected
                  to the conference.
              muted:
                type: boolean
              onhold:
                type: boolean
    manageConferenceParticipantRequest:
      type: object
      example:
        command: unmute
      description: ''
      required:
        - command
      properties:
        command:
          type: string
          description: Action to apply on conference participant.
          x-enumDescriptions:
            mute: Mutes participant.
            unmute: Unmutes participant.
            onhold: Puts participant on hold.
            resume: Returns participant to conference.
          enum:
            - mute
            - unmute
            - onhold
            - resume
        moh:
          description: >-
            Means "music on hold". If this optional parameter is included, plays
            music to the first participant in a conference while they're alone
            and waiting for other participants to join. If `moh` isn't
            specified, the user will only hear silence while alone in the
            conference. This property is only available to use with the `onhold`
            command.
          allOf:
            - $ref: '#/components/schemas/musicOnHold'
    CalloutRequest:
      type: object
      description: >-
        Currently three types of callouts are supported: conference callouts,
        text-to-speech callouts and custom callouts. The custom callout is the
        most flexible, but text-to-speech and conference callouts are more
        convenient.
      required:
        - method
      oneOf:
        - $ref: '#/components/schemas/conferenceCalloutRequest'
        - $ref: '#/components/schemas/ttsCalloutRequest'
        - $ref: '#/components/schemas/customCalloutRequest'
      discriminator:
        propertyName: method
        mapping:
          conferenceCallout: '#/components/schemas/conferenceCalloutRequest'
          ttsCallout: '#/components/schemas/ttsCalloutRequest'
          customCallout: '#/components/schemas/customCalloutRequest'
    CalloutRequestType:
      type: string
      description: Sets the type of callout.
      x-enumDescriptions:
        conferenceCallout: A callout that starts a conference or adds a callee to a conference.
        ttsCallout: A callout that plays a text to speech message to the callee.
        customCallout: A callout that can be customized to perform more complex behavior.
      enum:
        - conferenceCallout
        - ttsCallout
        - customCallout
      example: conferenceCallout
    calloutRequestBase:
      type: object
      properties:
        cli:
          type: string
          format: e.164
          description: >-
            The number that will be displayed as the incoming caller. To set
            your own CLI, you may use your verified number or your Dashboard
            number. The number must be in
            [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537)
            format.
          example: '14151112223333'
        dtmf:
          type: string
          description: >-
            When the destination picks up, this DTMF tones will be played to the
            callee. Valid characters in the string are "0"-"9", "#" and "w". A
            "w" will render a 500 ms pause. Example: "ww1234#w#" will render a
            1s pause, the DTMF tones "1", "2", "3", "4" and "#" followed by a
            0.5s pause and finally the DTMF tone for "#". This can be used if
            the callout destination for instance require a conference PIN code
            or an extension to be entered.
        custom:
          type: string
          description: Used to input custom data.
    conferenceCalloutRequest:
      type: object
      properties:
        method:
          type: string
          x-enumDescriptions:
            conferenceCallout: Define `conferenceCallout` request
          enum:
            - conferenceCallout
        conferenceCallout:
          $ref: '#/components/schemas/conferenceCallout'
    ttsCalloutRequest:
      type: object
      properties:
        method:
          type: string
          x-enumDescriptions:
            ttsCallout: Define `ttsC allout` request
          enum:
            - ttsCallout
        ttsCallout:
          $ref: '#/components/schemas/ttsCallout'
    customCalloutRequest:
      type: object
      properties:
        method:
          type: string
          x-enumDescriptions:
            customCallout: Define `customCallout` request
          enum:
            - customCallout
        customCallout:
          $ref: '#/components/schemas/customCallout'
    conferenceCallout:
      type: object
      description: >-
        The conference callout calls a phone number or a user. When the call is
        answered, it's connected to a conference room.
      required:
        - destination
        - conferenceId
      allOf:
        - $ref: '#/components/schemas/calloutRequestBase'
        - type: object
          properties:
            destination:
              oneOf:
                - $ref: '#/components/schemas/destinationPstn'
                - $ref: '#/components/schemas/destinationMxp'
                - $ref: '#/components/schemas/destinationSip'
            conferenceId:
              type: string
              description: >-
                The conferenceId of the conference to which you want the callee
                to join. If the conferenceId doesn't exist a conference room
                will be created.
            conferenceDtmfOptions:
              $ref: '#/components/schemas/conferenceDtmfOptions'
            maxDuration:
              type: integer
            enableAce:
              type: boolean
              description: >-
                If `enableAce` is set to true and the application has a callback
                URL specified, you will receive an ACE callback when the call is
                answered. When the callback is received, your platform must
                respond with a svamlet containing the `connectConf` action in
                order to add the call to a conference or create the conference
                if it's the first call. If it's set to false, no ACE event will
                be sent to your backend.<br><b>Note </b> if the call is towards
                an InApp destination `type:` `username`, then no ACE will be
                issued when the call is connected, even if `enableAce` is
                present in the callout request.
              default: false
              example: false
            enableDice:
              type: boolean
              description: >-
                If `enableDice` is set to true and the application has a
                callback URL specified, you will receive a DiCE callback when
                the call is disconnected. If it's set to false, no DiCE event
                will be sent to your backend.<br><b>Note</b> if the call is
                towards an InApp destination `type:` `username`, then no DICE
                will be issued at the end of the call, even if `enableDice` is
                present in the callout request.
              default: false
              example: false
            enablePie:
              type: boolean
              description: >-
                If `enablePie` is set to true and the application has a callback
                URL specified, you will receive a PIE callback after a `runMenu`
                action, with the information of the action that the user took.
                If it's set to false, no PIE event will be sent to your backend.
              default: false
              example: false
            locale:
              type: string
              format: ISO 639
              description: >-
                The voice and language you want to use for the prompts. This can
                either be defined by the ISO 639 locale and language code or by
                specifying a particular voice. Supported languages and voices
                are detailed
                [here](https://developers.sinch.com/docs/voice/api-reference/voice-locales/)
              default: en-US
              example: en-US
            greeting:
              type: string
              description: The text that will be spoken as a greeting.
              example: Welcome to the conference
            mohClass:
              description: >-
                Means "music-on-hold." It's an optional parameter that specifies
                what the first participant should listen to while they're alone
                in the conference, waiting for other participants to join. It
                can take one of these pre-defined values:<ul><li>`ring`
                (progress tone)</li><li>`music1` (music file)</li><li>`music2`
                (music file)</li><li>`music3` (music file)</li></ul><br>If no
                “music-on-hold” is specified, the user will only hear silence.
              allOf:
                - $ref: '#/components/schemas/musicOnHold'
              example: ring
            domain:
              description: >-
                can be either “pstn” for PSTN endpoint or “mxp” for data (app or
                web) clients.
              allOf:
                - $ref: '#/components/schemas/domain'
    ttsCallout:
      type: object
      description: >-
        The text-to-speech callout calls a phone number and plays a synthesized
        text messages or pre-recorded sound files.
      required:
        - destination
      properties:
        cli:
          type: string
          format: e.164
          description: >-
            The number that will be displayed as the incoming caller. To set
            your own CLI, you may use your verified number or your Dashboard
            number. The number must be in
            [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537)
            format.
          example: '+14155552223333'
        destination:
          oneOf:
            - $ref: '#/components/schemas/destinationPstn'
            - $ref: '#/components/schemas/destinationMxp'
            - $ref: '#/components/schemas/destinationSip'
        dtmf:
          type: string
          description: >-
            When the destination picks up, this DTMF tones will be played to the
            callee. Valid characters in the string are "0"-"9", "#", and "w". A
            "w" will render a 500 ms pause. For example, "ww1234#w#" will render
            a 1s pause, the DTMF tones "1", "2", "3", "4" and "#" followed by a
            0.5s pause and finally the DTMF tone for "#". This can be used if
            the callout destination for instance require a conference PIN code
            or an extension to be entered.
          example: ww1234#w#
        domain:
          $ref: '#/components/schemas/domain'
        custom:
          type: string
          description: Can be used to input custom data.
        locale:
          type: string
          description: >-
            The voice and language you want to use for the text-to-speech
            message. This can either be defined by the ISO 639 locale and
            language code or by specifying a particular voice. Supported
            languages and voices are detailed
            [here](https://developers.sinch.com/docs/voice/api-reference/voice-locales/).
          example: en-US
        text:
          type: string
          description: >
            The text that will be spoken in the text-to-speech message.


            _Every application's default maximum characters allowed in
            text-to-speech is 600 characters. Contact support if you wish this
            limit to be changed._
        prompts:
          type: string
          description: >
            An advanced alternative to using ```text```.


            __TTS__ _Text To Speech:_ The equivalent of text but within the
            prompt property.


            Example: _```#tts[Hello from Sinch]```_


            __TTS with SSML__ _Text To Speech with Speech Synthesis Markup
            Language (SSML)._ This is an XML-based markup language for assisting
            the generation of synthetic speech in the Web and other
            applications. AWS Polly supports a sub-set of SSML. This allows us
            to use SSML-enhanced text for additional control over how Polly
            generates speech from the text. Details and examples of supported
            tags are
            [here](https://docs.aws.amazon.com/polly/latest/dg/supportedtags.html)

              __Externally hosted media:__ Provide a URL to your own hosted media.  Please check [here](https://developers.sinch.com/docs/voice/api-reference/supported-audio-formats/#limits) to read about audio content type and usage limits.

            _Every application's default maximum allowed in TTS or TTS SSML is
            600 characters. Contact support if you wish this limit to be
            changed._

            _Several prompts can be used, separated by a semi-colon_ ```;```


            Example: _```#tts[Hello from Sinch];#ssml[<speak><break
            time=\"250ms\"/>Have a great day!</speak>]```_
        enableAce:
          type: boolean
          description: >-
            If `enableAce` is set to `true` and the application has a callback
            URL specified, you will receive an ACE callback when the call is
            answered. When the callback is received, your platform must respond
            with a svamlet, containing the “connectconf” action in order to add
            the call to a conference or create the conference if it's the first
            call. If it's set to `false`, no ACE event will be sent to your
            backend.
          default: false
          example: false
        enableDice:
          type: boolean
          description: >-
            If `enableDice` is set to `true` and the application has a callback
            URL specified, you will receive a DiCE callback when the call is
            disconnected. If it's set to `false`, no DiCE event will be sent to
            your backend.
          default: false
          example: false
        enablePie:
          type: boolean
          description: >-
            <b>Note:</b> PIE callbacks are not available for DATA Calls; only
            PSTN and SIP calls.


            If `enablePie` is set to `true` and the application has a callback
            URL specified, you will receive a PIE callback after the `runMenu`
            action executes and after the configured menu timeout has elapsed
            with no input. If it's set to `false`, no PIE events will be sent to
            your backend.
    customCallout:
      type: object
      description: >-
        The custom callout, the server initiates a call from the servers that
        can be controlled by specifying how the call should progress at each
        call event.
      properties:
        cli:
          type: string
          format: e.164
          description: >-
            The number that will be displayed as the incoming caller, to set
            your own CLI, you may use your verified number or your Dashboard
            virtual number, it must be in
            [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537)
            format.
          example: '+14155552223333'
        destination:
          oneOf:
            - $ref: '#/components/schemas/destinationPstn'
            - $ref: '#/components/schemas/destinationMxp'
            - $ref: '#/components/schemas/destinationSip'
        dtmf:
          type: string
          description: >-
            When the destination picks up, this DTMF tones will be played to the
            callee. Valid characters in the string are "0"-"9", "#", and "w". A
            "w" will render a 500 ms pause. For example, "ww1234#w#" will render
            a 1s pause, the DTMF tones "1", "2", "3", "4" and "#" followed by a
            0.5s pause and finally the DTMF tone for "#". This can be used if
            the callout destination for instance require a conference PIN code
            or an extension to be entered.
          example: ww1234#w#
        custom:
          type: string
          description: Can be used to input custom data.
        maxDuration:
          type: integer
          description: The maximum amount of time in seconds that the call will last.
          example: 600
        ice:
          type: string
          description: >
            You can set a new callback URL or use inline
            [SVAML](https://developers.sinch.com/docs/voice/api-reference/svaml/)
            to replace a predefined callback URL, when using custom callouts.
            Ensure that the JSON object is escaped correctly. If inline ICE
            SVAML is passed, exclude *cli* and *destination* properties from the
            *customCallout* request body.
          example: ' ```"ice":"{\"action\":{\"name\":\"connectPstn\",\"number\":\"46000000001\",\"maxDuration\":90}}"``` '
        ace:
          type: string
          description: >
            You can set a new callback URL or use inline
            [SVAML](https://developers.sinch.com/docs/voice/api-reference/svaml/)
            to replace a predefined callback URL, when using custom callouts.
            Ensure that the JSON object is escaped correctly.
          example: ' ```"ace":"{\"action\": {\"name\": \"RunMenu\",\"locale\": \"en-US\",\"menus\": [{\"id\": \"main\",\"mainPrompt\": \"#tts[ Welcome to the main menu. Press 1 for a callback or 2 for a cancel<\/speak>]\",\"timeoutMills\": 5000,\"options\": [ {\"dtmf\": \"1\",\"action\": \"return(callback)\"}, {\"dtmf\": \"2\",\"action\": \"return(cancel)\"}]}]}}"``` '
        pie:
          type: string
          description: >
            <b>Note:</b> PIE callbacks are not available for DATA Calls; only
            PSTN and SIP calls.


            You can set a new callback URL or use inline
            [SVAML](https://developers.sinch.com/docs/voice/api-reference/svaml/)
            to replace a predefined callback URL, when using custom callouts.
            Ensure that the JSON object is escaped correctly. A PIE event will
            contain a value chosen from an IVR choice. Usually a PIE event wil
            contain a URL to a callback sever that will receive the choice and
            be able to parse it. This could result in further SVAML or some
            other application logic function.
          example: ' ```"pie":"https://your-application-server-host/menu_endpoint"``` '
        dice:
          type: string
          description: >
            You can use it to set a new callback URL in case you wish to replace
            your voice application configured callback URL.
          example: ' ```"dice":"https://your-application-server-host/new_endpoint"``` '
    getCalloutResponseObj:
      type: object
      description: The returned call ID.
      properties:
        callId:
          type: string
          description: The returned call identifier.
          example: adf92089-d9e8-4f14-a377-1e975f588fe4
    svaml.instruction:
