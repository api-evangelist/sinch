x-webhooks:
  ice:
    post:
      operationId: ice
      summary: Incoming Call Event
      tags:
        - Callbacks
      description: >-
        When a call reaches the Sinch platform, the system makes a POST request
        to the specified calling callback URL.


        This event, called the **ICE** event, can be triggered by either an
        incoming data call or an incoming PSTN call. Look here for allowed
        [instructions](https://developers.sinch.com/docs/voice/api-reference/svaml/instructions)
        and
        [actions](https://developers.sinch.com/docs/voice/api-reference/svaml/actions).


        If there is no response to the callback within the timeout period, an
        error message is played, and the call is disconnected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iceRequest'
            examples:
              IceExample:
                $ref: '#/components/examples/ICEexample'
      responses:
        '200':
          description: >-
            The Incoming Call Event (ICE) requires a valid SVAML object in
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceSVAMLRequestBody'
              examples:
                sayExample:
                  $ref: '#/components/examples/IceSayResponse'
  ace:
    post:
      operationId: ace
      summary: Answered Call Event
      tags:
        - Callbacks
      description: >-
        This callback is made when the call is picked up by the callee (person
        receiving the call). It's a POST request to the specified calling
        callback URL. Look here for allowed
        [instructions](https://developers.sinch.com/docs/voice/api-reference/svaml/instructions)
        and
        [actions](https://developers.sinch.com/docs/voice/api-reference/svaml/actions).


        If there is no response to the callback within the timeout period, the
        call is connected.


        If you have [Answering Machine
        Detection](https://developers.sinch.com/docs/voice/api-reference/amd_v2)
        (AMD) enabled, the `amd` object will also be present on ACE callbacks.


        <b>Note:</b> ACE Callbacks are <b>not</b> issued for InApp Calls
        (`destination:` `username`), only PSTN and SIP calls.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aceRequest'
      responses:
        '200':
          description: >-
            The Answered Call Event (ACE) requires a valid SVAML object in
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceSVAMLRequestBody'
              examples:
                hangup:
                  $ref: '#/components/examples/AceHangupResponse'
                runMenu:
                  $ref: '#/components/examples/AcePlayMenuResponse'
  dice:
    post:
      operationId: dice
      summary: Disconnected Call Event
      tags:
        - Callbacks
      description: >-
        This callback is made when the call is disconnected. It's a POST request
        to the specified calling callback URL. This event doesn't support
        instructions and only supports the
        [hangup](https://developers.sinch.com/docs/voice/api-reference/svaml/actions/#hangup)
        action.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/diceRequest'
            examples:
              DiceExample:
                $ref: '#/components/examples/DICEexample'
      responses:
        '200':
          description: >-
            Return a 200 status to indicate that the data was received
            successfully
  pie:
    post:
      operationId: pie
      summary: Prompt Input Event
      tags:
        - Callbacks
      description: >-
        This callback is triggered as a result of a
        [runMenu](https://developers.sinch.com/docs/voice/api-reference/svaml/actions/#runmenu)
        action. It can be triggered from either a user pressing a number of DTMF
        digits, or by the `return` command.


        It's a POST request to the specified calling callback URL. Your
        application can respond with
        [SVAML](https://developers.sinch.com/docs/voice/api-reference/svaml/)
        logic.


        <b>Note:</b> PIE callbacks are not issued for DATA Calls, only PSTN and
        SIP calls.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pieRequest'
            examples:
              PieExample:
                $ref: '#/components/examples/PIEexample'
      responses:
        '200':
          description: >-
            The Prompt Input Event (PIE) can accept a valid SVAML object in
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieSVAMLRequestBody'
              examples:
                hangup:
                  $ref: '#/components/examples/PieHangupResponse'
  notify:
    post:
      operationId: notify
      summary: Notification Event
      tags:
        - Callbacks
      description: >-
        This is the general callback used to send notifications. It's a POST
        request to the specified calling callback URL.


        If there is no response to the callback within the timeout period, the
        notification is discarded.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notifyRequest'
            examples:
              notifyRecFinishExample:
                $ref: '#/components/examples/NotifyRecordingFinishedExample'
              notifyRecAvailableExample:
                $ref: '#/components/examples/NotifyRecordingAvailableExample'
              notifyAMDExample:
                $ref: '#/components/examples/NotifyAMDExample'
              notifyAMDBeepExample:
                $ref: '#/components/examples/NotifyAMDBeepExample'
      responses:
        '200':
          description: >-
            Return a 200 status to indicate that the data was received
            successfully
paths:
  /calling/v1/callouts:
    post:
      tags:
        - Callouts
        - Conferences
      description: >-
        Makes a call out to a phone number. The types of callouts currently
        supported are conference callouts, text-to-speech callouts, and custom
        callouts. The custom callout is the most flexible, but text-to-speech
        and conference callouts are more convenient.
      summary: Callout Request
      operationId: Callouts
      requestBody:
        $ref: '#/components/requestBodies/calloutRequest'
      responses:
        '200':
          description: >-
            A success response, or an
            [Error](https://developers.sinch.com/docs/voice/api-reference/errors/).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCalloutResponseObj'
              example:
                callId: adf92089-df2a-4f14-a377-1e975f588fe4
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package voice.callouts;


            import com.sinch.sdk.SinchClient;

            import com.sinch.sdk.domains.voice.api.v1.CalloutsService;

            import
            com.sinch.sdk.domains.voice.models.v1.callouts.request.CalloutRequestTTS;

            import
            com.sinch.sdk.domains.voice.models.v1.destination.DestinationPstn;

            import com.sinch.sdk.models.Configuration;

            import java.util.logging.Logger;

            import utils.Settings;


            public class Call {

              private static final Logger LOGGER = Logger.getLogger(Call.class.getName());

              public static void main(String[] args) {

                String applicationKey = Settings.getApplicationKey().orElse("MY_APPLICATION_KEY");
                String applicationSecret = Settings.getApplicationSecret().orElse("MY_APPLICATION_SECRET");

                // The phone number you want to call, in E.164 format (e.g., +12025550123)
                String recipientPhoneNumber = "RECIPIENT_PHONE_NUMBER";
                String textToSpeech = "Hello, this is a call initiated from Sinch Java SDK. Goodbye.";

                Configuration configuration =
                    Configuration.builder()
                        .setApplicationKey(applicationKey)
                        .setApplicationSecret(applicationSecret)
                        .build();

                SinchClient client = new SinchClient(configuration);

                CalloutsService calloutsService = client.voice().v1().callouts();

                LOGGER.info(String.format("Calling phone number '%s'", recipientPhoneNumber));

                CalloutRequestTTS request =
                    CalloutRequestTTS.builder()
                        .setDestination(DestinationPstn.from(recipientPhoneNumber))
                        .setText(textToSpeech)
                        .build();

                String response = calloutsService.call(request);

                LOGGER.info("Response: " + response);
              }
            }
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const applicationKey = process.env.SINCH_APPLICATION_KEY ?? 'MY_APPLICATION_KEY';
              const applicationSecret = process.env.SINCH_APPLICATION_SECRET ?? 'MY_APPLICATION_SECRET';

              // The phone number you want to call, in E.164 format (e.g., +12025550123)
              const recipientPhoneNumber = 'RECIPIENT_PHONE_NUMBER';
              // The text you want to convert to speech and play during the call
              const textToSpeech = 'Hello, this is a call initiated from the Sinch Node.js SDK. Goodbye.';

              const sinch = new SinchClient({ applicationKey, applicationSecret });

              try {
                const response = await sinch.voice.callouts.tts({
                  ttsCalloutRequestBody: {
                    method: 'ttsCallout',
                    ttsCallout: {
                      destination: {
                        type: 'number',
                        endpoint: recipientPhoneNumber,
                      },
                      text: textToSpeech,
                    },
                  },
                });
                console.log(`✅ Successfully initiated TTS call to ${recipientPhoneNumber}:`);
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error(`❌ Failed to initiate TTS call to ${recipientPhoneNumber}:`);
                console.error(err);
              }
            }

            main();
  /calling/v1/calls/id/{callId}:
    parameters:
      - $ref: '#/components/parameters/callId'
    patch:
      tags:
        - Calls
      summary: Update a call in progress
      description: >-
        This method is used to manage ongoing, connected calls. This method uses
        SVAML in the request body to perform various tasks related to the call.
        For more information about SVAML, see the [Callback
        API](https://developers.sinch.com/docs/voice/api-reference/svaml/)
        documentation.


        This method can only be used for calls that originate from or terminate
        to PSTN or SIP networks.
      operationId: Calling_UpdateCall
      requestBody:
        $ref: '#/components/requestBodies/updateCall'
      responses:
        '204':
          description: >-
            A success response, or an
            [Error](https://developers.sinch.com/docs/voice/api-reference/errors/).
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package voice.calls;


            import com.sinch.sdk.SinchClient;

            import com.sinch.sdk.domains.voice.api.v1.CallsService;

            import
            com.sinch.sdk.domains.voice.models.v1.calls.request.CallUpdateRequest;

            import
            com.sinch.sdk.domains.voice.models.v1.svaml.action.ManagedCallSvamlAction;

            import
            com.sinch.sdk.domains.voice.models.v1.svaml.action.SvamlActionHangup;

            import
            com.sinch.sdk.domains.voice.models.v1.svaml.instruction.SvamlInstruction;

            import
            com.sinch.sdk.domains.voice.models.v1.svaml.instruction.SvamlInstructionSay;

            import com.sinch.sdk.models.Configuration;

            import java.util.Collection;

            import java.util.Collections;

            import java.util.logging.Logger;

            import utils.Settings;


            public class Update {

              private static final Logger LOGGER = Logger.getLogger(Update.class.getName());

              public static void main(String[] args) {

                String applicationKey = Settings.getApplicationKey().orElse("MY_APPLICATION_KEY");
                String applicationSecret = Settings.getApplicationSecret().orElse("MY_APPLICATION_SECRET");

                // The ID of the call to update
                String callId = "CALL_ID";
                // The instruction to be performed
                SvamlInstruction instruction = SvamlInstructionSay.builder().setText("Goodbye").build();
                // The instruction to add to the call
                ManagedCallSvamlAction action = SvamlActionHangup.SVAML_ACTION_HANGUP;

                Configuration configuration =
                    Configuration.builder()
                        .setApplicationKey(applicationKey)
                        .setApplicationSecret(applicationSecret)
                        .build();

