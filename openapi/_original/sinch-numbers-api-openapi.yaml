  /v1/projects/{projectId}/availableNumbers/{phoneNumber}:rent:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/phoneNumber'
    post:
      summary: Activate a new phone number
      description: >-
        **Deprecated:** This endpoint is deprecated. It remains available for
        existing integrations, but new integrations should use the [Number
        Order](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order)
        API, which supports numbers from all regions and of all number types. To
        order a specific number with a number order, use `numberOrderOption` in
        the "Create a number order" endpoint.


        Activate a phone number to use with SMS products, Voice products, or
        both.


        **Note:** This endpoint only supports US `LOCAL` numbers.


        You'll use `smsConfiguration` to setup your number for SMS and
        `voiceConfiguration` for Voice. To setup for both, add both objects. See
        the dropdown menu (just under language selection) for code samples.


        Note: You cannot add both objects if you only need to configure one
        object. For example, if you only need to configure `smsConfiguration`
        for SMS messaging, do not add the `voiceConfiguration` object or it will
        result in an error.
      operationId: NumberService_RentNumber
      deprecated: true
      requestBody:
        $ref: '#/components/requestBodies/RentNumberRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActiveNumberResponse'
        '400':
          description: 400 Invalid Argument error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: 404 Not Found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: 500 Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      tags:
        - Available Number
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package numbers;


            import com.sinch.sdk.SinchClient;

            import com.sinch.sdk.domains.numbers.api.v1.NumbersService;

            import com.sinch.sdk.domains.numbers.models.v1.ActiveNumber;

            import com.sinch.sdk.domains.numbers.models.v1.SmsConfiguration;

            import
            com.sinch.sdk.domains.numbers.models.v1.request.AvailableNumberRentRequest;

            import com.sinch.sdk.models.Configuration;

            import java.util.logging.Logger;

            import utils.Settings;


            public class Rent {

              private static final Logger LOGGER = Logger.getLogger(Rent.class.getName());

              public static void main(String[] args) {

                String projectId = Settings.getProjectId().orElse("MY_PROJECT_ID");
                String keyId = Settings.getKeyId().orElse("MY_KEY_ID");
                String keySecret = Settings.getKeySecret().orElse("MY_KEY_SECRET");

                String servicePlanIdToAssociateWithTheNumber =
                    Settings.getServicePlanId().orElse("MY_SERVICE_PLAN_ID");

                // Available numbers list can be retrieved by using list() function from available service, see
                // the SearchAvailableSnippet or
                // https://developers.sinch.com/docs/numbers/getting-started/java-sdk/searchavailable
                String phoneNumberToBeRented = "AVAILABLE_PHONE_NUMBER_TO_BE_RENTED";

                Configuration configuration =
                    Configuration.builder()
                        .setProjectId(projectId)
                        .setKeyId(keyId)
                        .setKeySecret(keySecret)
                        .build();

                SinchClient client = new SinchClient(configuration);

                NumbersService numbersService = client.numbers().v1();

                SmsConfiguration smsConfiguration =
                    SmsConfiguration.builder().setServicePlanId(servicePlanIdToAssociateWithTheNumber).build();

                AvailableNumberRentRequest parameters =
                    AvailableNumberRentRequest.builder().setSmsConfiguration(smsConfiguration).build();

                ActiveNumber response = numbersService.rent(phoneNumberToBeRented, parameters);

                LOGGER.info(String.format("Rented number: %s", response));
              }
            }
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';

              // The available phone number to rent
              const phoneNumber = 'PHONE_NUMBER';
              // The service plan ID to associate with the phone number
              const servicePlanId = process.env.SINCH_SERVICE_PLAN_ID ?? 'MY_SERVICE_PLAN_ID';

              const sinch = new SinchClient({ projectId, keyId, keySecret });

              try{
                const response = await sinch.numbers.rent({
                  phoneNumber: phoneNumber,
                  rentNumberRequestBody: {
                    smsConfiguration: {
                      servicePlanId,
                    },
                  },
                });
                console.log('✅ Successfully rented the phone number.');
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error(`❌ Failed to rent the phone number ${phoneNumber}:`);
                console.error(err);
              }
            }

            main();
        - lang: Python
          source: >
            """

            Sinch Python Snippet


            This snippet is available at
            https://github.com/sinch/sinch-sdk-python/tree/main/examples/snippets

            """


            import os

            from dotenv import load_dotenv

            from sinch import SinchClient

            from sinch.domains.numbers.models.v1.types import
            SmsConfigurationDict


            load_dotenv()


            sinch_client = SinchClient(
                project_id=os.environ.get("SINCH_PROJECT_ID") or "MY_PROJECT_ID",
                key_id=os.environ.get("SINCH_KEY_ID") or "MY_KEY_ID",
                key_secret=os.environ.get("SINCH_KEY_SECRET") or "MY_KEY_SECRET"
            )


            # The available phone number to rent in E.164 format

            phone_number = "PHONE_NUMBER"

            # The service plan ID to associate with the phone number

            service_plan_id = os.environ.get("SINCH_SERVICE_PLAN_ID") or
            "MY_SERVICE_PLAN_ID"

            sms_configuration: SmsConfigurationDict = {
                "service_plan_id": service_plan_id,
            }


            rented_number = sinch_client.numbers.rent(
                phone_number=phone_number,
                sms_configuration=sms_configuration
            )

            print("Rented Number:\n", rented_number)
