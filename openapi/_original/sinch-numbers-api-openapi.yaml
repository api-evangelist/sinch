        matching a set of criteria (pattern, capabilities etc.) - reserves the
        phone numbers for a period between 30 minutes and 48 hours (check the
        expireTime field) and creates entities for collecting KYC info.


        Set exactly one of these options:

        - `numberOrderOption`: order specific phone numbers. `phoneNumbers` must
        contain exactly one phone number; ordering more than one number per
        order isn't currently supported.

        - `quantityOrderOption`: order between 1 and 100 numbers
        (`requestedQuantity`) that match the given criteria.


        You can follow a detailed tutorial outlining the entire ordering process
        [here](https://developers.sinch.com/docs/numbers/kyc-numbers-order).
