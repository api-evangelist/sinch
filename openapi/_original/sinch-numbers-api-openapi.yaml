          example: a99aa9aa-b888-777c-dd6d-ee55e5555555
        hmacSecret:
          type: string
          description: >-
            The HMAC secret used for hashing the callback body using the
            HMAC-SHA1 algorithm - and for creating the `X-Sinch-Signature`
            header.
          example: YOUR_hmac_secret
    CallbackConfigurationUpdate:
      title: CallbackConfigurationUpdate
      type: object
      properties:
        hmacSecret:
          type: string
          description: >-
            The HMAC secret to be updated for the specified project. It must be
            between 32 and 64 characters, alphanumeric (A-Z, a-z, 0-9) and
            hyphens (-) only. Regex pattern: ^[a-zA-Z0-9-]{32,64}$
      description: >-
        The request to update the callbacks configuration for the current
        project.
    CallbackPayload:
      type: object
      oneOf:
        - $ref: '#/components/schemas/CallbackPayloadActiveNumber'
        - $ref: '#/components/schemas/CallbackPayloadNumberOrder'
      discriminator:
        propertyName: resourceType
        mapping:
          ACTIVE_NUMBER: '#/components/schemas/CallbackPayloadActiveNumber'
          NUMBER_ORDER: '#/components/schemas/CallbackPayloadNumberOrder'
    CallbackPayloadActiveNumber:
      type: object
      allOf:
        - $ref: '#/components/schemas/CallbackPayloadCommon'
      properties:
        eventType:
          type: string
          description: The type of the event.
          enum:
            - PROVISIONING_TO_SMS_PLATFORM
            - DEPROVISIONING_FROM_SMS_PLATFORM
            - PROVISIONING_TO_CAMPAIGN
            - DEPROVISIONING_FROM_CAMPAIGN
            - PROVISIONING_TO_VOICE_PLATFORM
            - DEPROVISIONING_FROM_VOICE_PLATFORM
          x-enumDescriptions:
            PROVISIONING_TO_SMS_PLATFORM: An event that occurs when a number is linked to a Service Plan ID.
            DEPROVISIONING_FROM_SMS_PLATFORM: >-
              An event that occurs when a number is unlinked from a Service Plan
              ID.
            PROVISIONING_TO_CAMPAIGN: An event that occurs when a number is linked to a Campaign.
            DEPROVISIONING_FROM_CAMPAIGN: An event that occurs when a number is unlinked from a Campaign.
            PROVISIONING_TO_VOICE_PLATFORM: >-
              An event that occurs when a number is enabled for Voice
              operations.
            DEPROVISIONING_FROM_VOICE_PLATFORM: >-
              An event that occurs when a number is disabled for Voice
              operations.
          example: PROVISIONING_TO_CAMPAIGN
        status:
          type: string
          description: The status of the event or the state transition it represents.
          x-enumDescriptions:
            SUCCEEDED: The event has succeeded.
            FAILED: The event has failed.
          enum:
            - SUCCEEDED
            - FAILED
          example: FAILED
        failureCode:
          type: string
          description: >-
            If the status is FAILED, a failure code will be provided. For
            numbers provisioning to SMS platform, there won't be any extra
            `failureCode`, as the result is binary. For campaign
            provisioning-related failures, refer to the list for the possible
            values.
          example: CAMPAIGN_NOT_AVAILABLE
          enum:
            - CAMPAIGN_NOT_AVAILABLE
            - EXCEEDED_10DLC_LIMIT
            - NUMBER_PROVISIONING_FAILED
            - PARTNER_SERVICE_UNAVAILABLE
            - CAMPAIGN_PENDING_ACCEPTANCE
            - MNO_SHARING_ERROR
            - CAMPAIGN_PROVISIONING_FAILED
            - CAMPAIGN_EXPIRED
            - CAMPAIGN_MNO_REJECTED
            - CAMPAIGN_MNO_SUSPENDED
            - CAMPAIGN_MNO_REVIEW
            - INSUFFICIENT_BALANCE
            - MOCK_CAMPAIGN_NOT_ALLOWED
            - TFN_NOT_ALLOWED
            - INVALID_NNID
          x-enumDescriptions:
            CAMPAIGN_NOT_AVAILABLE: The specified campaign is not available.
            EXCEEDED_10DLC_LIMIT: Exceeded the limit for 10DLC.
            NUMBER_PROVISIONING_FAILED: Provisioning the number failed.
            PARTNER_SERVICE_UNAVAILABLE: The third party service is unavailable.
            CAMPAIGN_PENDING_ACCEPTANCE: The campaign is not yet accepted.
            MNO_SHARING_ERROR: Error with MNO.
            CAMPAIGN_PROVISIONING_FAILED: The campaign failed to provision.
            CAMPAIGN_EXPIRED: The campaign expired.
            CAMPAIGN_MNO_REJECTED: The campaign MNO was rejected.
            CAMPAIGN_MNO_SUSPENDED: The campaign MNO was suspended.
            CAMPAIGN_MNO_REVIEW: The campaign MNO is under review.
            INSUFFICIENT_BALANCE: Not enough credit in the account.
            MOCK_CAMPAIGN_NOT_ALLOWED: Provisioning not allowed for mock campaigns.
            TFN_NOT_ALLOWED: Toll free numbers not allowed.
            INVALID_NNID: Invalid NNID.
        internalFailureCode:
          type: string
          description: >-
            If the status is FAILED, certain processes (eg. number to campaign
            provisioning) will have an internalFailureCode in the payload. The
            details of these codes can be found in our dedicated [Provisioning
            errors](https://developers.sinch.com/docs/numbers/api-reference/error-codes/provisioning-errors)
            documentation.
          example: CRS0018
        resourceId:
          type: string
          description: >-
            The unique identifier of the resource, depending on the resource
            type. For example, a phone number.
          example: '+12345612345'
    CallbackPayloadNumberOrder:
      type: object
      allOf:
        - $ref: '#/components/schemas/CallbackPayloadCommon'
      properties:
        eventType:
          type: string
          description: The type of the event.
          enum:
            - NUMBER_ORDER_PROCESSING
          x-enumDescriptions:
            NUMBER_ORDER_PROCESSING: >-
              An event that occurs when a Number Order transitions to a new
              state.
          example: NUMBER_ORDER_PROCESSING
        status:
          type: string
          description: The status of the event or the state transition it represents.
          x-enumDescriptions:
            IN_REVIEW: The Number Order transitioned to the IN_REVIEW state.
            BLOCKED: >-
              The Number Order transitioned to the BLOCKED state. The number
              order was blocked. To view any reasons associated with the BLOCKED
              status, use the [get number order registration
              operation](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order/getnumberorderregistration).
            COMPLETED: >-
              The Number Order transitioned to the COMPLETED state. This is a
              final state and indicates the number order was successful.
            REJECTED: >-
              The Number Order transitioned to the REJECTED state. This is a
              final state and indicates the number order was rejected.
            EXPIRED: >-
              The Number Order transitioned to the EXPIRED state. This is a
              final state and indicates the number order expired.
          enum:
            - IN_REVIEW
            - BLOCKED
            - COMPLETED
            - REJECTED
            - EXPIRED
          example: IN_REVIEW
        resourceId:
          type: string
          description: >-
            The unique identifier of the resource, depending on the resource
            type. For example, a number order ID.
          example: 01jgkbb8xywmz3hhahd76menqf
    CallbackPayloadCommon:
      type: object
      required:
        - resourceType
      properties:
        eventId:
          type: string
          description: The ID of the event.
          example: abcd1234efghijklmnop567890
        timestamp:
          type: string
          description: >-
            The date and time when the callback was created and added to the
            callbacks queue.
          example: '2023-06-06T07:45:27.785357'
        projectId:
          type: string
          description: The ID of the project to which the event belongs.
          example: abcd12ef-ab12-ab12-bc34-abcdef123456
        resourceType:
          $ref: '#/components/schemas/ResourceType'
    InvalidArgument:
      type: object
      properties:
