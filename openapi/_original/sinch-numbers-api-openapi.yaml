components:
  parameters:
    projectId:
      name: projectId
      description: >-
        Found on your [Sinch Customer
        Dashboard](https://dashboard.sinch.com/settings/project-management).
        Settings > Projects.
      in: path
      required: true
      schema:
        type: string
        example: YOUR_projectId
    phoneNumber:
      name: phoneNumber
      description: >-
        Output only. The phone number in
        [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537) format
        with leading `+`.
      in: path
      required: true
      schema:
        type: string
        example: '+12025550134'
        default: YOUR_selected_phoneNumber_from_search
    numberOrderId:
      name: numberOrderId
      description: The ID of the number order created by the REST API user.
      in: path
      required: true
      schema:
        type: string
    numberPattern.pattern:
      name: numberPattern.pattern
      description: >-
        Sequence of digits to search for. If you prefer or need certain digits
        in sequential order, you can enter the sequence of numbers here. For
        example, `2020`.
      in: query
      required: false
      schema:
        type: string
        example: '%2B120'
    numberPattern.searchPattern:
      name: numberPattern.searchPattern
      description: >-
        Search pattern to apply. The options are, `START`, `CONTAINS`, and
        `END`.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NumberPatternSearchPattern'
    regionCodeRequired:
      name: regionCode
      description: >-
        Region code to filter by. ISO 3166-1 alpha-2 country code of the phone
        number. Example: US, GB or SE.
      in: query
      required: true
      schema:
        type: string
        example: US
    regionCodeOptional:
      name: regionCode
      description: >-
        Region code to filter by. ISO 3166-1 alpha-2 country code of the phone
        number. Example: US, GB or SE.
      in: query
      required: false
      schema:
        type: string
        example: US
    typeRequired:
      name: type
      description: >-
        Number type to filter by. Options include, `MOBILE`, `LOCAL` or
        `TOLL_FREE`.
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/NumberType'
    typeOptional:
      name: type
      description: >-
        Number type to filter by. Options include, `MOBILE`, `LOCAL` or
        `TOLL_FREE`.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NumberType'
    capabilities:
      name: capabilities
      description: Number capabilities to filter by SMS and/or VOICE.
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/NumberCapability'
    capability:
      name: capability
      description: Number capabilities to filter by SMS and/or VOICE.
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/NumberCapability'
    pageSize:
      name: pageSize
      description: The maximum number of items to return.
      in: query
      required: false
      schema:
        type: integer
        format: int32
    pageToken:
      name: pageToken
      description: The next page token value returned from a previous List request, if any.
      in: query
      required: false
      schema:
        type: string
    orderBy:
      name: orderBy
      description: Supported fields for ordering by `phoneNumber` or `displayName`.
      in: query
      required: false
      schema:
        type: string
        enum:
          - phoneNumber
          - displayName
        x-enumDescriptions:
          phoneNumber: Ordered by phone number
          displayName: Ordered by display name
        description: The ordering the request is supporting
  examples:
    SearchActivateSMSNumber:
      summary: >-
        Search and activate a number that matches criteria and sets the SMS
        configuration
      value:
        regionCode: US
        type: LOCAL
        capabilities:
          - SMS
        numberPattern:
          pattern: '+1208'
          searchPattern: START
        smsConfiguration:
          servicePlanId: YOUR_SMS_servicePlanId
          campaignId: YOUR_campaignId_from_TCR
        callbackUrl: https://www.your-callback-server.com/callback
    gettingStartedLookupExample:
