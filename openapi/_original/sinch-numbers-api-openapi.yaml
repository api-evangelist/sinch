  schemas:
    RentAnyNumberRequest:
      title: RentAnyNumberRequest
      required:
        - regionCode
        - type
      type: object
      properties:
        numberPattern:
          $ref: '#/components/schemas/NumberPattern'
        regionCode:
          allOf:
            - $ref: '#/components/schemas/RegionCode'
          description: >-
            ISO 3166-1 alpha-2 country code of the phone number. This endpoint
            only supports `US`.
        type:
          allOf:
            - $ref: '#/components/schemas/NumberType'
          description: Number type. This endpoint only supports `LOCAL`.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/NumberCapability'
          description: Number capabilities to filter by, `SMS` and/or `VOICE`.
        smsConfiguration:
          $ref: '#/components/schemas/smsConfiguration'
        voiceConfiguration:
          $ref: '#/components/schemas/VoiceConfiguration'
        callbackUrl:
          type: string
          description: >-
            The callback URL to be called for a rented number's provisioning /
            deprovisioning operations.
          example: https://www.your-callback-server.com/callback
      description: >-
        Request message for searching and renting in one go any number that
        matches the search criteria.
    NumberPatternSearchPattern:
      type: string
      enum:
        - START
        - CONTAINS
        - END
      x-enumDescriptions:
        START: Numbers that start with the provided sequence of digits.
        CONTAINS: Numbers that contain the sequence of digits entered.
        END: Numbers that end with the sequence of digits entered.
      description: The pattern to apply to searches.
      title: Search Pattern
    money:
      type: object
      description: An object giving details on currency code and the amount charged.
      properties:
        currencyCode:
          type: string
          example: USD
          description: >-
            The 3-letter currency code defined in [ISO
            4217](https://www.iso.org/iso-4217-currency-codes.html).
        amount:
          type: string
          example: '2.00'
          description: >-
            The amount in decimal form.

            For example `2.00`.

            There are no guarantees on the precision unless documented by the
            message origin. The amount cannot be updated and is read-only.
      title: Money
    ActiveNumberRequest:
      type: object
      properties:
        displayName:
          type: string
          description: User supplied name for the phone number.
        smsConfiguration:
          $ref: '#/components/schemas/smsConfiguration'
        voiceConfiguration:
          $ref: '#/components/schemas/VoiceConfiguration'
        callbackUrl:
          type: string
          description: >-
            The callback URL to be called for a rented number's provisioning /
            deprovisioning operations.
      description: >-
        The phone number that has been rented by a customer and assigned to a
        project.
      title: Active Number Request
    ActiveNumberResponse:
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        projectId:
          type: string
          example: 51bc3f40-f266-4ca8-8938-a1ed0ff32b9a
          description: >-
            Project ID. Your project ID can be found on your [Sinch Customer
            Dashboard](https://dashboard.sinch.com/settings/project-management).
        displayName:
          type: string
          description: User supplied name for the phone number.
        regionCode:
          $ref: '#/components/schemas/RegionCode'
        type:
          $ref: '#/components/schemas/NumberType'
        capability:
          description: The capability of the number.
          type: array
          example:
            - SMS
          items:
            $ref: '#/components/schemas/NumberCapability'
        money:
          $ref: '#/components/schemas/money'
        paymentIntervalMonths:
          type: integer
          format: int32
          description: How often the recurring price is charged in months.
          readOnly: true
        nextChargeDate:
          type: string
          format: date-time
          description: The date of the next charge.
          readOnly: true
        expireAt:
          type: string
          format: date-time
          description: >-
            The timestamp when the subscription will expire if an expiration
            date has been set.
          readOnly: true
        smsConfiguration:
          $ref: '#/components/schemas/smsConfiguration'
        voiceConfiguration:
          $ref: '#/components/schemas/VoiceConfiguration'
        callbackUrl:
          type: string
          description: >-
            The callback URL to be called for a rented number's provisioning /
            deprovisioning operations.
          example: https://www.your-callback-server.com/callback
      description: >-
        The phone number that has been bought by a customer and assigned to a
        project.
      title: Active Number Response
    AvailableNumber:
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        regionCode:
          $ref: '#/components/schemas/RegionCode'
        type:
          $ref: '#/components/schemas/NumberType'
        capability:
          type: array
          description: The capability of the number.
          example:
            - SMS
            - VOICE
          items:
            $ref: '#/components/schemas/NumberCapability'
        setupPrice:
          $ref: '#/components/schemas/money'
        monthlyPrice:
          $ref: '#/components/schemas/money'
        paymentIntervalMonths:
          type: integer
          format: int32
          description: How often the recurring price is charged in months.
          readOnly: true
        supportingDocumentationRequired:
          type: boolean
          description: >-
            Whether regulations in the number's region require supplementary
            documentation (for example, business or identity documents) to buy
            numbers of this type. The value is determined by the regulatory
            requirements for the number's region and number type, so it's the
            same for every number of that type in that region.


            If `true`, use the [Number
            Order](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order)
            API to buy the number: call "Lookup number requirements" to find out
            exactly which information and documents are required, then provide
            them with the order's registration and attachment endpoints before
            submitting the order.
          readOnly: true
      description: >-
        The phone numbers that are available to be rented in
        [dashboard.sinch.com](https://dashboard.sinch.com/numbers/buy-numbers)
        or via the public numbers API.
      title: Available Number
    AvailableRegion:
      type: object
      properties:
        regionCode:
          $ref: '#/components/schemas/RegionCode'
        regionName:
          type: string
          example: United States
          description: >-
            Display name of the region. Examples: United States, United Kingdom
            or Sweden.
          readOnly: true
        types:
          type: array
          example:
            - MOBILE
          items:
            $ref: '#/components/schemas/NumberType'
          description: >-
            A list of the different number types available. Examples: `MOBILE`
            or `LOCAL`.
          readOnly: true
      description: A region for which numbers are provided.
      title: Available Region
    ListActiveNumbersResponse:
      type: object
      properties:
        activeNumbers:
          type: array
          items:
            $ref: '#/components/schemas/ActiveNumberResponse'
          description: >-
            List of numbers associated to the client project specified in
            `ListActiveNumbers`.
        nextPageToken:
          type: string
          title: The token to be used for listing the next page.
        totalSize:
          type: integer
          format: int32
          title: The maximum number of results returned.
      description: Response message to list your active phone numbers.
      title: Active Numbers Response
    ListAvailableNumbersResponse:
      type: object
      properties:
        availableNumbers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableNumber'
          description: List of available phone numbers.
      description: Response message to list available phone numbers.
      title: Available Numbers Response
    ListAvailableRegionsResponse:
      type: object
      properties:
        availableRegions:
          type: array
          items:
            $ref: '#/components/schemas/AvailableRegion'
          title: List of regions for which numbers are provided.
      description: Response message to list regions for which numbers are provided.
      title: List Available Regions Response
    NumberCapability:
      type: string
      enum:
        - SMS
        - VOICE
      x-enumDescriptions:
        SMS: The SMS product can use the number.
        VOICE: The Voice product can use the number.
      default: SMS
      description: 'The capabilities the phone number supports: SMS, Voice, or both'
      title: Capability
    NumberPattern:
      type: object
      properties:
        pattern:
          type: string
          description: Sequence of digits to search for.
        searchPattern:
          $ref: '#/components/schemas/NumberPatternSearchPattern'
      title: Search Pattern
    RegionCode:
      type: string
      example: US
      description: >-
        ISO 3166-1 alpha-2 country code of the phone number. Example: US, GB or
        SE.
      title: Region Code
      nullable: false
    PhoneNumber:
      type: string
      example: '+12025550134'
      description: >-
        The phone number in
        [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537) format
        with leading `+`. Example `+12025550134`.
      title: Phone Number
    NumberType:
      type: string
      enum:
        - MOBILE
        - LOCAL
        - TOLL_FREE
      x-enumDescriptions:
        MOBILE: Numbers that belong to a specific range.
        LOCAL: Numbers that are assigned to a specific geographic region.
        TOLL_FREE: >-
          Numbers that are free of charge for the calling party but billed for
          all arriving calls.
      description: The number type.
      title: Type
      nullable: false
    UploadStatus:
      default: WAITING
      description: >-
        The attachment upload status. It will be either `COMPLETED`, `WAITING`
        or `FAILED`.
      enum:
        - COMPLETED
        - WAITING
        - FAILED
      x-enumDescriptions:
        WAITING: Waiting for upload
        COMPLETED: Upload completed
        FAILED: Upload failed
      title: Upload Status
    ProvisioningStatus:
      default: WAITING
      description: >-
        The provisioning status. It will be either `WAITING`, `IN_PROGRESS` or
        `FAILED`. If the provisioning fails, a reason for the failure will be
        provided. [See a full list of provisioning error
        descriptions]<(https://developers.sinch.com/docs/numbers/api-reference/error-codes/provisioning-errors)
        and troubleshooting recommendations.
      enum:
        - PROVISIONING_STATUS_UNSPECIFIED
        - WAITING
        - IN_PROGRESS
        - FAILED
      x-enumDescriptions:
        PROVISIONING_STATUS_UNSPECIFIED: The status is currently unknown.
        WAITING: Waiting for provisioning
        IN_PROGRESS: Provisioning in progress
        FAILED: >-
          Provisioning failed. See [provisioning error
          descriptions](https://developers.sinch.com/docs/numbers/api-reference/error-codes/provisioning-errors)
      title: Provisioning Status
    RentNumberRequest:
      type: object
      properties:
        smsConfiguration:
          $ref: '#/components/schemas/smsConfiguration'
        voiceConfiguration:
          $ref: '#/components/schemas/VoiceConfiguration'
        callbackUrl:
          type: string
          description: >-
            The callback URL to be called for a rented number's provisioning /
            deprovisioning operations.
      description: Request message for renting a phone number.
      title: Rent Number Request
    scheduledProvisioning:
      type: object
      description: >-
        Represents the ongoing or failed scheduled provisioning job. This field
        will be empty if the number was both successfully provisioned to the SMS
        platform and linked to the 10DLC campaign.
      properties:
        servicePlanId:
          type: string
          description: >-
            The SMS service plan that the scheduled provisioning job will
            configure with the number.
          readOnly: true
        campaignId:
          type: string
          description: >-
            TCR campaign ID that the scheduled provisioning job will configure
            with the number.
          readOnly: true
        status:
          $ref: '#/components/schemas/ProvisioningStatus'
        lastUpdatedTime:
          type: string
          format: date-time
          description: Timestamp when the status was last updated.
          readOnly: true
