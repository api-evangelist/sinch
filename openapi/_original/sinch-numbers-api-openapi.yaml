openapi: 3.0.3
info:
  title: Numbers | Sinch
  description: >
    # Overview


    The Numbers API enables you to search for, buy, view, and manage numbers.
    It's considered a precursor to other APIs in the Sinch product family. The
    numbers API can be used in tandem with any of our APIs that perform
    messaging or calling. Once you have bought your numbers, you can then use
    the various other APIs, such as
    [SMS](https://developers.sinch.com/docs/sms/) or
    [Voice](https://developers.sinch.com/docs/voice/), to assign and use those
    numbers.


    ## Choosing how to buy a number


    Use the [Number
    Order](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order)
    API to buy numbers. It supports numbers from all regions and of all number
    types, and it collects any registration (KYC) information and supporting
    documents a region requires:


    1. Check what the region and number type require ("Lookup number
    requirements").

    2. Find a number to buy ("Search for available phone numbers" in the
    [Available
    Numbers](https://developers.sinch.com/docs/numbers/api-reference/numbers/available-number)
    API), or skip this step and order by criteria instead.

    3. Create the order, provide any required registration information and
    documents, and submit it.


    For a step-by-step walkthrough, see [Ordering numbers that meet specific
    requirements](https://developers.sinch.com/docs/numbers/kyc-numbers-order).


    **Deprecated:** The Available Numbers activation endpoints, "Activate a new
    phone number" (`availableNumbers/{phoneNumber}:rent`) and "Rent any number
    that matches the criteria" (`availableNumbers:rentAny`), are deprecated and
    only support US `LOCAL` numbers. They remain available for existing
    integrations, but new integrations should use the Number Order API. The
    Available Numbers search endpoints aren't deprecated and work for all
    regions and number types.


    ## Numbers REST formats and conventions


    Let's take a brief look at some of the formats used in the REST API.


    ### JSON


    JSON (`application/json`) is the content type of both requests and responses
    if not otherwise specified.


    Requests with invalid JSON will be rejected.


    ### Null values


    Null values can be omitted in requests and will be omitted in responses. In
    some cases, explicitly setting `null` will overwrite a previously set value
    with `null`.


    ### Phone numbers


    Only phone numbers in
    [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537) standard
    format are accepted by the API.


    #### Examples:


    - **US phone number:** `+13059394139`

    - **UK phone number:** `+447478727259`

    - **SE phone number:** `+46113232516`


    ## Status codes


    A summary of status codes can be found on the [HTTP status codes
    page](https://developers.sinch.com/docs/numbers/api-reference/error-codes/status-codes).


    ## IP addresses for callbacks


    To successfully use callbacks with Numbers, add the following IP addresses
    to your allowlist:


    - 54.76.19.159

    - 54.78.194.39

    - 54.155.83.128


    ## New features


    New features might result in additional request and response parameters. New
    request parameters will either have a default value or be considered
    optional to retain backwards compatibility. It's highly recommended to
    ignore any unexpected parameters when reading JSON in API responses and in
    callback handlers.
