            traffic to US; click
            [here](https://community.sinch.com/t5/10DLC/What-is-10DLC/ta-p/7845)
            to read more about 10DLC A2P messaging. So, it is the current
            campaign ID for this number. The `campaignId` is found on your TCR
            platform.
