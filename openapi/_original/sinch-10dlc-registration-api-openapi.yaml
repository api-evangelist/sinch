security:
  - BasicAuth: []
  - OAuth2: []
tags:
  - name: 10DLC Brand Registration
    description: Create or look up brand registration for 10DLC virtual numbers
  - name: 10DLC Campaign Registration
    description: >-
      10DLC is a system in the United States that allows businesses to send
      Application-to-Person (A2P) messaging via 10-digit-long-codes (10DLC). It
      uses a dedicated 10-digit telephone number allocated within the North
      American Numbering Plan (NANP). 


      In order to register for a 10DLC campaign, you need to have a 10DLC
      enabled brand. Create a 10DLC enabled brand before you start, see [Brand
      Registrations](https://developers.sinch.com/docs/10dlc-registration/api-reference/10dlc-registration/tag/Brand-Registration/)
      for more info.


      Before you launch your 10DLC message program, Sinch must review your
      campaign. We make sure your message program aligns with carrier and
      industry requirements. Principally we look for alignment with the [CTIA
      2023 Messaging Principals & Best
      Practices](https://community.sinch.com/t5/SMS/CTIA-Messaging-Principles-and-Best-Practices/ta-p/7087/highlight/true).
      If your campaign does not meet these requirements, we will reject it. If
      we do reject it, you will need to make changes to the campaign and
      resubmit it for Sinch to review again.  


      It's important to understand [10DLC compliance
      requirements](https://community.sinch.com/t5/10DLC/10DLC-Compliance-Requirements-and-Guidance/ta-p/10706)
      as well as other best practices. You should also know the [most common
      reasons why Sinch may reject your
      campaign](https://community.sinch.com/t5/10DLC/Why-was-my-campaign-rejected/ta-p/15408)
      . We want to help you get your campaigns approved the first time. Then you
      can get your message program up and running right away!    
  - name: TFN Verification
    description: Create or look up Verifications for Toll-Free Numbers
paths:
  /v1/projects/{projectId}/campaignRegistrations:submit:
    post:
      tags:
        - 10DLC Campaign Registration
      summary: Create new Campaign in TCR
      description: >-
        Create a 10DLC campaign at TCR (The Campaign Registry).<br><br> Campaign
        fees and carrier requirements are determined by the brand and use-case
        being used.  To check the campaign requirements, use the
        campaign:qualify API.
      operationId: CampaignRegistrationExternalService_CreateTcrCampaign
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTcrCampaignRequest'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTcrCampaignResponse'
        '400':
          description: 'INVALID_ARGUMENT: If the input parameters are not valid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 400
                  message: useCase must not be blank
                  status: INVALID_ARGUMENT
                  details:
                    - type: BadRequest
                      fieldViolations:
                        - field: useCase
                          description: must not be blank
        '429':
          description: Over limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 429
                  message: Over limit
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 500
                  message: >-
                    Error while retrieving account mapped to the given project
                    id.
                  status: INTERNAL
                  details:
                    - type: ResourceInfo
                      resourceType: Project
                      resourceName: ec9f3e99-f7b1-474d-9dbd-ba3cef667d6e
                      owner: ''
                      description: >-
                        Error while retrieving account mapped to the given
                        project id.
      x-codegen-request-body-name: body
  /v1/projects/{projectId}/uploadCampaignFile:submit:
    post:
      tags:
        - 10DLC Campaign Registration
      summary: Upload attachments for 10DLC campaign registration
      description: Uploads supporting documentation for 10DLC campaign registrations.
      parameters:
        - $ref: '#/components/parameters/projectId'
      operationId: CampaignRegistrationExternalService_UploadCampaignFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1uploadCampaignFilesRequest'
            example:
              projectId: 0fc52975-636a-4700-8943-68759df5c9e1
              campaignInternalId: 01k4cxccbt519xa3ejty1r5jb4
              file:
                fileName: TestText.txt
                fileContent: VGhpcyBpcyBhIHRlc3QgdGV4dCBmaWxlLg==
                fileCategory: 5
              submitCampaign: false
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Indicates whether the file upload was successful or not.
                    example: success
                  message:
                    type: string
                    description: >-
                      A message providing details if the file upload was not
                      successful. Will be an empty string if the upload was
                      successful.
        '400':
          description: 'INVALID_ARGUMENT: If the input parameters are not valid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 400
                  message: Invalid campaign_registration_id
                  status: INVALID_ARGUMENT
                  details:
                    - type: BadRequest
                      fieldViolations:
                        - field: campaign_registration_id
                          description: invalid value
        '404':
          description: The campaign could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error:
                  code: 404
                  message: Campaign not found
                  status: NOT_FOUND
                  details:
                    - type: ResourceInfo
                      resourceType: Campaign
                      resourceName: 01frjdjhq2mnps0srvbt9wpvek
                      owner: ''
                      description: not found
        '429':
