  /v1/projects/{projectId}/campaignRegistrations/{campaignRegistrationId}/resubmit:
    put:
      tags:
        - 10DLC Campaign Registration
      summary: Campaign Registration Resubmit
      description: >-
        "Resubmit a campaign to:


        1. Backfill missing MNO campaign operation records for one or more
        networks.

        2. Retroactively update the campaign to reflect newly assigned message
        class.


        Please note that running this endpoint could potentially downgrade
        campaign business terms.<br><br>

        After hitting this endpoint, call the Get Campaign Registration API to
        to check lastActionStatus:


        1. If lastActionStatus is `RESUBMIT_IN_PROGRESS, mno metadata not
        updated`, poll again.

        2. If lastActionStatus is `RESUBMIT_SUCCESSFUL`, get updated MNO
        metadata.

        3. If lastActionStatus is `RESUBMIT_FAILED`, call the Campaign Feedback
        API to know the reason for failure.
      operationId: CampaignRegistrationService_ResubmitCampaignRegistration
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/campaignRegistrationId'
      requestBody:
        description: >-
          List of MNOs (ATT, TMO, USC, VZW) to resubmit a campaign in TCR.
          Default value for empty list: ALL, i.e. all MNOs.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResubmitCampaignRegistrationRequest'
        required: false
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 'INVALID_ARGUMENT: If the input parameters are not valid'
          content:
            application/json:
              schema:
