openapi: 3.0.1
info:
  title: Registration
  description: >-
    Service for creating and listing US 10DLC brand and campaign registrations
    and TFN Verifications.


    The US  brand and campaign registration API is an asynchronous process. 
    Most brands and campaign registrations will be completed in a few minutes,
    but in some scenarios, the process can take several days.  The initial
    release will not include a webhook service, therefore you will need to poll
    the result of the brand and campaign registrations. We suggest doing this
    every hour until the registration status is "Approved" or "Rejected".



    <table><thead><tr><th><b>10DLC Registration
    steps</b></th><th></th></tr></thead><tbody><tr><td><b>Client submits brand
    registration</b></td><td>&#8594;</td><td>brandRegistrations</td><td>&#8594;</td><td>Sinch</td></tr><tr><td><b>Client
    gets back
    brandRegistrationId</b></td><td>&#8592;</td><td>{brandRegistrationId}</td><td>&#8592;</td><td>Sinch</td></tr><tr><td><b>Client
    polls using
    brandRegistrationId</b></td><td>&#8594;</td><td>brandRegistrations/{brandRegistrationId}</td><td>&#8594;</td><td>Sinch</td></tr><tr><td><b>Client
    gets back TCR Brand
    ID</b></td><td>&#8592;</td><td>{brandId}</td><td>&#8592;</td><td>Sinch</td></tr><tr><td><b>Client
    checks
    use-case</b></td><td>&#8594;</td><td>campaignRegistration:qualify</td><td>&#8594;</td><td>Sinch</td></tr><tr><td><b>Client
    submits campaign
    registration</b></td><td>&#8594;</td><td>campaignRegistration:submit</td><td>&#8594;</td><td>Sinch</td></tr><tr><td><b>Client
    gets back
    campaignRegistrationId</b></td><td>&#8592;</td><td>{campaignRegistrationId}</td><td>&#8592;</td><td>Sinch</td></tr><tr><td><b>Client
    polls using
    campaignRegistrationId</b></td><td>&#8594;</td><td>campaignRegistrations/{campaignRegistrationId}</td><td>&#8594;</td><td>Sinch</td></tr><tr><td><b>Client
    gets back TCR campaign
    ID</b></td><td>&#8592;</td><td>campaignId</td><td>&#8592;</td><td>Sinch</td></tr></tbody></table>
    <br>
  contact:
    name: Support
    url: https://www.sinch.com
    email: Support@sinch.com
  version: '1.0'
  license:
    name: MIT
    url: https://www.sinch.com/toc
servers:
  - url: https://us10dlc.numbers.api.sinch.com
