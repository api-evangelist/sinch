  /v1/projects/{projectId}/campaignRegistrations:qualify:
    get:
      tags:
        - 10DLC Campaign Registration
      summary: Qualify Brand by Use Case
      description: >-
        Before submitting a campaign, this API will provide some important
        feedback about how the resulting campaign will be treated.  You can
        verify that the campaign will be supported by all operators, the AT&T
        message class and TPM, the T-Mobile brand daily bucket that will be
        applied and more.


        It is suggested to validate that the operator restrictions will meet
        your needs prior to submitting the campaign request.  Brand revettings
        do not automatically adjust operator restrictions, and in some cases a
        new campaign may have to be resubmitted to receive the adjusted MNO
        values.
      operationId: CampaignRegistrationExternalService_QualifyBrandByUseCase
      parameters:
