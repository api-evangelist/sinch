    get:
      tags:
        - Faxes
      summary: List faxes
      operationId: getFaxes
      description: >-
        List faxes sent (OUTBOUND) or received (INBOUND), set parameters to
        filter the list.

        Example: Return calls made between 1st of January 2021 and  10th of
        January 2021.

        ```
         created>=2021-01-01&startTime<=2021-01-10
        ```
      parameters:
        - name: serviceId
          in: query
          description: Limits results to faxes that were sent using the specified service.
          schema:
            type: string
            example: YOUR_SERVICE_ID
        - name: createTime
          in: query
          description: >-
            Filter calls based on  `createTime`. If you make the query more
            precise, fewer results will be returned.

            For example, `2021-02-01` will return all calls from the first of
            February 2021, and `2021-02-01T14:00:00Z` will return all calls
            after 14:00 on the first of February.

            This field also supports `<=` and `>=` to search for calls in a
            range `?createTime>=2021-10-01&startTime<=2021-10-30` to get a list
            of calls for all of October 2021.

            It is also possible to submit partial dates. For example,
            `createTime=2021-02` will return all calls for February 2021.


            If not value is submitted, the default value is the prior week.
          schema:
            type: string
            format: date-time
        - name: direction
          in: query
          description: Limits results to faxes with the specified direction.
          schema:
            $ref: '#/components/schemas/FaxDirection'
          example: OUTBOUND
        - name: status
          in: query
          description: Limits results to faxes with the specified status.
          schema:
            $ref: '#/components/schemas/FaxStatus'
          example: COMPLETED
        - name: to
          in: query
          description: >-
            Filters the results by the phone number to which the fax was sent.
            The parameter search with startsWith, so you can pass a partial
            number to get all faxes sent to numbers that start with the number
            you passed.
          schema:
            $ref: '#/components/schemas/PhoneNumber'
          example: '+14155552222'
        - name: from
          in: query
          description: >-
            Filters the results by the phone number from which the fax was
            sent.  The parameter search with startsWith, so you can pass a
            partial number to get all faxes sent to numbers that start with the
            number you passed.
          schema:
            $ref: '#/components/schemas/PhoneNumber'
        - $ref: '#/components/parameters/Labels'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
        - name: fromCountry
          in: query
          description: >-
            Filter by the country which sent the fax. The country code should be
            in ISO 3166-1 alpha-2 format.
          schema:
            type: string
            example: US
        - name: toCountry
          in: query
          description: >-
            Filter by the country to which the fax was sent. The country code
            should be in ISO 3166-1 alpha-2 format.
          schema:
            type: string
            example: US
      responses:
        '200':
          description: Result of the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFaxesObject'
            text/csv:
              schema: {}
      x-codeSamples:
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';

              const sinch = new SinchClient({ projectId, keyId, keySecret });

              try {
                const response = await sinch.fax.faxes.list({});
                if (response.data.length === 0) {
                  console.log('No Faxes found.');
                  return;
                }
                console.log(`✅ Found ${response.data.length} Faxes.`);
                response.data.forEach((fax) => {
                  console.log(fax);
                });
              } catch (err) {
                console.error('❌ Failed to list Faxes:');
                console.error(err);
              }
            }

            main();
