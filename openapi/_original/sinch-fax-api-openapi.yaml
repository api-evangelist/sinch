components:
  examples:
    SendWebPageAsFax:
      summary: Send a web page as a fax
      value:
        to: '+14155552222'
        contentUrl: https://developers.sinch.com/fax/fax.pdf
    SendFileAsFax:
      summary: Send a file as a fax
      value:
        to: '+14155552222'
        file: //path/to/file.pdf
    SendFileAsFaxWithCoverPage:
      summary: Send a fax with cover page
      value:
        to: '+14155552222'
        file: //path/to/file.pdf
        coverPageId: 12312kj312kl3j12k3j
        coverPageData:
          message: To Dr. Smith regarding referral
    SendFileAsFaxJson:
      summary: Send a file as a fax
      value:
        to:
          - '+14155552222'
          - '+14155552233'
        files:
          - file: '{base64EncodedData}'
            fileType: PDF
  responses:
    ServiceList:
      description: >-
        List of services, or an
        [Error](https://developers.sinch.com/docs/fax/api-reference/fax/error-messages)
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  services:
                    description: List of services.
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
              - $ref: '#/components/schemas/Pagination'
  schemas:
    Number:
      description: A phone number and its permissions.
      type: object
      properties:
        number:
          $ref: '#/components/schemas/PhoneNumber'
        permissions:
          type: string
          description: >-
            Allows you to set permissions for sending and receiving faxes to
            this email/phone number combination. Default value is `both`.
          x-enumDescriptions:
            both: >-
              Allows the email to send and receive faxes to this email/phone
              number combination.
            send: >-
              Allows the email to only send faxes to this email/phone number
              combination.
            receive: >-
              Allows the email to only receive faxes from this email/phone
              number combination.
          enum:
            - both
            - send
            - receive
          default: both
    Email:
      type: object
      required:
        - email
        - phoneNumbers
      properties:
        email:
          type: string
          format: email
          example: user@domain.com
        phoneNumbers:
          description: Numbers you want to associate with this email.
          type: array
          items:
            $ref: '#/components/schemas/Number'
        projectId:
          readOnly: true
          x-version: 1
          allOf:
            - $ref: '#/components/schemas/ProjectId'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the email configuration was created.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the email configuration was last updated.
    TemplateName:
      type: string
      description: The name of the email template.
      enum:
        - successful outbound fax
        - unsuccessful outbound fax
        - successful inbound fax
        - unsuccessful inbound fax
      x-enumDescriptions:
        successful outbound fax: The template for a successful outbound fax.
        unsuccessful outbound fax: The template for an unsuccessful outbound fax.
        successful inbound fax: The template for a successful inbound fax.
        unsuccessful inbound fax: The template for an unsuccessful inbound fax.
      example: successful outbound fax
    FaxDirection:
      type: string
      description: The direction of the fax.
      readOnly: true
      enum:
        - OUTBOUND
        - INBOUND
      x-enumDescriptions:
        OUTBOUND: The fax was sent by you via the API.
        INBOUND: The fax was received on one of your numbers.
      example: OUTBOUND
    Fax:
      type: object
      properties:
        id:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/FaxId'
        direction:
          allOf:
            - $ref: '#/components/schemas/FaxDirection'
          readOnly: true
        from:
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
          readOnly: false
          description: >-
            For `INBOUND` faxes, this is the number where the fax is sent from

            For `OUTBOUND` faxes, this is the Sinch number you want to have as
            sender
        to:
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
          readOnly: false
          description: >-
            For `INBOUND` faxes, this is the Sinch number someone sent the fax
            to.

            For `OUTBOUND` faxes, this is the phone number you want to send a
            fax to.


            You can add multiple numbers by adding them as an array. For
            example:

              application/json

              ```json
              "to": ["+14155552222", "+14155553333"]
              ```

              multipart/form
              ```json
              to=+14155552222&to=+14155553333

              ```
        contentUrl:
          anyOf:
            - type: string
              format: url
              description: >-
                Single URL. Fetched documents must be one of the following file
                types: `.docx`, `html.`, `.jpg`, `.pdf`, `.png`, `.tif`, `.txt`.
              example: https://example.com/fax.pdf
            - type: array
              items:
                type: string
                format: url
              description: >-
                Multiple URLs. Fetched documents must be one of the following
                file types: `.docx`, `html.`, `.jpg`, `.pdf`, `.png`, `.tif`,
                `.txt`.
              example:
                - https://www.google.com
                - https://www.sinch.com
          format: URL
          description: >-
            Give us any URL on the Internet (including ones with basic
            authentication)

            At least one file or contentUrl parameter is required.

            Please note: If you are passing fax a secure URL (starting with
            https://), make sure that your SSL certificate (including your
            intermediate cert, if you have one) is installed properly, valid,
            and up-to-date.

            If the file parameter is specified as well, content from URLs will
            be rendered before content from files.


            You can add multiple URLs by adding them as an array them with a
            comma when posting as multipart/form-data


            For example: "https://developers.sinch.com/fax/fax.pdf,
            https://developers.sinch.com/" or if posting JSON `"contentUrl":
            ["https://developers.sinch.com/fax/fax.pdf",
            "https://developers.sinch.com/"]`
          example: https://developers.sinch.com/fax/fax.pdf
        numberOfPages:
          type: integer
          readOnly: true
          description: The number of pages in the fax.
        status:
          $ref: '#/components/schemas/FaxStatus'
        price:
          description: >-
            The total price for this fax. This field is populated after the
            final fax price is calculated.
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true
        barCodes:
          description: >-
            The bar codes found in the fax. This field is populated when Sinch
            detects bar codes on incoming faxes.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/BarCode'
        createTime:
          readOnly: true
          type: string
          format: date-time
          description: >-
            A timestamp representing the time when the initial API call was
            made.
        completedTime:
          type: string
          format: date-time
          readOnly: true
          description: >-
            If the job is complete, this is a timestamp representing the time
            the job was completed.
        pagesSentSuccessfully:
          type: integer
          description: >-
            The number of pages successfully sent to the receiving side in the
            fax.
          readOnly: true
          example: 3
        headerText:
          description: >-
            Text that will be displayed at the top of each page of the fax. 50
            characters maximum. Default header text is "-". Note that the header
            is not applied until the fax is transmitted, so it will not appear
            on fax PDFs or thumbnails.
          type: string
          maximum: 50
          default: ''
        headerPageNumbers:
          type: boolean
          description: >-
            If true, page numbers will be displayed in the header. Default is
            true.
          default: true
        headerTimeZone:
          type: string
          format: timezone
          description: >-
            A [TZ database
            name](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)
            string specifying the timezone for the header timestamp.
          default: America/New_York
        retryDelaySeconds:
          description: >-
            The number of seconds to wait between retries if the fax is not yet
            completed.
          type: integer
          minimum: 30
          maximum: 300
          default: 60
        labels:
          x-version: 2
          description: >-
            You can use this to attach labels to your call that you can use in
            your BI solutions.
          allOf:
            - $ref: '#/components/schemas/Labels'
          example:
            customerId: '1234'
            customerName: John Doe
        callbackUrl:
          type: string
          description: >-
            The URL to which a callback will be sent when the fax is completed.
            The callback will be sent as a POST request with a JSON body. The
            callback will be sent to the URL specified in the `callbackUrl`
            parameter, if provided, otherwise it will be sent to the URL
            specified in the `callbackUrl` field of the Fax Service object.


            Note: If a callback URL uses basicauth credentials, when the
            callback URL is retrieved those credentials are masked. It is not
            possible to retrieve previously-set credentials through the API.
          format: URL
          example: https://www.my-website.com/callback
        callbackUrlContentType:
          description: The content type of the callback.
          type: string
          default: multipart/form-data
          enum:
            - multipart/form-data
            - application/json
          x-enumDescriptions:
            multipart/form-data: >-
              The callback will be sent as a multipart/form-data request with
              files as attachments to the body.
            application/json: >-
              The callback will be sent as a JSON request with the files as
              base64 encoded strings in the JSON object.
        imageConversionMethod:
          $ref: '#/components/schemas/ImageConversionMethod'
        errorType:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ErrorType'
        errorCode:
          readOnly: true
          type: integer
          description: >-
            One of the error numbers listed in the [Fax Error Messages
            section](https://developers.sinch.com/docs/fax/api-reference/fax/error-messages).
        errorMessage:
          readOnly: true
          type: string
          description: >-
            One of the error codes listed in the [Fax Error Messages
            section](https://developers.sinch.com/docs/fax/api-reference/fax/error-messages).
        maxRetries:
          readOnly: false
          type: integer
          description: >-
            | The number of times the fax will be retired before cancel. Default
            value is set in your fax service.

            | The maximum number of retries is 5.
          maximum: 5
          minimum: 0
        retryCount:
          readOnly: true
          type: integer
          description: The number of times the fax has been retried.
        hasFile:
          readOnly: true
          type: boolean
          description: >-
            Only shown on the fax result. This indicates if the content of the
            fax is stored with Sinch. (true or false)
        resolution:
          $ref: '#/components/schemas/Resolution'
        coverPageId:
          type: string
          description: The cover page id you want to use for the fax
        coverPageData:
          $ref: '#/components/schemas/CoverPageData'
        inProgressNotifications:
          type: boolean
          description: >-
            If set to `true`, you will receive a webhook notification for each
            page sent on an outbound fax.
          default: false
        fromCountry:
          readOnly: true
          type: string
          description: >-
            The country code in ISO 3166-1 alpha-2 format of the number sending
            the fax.
          example: US
        toCountry:
          readOnly: true
          type: string
          description: >-
            The country code in ISO 3166-1 alpha-2 format of the number
            receiving the fax.
          example: US
        projectId:
          readOnly: true
          x-version: 1
          allOf:
            - $ref: '#/components/schemas/ProjectId'
        serviceId:
          readOnly: false
          x-version: 1
          allOf:
            - $ref: '#/components/schemas/ServiceId'
    FaxBase64Array:
      description: An array of base64 encoded files
      type: object
      properties:
        files:
          type: array
          description: An array of base64 encoded files
          items:
            $ref: '#/components/schemas/FaxBase64File'
    FaxBase64File:
      type: object
      properties:
        file:
          type: string
          format: base64
          contentEncoding: base64
          description: >-
            When application/json Base64 encoded file content, this is only
            present when using application/json for request/response.
          example: '{base64-encoded content}'
        fileType:
          $ref: '#/components/schemas/FileTypeJson'
    FileTypeMultiPart:
      description: >-
        When request/response is multipart/form-data and file is part of
        payload. This is the file type of the file.
      enum:
        - application/docx
        - application/pdf
        - application/tif
        - application/jpg
        - application/txt
        - application/html
        - application/png
      x-enumDescriptions:
        application/docx: Microsoft Word
        application/pdf: PDF
        application/tif: TIFF
        application/jpg: JPEG
        application/txt: Text
        application/html: HTML
        application/png: PNG
    FileTypeJson:
      type: string
      description: >-
        When request/response is application/json and file is part of payload.
        This is the file type of the file.
      enum:
        - DOCX
        - PDF
        - TIF
        - JPG
        - TXT
        - HTML
        - PNG
      x-enumDescriptions:
        DOCX: Microsoft Word
        PDF: PDF
        TIF: TIFF
        JPG: JPEG
        TXT: Text
        HTML: HTML
        PNG: PNG
    BarCode:
      type: object
      description: >-
        Sinch will scan all pages of all incoming faxes for Code-128 and
        DataMatrix bar codes and include this information in webhook requests
        and via the API.
      properties:
        type:
          type: string
