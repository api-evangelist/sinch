    Error:
      type: object
      properties:
        code:
          description: HTTP status code or error code
          readOnly: true
          type: integer
          format: int32
          example: 400
        status:
          description: Response status name.
          readOnly: true
          type: string
          example: INVALID_ARGUMENT
        message:
          type: string
          readOnly: true
          description: A developer-facing error message
          example: Bad request.
        details:
          readOnly: true
          description: Details of the errors
          type: array
          items:
            type: object
            allOf:
              - $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      anyOf:
        - $ref: '#/components/schemas/NotFoundDetail'
        - $ref: '#/components/schemas/BadRequestDetail'
        - $ref: '#/components/schemas/ErrorInfo'
      discriminator:
        propertyName: type
        mapping:
          NotFound: '#/components/schemas/NotFoundDetail'
          BadRequest: '#/components/schemas/BadRequestDetail'
          ErrorInfo: '#/components/schemas/ErrorInfo'
    ErrorType:
      readOnly: true
      description: Error type
      type: string
      enum:
        - DOCUMENT_CONVERSION_ERROR
        - CALL_ERROR
        - FAX_ERROR
        - FATAL_ERROR
        - GENERAL_ERROR
      x-enumDescriptions:
        DOCUMENT_CONVERSION_ERROR: A documentation conversion error.
        CALL_ERROR: A call error.
        FAX_ERROR: A fax error.
        FATAL_ERROR: A fatal error.
        GENERAL_ERROR: A general error.
    FaxErrors:
      type: object
      anyOf:
        - $ref: '#/components/schemas/DocumentConversionError'
        - $ref: '#/components/schemas/CallError'
        - $ref: '#/components/schemas/FaxError'
      discriminator:
        propertyName: errorType
        mapping:
          DOCUMENT_CONVERSION_ERROR: '#/components/schemas/DocumentConversionError'
          CALL_ERROR: '#/components/schemas/CallError'
          FAX_ERROR: '#/components/schemas/FaxError'
      examples:
        - DocumentConversionError: null
          summary: Document conversion error
          value:
            errorType: DOCUMENT_CONVERSION_ERROR
            errorMessage: >-
              There was a problem in converting and merging files to the output
              file format. Contact support.
            errorCode: 4
        - CallError: null
          summary: Call error
          value:
            errorType: CALL_ERROR
            errorMessage: Busy
            errorCode: 17
        - FaxError: null
          summary: Fax error
          value:
            errorType: FAX_ERROR
            errorMessage: Could not establish a connection to the fax server.
            errorCode: 6
    FaxError:
      type: object
      description: A problem occurred during the fax communication process.
      properties:
        errorType:
          description: Type of error for the fax
          type: string
          enum:
            - FAX_ERROR
          x-enumDescriptions:
            FAX_ERROR: An error related to the fax.
          example: FAX_ERROR
        errorMessage:
          description: A developer-facing error message
          type: string
          example: Could not establish a connection to the fax server.
        errorCode:
          type: integer
          description: The error code returned describing the error of the call
          enum:
            - 6
            - 7
            - 8
            - 10
            - 12
            - 13
            - 14
            - 18
            - 20
            - 21
            - 22
            - 25
            - 26
            - 28
            - 29
            - 31
            - 38
            - 40
            - 41
            - 44
            - 46
            - 48
            - 53
            - 60
            - 63
            - 68
            - 75
            - 76
            - 77
            - 79
            - 80
            - 82
            - 84
            - 113
            - 117
            - 119
            - 131
            - 132
            - 133
          x-enumDescriptions:
            '6': There was an error communicating with the far side.
            '7': Far end cannot receive at the size of image
            '8': No response after sending a page
            '10': Disconnected after permitted retries
            '12': Received no response to DCS or TCF
            '13': Timed out waiting for the first message
            '14': Timed out waiting for initial communication
            '18': Unexpected message received
            '20': The HDLC carrier did not stop in a timely manner
            '21': Received a DCN from remote after sending a page
            '22': Received bad response to DCS or training
            '25': Far end cannot receive at the resolution of the image
            '26': The remote fax machine failed to respond
            '28': Failed to train with any of the compatible modems
            '29': Invalid response after sending a page
            '31': Fax machine incompatibility
            '38': The remote fax machine hung up before receiving fax
            '40': Telephony error
            '41': Unexpected DCN while waiting for DCS or DIS
            '44': Telephony Error
            '46': >-
              Insufficient funds to send fax and not able to auto recharge;
              There was a problem charging your credit card. Please check your
              payment information and try again.
            '48': No answer (The Receiving Machine May Be Out Of Paper)
            '53': Unexpected DCN after EOM or MPS sequence
            '60': Transmission error after page break
            '63': Fax protocol error
            '68': Far end is not compatible
            '75': Manually canceled by user
            '76': Canceled automatically because timeout exceeded
            '77': Timed out waiting for receiver ready (ECM mode)
            '79': Can't cancel the fax, it's already complete!
            '80': Received a DCN while waiting for a DIS
            '82': There was an error communicating with the far side
            '84': Unexpected command after page received
            '113': The file for this fax has been deleted or is not accessible.
            '117': No pages received
            '119': User requested simulated faxError
            '131': Incomplete transmission
            '132': No fax tone detected
            '133': Phone number is not permitted
    CallError:
      type: object
      description: >-
        There was a problem with the phone line. The call could not be placed.
        Many times you can just try again
      properties:
        errorType:
          description: Type of error for the Call
          type: string
          enum:
            - CALL_ERROR
          x-enumDescriptions:
            CALL_ERROR: An error related to the call.
          example: CALL_ERROR
        errorMessage:
          description: A developer-facing error message
          type: string
          example: Busy
        errorCode:
          type: integer
          description: The error code returned describing the error of the call.
          enum:
            - 11
            - 15
            - 16
            - 17
            - 19
            - 30
            - 32
            - 34
            - 43
            - 49
          x-enumDescriptions:
            '11': The call dropped prematurely
            '15': Congestion
            '16': Ring Timeout
            '17': Busy
            '19': Immediate Hangup
            '30': No answer from a fax machine.
            '32': Incompatible destination
            '34': Phone number not operational
            '43': Problem establishing connection
            '49': The destination phone number Is Not active
    DocumentConversionError:
      type: object
      description: >-
        Conversion errors usually occur when there is a problem with one of the
        files you posted.
      properties:
        errorType:
          description: Type of error for the Document conversion
          type: string
          enum:
            - DOCUMENT_CONVERSION_ERROR
          x-enumDescriptions:
            DOCUMENT_CONVERSION_ERROR: An error related to document conversion.
          example: DOCUMENT_CONVERSION_ERROR
        errorMessage:
          description: The error message
          type: string
          example: >-
            There was a problem in converting and merging files to the output
            file format. Contact support.
        errorCode:
          type: integer
          description: The error code returned during document conversion.
          enum:
            - 4
            - 54
            - 55
            - 57
            - 69
            - 122
            - 128
            - 129
            - 130
            - 133
          x-enumDescriptions:
            '4': >-
              There was a problem in converting and merging files to the output
              file format. Contact support.
            '54': Could not access the url you provided. {contentUrl}
            '55': The string_data URL you provided is invalid
            '57': There was a problem storing the file you provided.
            '69': There was a problem storing the file you provided.
            '122': User simulated Document Conversion Error
            '128': Could not determine mimetype for file.
            '129': Mimetype not supported.
            '130': 'Mimetype not supported: application/xml'
            '133': Failed to normalize PDF document
    NotFoundDetail:
      type: object
      description: The request was malformed on one or more fields.
      x-internal: >-
        https://github.com/googleapis/googleapis/blob/f79d6e85a9a6b913a5e9cb0067e846e7f087dbc8/google/rpc/error_details.proto#L169
      properties:
        type:
          type: string
          description: The request was malformed on one or more properties.
          readOnly: true
          example: NOT_FOUND
          default: BadRequest
    BadRequestDetail:
      type: object
      description: The request was malformed on one or more fields.
      x-internal: >-
        https://github.com/googleapis/googleapis/blob/f79d6e85a9a6b913a5e9cb0067e846e7f087dbc8/google/rpc/error_details.proto#L169
      properties:
        type:
          type: string
          description: The request was malformed on one or more properties.
          readOnly: true
          example: BadRequest
          default: BadRequest
        fieldViolations:
          description: The field violation(s).
          type: array
          items:
            type: object
            readOnly: true
            allOf:
              - $ref: '#/components/schemas/FieldViolation'
          example:
            - field: to
              description: Phone number was not in the expected format.
    FieldViolation:
      type: object
      properties:
        field:
          type: string
          readOnly: true
          description: Request field.
          example: to
        description:
          type: string
          readOnly: true
          description: Description of why the request field was considered invalid.
          example: Phone number was not in the expected format.
    ErrorInfo:
      description: |-
        Describes the cause of the error with structured details.
        Example of an error when trying to make a call to blocked destination:

             { "reason": "DESTINATION_BLOCKED"
               "domain": "VOICE"
               "metadata": {
                 "country": "Bermuda",
               }
             }
      type: object
      properties:
        type:
          type: string
          description: >-
            Describes the cause of the error with structured details.

            Example of an error when trying to make a call to blocked
            destination:


            ```
                { "reason": "DESTINATION_BLOCKED"
                  "domain": "VOICE"
                  "metadata": {
                    "country": "Bermuda",
                  }
                }
            ```
          default: ErrorInfo
          example: ErrorInfo
        reason:
          type: string
          description: >-
            The reason of the error. This is a constant value that identifies
            the

            proximate cause of the error. Error reasons are unique. Max 63
            characters and match
             /[A-Z0-9_]+/.
          maxLength: 63
        domain:
          type: string
          description: Domain for error, for voice its always sinch.voice
        metaData:
          description: >-
            Additional structured details about this error. key value pair of
            strings
          type: object
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: >-
        The `projectId` is a required parameter you must include when making any
        API calls. You can find your project ID on your [Build
        dashboard](https://dashboard.sinch.com).
      schema:
        type: string
        example: 3acb7ae1-cf3d-4112-ba5e-3a9d8c71cd47
    Id:
      in: path
      name: id
      required: true
      description: The ID of the fax.
      schema:
        $ref: '#/components/schemas/FaxId'
    Page:
      in: query
      name: page
      description: >-
        The page you want to retrieve returned from a previous List request, if
        any
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      description: >-
        The maximum number of items to return per request. The default is 100
        and the maximum is 1000. If you need to export larger amounts and
        pagination is not suitable for you can use the Export function in the
        dashboard.
      schema:
        type: integer
        maximum: 1000
        minimum: 1
    Labels:
      name: labels
      in: query
      schema:
        $ref: '#/components/schemas/Labels'
    Format:
      name: format
      in: query
      description: >-
        If you include this parameter, you can export the list of faxes as a
        .csv file. Default value is `csv`
      schema:
        type: string
        enum:
          - csv
        x-enumDescriptions:
          csv: This exports the list of faxes as a .csv file.
        example: csv
  securitySchemes:
    WebhookBasicAuth:
      type: http
      scheme: basic
      description: >-
        You can validate whether a webhook is genuine by providing credentials
        you set and will check on your server side along with the callback URL,
        as in this example:
        `https://username:password@www.YourWebhookWebsite.com`
    BasicAuth:
      type: http
      scheme: basic
      description: >-
        The user name and password is your keyId and key secret from the [Access
        keys sections](https://dashboard.sinch.com/settings/access-keys)
    OAuth2:
      type: oauth2
      description: >-
        The user name and password is your key id and key secret from the
        [Access keys sections](https://dashboard.sinch.com/settings/access-keys)
      flows:
        clientCredentials:
          tokenUrl: https://auth.sinch.com/oauth2/token
          scopes: {}
