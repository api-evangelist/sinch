          /v1/projects/{projectId}/us/brands/{brandId}/orders/{orderId}/verifyOtp
          to successfully authorize and finalize the process.
        US_10DLC_TCR_PRIVATE_BRAND_REGISTRATION: >-
          Simple brand registration with 10DLC for private companies to obtain
          the 10DLC channel in the US. This process does not include vetting.
          You will receive a TCR ID upon completion (approx. 1 minute). Provides
          lower throughput and a maximum of 3 numbers. Once completed, this
          process can be re-requested if any data needs to be modified (there
          are some fields not allowed for edition: legalCompanyName, entityType,
          federalTaxId and taxCountry). This process can be initiated again for
          revetting the brand, in case that critical information needs to be
          updated: entityType, legalCompanyName, federalTaxId or taxCountry. In
          this case, the brand will go through the same process as a new
          registration, with the same time of completion, but keeping the same
          TCR ID and the history of previous registrations.
        US_10DLC_TCR_PUBLIC_BRAND_REGISTRATION: >-
          Simple brand registration with 10DLC for public companies to obtain
          the 10DLC channel in the US. This process does not include vetting.
          You will receive a TCR ID upon completion (approx. 1 minutes).
          Provides lower throughput and a maximum of 3 numbers. Once completed,
          this process can be re-requested if any data needs to be modified
          (there are some fields not allowed for edition: legalCompanyName,
          entityType, federalTaxId and taxCountry). This process can be
          initiated again for revetting the brand, in case that critical
          information needs to be updated: entityType, legalCompanyName,
          federalTaxId or taxCountry. In this case, the brand will go through
          the same process as a new registration, with the same time of
          completion, but keeping the same TCR ID and the history of previous
          registrations.
        US_10DLC_TCR_PRIVATE_BRAND_UPDATE: >-
          Brand data update process with 10DLC for private companies that
          already have the 10DLC channel. This process is used to update any
          brand data that needs to be modified after a successful registration,
          except for critical information such as entityType, legalCompanyName,
          federalTaxId or taxCountry. Cost: free. You will receive a
          confirmation of the update upon completion (approx. 1 minute). This
          process does not affect the TCR ID, the throughput or the number of
          phone numbers allowed. Update process cannot be used after standard or
          enhanced vetting, as the brand needs to be revetted in case of any
          critical information update.
        US_10DLC_TCR_PUBLIC_BRAND_UPDATE: >-
          Brand data update process with 10DLC for public companies that already
          have the 10DLC channel. This process is used to update any brand data
          that needs to be modified after a successful registration, except for
          critical information such as entityType, legalCompanyName,
          federalTaxId or taxCountry. Cost: free. You will receive a
          confirmation of the update upon completion (approx. 1 minute). This
          process does not affect the TCR ID, the throughput or the number of
          phone numbers allowed. Update process cannot be used after standard or
          enhanced vetting, as the brand needs to be revetted in case of any
          critical information update.
        US_10DLC_TCR_PRIVATE_MOCK: >-
          A free-of-charge mock process for private companies to test the 10DLC
          integration. Successfully completing this process does not grant the
          10DLC channel but serves as a preliminary check to ensure that
          subsequent paid TCR registrations will be successful.
        US_10DLC_TCR_PUBLIC_MOCK: >-
          A free-of-charge mock process for public companies to test the 10DLC
          integration. Successfully completing this process does not grant the
          10DLC channel but serves as a preliminary check to ensure that
          subsequent paid TCR registrations will be successful.
        US_10DLC_TCR_PRIVATE_STANDARD_BRAND_REGISTRATION: >-
          Initiates a standard brand registration with 10DLC for a private
          company, which involves an automated review of compliance history,
          employee count, and other business metrics. The process, which
          typically takes 5-10 days, is used to verify the brand and assign a
          vetting score from 0-100 that determines the brand's throughput level
          with network carriers. A successful registration provides higher
          throughput and allows for unlimited campaigns and numbers. Once
          completed, this process can be re-requested if any data not included
          in US_TCR_PATCH_BRAND needs to be modified. Once completed, this
          process can be re-requested if any data needs to be modified (there
          are some fields not allowed for edition: legalCompanyName, entityType,
          federalTaxId and taxCountry)
        US_10DLC_TCR_PUBLIC_STANDARD_BRAND_REGISTRATION: >-
          Initiates a standard brand registration with 10DLC for a public
          company, which involves an automated review of compliance history,
          employee count, and other business metrics. The process, which
          typically takes 5-10 days, is used to verify the brand and assign a
          vetting score from 0-100 that determines the brand's throughput level
          with network carriers. A successful registration provides higher
          throughput and allows for unlimited campaigns and numbers. Once
          completed, this process can be re-requested if any data needs to be
          modified (there are some fields not allowed for edition:
          legalCompanyName, entityType, federalTaxId and taxCountry)
        US_10DLC_TCR_PRIVATE_ENHANCED_BRAND_REGISTRATION: >-
          Initiates an enhanced brand registration for a private company, which
          is recommended if you are dissatisfied with your Standard vet score
          and believe a more thorough review could yield a higher rating. This
          process is designed to improve the brand's vetting score and
          potentially achieve better throughput. Please note that this enhanced
          vet can only be ordered after a STANDARD registration is complete.
        US_10DLC_TCR_PUBLIC_ENHANCED_BRAND_REGISTRATION: >-
          Initiates an enhanced brand registration for a public company, which
          is recommended if you are dissatisfied with your Standard vet score
          and believe a more thorough review could yield a higher rating. This
          process is designed to improve the brand's vetting score and
          potentially achieve better throughput. Please note that this enhanced
          vet can only be ordered after a STANDARD registration is complete.
        US_RCS_TCR_PRIVATE_BRAND_REGISTRATION: >-
          US RCS brand registration process with RCS for private companies. This
          process is used to verify a private brand for RCS in the US. Upon
          successful completion, the RCS channel will be granted to the brand.
        US_RCS_TCR_PUBLIC_BRAND_REGISTRATION: >-
          US RCS brand registration process with RCS for public companies. This
          process is used to verify a public brand for RCS in the US. Upon
          successful completion, the RCS channel will be granted to the brand.
        US_RCS_TCR_UPDATE_ASSETS: >-
          US RCS asset update process with RCS. This process is used to update
          the brand assets required for RCS, such as logos or banners, after the
          brand has already been registered.
      type: string
      examples:
        - US_SC_REGISTRY
        - US_SC_GCH
        - US_10DLC_TCR_PRIVATE_BRAND_REGISTRATION
        - US_RCS_TCR_PRIVATE_BRAND_REGISTRATION
    CallbackConfigResponse:
      description: >-
        Response body for the GET Callback Configuration endpoint. The HMAC
        secret is masked — only the last 6 characters are shown.
      type: object
      properties:
        projectId:
          description: Project ID this callback configuration belongs to.
          type: string
          readOnly: true
        hmacSecretMask:
          description: >-
            Masked representation of the HMAC secret. Only the last 6 characters
            are visible

            (e.g. `••••••1b11ee`). To see the full secret, rotate it via

            `POST /v1/projects/{projectId}/callbackConfig/rotate` or set a new
            one via `PATCH`.
          type: string
          readOnly: true
          examples:
            - ••••••1b11ee
    CallbackConfigSecretResponse:
      description: >-
        Response body returned once after setting or rotating the HMAC secret.
        The full secret is

        included here and will not be returned again in plain text. Store it
        securely immediately.
      type: object
      properties:
        projectId:
          description: Project ID this callback configuration belongs to.
          type: string
          readOnly: true
        hmacSecret:
          description: >-
            The full HMAC secret for webhook signature verification. Returned
            only once — on creation or rotation.
          type: string
          format: password
          readOnly: true
          examples:
            - d1c7ccbf-919d-462f-8587-dec95a1b11ee
    CallbackConfigUpdateBody:
      description: Request body for the Update Callback Configuration endpoint.
      properties:
        hmacSecret:
          description: The HMAC secret to be updated for the specified project
          examples:
            - d1c7ccbf-919d-462f-8587-dec95a1b11ee
          type: string
          format: password
      type: object
    RestError:
      description: >-
        Standard error response body for the Sinch Compliance API. It follows
        the RFC 7807 specification for problem details. The body contains either
        an `errors` list with structured field-level details or a `detail` field
        with a plain text explanation.
      type: object
      required:
        - type
        - title
      properties:
        type:
          description: >-
            A URI reference that identifies the problem type. This URI reference
            should provide a human-readable explanation of the problem type when
            dereferenced.
          type: string
          format: uri
          examples:
            - https://developers.sinch.com/docs/errors/registry/validation-error
        title:
          description: >-
            A short, human-readable summary of the problem type. It should not
            change from occurrence to occurrence of the problem, except for
            localization purposes.
          type: string
          examples:
            - Validation Error
      oneOf:
        - description: >-
            Response with a list of structured error details, each pointing to a
            specific field.
          properties:
            errors:
              description: >-
                Detailed information about the error. This field can contain
                multiple error details to provide more context about the error
                that occurred.
              type: array
              items:
                $ref: '#/components/schemas/InternalRestError'
        - description: Response with a plain text explanation of the error.
          properties:
            detail:
              description: A human-readable explanation of the error that occurred.
              type: string
              examples:
                - Project not found
    InternalRestError:
      description: >-
        Detailed information about a specific error that occurred during the
        processing of a request. This is used in the `errors` field of the
        `RestError` schema to provide more granular information about the error.
      properties:
        pointer:
          description: JSON pointer to the field that caused the error, following RFC 6901.
          type: string
          examples:
            - /brandName
            - /entityType
        detail:
          description: >-
            A human-readable explanation specific to this occurrence of the
            problem. Like title, this field is not intended for end users, but
            rather for developers to understand the details of the error that
            occurred.
          type: string
          examples:
            - Brand Name already exists for this brand type
      type: object
  responses:
    Unauthorized:
      description: 'UNAUTHENTICATED: Missing or invalid authentication credentials.'
      headers:
        WWW-Authenticate:
          description: Authentication challenge per RFC 7235.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RestError'
    Forbidden:
      description: >-
        PERMISSION_DENIED: The authenticated user does not have permission to
        perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RestError'
    TooManyRequests:
      description: >-
        RESOURCE_EXHAUSTED: Too many requests. The client has exceeded the rate
        limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RestError'
  securitySchemes:
    OAuth2:
      description: >-
        The username and password are your Key ID and Key Secret from the Access
        keys section in the Sinch Customer Dashboard. Exchange these for a
        bearer token (access token).
      flows:
        clientCredentials:
          scopes:
            read: read
            write: write
          tokenUrl: https://auth.sinch.com/oauth2/token
      type: oauth2
    hmacAuth:
      type: apiKey
      in: header
      name: X-Sinch-Signature
      description: >-
        HMAC-SHA256 signature used to authenticate webhook deliveries. The
        signature is computed over the request body using the project's HMAC
        secret and sent in the X-Sinch-Signature header. Please refer to the
        Brand Callback endpoints for more information.
servers:
  - description: Production server. Data processed and stored within Europe.
    url: https://compliance.api.sinch.com
tags:
  - description: Create and manage Customer Brands
    name: brands
    x-displayName: Brands
  - description: Create and manage Customer Brand Orders
    name: orders
    x-displayName: Orders
  - description: Brand Webhook events.
    name: brand-webhooks-delivery
    x-displayName: Brand Webhooks
  - description: >-
      You can set up callback URLs to receive event notifications when your
      brand status is updated.

      When delivering events the order is not guaranteed (for example, a failed
      event scheduled for retry will not block other events that were queued).

      The client's callback handler must implement the state machine that can
      decide what to do with unexpected events, for example, "old" events or
      invalid state transitions. In these cases the handler could use the API to
      GET the latest state for the resource.

      The callback handler is expected to "ingest" the event and respond with
      200 OK. The domain-specific business logic and processes should be
      executed outside of the callback request, as internal asynchronous jobs.

      An HMAC encrypted secret is used for hashing the payload and sending the
      hashed String via the X-Sinch-Signature header - that you can use to
      validate that an incoming request is secure. Hmac secret value can be
      checked with GET endpoint, and it can be updated with PUT endpoint
    name: brand-callbacks
    x-displayName: Brand Callbacks
x-explorer-enabled: false
