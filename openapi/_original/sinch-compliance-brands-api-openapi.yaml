    AttachmentType:
      description: Attachment type
      enum:
        - COMPANY_BANNER
        - COMPANY_LOGO
      x-enum-varnames:
        - COMPANY_BANNER
        - COMPANY_LOGO
      x-enumDescriptions:
        COMPANY_BANNER: Banner attachment
        COMPANY_LOGO: Logo attachment
      examples:
        - COMPANY_BANNER
      type: string
    BrandStatus:
      description: >-
        Brand status represents the current state of the brand in the system. It
        is determined by the status of the brand orders and the channels
        assigned to the brand. The status can be DRAFT when the brand is being
        created or updated, ACTIVE when the brand has at least one channel
        assigned and it is ready to be used, or ARCHIVED when the brand has been
        cancelled and it can not be used anymore.
      enum:
        - DRAFT
        - ACTIVE
        - ARCHIVED
      x-enumDescriptions:
        DRAFT: >-
          The brand is in draft status. It can be updated and submitted for
          validation.
        ACTIVE: The brand has at least one channel assigned.
        ARCHIVED: >-
          The brand is archived after a cancellation. It can not be updated or
          submitted for validation.
      type: string
      examples:
        - ACTIVE
        - DRAFT
    BrandOrderStatus:
      description: >-
        Brand order status represents the current state of the brand order in
        the system. When a brand order is created, it is in NEW status. After
        that, it can be moved to PENDING status when the validation process
        starts, then it can be moved to REJECTED or INCOMPLETE if the validation
        process fails, or to COMPLETED if the validation process is successful.
        When a brand order is in INCOMPLETE status, customer can update the
        brand/brand order. Updating the brand order moves the brand order to
        PENDING_REVIEW state, what means that is waiting for another review
        after the customer changes. Finally, a brand order can be moved to
        ARCHIVED status after a cancellation.
      enum:
        - NEW
        - PENDING
        - PENDING_REVIEW
        - REJECTED
        - INCOMPLETE
        - COMPLETED
        - ARCHIVED
      x-enumDescriptions:
        NEW: A new brand order created, not processed yet.
        PENDING: The brand order info is under review.
        PENDING_REVIEW: >-
          When a brand order is in incomplete status, customer can update the
          brand/brand order. Updating the brand order moves the brand order to
          PENDING_REVIEW state, what means that is waiting for another review
          after the customer changes.
        REJECTED: The brand order has been rejected.
        INCOMPLETE: >-
          The brand order is incomplete. The customer can update the brand/brand
          order to complete it.
        COMPLETED: >-
          The brand order validation has been completed and the brand order is
          approved for integration against the channel specification.
        ARCHIVED: >-
          The brand order is archived after a cancellation. It can not be
          updated or submitted for validation.
      type: string
      examples:
        - INCOMPLETE
    Channel:
      description: >-
        Channel represents the different channels that can be assigned to a
        brand after completing a brand order. Each channel has different
        requirements and it is assigned after completing a specific brand order
        process.
      enum:
        - RCS
        - SHORT_CODE
        - TENDLC
      x-enumDescriptions:
        RCS: RCS Channel enables RCS traffic and it is provided by RCS.
        SHORT_CODE: >-
          The SHORT_CODE Channel enables Short Code traffic and it is provided
          by the US Short Code Registry.
        TENDLC: >-
          Ten Digit Long Code (10DLC) channel enables Long Number traffic and it
          is provided by 10DLC.
      type: string
      examples:
        - RCS
        - SHORT_CODE
    BrandOrderRequestMetadata:
      description: >-
        These are the different processes the customers can request to add
        different channels to the Brand.


        **Note:** US_SC_REGISTRY is excluded — it is a legacy read-only process
        and cannot be used for new orders. It may appear in existing brand order
        responses.
      enum:
        - US_SC_GCH
        - US_SC_GCH_CONTENT_PROVIDER
        - US_10DLC_TCR_PRIVATE_BRAND_REGISTRATION
        - US_10DLC_TCR_PUBLIC_BRAND_REGISTRATION
        - US_10DLC_TCR_PRIVATE_BRAND_UPDATE
        - US_10DLC_TCR_PUBLIC_BRAND_UPDATE
        - US_10DLC_TCR_PRIVATE_MOCK
        - US_10DLC_TCR_PUBLIC_MOCK
        - US_10DLC_TCR_SOLE_PROPRIETOR
        - US_10DLC_TCR_PRIVATE_STANDARD_BRAND_REGISTRATION
        - US_10DLC_TCR_PRIVATE_ENHANCED_BRAND_REGISTRATION
        - US_10DLC_TCR_PUBLIC_STANDARD_BRAND_REGISTRATION
        - US_10DLC_TCR_PUBLIC_ENHANCED_BRAND_REGISTRATION
        - US_RCS_TCR_PRIVATE_BRAND_REGISTRATION
        - US_RCS_TCR_PUBLIC_BRAND_REGISTRATION
        - US_RCS_TCR_UPDATE_ASSETS
      x-enumDescriptions:
        US_SC_GCH: >-
          Unified US Short Code verification process via the US Short Code
          Registry. The specific process to be applied is automatically
          determined by the brand's programType field: Standard → standard
          process, Government → government process, Charitable Organization →
          charity process, Political → political process. This process is free
          of charge and, upon successful completion, the SHORT_CODE channel will
          be granted to the brand.
        US_SC_GCH_CONTENT_PROVIDER: >-
          US Short Code verification process for Content Provider entities. This
          process internally uses the US Short Code Registry and is free of
          charge. Upon successful completion, the SHORT_CODE channel will be
          granted to the content provider.
        US_10DLC_TCR_SOLE_PROPRIETOR: >-
          To register as a Sole Proprietor for 10-Digit Long Code (10DLC)
          messaging via 10DLC, you can complete the registration process without
          needing an Employer Identification Number (EIN). Upon initiating the
          registration, a One-Time Password (OTP) will be automatically sent to
          the provided mobile number for identity verification, which you must
          subsequently submit using the endpoint
          /v1/projects/{projectId}/us/brands/{brandId}/orders/{orderId}/verifyOtp
          to successfully authorize and finalize the process.
        US_10DLC_TCR_PRIVATE_BRAND_REGISTRATION: >-
          Simple brand registration with 10DLC for private companies to obtain
          the 10DLC channel in the US. This process does not include vetting.
          You will receive a TCR ID upon completion (approx. 1 minute). Provides
          lower throughput and a maximum of 3 numbers. Once completed, this
          process can be re-requested if any data needs to be modified (there
          are some fields not allowed for edition: legalCompanyName, entityType,
          federalTaxId and taxCountry). This process can be initiated again for
          revetting the brand, in case that critical information needs to be
          updated: entityType, legalCompanyName, federalTaxId or taxCountry. In
          this case, the brand will go through the same process as a new
          registration, with the same time of completion, but keeping the same
          TCR ID and the history of previous registrations.
        US_10DLC_TCR_PUBLIC_BRAND_REGISTRATION: >-
          Simple brand registration with 10DLC for public companies to obtain
          the 10DLC channel in the US. This process does not include vetting.
          You will receive a TCR ID upon completion (approx. 1 minutes).
          Provides lower throughput and a maximum of 3 numbers. Once completed,
          this process can be re-requested if any data needs to be modified
          (there are some fields not allowed for edition: legalCompanyName,
          entityType, federalTaxId and taxCountry). This process can be
          initiated again for revetting the brand, in case that critical
          information needs to be updated: entityType, legalCompanyName,
          federalTaxId or taxCountry. In this case, the brand will go through
          the same process as a new registration, with the same time of
          completion, but keeping the same TCR ID and the history of previous
          registrations.
        US_10DLC_TCR_PRIVATE_BRAND_UPDATE: >-
          Brand data update process with 10DLC for private companies that
          already have the 10DLC channel. This process is used to update any
          brand data that needs to be modified after a successful registration,
          except for critical information such as entityType, legalCompanyName,
          federalTaxId or taxCountry. Cost: free. You will receive a
          confirmation of the update upon completion (approx. 1 minute). This
          process does not affect the TCR ID, the throughput or the number of
          phone numbers allowed. Update process cannot be used after standard or
          enhanced vetting, as the brand needs to be revetted in case of any
          critical information update.
        US_10DLC_TCR_PUBLIC_BRAND_UPDATE: >-
          Brand data update process with 10DLC for public companies that already
          have the 10DLC channel. This process is used to update any brand data
          that needs to be modified after a successful registration, except for
          critical information such as entityType, legalCompanyName,
          federalTaxId or taxCountry. Cost: free. You will receive a
          confirmation of the update upon completion (approx. 1 minute). This
          process does not affect the TCR ID, the throughput or the number of
          phone numbers allowed. Update process cannot be used after standard or
          enhanced vetting, as the brand needs to be revetted in case of any
          critical information update.
        US_10DLC_TCR_PRIVATE_MOCK: >-
          A free-of-charge mock process for private companies to test the 10DLC
          integration. Successfully completing this process does not grant the
          10DLC channel but serves as a preliminary check to ensure that
          subsequent paid TCR registrations will be successful.
        US_10DLC_TCR_PUBLIC_MOCK: >-
          A free-of-charge mock process for public companies to test the 10DLC
          integration. Successfully completing this process does not grant the
          10DLC channel but serves as a preliminary check to ensure that
          subsequent paid TCR registrations will be successful.
        US_10DLC_TCR_PRIVATE_STANDARD_BRAND_REGISTRATION: >-
          Initiates a standard brand registration with 10DLC for a private
          company, which involves an automated review of compliance history,
          employee count, and other business metrics. The process, which
          typically takes 5-10 days, is used to verify the brand and assign a
          vetting score from 0-100 that determines the brand's throughput level
          with network carriers. A successful registration provides higher
          throughput and allows for unlimited campaigns and numbers. Once
          completed, this process can be re-requested if any data not included
          in US_TCR_PATCH_BRAND needs to be modified. Once completed, this
          process can be re-requested if any data needs to be modified (there
          are some fields not allowed for edition: legalCompanyName, entityType,
          federalTaxId and taxCountry)
        US_10DLC_TCR_PUBLIC_STANDARD_BRAND_REGISTRATION: >-
          Initiates a standard brand registration with 10DLC for a public
          company, which involves an automated review of compliance history,
          employee count, and other business metrics. The process, which
          typically takes 5-10 days, is used to verify the brand and assign a
          vetting score from 0-100 that determines the brand's throughput level
          with network carriers. A successful registration provides higher
          throughput and allows for unlimited campaigns and numbers. Once
          completed, this process can be re-requested if any data needs to be
          modified (there are some fields not allowed for edition:
          legalCompanyName, entityType, federalTaxId and taxCountry)
        US_10DLC_TCR_PRIVATE_ENHANCED_BRAND_REGISTRATION: >-
          Initiates an enhanced brand registration for a private company, which
          is recommended if you are dissatisfied with your Standard vet score
          and believe a more thorough review could yield a higher rating. This
          process is designed to improve the brand's vetting score and
          potentially achieve better throughput. Please note that this enhanced
          vet can only be ordered after a STANDARD registration is complete.
        US_10DLC_TCR_PUBLIC_ENHANCED_BRAND_REGISTRATION: >-
          Initiates an enhanced brand registration for a public company, which
          is recommended if you are dissatisfied with your Standard vet score
          and believe a more thorough review could yield a higher rating. This
          process is designed to improve the brand's vetting score and
          potentially achieve better throughput. Please note that this enhanced
          vet can only be ordered after a STANDARD registration is complete.
        US_RCS_TCR_PRIVATE_BRAND_REGISTRATION: >-
          US RCS brand registration process with RCS for private companies. This
          process is used to verify a private brand for RCS in the US. Upon
          successful completion, the RCS channel will be granted to the brand.
        US_RCS_TCR_PUBLIC_BRAND_REGISTRATION: >-
          US RCS brand registration process with RCS for public companies. This
          process is used to verify a public brand for RCS in the US. Upon
          successful completion, the RCS channel will be granted to the brand.
        US_RCS_TCR_UPDATE_ASSETS: >-
          US RCS asset update process with RCS. This process is used to update
          the brand assets required for RCS, such as logos or banners, after the
          brand has already been registered.
      type: string
      examples:
        - US_SC_GCH
        - US_10DLC_TCR_PRIVATE_BRAND_REGISTRATION
        - US_RCS_TCR_PRIVATE_BRAND_REGISTRATION
    BrandOrderMetadata:
      description: >-
        These are the different processes the customers can request to add
