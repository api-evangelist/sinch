            check the type of the order without having to call the Get Brand
            Order endpoint.
          $ref: '#/components/schemas/BrandOrderRequestMetadata'
        callbackUrl:
          description: >-
            The URL to receive the order status update callback. The URL must be
            a valid URL and must be reachable from Sinch.
          examples:
            - https://example.com/callback
          type: string
          format: uri
    BrandOrderOtpRequest:
      description: Request to send an OTP for Sole Proprietor orders.
      type: object
      required:
        - otp
      properties:
        otp:
          description: OTP code received in the mobilePhoneNumber.
          examples:
            - 27FUY2
          type: string
    BrandOrder:
      description: A brand order created for a brand and a specific process metadata.
      type: object
      properties:
        brandOrderId:
          description: The unique identifier for the brand order.
          examples:
            - '212421442412'
          type: string
          readOnly: true
        brandId:
          description: Brand ID this Order belongs to.
          examples:
            - '3242343243243'
          type: string
          readOnly: true
        status:
          description: >-
            Brand order status represents the current state of the brand order
            in the system. When a brand order is created, it is in NEW status.
            After that, it can be moved to PENDING status when the validation
            process starts, then it can be moved to REJECTED or INCOMPLETE if
            the validation process fails, or to COMPLETED if the validation
            process is successful. When a brand order is in INCOMPLETE status,
            customer can update the brand/brand order. Updating the brand order
            moves the brand order to PENDING_REVIEW state, what means that is
            waiting for another review after the customer changes. Finally, a
            brand order can be moved to ARCHIVED status after a cancellation.
          $ref: '#/components/schemas/BrandOrderStatus'
          readOnly: true
        metadataName:
          description: >-
            Metadata name of the brand order, which identifies the type of the
            order and the process it follows. This field is useful to quickly
            check the type of the order without having to call the Get Brand
            Order endpoint.
          $ref: '#/components/schemas/BrandOrderMetadata'
          readOnly: true
        logs:
          description: Detailed history of the status changes this brand went through
          items:
            $ref: '#/components/schemas/BrandOrderLog'
          type: array
          readOnly: true
        channels:
          description: Channels available for this Brand Order
          items:
            $ref: '#/components/schemas/Channel'
          type: array
          readOnly: true
        thirdPartyMetadata:
          description: Third party metadata available for this Brand Order
          items:
            $ref: '#/components/schemas/ThirdPartyElement'
          type: array
          readOnly: true
        pricing:
          description: >-
            Includes details of the fee associated with the process to be
            carried out. For more information about pricing, you may consult
            your Account Manager or the Sinch Customer Dashboard.
          $ref: '#/components/schemas/Money'
          readOnly: true
        callbackUrl:
          description: >-
            The URL to receive the order status update callback. The URL must be
            a valid URL and must be reachable from Sinch.
          examples:
            - https://example.com/callback
          type: string
          format: uri
        createTime:
          description: Create time of the request. ISO date time format in UTC.
          examples:
            - '2021-11-03T14:30:03Z'
          type: string
          readOnly: true
          format: date-time
        updateTime:
          description: Update time of the request. ISO date time format in UTC.
          examples:
            - '2021-11-03T14:30:03Z'
          type: string
          readOnly: true
          format: date-time
    CloudEventBase:
      description: >-
        Base fields required by the CloudEvents spec v1.0
        (https://cloudevents.io). All Sinch webhook payloads conform to this
        structure.
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
      properties:
        specversion:
          description: >-
            The version of the CloudEvents specification which the event uses.
            Always "1.0".
          type: string
          enum:
            - '1.0'
          x-enumDescriptions:
            '1.0': CloudEvents specification version 1.0.
          examples:
            - '1.0'
          readOnly: true
        id:
          description: >-
            Unique identifier for the event within the scope of the source.
            Clients MUST treat events with the same source+id as duplicates.
          type: string
          examples:
            - ee34ccbf-919d-462f-8587-dec95a1b11ee
          readOnly: true
        source:
          description: >-
            URI-reference identifying the context in which the event occurred.
            Combined with id, this MUST be globally unique per event.
          type: string
          format: uri
          examples:
            - >-
              https://compliance.api.sinch.com/v1/projects/us/brand/212421442412/orders/dec95a1b11b0
          readOnly: true
        type:
          description: >-
            Reverse-DNS-prefixed event type string. The last component
            identifies the event version (e.g.
            com.sinch.registrations.brand.order.v1.BrandOrderStatusUpdate).
          type: string
          examples:
            - com.sinch.registrations.brand.order.v1.BrandOrderStatusUpdate
          readOnly: true
        time:
          description: >-
            Timestamp of when the event was produced, in RFC-3339 format with
            timezone.
          type: string
          format: date-time
          examples:
            - '2023-10-01T12:00:00Z'
          readOnly: true
    BrandOrderEventData:
      description: >-
        Business payload carried in the `data` property of a brand order
        CloudEvent. Contains the brand order status update details that
        triggered the event.
      type: object
      properties:
        projectId:
          description: The ID of the project to which the event belongs.
          examples:
            - aad4ccbf-919d-462f-8587-dec95a1b11b0
          type: string
          readOnly: true
        resourceId:
          description: Corresponds to the order id the event belongs to.
          examples:
            - aad4ccbf-919d-462f-8587-dec953242342
          type: string
          readOnly: true
        resourceType:
          description: The brand order type.
          $ref: '#/components/schemas/BrandOrderMetadata'
        status:
          description: >-
            Status of the brand order after the update that triggered the event.
            This field is useful to quickly check the status of the order
            without having to call the Get Brand Order endpoint.
          $ref: '#/components/schemas/BrandOrderStatus'
        comments:
          description: >-
            Comments related to the brand order status update. For instance, an
            incomplete brand order status update can include the reason why the
            brand order is incomplete, or the fields that must be updated.
          examples:
            - Brand Order is incomplete. Please update the address field.
          type: string
          readOnly: true
    CallbackBrandOrderStatusUpdatedBody:
      description: >-
        CloudEvents v1.0 payload delivered by Sinch when a brand order status
        changes. The envelope follows the CloudEvents structured content mode
        with `Content-Type: application/json`.


        The `type` field uses the reverse-DNS prefix
        `com.sinch.registrations.brand.order.v1` and the event version is the
        last component. The `data` property carries the brand-order-specific
        payload.
      type: object
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          properties:
            data:
              description: >-
                Brand order event payload. Contains the details of the brand
                order status update that triggered the event.
              allOf:
                - $ref: '#/components/schemas/BrandOrderEventData'
    Money:
