        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'NOT_FOUND: The project id introduced does not exist.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RestError'
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
      security:
        - OAuth2:
            - write
      summary: Rotate the HMAC secret for webhook signing.
      tags:
        - brand-callbacks
components:
  schemas:
    BrandProperties:
      description: Writable properties shared across brand request and response schemas.
      type: object
      properties:
        displayName:
          description: >-
            The name of the brand. DisplayName must be unique per projectId and
            marketCode (US)
          examples:
            - My End Customer Brand Name
          type: string
        legalCompanyName:
          type: string
          description: Legal company name. Required for all product verification.
          examples:
            - Alpha Adventures Corp.
        dba:
          type: string
          description: >-
            Doing Business As. Optional for Short Code verification (not
            necessary for RCS/10DLC)
          examples:
            - Alpha Adventures
        entityType:
          type: string
          enum:
            - CORPORATION
            - LLC
            - PARTNERSHIP
            - S_CORPORATION
          x-enumDescriptions:
            CORPORATION: >-
              A standard corporation (often a C Corp), a legal entity that is
              separate from its owners (shareholders). Choose this unless you
              are specifically registered as an S Corp.
            LLC: >-
              Limited Liability Company. A business structure that combines the
              pass-through taxation of a partnership or sole proprietorship with
              the limited liability of a corporation.
            PARTNERSHIP: >-
              A business owned and operated by two or more individuals or
              entities. Includes various types like General Partnerships (GP)
              and Limited Partnerships (LP).
            S_CORPORATION: >-
              A special type of corporation that passes corporate income,
              losses, deductions, and credits through to its shareholders for
              federal tax purposes.
          description: >-
            Specifies the legal structure of the business or organization being
            registered. This is a critical field that affects compliance
            requirements, verification processes, and the availability of
            certain products. Required for all product verification.
        verticalType:
          type: string
          enum:
            - PROFESSIONAL
            - REAL_ESTATE
            - HEALTHCARE
            - HUMAN_RESOURCES
            - ENERGY
            - ENTERTAINMENT
            - RETAIL
            - TRANSPORTATION
            - AGRICULTURE
            - INSURANCE
            - POSTAL
            - EDUCATION
            - HOSPITALITY
            - FINANCIAL
            - POLITICAL
            - GAMBLING
            - LEGAL
            - CONSTRUCTION
            - NGO
            - MANUFACTURING
            - GOVERNMENT
            - TECHNOLOGY
            - COMMUNICATION
          x-enumDescriptions:
            PROFESSIONAL: >-
              Professional services firms such as law, accounting, consulting,
              staffing, and financial advisory.
            REAL_ESTATE: >-
              Businesses involved in buying, selling, renting, or managing
              residential or commercial real estate.
            HEALTHCARE: >-
              Hospitals, clinics, pharmacies, medical device manufacturers, and
              other health services providers.
            HUMAN_RESOURCES: >-
              HR software, staffing agencies, payroll processors, and workforce
              management services.
            ENERGY: >-
              Utilities, oil and gas companies, renewable energy producers, and
              energy services providers.
            ENTERTAINMENT: >-
              Media, gaming, live events, streaming platforms, and entertainment
              content producers.
            RETAIL: >-
              Brick-and-mortar or e-commerce retailers selling goods directly to
              consumers.
            TRANSPORTATION: >-
              Logistics, freight carriers, ride-sharing services, airlines, and
              other transport providers.
            AGRICULTURE: >-
              Farming, agribusiness, food production, and agricultural
              technology companies.
            INSURANCE: >-
              Property, casualty, life, health, and specialty insurance carriers
              and brokers.
            POSTAL: Postal services, courier companies, and parcel delivery providers.
            EDUCATION: >-
              Schools, universities, e-learning platforms, tutoring services,
              and educational content providers.
            HOSPITALITY: >-
              Hotels, restaurants, travel agencies, and other hospitality and
              tourism businesses.
            FINANCIAL: >-
              Banks, credit unions, payment processors, investment firms, and
              other financial services.
            POLITICAL: >-
              Political parties, campaigns, PACs, and other organizations
              engaged in political messaging.
            GAMBLING: >-
              Casinos, online betting platforms, lottery operators, and other
              gaming and wagering services.
            LEGAL: >-
              Law firms, legal technology providers, and other organizations
              delivering legal services.
            CONSTRUCTION: >-
              General contractors, sub-contractors, engineering firms, and
              building materials suppliers.
            NGO: >-
              Non-governmental and non-profit organizations with a charitable or
              humanitarian mission.
            MANUFACTURING: >-
              Factories, industrial producers, and companies that fabricate or
              assemble physical goods.
            GOVERNMENT: >-
              Federal, state, provincial, or local government agencies and
              public sector entities.
            TECHNOLOGY: >-
              Software companies, hardware makers, IT services firms, and
              technology platform providers.
            COMMUNICATION: >-
              Telecommunications carriers, internet service providers, and
              messaging platform operators.
          description: It is required for 10DLC, RCS
        programType:
          type: string
          enum:
            - STANDARD
            - GOVERNMENT
            - CHARITY
            - POLITICAL
          x-enumDescriptions:
            STANDARD: >-
              A standard commercial program used by businesses for general
              messaging purposes, including marketing, customer service, and
              transactional notifications.
            GOVERNMENT: >-
              A program operated by a federal, state, provincial, or local
              government entity or agency. Used for public service
              announcements, emergency alerts, and official government
              communications.
            CHARITY: >-
              A program operated by a non-profit or charitable organization,
              typically a 501(c) entity, used for fundraising, donor outreach,
              and mission-related communications.
            POLITICAL: >-
              A program used for political messaging, including campaigns, voter
              outreach, and political action committees (PACs). Subject to
              specific regulatory and compliance requirements.
          description: >-
            Specifies the type of messaging program associated with the brand.
            This field helps classify the intended use case and may affect
            compliance requirements and carrier routing.
        registrationCountry:
          type: string
          description: >-
            Country of registration, 2 letters country ISO Code. Required for
            Short Code product verification.
          examples:
            - US
            - CA
        registrationState:
          type: string
          description: State of registration. Required for Short Code product verification.
          examples:
            - California
            - Nebraska
        stockMarketSymbol:
          type: string
          description: >-
            Stock market symbol. Optional for all product verification
            processes.
          examples:
            - SINCH
        exchange:
          type: string
          description: Where the stock market is set. Optional for 10DLC and RCS.
          examples:
            - NASDAQ
            - AMEX
        website:
          type: string
          description: >-
            Company website. Required for all product verification processes. It
            must have valid url format.
          examples:
            - https://www.sinch.com
        companyEmail:
          type: string
          description: >-
            Company email account. Required for 10DLC, RCS. It must have valid
            email format. Contains PII Data.
          examples:
            - john.doe@sinch.com
        estimatedAnnualRevenue:
          type: string
          description: Optional for Short Code product verification.
          examples:
            - 100K-1M USD
        country:
          type: string
          description: >-
            Country of brand address, 2 letters country ISO Code. Required for
            all product verification processes.
          examples:
            - US
            - CA
        street:
          type: string
          description: >-
            brand street address. Required for all product verification
            processes. Contains PII Data.
          examples:
            - 129 MacDougal Street, Manhattan
        street2:
          type: string
          description: >-
            brand street 2 address. Optional for Short Code product
            verification. Contains PII Data.
          examples:
            - D, 7th floor
        city:
          type: string
          description: >-
            brand city address. Required for all product verification processes.
            Contains PII Data.
          examples:
            - New York
        state:
          type: string
          description: >-
            brand state address. Required for all product verification
            processes. Contains PII Data.
          examples:
            - New York
        stateCode:
          type: string
          description: >-
            brand state code address. Required for Short Code product
            verification. Contains PII Data.
          examples:
            - NY
        zip:
          type: string
          description: >-
            brand zip code address. Required for all product verification
            processes. Contains PII Data.
          examples:
            - '10012'
        taxCountry:
          type: string
          description: Tax country, 2 letters country ISO Code. Required for 10DLC, RCS.
          examples:
            - US
        federalTaxId:
          type: string
          description: >-
            If US, EIN must be provided. If not, VAT ID. Required for all
            product verification processes.
          examples:
            - '123456789'
        duns:
          type: string
          description: Optional for all product verification processes.
          examples:
            - '123456789'
        giin:
          type: string
          description: Optional for all product verification processes.
          examples:
            - ABC9EF.A23FF.US.724
        lei:
          type: string
          description: Optional for all product verification processes.
          examples:
            - 549300L4R7HSB20U5D88
        firstName:
          type: string
          description: Required for Short Code product verification. Contains PII Data.
          examples:
            - John
        lastName:
          type: string
          description: Required for Short Code product verification. Contains PII Data.
          examples:
            - Doe
        phoneNumber:
          type: string
          description: >-
            Required for Short Code product verification. Contains PII Data.
            Must be in E.164 format (e.g. +19176393200).
          examples:
            - '+19176393200'
        phoneNumberExtension:
          type: string
          description: Optional for Short Code product verification
          examples:
            - '343'
        mobilePhoneNumber:
          type: string
          description: >-
            Required for sending OTP request in 10DLC Sole Proprietor
            registration process. It must be a US/CA number.
          examples:
            - '+12015550143'
        contactEmail:
          type: string
          description: >-
            It is required for all product verification processes. It must have
            valid email format. Contains PII Data.
          examples:
            - john.doe@sinch.com
        politicalToken:
          type: string
          format: password
          description: >-
            A required authorization token for political campaigns sending
            messages in the US. This token is issued by Campaign Verify and
            serves as a credential to verify the legitimacy of a political
            committee (e.g., candidate, party, or PAC). Mandatory for Short Code
            verification when Political program type.
          examples:
            - cv_a1b2c3d4e5f67890a1b2c3d4e5f67890
        politicalType:
          type: string
          description: >-
            The classification of the political campaign. This is crucial for
            determining the specific compliance requirements that apply.
            Mandatory for Short Code verification when Political program type.
          enum:
            - FEDERAL
            - LOCAL
            - TRIBAL
            - STATE
            - OTHER
          x-enumDescriptions:
            FEDERAL: For political campaigns at the national or federal level.
            LOCAL: For political campaigns at the city, county, or municipal level.
            STATE: >-
              For political campaigns at the state, provincial, or regional
              level.
            TRIBAL: For tribal political campaigns.
            OTHER: For any other type of political campaigns not listed above.
        politicalUrl:
          type: string
          description: >-
            A URL or other reference number that links to official political
            filing records. This information serves as verifiable proof of the
            campaign's registration with a relevant government body (like the
            FEC in the US). Mandatory for Short Code verification when Political
            program type.
          examples:
            - https://www.fec.gov/data/committee/C00123456/
            - 'FEC Committee ID: C00123456'
        governmentWebsite:
          type: string
          description: >-
            The official website URL for the government agency. The URL must be
            a valid, active, and secure (HTTPS) link to a government-owned
            domain (e.g., .gov, .gov.uk, .gc.ca, etc.). This information is used
            for verification purposes. Mandatory for Short Code verification
            when Government program type.
          examples:
            - https://www.fcc.gov
        governmentType:
          type: string
          description: >-
            Specifies the type of government agency. This helps categorize the
            entity for compliance and routing purposes. Select the most
            appropriate value from the accepted list. This field is mandatory
            for Short Code verification when Government program type.
          enum:
            - FEDERAL
            - LOCAL
            - TRIBAL
            - STATE
            - OTHER
          x-enumDescriptions:
            FEDERAL: For agencies at the national or federal level.
            LOCAL: For agencies at the city, county, or municipal level.
            STATE: For agencies at the state, provincial, or regional level.
            TRIBAL: For recognized tribal governments.
            OTHER: >-
              For any other type of government agency not listed above. If
              selected, the governmentTypeOther field must be filled.
        governmentTypeOther:
          type: string
          description: >-
            A free-text field to provide details if OTHER is selected in the
            governmentType field. This field is required and should be used only
            when none of the predefined agency types apply, only for Short Code
            verification when Government program type.
          examples:
            - International Port Authority Commission
        charitableAccreditation:
          type: string
          description: >-
            The name of the organization that has accredited the charitable
            entity. This is used to verify the non-profit status and legitimacy
            of the organization. This field is mandatory for Short Code
            verification when Charity program type.
          examples:
            - BBB Wise Giving Alliance
        scType:
          description: >-
            Short Code type. It is required for Short Code product verification
            US_SC_REGISTRY and it determines the type of Short Code that will be
            requested in the order. Vanity Short Codes are custom and can be
            chosen by the customer, while Random Short Codes are assigned by the
            provider without customer input. When VANITY is selected, scText
            must be provided with the list of requested short codes.
          type: string
          enum:
            - VANITY
            - RANDOM
          x-enumDescriptions:
            VANITY: Vanity Short Code
            RANDOM: Random Short Code
        scText:
          type: string
          description: >-
            Comma separated list of potential vanity short codes requested by
            the customer, in order of preference. Required when scType is
            VANITY. Optional otherwise for Short Code verification.
          examples:
            - We need 11111, if not available please provide SINCH
    CreateBrandRequest:
      description: Request body for creating a new Draft Brand.
      type: object
      allOf:
        - $ref: '#/components/schemas/BrandProperties'
        - if:
            properties:
              scType:
                const: VANITY
            required:
              - scType
          then:
            required:
              - scText
            properties:
              scText:
                $ref: '#/components/schemas/BrandProperties/properties/scText'
        - type: object
          required:
            - displayName
          properties:
            contentProvider:
              type: boolean
              description: >-
                Indicates whether the brand is a Content Provider (true) or a
                standard Brand (false). This choice determines the types of
                orders that can be requested, as they follow different
                registration processes and are available for different products.
              examples:
                - true
            attachmentInputs:
              description: >-
                Attachments can be added by url or using the specified endpoint.
                Only the latest version of each attachment type is kept per
                Brand.
              items:
                $ref: '#/components/schemas/AttachmentInput'
              type: array
    PatchBrandRequest:
      description: >-
        Request body for partially updating an existing Brand. Only fields
        present in the request body are updated; omitted fields remain
        unchanged. Fields set to null explicitly clear the value.
      type: object
      allOf:
        - $ref: '#/components/schemas/BrandProperties'
        - type: object
          properties:
            attachmentInputs:
              description: >-
                Attachments can be added by url or using the specified endpoint.
                Only the latest version of each attachment type is kept per
                Brand.
              items:
                $ref: '#/components/schemas/AttachmentInput'
              type: array
    ImportBrandRequest:
      type: object
      description: Import Brand request
      required:
        - displayName
        - importType
        - externalBrandId
      properties:
        displayName:
          description: >-
            The name of the brand. DisplayName must be unique per projectId and
            marketCode (US)
          examples:
            - My End Customer Brand Name
          type: string
        importType:
          description: >-
            Type of import, options are IMPORT_TCR_BRAND for 10DLC / RCS and
            IMPORT_GCH_BRAND for Short Code
          type: string
          enum:
            - IMPORT_TCR_BRAND
            - IMPORT_GCH_BRAND
          x-enumDescriptions:
            IMPORT_TCR_BRAND: >-
              Import an existing brand in 10DLC. Imported brand will get same
              channels as in original request (10DLC, 10DLC+RCS). 10DLC brand Id
              must be included as external brand.
            IMPORT_GCH_BRAND: >-
              Import an existing brand in the US Short Code Registry. Imported
              brand will get Short Code channel. The US Short Code Registry
              brand Id must be included as external brand.
          examples:
            - IMPORT_TCR_BRAND
            - IMPORT_GCH_BRAND
        externalBrandId:
          description: >-
            The external brand ID obtained in the original order. It can be the
            10DLC brand Id or the US Short Code Registry brand Id.
          type: string
          examples:
            - GW12345
        callbackUrl:
          description: >-
            The URL to receive the order status update callback. The URL must be
            a valid URL and must be reachable from Sinch.
          examples:
            - https://example.com/callback
          type: string
          format: uri
    ImportBrandResponse:
      type: object
      description: Import Brand response
      properties:
        brandId:
          description: The unique identifier for the brand.
          examples:
            - '1234567890'
          type: string
          readOnly: true
        brandOrderId:
          description: The unique identifier for the brand order.
          examples:
            - '212421442412'
          type: string
          readOnly: true
        brandOwnerContactEmail:
          type: string
          description: >-
            The email of the brand owner contact provided in the original order,
            masked for privacy reasons. This field is included for informational
            purposes, but it is not intended for communication as the email is
            masked.
          examples:
            - bo***********@sinch.com
          readOnly: true
    ListBrandOrderResponse:
      type: object
      description: List of Brands response
      properties:
        orders:
          description: List of brand orders
          items:
            $ref: '#/components/schemas/BrandOrderSummary'
          type: array
          readOnly: true
        links:
          description: Pagination links.
          $ref: '#/components/schemas/Links'
        meta:
          description: Pagination metadata.
          $ref: '#/components/schemas/PaginationMeta'
    ListBrandResponse:
      type: object
      description: List of Brands response
      properties:
        brands:
          description: List of brands
          items:
            $ref: '#/components/schemas/BasicBrand'
          type: array
          readOnly: true
        links:
          description: Pagination links.
          $ref: '#/components/schemas/Links'
        meta:
          description: Pagination metadata.
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      description: Pagination metadata for list responses.
      properties:
        totalCount:
          description: >-
            Total count of resources matching the provided search criteria. This
            field cannot be null; an empty result will return 0.
          format: int32
          type: integer
    Links:
      type: object
      description: Pagination links.
      properties:
        next:
          description: >-
            Link to the next page of results, following RFC 8288. Absence of
            this link indicates the last page.
          type: string
          examples:
            - >-
              https://compliance.api.sinch.com/v1/projects/{projectId}/us/brands?pageToken=abc123
    BasicBrand:
      description: >-
        Basic brand content used for listing brands matching the search
        criteria.
      type: object
      properties:
        brandId:
          description: The unique identifier for the brand.
          examples:
            - '1234567890'
          type: string
          readOnly: true
        displayName:
          description: >-
            The name of the brand. DisplayName must be unique per projectId and
            marketCode (US)
          examples:
            - My End Customer Brand Name
          type: string
        status:
          description: Brand status, it can be DRAFT, ACTIVE and ARCHIVED.
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/BrandStatus'
        channels:
          description: Channels available for this Brand
          items:
            $ref: '#/components/schemas/Channel'
          type: array
          readOnly: true
        createTime:
          description: The date and time when the brand was created.
          examples:
            - '2023-10-01T12:00:00Z'
          type: string
          format: date-time
          readOnly: true
        updateTime:
          description: The date and time when the brand was updated.
          examples:
            - '2023-10-01T12:00:00Z'
          type: string
          format: date-time
          readOnly: true
    Brand:
      description: The brand object that contains the brand details.
      type: object
      allOf:
        - $ref: '#/components/schemas/BrandProperties'
        - type: object
          required:
            - brandId
            - displayName
            - status
            - contentProvider
            - createTime
            - updateTime
          properties:
            brandId:
              description: The unique identifier for the brand.
              examples:
                - '1234567890'
              type: string
              readOnly: true
            status:
              description: Brand status, it can be DRAFT, ACTIVE and ARCHIVED.
              $ref: '#/components/schemas/BrandStatus'
            contentProvider:
              type: boolean
              description: >-
                Indicates whether the brand is a Content Provider (true) or a
                standard Brand (false). This choice determines the types of
                orders that can be requested, as they follow different
                registration processes and are available for different products.
                It cannot be updated after the brand creation.
              examples:
                - true
              readOnly: true
            attachments:
              description: Files attached to this brand
              items:
                $ref: '#/components/schemas/Attachment'
              type: array
              readOnly: true
            logs:
              description: Detailed history of the status changes this brand went through
              items:
                $ref: '#/components/schemas/BrandLog'
              type: array
              readOnly: true
            channels:
              description: Channels available for this Brand
              items:
                $ref: '#/components/schemas/Channel'
              type: array
              readOnly: true
            createTime:
              description: The date and time when the brand was created.
              examples:
                - '2023-10-01T12:00:00Z'
              type: string
              format: date-time
              readOnly: true
            updateTime:
              description: The date and time when the brand was updated.
              examples:
                - '2023-10-01T12:00:00Z'
              type: string
              format: date-time
              readOnly: true
    BrandLog:
      description: >-
        A log entry for a brand, which contains details of the brand status
        update or new channel added. It can contain information provided by the
        agent handling the request.
      properties:
        createTime:
          description: Create time of this log entry. ISO date time format in UTC.
          examples:
            - '2021-11-03T14:30:03Z'
          type: string
          format: date-time
          readOnly: true
        message:
          description: >-
            Optional message with details of the brand status update or new
            channel added. It can contain information provided by the agent
            handling the request.
          examples:
            - Please update the attachment connected to your request.
          type: string
        brandCurrentState:
          description: State of the brand after this entry was created
          $ref: '#/components/schemas/BrandStatus'
          readOnly: true
      type: object
    BrandOrderLog:
      description: >-
        A log entry for a brand order, which contains details of the brand order
        status update or new channel added. It can contain information provided
        by the agent handling the request.
      properties:
        createTime:
          description: Create time of this log entry. ISO date time format in UTC.
          examples:
            - '2021-11-03T14:30:03Z'
          type: string
          format: date-time
          readOnly: true
        message:
          description: >-
            Optional message with details of the brand status update or new
            channel added. It can contain information provided by the agent
            handling the request.
          examples:
            - Please update the attachment connected to your request.
          type: string
        brandCurrentState:
          description: State of the order after this entry was created
          $ref: '#/components/schemas/BrandOrderStatus'
          readOnly: true
        brandPreviousState:
          description: State of the order before this entry was created
          $ref: '#/components/schemas/BrandOrderStatus'
          readOnly: true
      type: object
    BrandOrderSummary:
      description: >-
        Summary of a brand order, used for listing brand orders matching the
        search criteria.
      type: object
      properties:
        brandOrderId:
          description: The unique identifier for the brand order.
          examples:
            - '212421442412'
          type: string
          readOnly: true
        brandId:
          description: Brand ID this Order belongs to.
          examples:
            - '3242343243243'
          type: string
          readOnly: true
        status:
          description: >-
            Brand Order status. This field is useful to quickly check the status
            of the order without having to call the Get Brand Order endpoint.
          $ref: '#/components/schemas/BrandOrderStatus'
          readOnly: true
        metadataName:
          description: >-
            Metadata name of the brand order, which identifies the type of the
            order and the process it follows. This field is useful to quickly
            check the type of the order without having to call the Get Brand
            Order endpoint.
          $ref: '#/components/schemas/BrandOrderMetadata'
          readOnly: true
        createTime:
          description: Create time of the request. ISO date time format in UTC.
          examples:
            - '2021-11-03T14:30:03Z'
          type: string
          readOnly: true
          format: date-time
        updateTime:
          description: Update time of the request. ISO date time format in UTC.
          examples:
            - '2021-11-03T14:30:03Z'
          type: string
          readOnly: true
          format: date-time
    BrandOrderRequest:
      description: A brand order request.
      type: object
      required:
        - metadataName
      properties:
        metadataName:
          description: >-
            Metadata name of the brand order, which identifies the type of the
