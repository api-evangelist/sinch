    get:
      tags:
        - Verification status
      summary: Get verification by ID
      description: >-
        Queries the verification result by sending the verification ID. With
        this query you can get the result of a verification.
      operationId: VerificationStatusById
      responses:
        '200':
          $ref: '#/components/responses/VerificationResult'
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package verification.status;


            import com.sinch.sdk.SinchClient;

            import
            com.sinch.sdk.domains.verification.api.v1.VerificationsStatusService;

            import
            com.sinch.sdk.domains.verification.models.v1.status.response.VerificationStatusResponse;

            import com.sinch.sdk.models.Configuration;

            import java.util.logging.Logger;

            import utils.Settings;


            public class GetById {

              private static final Logger LOGGER = Logger.getLogger(GetById.class.getName());

              public static void main(String[] args) {

                String applicationKey = Settings.getApplicationKey().orElse("MY_APPLICATION_KEY");
                String applicationSecret = Settings.getApplicationSecret().orElse("MY_APPLICATION_SECRET");

