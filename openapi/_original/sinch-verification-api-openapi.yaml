        With the SMS verification method, a user's phone number is verified by
        sending an SMS containing an OTP code that must be manually returned. If
        you are are using an Android handset, you could instead intercept the
        SMS message delivery and capture the OTP code automatically.
      x-enumDescriptions:
        intercepted: OTP verification was performed automatically
        manual: OTP verification was manually performed
      enum:
        - intercepted
        - manual
      example: intercepted
    VerificationResultEvent:
      required:
        - status
      type: object
      allOf:
        - $ref: '#/components/schemas/VerificationEventBase'
        - type: object
          properties:
            event:
              type: string
              description: The type of the event.
              example: VerificationResultEvent
              x-enumDescriptions:
                VerificationResultEvent: Notification Event received onto verification result
              enum:
                - VerificationResultEvent
            status:
              $ref: '#/components/schemas/VerificationStatus'
            reason:
              $ref: '#/components/schemas/VerificationStatusReason'
            source:
              $ref: '#/components/schemas/Source'
    VerificationSmsDeliveredEvent:
      required:
        - smsResult
      type: object
      allOf:
        - $ref: '#/components/schemas/VerificationEventBase'
        - type: object
          properties:
            event:
              type: string
              description: The type of the event.
              example: VerificationSmsDeliveredEvent
              x-enumDescriptions:
                VerificationSmsDeliveredEvent: Event received onto verification request
              enum:
                - VerificationSmsDeliveredEvent
            smsResult:
              type: string
              description: >-
                The result of the SMS delivery. Possible values can be extended
                in the future.
              x-enumDescriptions:
                Successful: SMS delivered to user successfully
                Failed: SMS delivery to user failed
              enum:
                - Successful
                - Failed
              example: Successful
    VerificationStartResponseBase:
      type: object
      additionalProperties: false
      required:
        - id
        - method
      properties:
        id:
          type: string
          description: Verification identifier used to query for status.
          example: '1234567890'
        method:
          $ref: '#/components/schemas/VerificationMethodStart'
        _links:
          type: array
          items:
            $ref: '#/components/schemas/Links'
    VerificationStartResponseSms:
      title: SMS Response
      type: object
      allOf:
        - $ref: '#/components/schemas/VerificationStartResponseBase'
        - type: object
          properties:
            sms:
              type: object
              description: >-
                The response contains the `template` of the SMS to be expected
                and intercepted.
              additionalProperties: true
              properties:
                template:
                  type: string
                  description: The expected template for the SMS response.
                  example: Your verification code is {{CODE}}
                interceptionTimeout:
                  type: integer
                  format: int32
                  description: >-
                    The amount of time in seconds that the client should wait
                    for the SMS.
                  example: 32
                codeType:
                  $ref: '#/components/schemas/SmsCodeType'
    VerificationStartResponseFlashCall:
      title: Flash Call Response
      type: object
      allOf:
        - $ref: '#/components/schemas/VerificationStartResponseBase'
        - type: object
          properties:
            flashCall:
              description: >-
                The response contains the `cliFilter` and `interceptionTimeout`
                properties.
              additionalProperties: true
              required:
                - cliFilter
                - interceptionTimeout
              type: object
              properties:
                cliFilter:
                  type: string
                  description: >-
                    Filter that should be applied for incoming calls to
                    intercept the flash call.
                  example: (.*)70123(.*)
                interceptionTimeout:
                  type: integer
                  description: Amount of seconds client should wait for the flash call.
                  format: int32
                  example: 60
                reportTimeout:
                  type: integer
                  description: >-
                    The time in seconds allowed for reporting the code after
                    which the verification will expire.
                  example: 120
                denyCallAfter:
                  type: integer
                  description: >-
                    Used by the mobile SDKs, this setting makes the handset deny
                    the flash call after the set time in seconds.
                  example: 120
