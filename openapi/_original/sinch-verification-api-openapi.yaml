openapi: 3.0.3
info:
  title: Verification | Sinch
  license:
    name: MIT
    url: https://www.sinch.com/toc
  contact:
    name: Sinch
    url: https://www.sinch.com/contact-us/
    email: support@sinch.com
  version: 2.0.1
  description: >
    Sinch offers a platform for phone number verification. It consists of
    different software development kits (the Sinch SDKs) that you integrate with
    your smartphone or web application and cloud based back-end services as well
    as a REST API. Together, they enable SMS, Flashcall, Phone Call, and Data
    verification in your application.


    Verify users with SMS, flash calls (missed calls), a regular call, or data
    verification. This document serves as a user guide and documentation on how
    to use the Sinch Verification REST APIs.


    The Sinch Verification API is used to verify mobile phone numbers. It's
    consumed by the Sinch Verification SDK, but it can also be used by any
    backend or client directly.


    The Sinch service uses four different verification methods:


    -
    [SMS](https://developers.sinch.com/docs/verification/api-reference/verification/section/sms-verification):
    Sending an SMS message with an OTP code

    -
    [FlashCall](https://developers.sinch.com/docs/verification/api-reference/verification/section/flashcall-verification):
    Placing a flashcall (missed call) and detecting the incoming calling number
    (CLI)

    - [Phone
    Call](https://developers.sinch.com/docs/verification/api-reference/verification/section/phone-call-verification):
    Placing a PSTN call to the user's phone and playing a message containing the
    code

    -
    [Data](https://developers.sinch.com/docs/verification/api-reference/verification/section/data-verification):
    By accessing internal infrastructure of mobile carriers to verify if given
    verification attempt was originated from device with matching phone number


    {% admonition type="info" name="Note:" %}

    If you want to use data verification, please contact your account manager.

    {% /admonition %}


    ## Authentication


    For general information on how to use the Sinch APIs including methods,
    types, errors and authorization, please visit the
    [Authentication](https://developers.sinch.com/docs/verification/api-reference/authentication/)
    page.


    Available authentication methods are:


    - [Application Signed
    Request](https://developers.sinch.com/docs/verification/api-reference/authentication/application-signed-request):
    Strongest method, recommended for production use

    - [Basic
    Authentication](https://developers.sinch.com/docs/verification/api-reference/authentication/basic-authentication):
    Strong and easy, recommended for prototyping

    - [Public
    Authentication](https://developers.sinch.com/docs/verification/api-reference/authentication/public-authentication):
    Weak method, suitable only for specific scenarios


    ### Authorization


    You can set the minimum required authentication level in the Dashboard.
    Verification API rejects requests using weaker authentication methods than
    configured. Some endpoints may require stronger authentication than the set
    minimum.


    # FlashCall verification


    With the flashCall verification method, a user's phone number is verified by
    triggering a "missed call" towards this number. The call is automatically
    intercepted by the Android SDK in the mobile app and blocked automatically.
    iOS and JavaScript use cases require manual interaction where user has to
    enter incoming phone call number in the application.


    To initiate a flashCall verification, visit [Android SDK
    documentation](https://developers.sinch.com/docs/verification/android/android-the-verification-process).
    For additional security, it's recommended that you control which
    verification requests should proceed and which ones not, by listening in
    your backend for the [Verification Request
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationrequestevent)
    and respond accordingly. Your backend will be notified on the result of the
    verification with the [Verification Result
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationresultevent).


    # SMS verification


    With the SMS verification method, a user's phone number is verified by
    sending an SMS containing an OTP code to this number. In the case of iOS or
    JavaScript, the user needs to enter the OTP manually or semi-manually in the
    application, while for Android there is an option of intercepting the SMS
    message delivery and capturing the OTP code automatically.


    To initiate an SMS verification, check the
    [iOS](https://developers.sinch.com/docs/verification/ios.md) or
    [Android](https://developers.sinch.com/docs/verification/android.md)
    documentation. For additional security, it's recommended that you control
    which verification requests should proceed and which ones not, by listening
    in your backend for the [Verification Request
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationrequestevent)
    and respond accordingly. Your backend will be notified on the result of the
    verification with the [Verification Result
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationresultevent).


    ## Set SMS language


    It's possible to specify the content language for SMS verification. The
    desired language is set in the initiate verification request
    'Accept-Language' header. Setting this header is optional. If not included
    the application's default SMS content language is used, which by default is
    en-US. If an SMS template for the desired language is not found it's
    defaulted to 'en-US' unless a different default language has been defined
    for the requesting application.

    More information on the 'Accept-Language' header can be found from
    [IETF](https://tools.ietf.org/html/rfc3282) and the [HTTP/1.1
    documentation](https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.4).


    {% admonition type="info" name="Note:" %}

    The content language specified in the API request or in the callback can be
    overridden by carrier provider specific templates, due to compliance and
    legal requirements, such as [US shortcode
    requirements](https://community.sinch.com/t5/SMS/Sinch-US-Short-Code-Onboarding-Overview/ta-p/7085).

    {% /admonition %}


    _Example_ - SMS verification specifying content language


    ```html

    Headers: ... Accept-Language: es-ES ... [POST]

    https://verification.api.sinch.com/verification/v1/verifications

    ```


    ```json

    {
      "identity": { "type": "number", "endpoint": "+46700000001" },
      "method": "sms"
    }

    ```


    The actual language that was selected is returned in the `Content-Language`
    HTTP content header. As outlined above, this may differ from the requested
    language due to either that language not having SMS content defined, or it
    being overridden by provider requirements.


    _Example_ - SMS verification response with selected content language


    #### Response


    ```html

    Headers: ... Content-Length: 103 Content-Language: es-ES Content-Type:

    application/json; charset=utf-8 Expires: -1 ...

    ```


    ```json

    {
      "id": "1087388",
      "sms": {
        "template": "Tu código de verificación es {{CODE}}.",
        "interceptionTimeout": 120
      }
    }

    ```


    # Phone Call verification


    With the Phone Call verification method, a user's phone number is verified
    by receiving a phone call and hearing a pre-recorded or text-to-speech
    message containing OTP code. The user is then expected to enter this code in
    the application.


    To initiate a Phone Call verification, check the [Start
    Verification](https://developers.sinch.com/docs/verification/api-reference/verification/verifications-start/startverification)
    documentation. For additional security, it's recommended that you control
    which verification requests should proceed and which ones not, by listening
    in your backend for the [Verification Request
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationrequestevent)
    and respond accordingly. Your backend will be notified on the result of the
    verification with the [Verification Result
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationresultevent).


    # Data verification


    With the data verification method, a user's phone number is verified by
    mobile carrier's infrastructure itself. This method requires cellular data
    usage on end-user's device and is currently limited in its coverage.


    {% admonition type="info" name="Note:" %}

    If you want to use data verification, please contact your account manager.

    {% /admonition %}


    # How to use the Verification APIs


    In combination with the Mobile or Web SDK (recommended)


    The following diagram shows how to use the Verification APIs when using the
    iOS, Android or JavaScript SDKs to initiate a verification.


    ![verification.png](https://developers.sinch.com/images/verification/1ad7295-verification.png)


    {% admonition type="warning" name="Important!" %}

    In this scenario, the _Verification Request_ and _Report Verification_ APIs
    don't need to be called explicitly by the app, since the SDK is handling
    that for you.

    {% /admonition %}


    If you have configured a verification callback URL in the Sinch Portal
    (recommended), with every verification that's initiated by the app, Sinch
    will send a [Verification Request
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationrequestevent)
    to your backend, to get permission to perform the verification. If your
    backend allows the verification request to proceed, Sinch will trigger a
    flashcall, SMS or call towards the phone to be verified. Once the phone
    receives the flash-call, SMS or voice call, the SDK will report back the CLI
    or OTP respectively so that the Sinch dashboard can compare its validity.
    The Sinch backend responds with the result of the verification to the client
    and sends a [Verification Result
    Event](https://developers.sinch.com/docs/verification/api-reference/verification/verification-callbacks/verificationresultevent)
    to your backend. The status of a verification can also be queried ad-hoc by
    using the "Query Verification" APIs.


    ## Without the mobile or web SDK


    If you are not using the mobile or web Verification SDKs, then you need to
    implement all the client logic for intercepting calls (in case of
    flashcalls) and reporting the CLI or OTP (in case of SMS or Phone Call
    verification) inside your app. The following diagram shows how to use Sinch
    Verification in this scenario.


    ![verification_without_sdk.png](https://developers.sinch.com/images/verification/82d9a08-verification_without_sdk.png)


    The verification requests will be triggered from your backend towards Sinch
    with the [Verification Request
    API](https://developers.sinch.com/docs/verification/api-reference/verification/verifications-start/startverification),
    by doing a [signed
    request](https://developers.sinch.com/docs/verification/api-reference/authentication/callback-signed-request).
    Sinch dashboard will respond with the CLI filter (for flashcalls) or the
    template (in case of an SMS), or the polling intervals (in case of a Phone
    Call). As soon as the flashcall or SMS is received by your app, your backend
    will need to report back to Sinch the CLI or OTP that was reported through
    the [Report Verification
    API](https://developers.sinch.com/docs/verification/api-reference/verification/verifications-report/reportverificationbyidentity).
    Sinch will respond with the result of the verification.
servers:
  - url: https://verification.api.sinch.com
security:
  - Basic: []
  - Application: []
x-webhooks:
  VerificationRequestEvent:
    post:
      security: []
      tags:
        - Verification callbacks
      summary: Verification Request Event
      operationId: VerificationRequestEvent
      description: >-
        This callback event is a POST request to the specified verification
        callback URL and is triggered when a new verification request is made
        from the SDK client or the Verification Request API. This callback event
        is only triggered when a verification callback URL is specified in your
        [dashboard](https://dashboard.sinch.com/verification/apps).
      requestBody:
        $ref: '#/components/requestBodies/VerificationRequestEventRequest'
      responses:
        '200':
          $ref: '#/components/responses/VerificationRequestEventResponse'
  VerificationResultEvent:
    post:
      security: []
      tags:
        - Verification callbacks
      summary: Verification Result Event
      operationId: VerificationResultEvent
      description: >-
        This callback event is a POST request to the specified verification
        callback URL and triggered when a verification has been completed and
        the result is known. It's used to report the verification result to the
        developer's backend application. This callback event is only triggered
        when the verification callback URL is specified in your
        [dashboard](https://dashboard.sinch.com/verification/apps).
      requestBody:
        $ref: '#/components/requestBodies/VerificationResultEventRequest'
      responses:
        '200':
          description: You must return an empty `200` response.
          content:
            schema: {}
  SmsDeliveredEvent:
    post:
      security: []
      tags:
        - Verification callbacks
      summary: SMS Delivered Event
      operationId: SmsDeliveredEvent
      description: >-
        This callback event is a POST request to the specified verification
        callback URL and is triggered when an SMS delivery receipt is received.
        It is used to report the final delivery status of the verification SMS.
        This callback event is only triggered when a verification callback URL
        is specified in your
        [dashboard](https://dashboard.sinch.com/verification/apps).
      requestBody:
        $ref: '#/components/requestBodies/VerificationSmsDeliveredEventRequest'
      responses:
        '200':
          description: You must return an empty `200` response.
          content:
            schema: {}
paths:
  /verification/v1/verifications:
    post:
      tags:
        - Verifications start
      summary: Start verification
      description: >-
        This method is used by the mobile and web Verification SDKs to start a
        verification. It can also be used to request a verification from your
        backend, by making an request.
      operationId: StartVerification
      parameters:
        - $ref: '#/components/parameters/acceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/StartVerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/StartVerificationResponse'
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package verification.start;


            import com.sinch.sdk.SinchClient;

            import
            com.sinch.sdk.domains.verification.api.v1.VerificationsStartService;

            import com.sinch.sdk.domains.verification.models.v1.NumberIdentity;

            import
            com.sinch.sdk.domains.verification.models.v1.start.request.VerificationStartRequestSms;

            import
            com.sinch.sdk.domains.verification.models.v1.start.response.VerificationStartResponse;

            import com.sinch.sdk.models.Configuration;

            import java.util.logging.Logger;

            import utils.Settings;


            public class Start {

              private static final Logger LOGGER = Logger.getLogger(Start.class.getName());

              public static void main(String[] args) {

                String applicationKey = Settings.getApplicationKey().orElse("MY_APPLICATION_KEY");
                String applicationSecret = Settings.getApplicationSecret().orElse("MY_APPLICATION_SECRET");

                // The phone number you want to verify, in E.164 format (e.g. +46701234567).
                String phoneNumber = "PHONE_NUMBER";

                Configuration configuration =
                    Configuration.builder()
                        .setApplicationKey(applicationKey)
                        .setApplicationSecret(applicationSecret)
                        .build();

                SinchClient client = new SinchClient(configuration);

                VerificationsStartService verificationsStartService =
                    client.verification().v1().verificationStart();

                LOGGER.info(String.format("Start a verification by SMS onto phone number '%s'", phoneNumber));

                VerificationStartRequestSms request =
                    VerificationStartRequestSms.builder()
                        .setIdentity(NumberIdentity.valueOf(phoneNumber))
                        .build();

                VerificationStartResponse response = verificationsStartService.startSms(request);

                LOGGER.info("Response: " + response);
              }
            }
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const applicationKey = process.env.SINCH_APPLICATION_KEY ?? 'MY_APPLICATION_KEY';
              const applicationSecret = process.env.SINCH_APPLICATION_SECRET ?? 'MY_APPLICATION_SECRET';

              const sinch = new SinchClient({ applicationKey, applicationSecret });

              // The phone number you want to verify, in E.164 format (e.g. +46701234567).
              const phoneNumber = 'PHONE_NUMBER';

              try {
                const response = await sinch.verification.verifications.startSms({
                  startVerificationWithSmsRequestBody: {
                    identity: {
                      type: 'number',
                      endpoint: phoneNumber,
                    },
                  },
                });
                console.log('✅ Successfully started the verification process via SMS.');
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error(`❌ Failed to start a verification process via SMS for the phone number ${phoneNumber}:`);
                console.error(err);
              }
            }

            main();
  /verification/v1/verifications/number/{endpoint}:
    parameters:
      - $ref: '#/components/parameters/endpoint'
    put:
      tags:
        - Verifications report
      summary: Report a verification using Identity
      description: >-
        Report the received verification code to verify it, using the identity
        of the user (in most cases, the phone number). For an SMS verification
        or Phone Call verification, this is the OTP code. For FlashCall, this is
        the CLI.
      operationId: ReportVerificationByIdentity
      requestBody:
        $ref: '#/components/requestBodies/VerificationReportRequest'
      responses:
        '200':
          $ref: '#/components/responses/VerificationReportResponse'
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package verification.report;


            import com.sinch.sdk.SinchClient;

            import
            com.sinch.sdk.domains.verification.api.v1.VerificationsReportService;

            import com.sinch.sdk.domains.verification.models.v1.NumberIdentity;

            import
            com.sinch.sdk.domains.verification.models.v1.report.request.VerificationReportRequestSms;

            import
            com.sinch.sdk.domains.verification.models.v1.report.response.VerificationReportResponse;

            import com.sinch.sdk.models.Configuration;

            import java.util.logging.Logger;

            import utils.Settings;


            public class ReportByIdentity {

              private static final Logger LOGGER = Logger.getLogger(ReportByIdentity.class.getName());

              public static void main(String[] args) {

                String applicationKey = Settings.getApplicationKey().orElse("MY_APPLICATION_KEY");
                String applicationSecret = Settings.getApplicationSecret().orElse("MY_APPLICATION_SECRET");

                // The phone number being verified via SMS.
                String phoneNumber = "PHONE_NUMBER";
                // The OTP is the code the user received via SMS as part of the verification process.
                String receivedVerificationCode = "OTP_CODE";

                Configuration configuration =
                    Configuration.builder()
                        .setApplicationKey(applicationKey)
                        .setApplicationSecret(applicationSecret)
                        .build();

                SinchClient client = new SinchClient(configuration);

                VerificationsReportService verificationsReportService =
                    client.verification().v1().verificationReport();

                LOGGER.info(String.format("Report SMS verification code for phone number '%s'", phoneNumber));

                VerificationReportRequestSms request =
                    VerificationReportRequestSms.builder().setCode(receivedVerificationCode).build();

                VerificationReportResponse response =
                    verificationsReportService.reportSmsByIdentity(
                        NumberIdentity.valueOf(phoneNumber), request);

                LOGGER.info("Response: " + response);
              }
            }
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const applicationKey = process.env.SINCH_APPLICATION_KEY ?? 'MY_APPLICATION_KEY';
              const applicationSecret = process.env.SINCH_APPLICATION_SECRET ?? 'MY_APPLICATION_SECRET';

              // The phone number being verified via SMS.
              const phoneNumber = 'PHONE_NUMBER';
              // The OTP is the code the user received via SMS as part of the verification process.
              const receivedVerificationCode = 'OTP_CODE';

              const sinch = new SinchClient({ applicationKey, applicationSecret });

              try {
                const response = await sinch.verification.verifications.reportSmsByIdentity({
                  endpoint: phoneNumber,
                  reportSmsVerificationByIdentityRequestBody: {
                    sms: {
                      code: receivedVerificationCode,
                    },
                  },
                });
                console.log('✅ Successfully reported the OTP for the verification process via SMS.');
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error(`❌  Failed to report the OTP for the verification process via SMS for the phone number ${phoneNumber}:`);
                console.error(err);
              }
            }

            main();
  /verification/v1/verifications/id/{id}:
