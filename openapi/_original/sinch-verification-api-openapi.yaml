tags:
  - name: Verifications start
    description: Start new verification requests.
  - name: Verifications report
    description: Report on existing verification requests.
  - name: Verification status
    description: >-
      Get the status of specific verification requests in the verification
      process. Returns the status of pending and completed verifications. You
      can retrieve the status of verification requests by using the ID of the
      request, the phone number of the user being verified, or a custom
      reference string.
    x-displayName: Verifications status
  - name: Verification callbacks
    description: >-
      Callback events are used to authorize and manage your verification
      requests and return verification results.
    x-displayName: Verifications callbacks
components:
