      title: Price
      type: object
      additionalProperties: false
      properties:
        currencyId:
          type: string
          description: ISO 4217 currency code
          example: USD
        amount:
          type: number
          format: float
          example: 0.0127
    BillableDuration:
      description: >
        The time of the call for which the fee was charged.


        Present only when termination debiting is enabled (disabled by default).


        Depending on the type of rounding used, the value is the actual call
        time rounded to the nearest second, minute or other value.
      type: integer
      example: 42
    VerificationTimestamp:
      type: string
      description: >-
        The timestamp in UTC format.

        <br>

        **Note:** The formatting does not respect `ISO-8601` and the returned
        value has the format `YYYY-MM-DDThh:mm:ss.SSS`. If you need to parse
        this value into a specific date object in your programming language,
        please append `Z` (Zulu time = UTC) at the end of the date value to
        match the `ISO-8601` format: `YYYY-MM-DDThh:mm:ss.SSSZ`.
      example: '2023-04-21T14:45:51'
    CountryId:
      type: string
      description: The ID of the country to which the verification was sent.
      example: US
