                - $ref: '#/components/schemas/CarrierState'
                - type: object
                  properties:
                    operation:
                      $ref: '#/components/schemas/Operation'
            mmsAtt:
              description: Contains information about MMS-enabled AT&T numbers.
              allOf:
                - $ref: '#/components/schemas/CarrierState'
                - type: object
                  properties:
                    operation:
                      $ref: '#/components/schemas/Operation'
