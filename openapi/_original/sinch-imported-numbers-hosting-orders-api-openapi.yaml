        - street
        - city
        - state
        - postalCode
        - country
      type: object
      properties:
        buildingNumber:
          type: string
          description: The building number of the address.
          example: '123'
        street:
          type: string
          description: The street name of the address.
          example: 1st
        city:
          type: string
          description: The city name of the address.
          example: New York
        state:
          type: string
          description: The state name of the address.
          example: NY
        postalCode:
          type: string
          description: The postal code of the address.
          example: '00001'
        country:
