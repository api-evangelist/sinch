tags:
  - name: Hosting Orders
    description: >-
      Hosted numbers provide you with an easy method to port your SMS enabled
      numbers to Sinch or to use SMS messaging and other products to send and
      receive messages, on voice-enabled numbers (including landline numbers)
      that you already own.


      Note: The SMS enablement process is only supported in United States and
      Canada.


      The Hosting Orders API allows you to manage all the numbers that you are
      hosting on the Sinch platform. This includes numbers that you have ported
      to Sinch and/or any non- Sinch numbers that you already own and are
      hosting on Sinch to enable Sinch SMS messaging and other products.
  - name: Imported Numbers
    description: >-
      Use the Imported Numbers API endpoints to list imported numbers or import
      a number that's already been provisioned with an NNID for use with Sinch.
      Imported numbers can be used with Sinch SMS services.


      Note: The SMS enablement process is only supported in United States and
      Canada.
  - name: Qualified Numbers
    description: >-
      You can use the Qualified Numbers API to qualify numbers you want Sinch to
      host and have available for use with Sinch SMS services. Qualifying a
      number involves verifying ownership of a number either by providing a one
      time passcode sent to the number by voice call or by providing invoices
      for multiple numbers. Once numbers are qualified, you can then enable
      those numbers for SMS text messaging services.


      Note: The SMS enablement process is only supported in United States and
      Canada.
  - name: Imported Numbers and Hosting Orders Callbacks
    description: >-
      You can set up callback URLs to receive event notifications when your
      numbers are updated. 


      When delivering events the order is not guaranteed (for example, a failed
      event scheduled for retry will not block other events that were queued).


      The client's callback handler must implement the state machine that can
      decide what to do with _unexpected_ events, for example, "old" events or
      invalid state transitions. In these cases the handler could use the API to
      GET the latest state for the resource.


      The callback handler is expected to "ingest" the event and respond with
      200 OK. The domain-specific business logic and processes should be
      executed outside of the callback request, as internal asynchronous jobs.


      To use callbacks, add the following IP addresses to your allowlist:


      - 54.76.19.159

      - 54.78.194.39

      - 54.155.83.128


      ### Secure Webhook Endpoints with HMAC


      Implementing HMAC (Hash-based Message Authentication Code) on your webhook
      endpoints will ensure the integrity of data, preventing tampering during
      transmission.

      An HMAC used in webhooks is a common approach in the industry and
      essentially it is just special code that can be used to check if a message
      hasn't been tampered with during the transmission.


      We recommend to configure an HMAC secret for your project using the
      [callback
      configuration](https://developers.sinch.com/docs/numbers/api-reference/imported-hosting/imported-numbers-and-hosting-orders-callbacks/updatecallbackconfiguration).
      Then, when sending the number events, the HTTP POST requests will include
      the header `X-Sinch-Signature` with the computed HMAC.


      **NOTE:** The HMAC secret is configured per project; if you are using the
      Numbers API with multiple projects, make sure you configure the HMAC
      secret in each project, and fetch it for either imported or purchased
      numbers from the dedicated endpoints.


      ### HMAC verification


      We recommend to verify the HMAC code received with every event in your
      event handler. When receiving a new event on your endpoint URL, compute
      the HMAC of the payload using the secret (configured
      [here](https://developers.sinch.com/docs/numbers/api-reference/imported-hosting/imported-numbers-and-hosting-orders-callbacks/updatecallbackconfiguration))
      and compare it with one received in the `X-Sinch-Signature` header.


      **NOTE:** Compute the HMAC on the plain text value before parsing the JSON
      payload.
