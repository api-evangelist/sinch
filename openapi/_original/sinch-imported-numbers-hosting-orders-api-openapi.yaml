                      $ref: '#/components/schemas/Operation'
    CarrierState:
      type: object
      description: Contains information about the state of the carrier.
      properties:
        state:
          $ref: '#/components/schemas/State'
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        errorMessage:
          $ref: '#/components/schemas/ErrorMessage'
        updateTime:
          $ref: '#/components/schemas/UpdateTime'
    State:
      type: string
      description: Indicates the current state of the operation.
      enum:
        - DONE
        - FAILED
        - IN_PROGRESS
        - WAITING
        - STATE_UNSPECIFIED
      x-enumDescriptions:
        DONE: The operation was completed successfully.
        FAILED: The operation has failed.
        IN_PROGRESS: The operation is currently in progress.
        WAITING: The operation is pending and has not yet started.
        STATE_UNSPECIFIED: The state is unspecified.
      example: DONE
    Operation:
      type: string
      description: Specifies the type of action being performed.
      enum:
        - PROVISIONING
        - DEPROVISIONING
        - OPERATION_UNSPECIFIED
      x-enumDescriptions:
        PROVISIONING: The service is being configured or activated.
        DEPROVISIONING: The service is being deactivated or removed.
        OPERATION_UNSPECIFIED: The operation is unspecified.
    ErrorCode:
      type: string
      description: >-
        An optional string field that contains an error code if the operation
        failed. This field is empty ("") when there is no error.
      example: ''
    ErrorMessage:
      type: string
      description: >-
        An optional string field that provides a human-readable message
        describing the error. This field is empty ("") when no error has
        occurred.
    UpdateTime:
      type: string
      description: >-
        A timestamp in ISO 8601 format indicating the last time the status was
        updated.
      example: '2025-04-02T19:45:28.650924Z'
    SmsConfiguration:
      type: object
      properties:
        servicePlanId:
          type: string
          description: "The current SMS configuration for this number.\r The `servicePlanId`` can be found when logging into dashboard.sinch.com\r in the SMS>APIs section."
          example: YOUR_service_plan_id
        scheduledProvisioning:
          $ref: '#/components/schemas/ScheduledProvisioning'
        campaignId:
          type: string
          description: The current campaign ID assigned to this number.
          example: YOUR_campaign_id
        migrateToSinchTmo:
          type: boolean
          readOnly: true
          description: >-
            Displays if a number is assigned to another aggregator in T-Mobile's
            platform, and requires migration from previous aggregator to Sinch.
      description: Configuration for SMS
    Address:
      description: The address of the business.
      required:
