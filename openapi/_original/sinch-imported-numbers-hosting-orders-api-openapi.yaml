openapi: 3.0.3
info:
  title: Imported Numbers and Hosting Orders
  description: >-
    API for importing, hosting, and qualifying numbers to enable them for use
    with Sinch SMS text messaging services.
  contact:
    name: Support
    url: https://www.sinch.com
    email: support@sinch.com
  license:
    name: MIT
    url: https://www.sinch.com/toc
  version: '1.0'
servers:
  - url: https://imported.numbers.api.sinch.com
    description: Global API
x-webhooks:
  EventsCallback:
    post:
      tags:
        - Imported Numbers and Hosting Orders Callbacks
      summary: Event notification
      description: A notification of an event sent to your configured callback URL.
      operationId: ImportedNumberService_EventsCallback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackPayload'
      responses:
        default:
          description: 200 OK
paths:
  /v1/projects/{projectId}/importedNumbers:
    get:
      tags:
        - Imported Numbers
      summary: List imported numbers
      description: Lists all imported numbers for the project.
      operationId: ImportNumberService_ListImportedNumbers
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/regionCode'
        - $ref: '#/components/parameters/numberPattern.pattern'
        - $ref: '#/components/parameters/numberPattern.searchPattern'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/servicePlanId'
        - $ref: '#/components/parameters/campaignId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImportedNumbersResponse'
        '400':
          description: If the page_token, number_pattern or order_by is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Imported Numbers
      summary: Import number
      description: >-
        You can use the Import Numbers API to import a non-Sinch number that you
        want to enable for SMS with Sinch as the Direct Connectivity Aggregator
        (DCA) without porting (or even partially porting) the number.


        Note: Customers who are importing numbers (i.e. want to use their own
        NNID) will need to complete the NNID provisioning process to support
        proper message routing with the carriers. To learn more, refer to the
        article [How can you provision a Network Number ID
        (NNID)?](https://community.sinch.com/t5/10DLC/How-can-you-provision-a-Network-Number-ID-NNID/ta-p/7040)
      operationId: ImportNumberService_ImportNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportedNumberRequest'
            examples:
              ProvisioningExample:
                summary: Importing a qualified number
                value:
                  regionCode: US
                  smsConfiguration:
                    servicePlanId: YOUR_service_plan_id
                    campaignId: YOUR_campaign_id
                    migrateToSinchTmo: true
                  phoneNumber: '+11234567890'
                  displayName: MyPhoneNumber
                  callbackUrl: https://www.your-callback-server.com/callback
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedNumber'
        '400':
          description: >-
            INVALID_ARGUMENT: If the importedNumber.phoneNumber,
            importedNumber.smsConfiguration.servicePlanId is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The imported number already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/importedNumbers/{phoneNumber}:
    get:
      tags:
        - Imported Numbers
      summary: Get imported number
      description: Returns the imported number you specify in the path.
      operationId: ImportNumberService_GetImportedNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedNumberResponse'
        '404':
          description: The imported number could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Imported Numbers
      summary: Delete imported number
      description: Delete an imported number from the project.
      operationId: ImportNumberService_DeleteImportedNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      responses:
        '200':
          description: OK
          content: {}
        '404':
          description: The imported number could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Imported Numbers
      summary: Update imported number
      description: >-
        Update an imported phone number. You can perform the following updates:


        * Update the name that displays for a customer by modifying the
        `displayName` parameter.

        * Unlink the number from an SMS service or campaign by updating the
        `smsConfiguration` configuration object. To unlink a number, submit the
        request with an empty string (`””`) in the service plan ID or campaign
        ID fields.

        * Before linking a number to a new service or campaign, it must be
        unlinked from any existing service or campaign. Then, link the number to
        a new SMS service or campaign by updating the service plan ID or
        campaign ID with the new desired value.
      operationId: ImportNumberService_UpdateImportedNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportedNumber'
            examples:
              UnlinkNumber:
                summary: Unlink a number with a campaign and service plan
                value:
                  displayName: My Display Name
                  smsConfiguration:
                    servicePlanId: ''
                    campaignId: ''
                  callbackUrl: https://www.your-callback-server.com/callback
              LinkNumber:
                summary: Link a number from a campaign and service plan
                value:
                  displayName: My Display Name
                  smsConfiguration:
                    servicePlanId: YOUR_service_plan_id
                    campaignId: YOUR_campaign_id
                  callbackUrl: https://www.your-callback-server.com/callback
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedNumber'
        '400':
          description: >-
            INVALID_ARGUMENT: If the fieldMask is not provided or
            importedNumber.smsConfiguration.servicePlanId is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The imported number could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/hostingOrders:
    get:
      tags:
        - Hosting Orders
      summary: List hosting orders
      description: Lists the hosting orders for the project.
      operationId: HostingOrderService_ListHostingOrders
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/regionCode'
        - $ref: '#/components/parameters/states'
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/servicePlanId'
        - $ref: '#/components/parameters/campaignId'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHostingOrdersResponse'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/hostingOrders/{hostingOrderId}:
    get:
      tags:
        - Hosting Orders
      summary: Get hosting order
      description: Returns the hosting order specified by the hosting order ID.
      operationId: HostingOrderService_GetHostingOrder
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/hostingOrderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingOrder'
              example:
                projectId: d1923022-5199-4bb3-a513-c47n7a656bc5
                hostingOrderId: 01arz3nhyrtsv4rrffq69g5fav
                displayName: Hosting order with campaignId, nnid and smsAppId
                regionCode: US
                state: SUBMITTED
                type: IMPORT
                createdTime: '2023-01-12T14:34:40.968Z'
                updatedTime: '2023-01-12T14:34:40.968Z'
                scheduledOsrUpdateTime: '2023-01-13T14:34:40.968Z'
                servicePlanId: 16e5c8d2odc842bda9a1b90e1673c174
                campaignId: C3O84GA
                migrateToSinchTmo: true
                callbackUrl: https://www.your-callback-server.com/callback
                hostingOrderInfo:
                  businessName: Sinch AB
                  authorisedPerson:
                    firstName: John
                    lastName: Smith
                    email: email@domain.com
                  address:
                    buildingNumber: '2433'
                    street: Vesta Drive
                    city: Chicago
                    state: IL
                    postalCode: '60647'
                    country: US
                  serviceProvider: Sinch America Inc.
                  currentVoiceCarrier: Verizon
                  nnid: '104029'
                  loaType: DIRECT
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/hostingOrders/{hostingOrderId}/report:
    get:
      summary: Retrieve a hosting order report
      description: Returns the report object for a specific hosting order
      operationId: GetHostingOrderReport
      responses:
        '200':
          $ref: '#/components/responses/HostingOrderReportResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/hostingOrderId'
      tags:
        - Hosting Orders
  /v1/projects/{projectId}/hostingOrders/{hostingOrderId}/numbers:
    get:
      tags:
        - Hosting Orders
      summary: List hosting order numbers
      description: Lists the numbers belonging to the specified hosting order.
      operationId: HostingOrderService_ListHostingOrderNumbers
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/hostingOrderId'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/osrUpdateState'
        - name: campaignProvisioningState
          description: Filter the results by the state of the campaign provisioning.
          in: query
          schema:
            $ref: '#/components/schemas/State'
        - name: platformProvisioningState
          description: Filter the results by the state of the platform provisioning.
          in: query
          schema:
            $ref: '#/components/schemas/State'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHostingOrderNumbersResponse'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/hostingOrders/{hostingOrderId}/numbers/{phoneNumber}:
    get:
      tags:
        - Hosting Orders
      summary: Get hosting order number
      description: >-
        Returns the specified phone number belonging to the specified hosting
        order.
      operationId: HostingOrderService_GetHostingOrderNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/hostingOrderId'
        - $ref: '#/components/parameters/phoneNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostingOrderNumber'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/hostingOrders:importNumbers:
    post:
      tags:
        - Hosting Orders
      summary: Import numbers using hosting orders
      description: >-
        Import numbers associated with hosting orders of a specific project and
        schedule the async provisioning to Sinch SMS platform and linking to
        campaign if applicable.


        <b>Note:</b> This operation is limited to five numbers. If you want to
        increase the quantity of numbers you can import using this operation,
        please contact your account manager for authorization.
      operationId: HostingOrderService_ImportNumbers
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        $ref: '#/components/requestBodies/ImportNumbersRequest'
      responses:
        '200':
          $ref: '#/components/responses/ImportNumbersHostingOrderResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/hostingOrders:textEnableNumbers:
    post:
      summary: Text enable numbers in hosting orders
      description: >-
        Text enable numbers associated with hosting orders of a specific
        project.
      operationId: TextEnableNumbers
      requestBody:
        $ref: '#/components/requestBodies/TextEnableNumbersRequest'
      responses:
        '200':
          $ref: '#/components/responses/HostingOrderResponse'
        '400':
          $ref: '#/components/responses/TextEnableNumbers_InvalidArgumentResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/AlreadyExistsResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
      parameters:
        - $ref: '#/components/parameters/projectId'
      tags:
        - Hosting Orders
  /v1/projects/{projectId}/hostingOrders:textEnableTollFreeNumbers:
    post:
      summary: Text enable Toll Free numbers in hosting orders
      description: >-
        Text enable Toll Free numbers associated with hosting orders of a
        specific project.
      operationId: TextEnableTollFreeNumbers
      requestBody:
        $ref: '#/components/requestBodies/TextEnableTollFreeNumbersRequest'
      responses:
        '200':
          $ref: '#/components/responses/HostingOrderResponse'
        '400':
          $ref: '#/components/responses/TextEnableNumbers_InvalidArgumentResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/AlreadyExistsResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
      parameters:
        - $ref: '#/components/parameters/projectId'
      tags:
        - Hosting Orders
  /v1/projects/{projectId}/callbackConfiguration:
    get:
      summary: Get callbacks configuration
      description: Returns the callbacks configuration for the specified project
      operationId: GetCallbackConfiguration
      responses:
        '200':
          description: Callbacks configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackConfiguration'
        '400':
          description: 400 Invalid Argument error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
        '404':
          description: 404 Not Found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: 500 Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      parameters:
        - $ref: '#/components/parameters/projectId'
      tags:
        - Imported Numbers and Hosting Orders Callbacks
    patch:
      summary: Update callback configuration
      description: Updates the callbacks configuration for the specified project
      operationId: UpdateCallbackConfiguration
      requestBody:
        description: The callback configuration details to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackConfigurationUpdate'
      responses:
        '200':
          description: Callback configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackConfiguration'
        '400':
          description: 400 Invalid Argument error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgument'
        '404':
          description: 404 Not Found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: 500 Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
      parameters:
        - $ref: '#/components/parameters/projectId'
      tags:
        - Imported Numbers and Hosting Orders Callbacks
  /v1/projects/{projectId}/qualifiedNumbers:
    get:
      tags:
        - Qualified Numbers
      summary: List qualified numbers
      description: Returns a list of qualified numbers for the project.
      operationId: QualifiedNumberService_ListQualifiedNumbers
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/regionCode'
        - $ref: '#/components/parameters/globalProcessStates'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/pageToken'
        - $ref: '#/components/parameters/orderBy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListQualifiedNumber'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/qualifiedNumbers/{phoneNumber}:
    get:
      tags:
        - Qualified Numbers
      summary: Get qualified number
      description: Return a qualified number as specified by the phone number in the path.
      operationId: QualifiedNumberService_GetQualifiedNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualifiedNumber'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Qualified Numbers
      summary: Delete qualified number
      description: Deletes a qualified number as specified by the phone number in the path.
      operationId: QualifiedNumberService_DeleteQualifiedNumber
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      responses:
        '200':
          description: OK
          content: {}
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/qualifiedNumbers:addNumbers:
    post:
      tags:
        - Qualified Numbers
      summary: Create qualified number batch
      description: >-
        Create a request to qualify a batch of numbers. After you have submitted
        the request, you must send an email to orders@sinch.com attaching all of
        the invoices related to the phone numbers in the request. In most cases,
        it will take the Sinch team 1-3 days to review your documentation and
        qualify your numbers.
      operationId: QualifiedNumberService_BatchCreateQualifiedNumbers
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateQualifiedNumbersRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateQualifiedNumbersResponse'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/qualifiedNumbers:textEnableNumbers:
    post:
      tags:
        - Qualified Numbers
      summary: Text enable numbers
      description: >-
        Enables text capability for the specified qualified numbers. You can
        enable up to 500 numbers at once. To enable a number for SMS, you must
        include a Campaign ID and billing information for a Letter of
        Authorization to be generated. The information required can differ
        depending on if you are a direct customer of Sinch or a reseller. The
        Letter of Authorization will be sent to the email you provide in the
        request to be e-signed.
      operationId: QualifiedNumberService_TextEnableNumbers
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextEnableNumbersRequest'
            examples:
              directLOAExample:
                summary: Direct customer LOA
                value:
                  regionCode: US
                  numbers:
                    - '+12025550134'
                  servicePlanId: YOUR_service_plan_id
                  campaignId: YOUR_campaign_id
                  directLoaInfo:
                    authorisedPerson:
                      firstName: John
                      lastName: Doe
                      email: john.doe@email.com
                    address:
                      buildingNumber: '1234'
                      street: Main St
                      city: NYC
                      state: NY
                      postalCode: '01002'
                      country: US
                    currentVoiceCarrier: Verizon
                  scheduledOsrUpdateTime: '2023-01-13T14:34:40.968Z'
                  migrateToSinchTmo: true
              resellerLOAExample:
                summary: Reseller LOA
                value:
                  regionCode: US
                  numbers:
                    - '+12025550134'
                  servicePlanId: YOUR_service_plan_id
                  campaignId: YOUR_campaign_id
                  resellerLoaInfo:
                    businessName: Acme, Inc.
                    authorisedPerson:
                      firstName: John
                      lastName: Doe
                      email: john.doe@email.com
                    address:
                      buildingNumber: '1234'
                      street: Main St
                      city: NYC
                      state: NY
                      postalCode: '01002'
                      country: US
                    currentVoiceCarrier: Verizon
                  scheduledOsrUpdateTime: '2023-01-13T14:34:40.968Z'
                  migrateToSinchTmo: true
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextEnableResponse'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/qualifiedNumbers:textEnableTollFreeNumbers:
    post:
      summary: Text enable Toll Free qualified numbers
      description: >-
        Text enable Toll Free qualified numbers of a specific project by
        creating a hosting order.
      operationId: QualifiedNumbersTextEnableTollFreeNumbers
      requestBody:
        $ref: '#/components/requestBodies/TextEnableTollFreeNumbersRequest'
      responses:
        '200':
          $ref: '#/components/responses/HostingOrderResponse'
        '400':
          $ref: '#/components/responses/TextEnableNumbers_InvalidArgumentResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/AlreadyExistsResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
      parameters:
        - $ref: '#/components/parameters/projectId'
      tags:
        - Qualified Numbers
  /v1/projects/{projectId}/qualifiedNumbers/{phoneNumber}:verifyVoiceChallenge:
    post:
      tags:
        - Qualified Numbers
      summary: Verify voice challenge
      description: >-
        Uses the code you received from the Send voice challenge operation to
        verify that you own the phone number.
      operationId: QualifiedNumberService_VerifyVoiceChallenge
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyVoiceChallengeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualifiedNumber'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/qualifiedNumbers/{phoneNumber}:sendVoiceChallenge:
    post:
      tags:
        - Qualified Numbers
      summary: Send voice challenge
      description: >-
        Sends a voice challenge to the phone number specified in the path to
        verify that you own the number. The voice call contains a code that you
        must use to verify the number.
      operationId: QualifiedNumberService_SendVoiceChallenge
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/phoneNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualifiedNumber'
        '404':
          description: 'NOT FOUND: The resource could not be found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL: Internal server error. Typically, a server bug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    projectId:
      name: projectId
      description: >-
        Found on your [Sinch Customer
        Dashboard](https://dashboard.sinch.com/settings/project-management).
        Settings > Projects.
      in: path
      required: true
      schema:
        type: string
        example: d1923022-5199-4bb3-a513-c47b3a656bc5
    hostingOrderId:
      name: hostingOrderId
      description: >-
        Found on your [Sinch Customer
        Dashboard](https://dashboard.sinch.com/settings/project-management).
        Settings > Projects.
      in: path
      required: true
      schema:
        type: string
        example: 01arz3ndektsv4rrffq69g5fav
    phoneNumber:
      name: phoneNumber
      description: >-
        The phone number in
        [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537) format
        with leading `+`.
      in: path
      required: true
      schema:
        type: string
        example: '+12025550134'
    numberPattern.pattern:
      name: numberPattern.pattern
      description: >-
        Sequence of digits to search for. If you prefer or need certain digits
        in sequential order, you can enter the sequence of numbers here.

        When using `START`, a plus sign (+) must be included and URL encoded.
        For example, to search for area code 206 in the US, the url encoded
        string would be `%2B1206`
      in: query
      required: false
      schema:
        type: string
        example: '+1732'
    numberPattern.searchPattern:
      name: numberPattern.searchPattern
      description: >-
        Search pattern to apply. The options are, `START`, `CONTAIN`, and `END`.

        Numbers that begin with the `numberPattern.pattern` entered. Often used
        to search for a specific area code.
      in: query
      required: false
      schema:
        type: string
        enum:
          - START
          - CONTAIN
          - END
        x-enumDescriptions:
          START: Number starts with specified pattern.
          CONTAIN: Number contains specified pattern.
          END: Number ends with specified pattern.
        example: START
    regionCode:
      name: regionCode
      description: >-
        Region code to filter by. ISO 3166-1 alpha-2 country code of the phone
        number. Currently supported are US, CA
      in: query
      required: false
      schema:
        type: string
        example: US
    servicePlanIdOpt:
      name: servicePlanId
      description: The hosting order servicePlanId
      in: query
      required: false
      schema:
        type: string
        example: 324e4567-e89b-12d3-a456-426614174000
    campaignIdOpt:
      name: campaignId
      description: The hosting order campaignId
      in: query
      required: false
      schema:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
    states:
      name: states
      description: The hosting order states
      in: query
      required: true
      schema:
        type: string
        enum:
          - HOSTING_ORDER_STATE_UNSPECIFIED
          - DRAFT
          - SUBMITTED
          - WAITING_FOR_LOA_SIGNATURE
          - IN_PROGRESS
          - COMPLETED
          - REJECTED
        x-enumDescriptions:
          HOSTING_ORDER_STATE_UNSPECIFIED: State is unspecified.
          DRAFT: Hosting order is a draft.
          SUBMITTED: Hosting order has been submitted.
          WAITING_FOR_LOA_SIGNATURE: Hosting order is waiting for the LoA signature.
          IN_PROGRESS: Hosting order is in progress.
          COMPLETED: Hosting order is completed.
          REJECTED: Hosting order is rejected.
    type:
      name: type
      description: The hosting order type
      in: query
      required: true
      schema:
        type: string
        enum:
          - HOSTING_ORDER_TYPE_UNSPECIFIED
          - IMPORT
          - TYPE_TEXT_ENABLE
        x-enumDescriptions:
          HOSTING_ORDER_TYPE_UNSPECIFIED: Type is unspecified.
          IMPORT: Type is importing numbers.
          TYPE_TEXT_ENABLE: Type is text enabling numbers.
    servicePlanId:
      name: servicePlanId
      description: The hosting order servicePlanId
      in: query
      required: true
      schema:
        type: string
        example: 324e4567-e89b-12d3-a456-426614174000
    campaignId:
      name: campaignId
      description: The hosting order campaignId
      in: query
      required: true
      schema:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
    orderBy:
      name: orderBy
      description: Parameter used to order the returned hosting orders
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdTime
          - updatedTime
        x-enumDescriptions:
          createdTime: Order by the time the hosting order was created.
          updatedTime: Order by the time the hosting order was last updated.
    pageSize:
      name: pageSize
      description: >-
        The maximum number of items to return, server can enforce an upper limit
        and overwrite the value.
      in: query
      required: false
      schema:
        type: integer
        example: 20
    pageToken:
      name: pageToken
      description: The next page token value returned from a previous listing.
      in: query
      required: false
      schema:
        type: string
        example: C2VNYXJrEg4KDCsxMjAxMjI2MzUyOQ==
    globalProcessStates:
      name: states
      description: The qualified number states
      in: query
      required: true
      schema:
        type: string
        enum:
          - GLOBAL_PROCESS_STATE_ELIGIBLE_CHECK_PENDING
          - GLOBAL_PROCESS_STATE_ELIGIBLE
          - GLOBAL_PROCESS_STATE_NOT_ELIGIBLE
          - GLOBAL_PROCESS_STATE_VERIFICATION_PENDING
          - GLOBAL_PROCESS_STATE_VERIFICATION_FAILED
          - GLOBAL_PROCESS_STATE_VERIFICATION_BLOCKED
          - GLOBAL_PROCESS_STATE_VERIFIED
          - GLOBAL_PROCESS_STATE_HOSTING_IN_PROGRESS
          - GLOBAL_PROCESS_STATE_HOSTING_DONE
          - GLOBAL_PROCESS_STATE_HOSTING_FAILED
          - GLOBAL_PROCESS_STATE_UNSPECIFIED
        x-enumDescriptions:
          GLOBAL_PROCESS_STATE_UNSPECIFIED: The state is unspecified.
          GLOBAL_PROCESS_STATE_ELIGIBLE_CHECK_PENDING: The check for eligibility is pending.
          GLOBAL_PROCESS_STATE_ELIGIBLE: The state is eligible.
          GLOBAL_PROCESS_STATE_NOT_ELIGIBLE: The state is not eligible.
          GLOBAL_PROCESS_STATE_VERIFICATION_PENDING: The state verification is pending.
          GLOBAL_PROCESS_STATE_VERIFICATION_FAILED: The state verification failed.
          GLOBAL_PROCESS_STATE_VERIFICATION_BLOCKED: The state verification is blocked.
          GLOBAL_PROCESS_STATE_VERIFIED: The state is verified.
          GLOBAL_PROCESS_STATE_HOSTING_IN_PROGRESS: Hosting process is in progress.
          GLOBAL_PROCESS_STATE_HOSTING_DONE: Hosting process is done.
          GLOBAL_PROCESS_STATE_HOSTING_FAILED: Hosting process failed.
        example: GLOBAL_PROCESS_STATE_HOSTING_IN_PROGRESS
    osrUpdateState:
      name: osrUpdateState
      description: Filter the results by the state of the OSR update.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/State'
