        information about basic authentication in the Numbers API, click
        [here](https://developers.sinch.com/docs/numbers/api-reference/authentication/basic).
      scheme: basic
    OAuth2.0:
      type: oauth2
      description: >-
        The username and password are your Key ID and Key Secret from the
        [Access keys section](https://dashboard.sinch.com/settings/access-keys)
        in the Sinch Customer Dashboard. Exchange these for a bearer token
        (access token). Learn how
        [here](https://developers.sinch.com/docs/numbers/api-reference/authentication/oauth).
      flows:
        clientCredentials:
          tokenUrl: https://auth.sinch.com/oauth2/token
          scopes: {}
