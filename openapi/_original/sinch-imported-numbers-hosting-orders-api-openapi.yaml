  schemas:
    CreateImportedNumberRequest:
      title: Create Imported Number
      required:
        - regionCode
        - smsConfiguration
      allOf:
        - $ref: '#/components/schemas/ImportedNumber'
    CreateTextEnabledNumberRequest:
      title: Text Enable Number
      required:
        - projectId
        - phoneNumber
        - regionCode
      type: object
      properties:
        projectId:
          type: string
          description: >-
            The ID of the project resource. You can find your project ID on
            dashboard.sinch.com.
          example: YOUR_project_id
        phoneNumber:
          type: string
          description: The phone number in e.164 format with leading +.
          example: '+12025550134'
        regionCode:
          type: string
          description: >-
            ISO 3166-1 alpha-2 country code of the phone number. Example US, UK
            or SE.
          example: US
        displayName:
          type: string
          description: User supplied name for the phone number.
          example: MyPhoneNumber
        servicePlanId:
          type: string
          description: The service plan ID for the phone number.
          example: YOUR_service_plan_id
        campaignId:
          type: string
          description: The campaign ID for the phone number.
          example: YOUR_campaign_id
        nnid:
          type: string
          description: The Net Number ID identifying the phone number.
      description: Request message for creating text enabled phone number.
    ErrorResponse:
      type: object
      properties:
        code:
          example: '404'
          type: string
          description: The HTTP response code for the error.
        message:
          example: The imported number could not be found.
          type: string
          description: The friendly message describing the reason for the error response.
        status:
          example: NOT_FOUND
          type: string
          description: The HTTP response status for the error.
      description: The schema for an error response.
    ImportedNumber:
      type: object
      properties:
        phoneNumber:
          type: string
          description: The phone number in e.164 format with leading +.
          example: '+12025550134'
        projectId:
          type: string
          description: >-
            The ID of the project resource. You can find your project ID on
            dashboard.sinch.com.
          example: YOUR_project_id
        regionCode:
          type: string
          description: >-
            ISO 3166-1 alpha-2 country code of the phone number. Example US, UK
            or SE.
          example: US
        displayName:
          type: string
          description: User supplied name for the phone number.
          example: MyPhoneNumber
        smsConfiguration:
          $ref: '#/components/schemas/SmsConfiguration'
        callbackUrl:
          type: string
          description: >-
            The client's callback URL to be called upon finishing the number
            import.
          example: https://www.your-callback-server.com/callback
    ImportedNumberResponse:
      allOf:
        - $ref: '#/components/schemas/ImportedNumber'
        - $ref: '#/components/schemas/MnoConfiguration'
        - $ref: '#/components/schemas/SmsProvisioning'
        - $ref: '#/components/schemas/CampaignProvisioning'
    ListImportedNumbersResponse:
      title: List Imported Numbers Response
      type: object
      properties:
        importedNumbers:
          type: array
          items:
            $ref: '#/components/schemas/ImportedNumberResponse'
          description: >-
            List of numbers associated to the client project specified in
            `ListImportedNumbers`.
        nextPageToken:
          type: string
          description: The token to be used for listing the next page.
        totalSize:
          type: integer
          description: https://cloud.google.com/apis/design/design_patterns#list_pagination
          format: int32
      description: Response message to list your imported phone numbers
    SmsProvisioning:
      description: An object giving details about the SMS provisioning of the number.
      type: object
      properties:
        smsProvisioning:
          description: An object giving details about the SMS provisioning of the number.
          type: object
          properties:
            serviceType:
              $ref: '#/components/schemas/ServiceType'
            serviceId:
              description: A unique identifier for the service being provisioned.
              type: string
              example: 0130a21c9ed6461ba3a1fefda83f7ec7
            type:
              $ref: '#/components/schemas/Type'
            state:
              $ref: '#/components/schemas/State'
            updateTime:
              type: string
              description: >-
                A timestamp in ISO 8601 format (UTC) indicating the last time
                the provisioning status was updated.
              example: '2023-02-02T21:00:07.467353Z'
            errorMessage:
              type: string
              description: >-
                If an error occurred during provisioning, this field will
                contain a descriptive message. It will be an empty string if no
                error is present.
              example: ''
            errorCode:
              type: string
              description: >-
                If an error occurred during provisioning, this field will
                contain the error code. This field is also an empty string when
                no error has occurred.
              example: ''
    CampaignProvisioning:
      description: An object giving details about the campaign provisioning of the number.
      type: object
      properties:
        campaignProvisioning:
          description: >-
            An object giving details about the campaign provisioning of the
            number.
          type: object
          properties:
            serviceType:
              $ref: '#/components/schemas/ServiceType'
            serviceId:
              description: A unique identifier for the service being provisioned.
              type: string
              example: CDCQLGJ
            type:
              $ref: '#/components/schemas/Type'
            state:
              $ref: '#/components/schemas/State'
            updateTime:
              type: string
              description: >-
                A timestamp in ISO 8601 format (UTC) indicating the last time
                the provisioning status was updated.
              example: '2023-02-02T21:00:07.467353Z'
            errorMessage:
              type: string
              description: >-
                If an error occurred during provisioning, this field will
                contain a descriptive message. It will be an empty string if no
                error is present.
              example: ''
            errorCode:
              type: string
              description: >-
                If an error occurred during provisioning, this field will
                contain the error code. This field is also an empty string when
                no error has occurred.
              example: ''
    ServiceType:
      description: The type of service.
      type: string
      enum:
        - SMS
        - CAMPAIGN
      x-enumDescriptions:
        SMS: SMS provisioning.
        CAMPAIGN: Campaign provisioning.
    Type:
      description: >-
        Specifies the type of operation. This value of this field is either
        "PROVISIONING" or "DEPROVISIONING".
      type: string
      enum:
        - PROVISIONING
        - DEPROVISIONING
      x-enumDescriptions:
        PROVISIONING: The operation is provisioning the number.
        DEPROVISIONING: The operation is deprovisioning the number.
    ScheduledProvisioning:
      readOnly: true
      type: object
      properties:
        servicePlanId:
          type: string
          description: Service plan of the scheduled provisioning task.
          example: YOUR_service_plan_id
        status:
          type: integer
          description: Status of the pending change.
          format: enum
        lastUpdatedTime:
          type: string
          description: Timestamp when the status was last updated.
          format: date-time
        campaignId:
          type: string
          description: The campaign of the scheduled provisioning task.
          example: YOUR_campaign_id
        errorCodes:
          type: array
          items:
            type: integer
            format: enum
          description: >-
            A list of error codes, if applicable, for the scheduled provisioning
            task.
      description: Ongoing Provisioning for SMS service
    MnoConfiguration:
      type: object
      properties:
        mnoConfiguration:
          type: object
          description: >-
            The mnoConfiguration object represents the status and progress of
            configuration operations for SMS and MMS services across different
            carriers (AT&T and T-Mobile). Each key within this object (smsAtt,
            smsTmo, mmsAtt and mmsTmo) corresponds to a specific service type
            (SMS or MMS) associated with a particular mobile network operator.
          properties:
            smsAtt:
              description: Contains information about SMS-enabled ATT&T numbers.
              allOf:
                - $ref: '#/components/schemas/CarrierState'
                - type: object
                  properties:
                    operation:
                      $ref: '#/components/schemas/Operation'
            smsTmo:
              description: Contains information about SMS-enabled T-Mobile numbers.
