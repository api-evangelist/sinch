          example: a99aa9aa-b888-777c-dd6d-ee55e5555555
        hmacSecret:
          type: string
          description: >-
            The HMAC secret used for hashing the callback body using the
            HMAC-SHA1 algorithm - and for creating the `X-Sinch-Signature`
            header.
          example: YOUR_hmac_secret
    CallbackConfigurationUpdate:
      title: CallbackConfigurationUpdate
      type: object
      properties:
        hmacSecret:
          type: string
          description: The HMAC secret to be updated for the specified project
      description: >-
        The request to update the callbacks configuration for the current
        project.
    CallbackPayload:
      type: object
      properties:
        resourceType:
          type: string
          description: The type of the resource.
          enum:
            - IMPORTED_NUMBER
            - HOSTING_ORDER_NUMBER
          x-enumDescriptions:
            IMPORTED_NUMBER: >-
              Numbers imported individually or previously imported successfully
              via hosting orders but later updated.
            HOSTING_ORDER_NUMBER: Numbers that are imported as part of a hosting order.
          example: IMPORTED_NUMBER
        eventType:
          type: string
          description: The type of the event.
          enum:
            - PROVISIONING_TO_SMS_PLATFORM
            - DEPROVISIONING_TO_SMS_PLATFORM
            - LINK_TO_10DLC_CAMPAIGN
            - UNLINK_TO_10DLC_CAMPAIGN
            - HOSTING_PROCESS
            - OSR_UPDATE
            - DELETE
          x-enumDescriptions:
            PROVISIONING_TO_SMS_PLATFORM: An event that occurs when a number is linked to a Service Plan ID.
            DEPROVISIONING_TO_SMS_PLATFORM: >-
              An event that occurs when a number is unlinked from a Service Plan
              ID.
            LINK_TO_10DLC_CAMPAIGN: An event that occurs when a number is linked to a Campaign.
            UNLINK_TO_10DLC_CAMPAIGN: An event that occurs when a number is unlinked from a Campaign.
            HOSTING_PROCESS: >-
              An event that indicates the success or failure of a number's
              hosting process.
            OSR_UPDATE: An event that occurs when an OSR update is performed for a number.
            DELETE: An event that occurs when a number is deleted.
          example: LINK_TO_10DLC_CAMPAIGN
        eventId:
          type: string
          description: The ID of the event.
          example: abcd1234efghijklmnop567890
        timestamp:
          type: string
          description: >-
            The date and time when the callback was created and added to the
            callbacks queue in ISO 8601 format (UTC).
          format: date-time
          example: '2023-06-06T07:45:27.785357Z'
        projectId:
          type: string
          description: The ID of the project to which the event belongs.
          example: abcd12ef-ab12-ab12-bc34-abcdef123456
        resourceId:
          type: string
          description: >-
            The unique identifier of the resource, depending on the resource
            type. For example, a phone number, a hosting order ID, or a brand
            ID.
          example: '+12345612345'
        status:
          type: string
          description: The status of the event. For example, `SUCCEEDED` or `FAILED`.
          x-enumDescriptions:
            SUCCEEDED: The event has succeeded.
            FAILED: The event has failed.
          enum:
            - SUCCEEDED
            - FAILED
          example: FAILED
        failureCode:
          type: string
          description: >-
            If the status is FAILED, a failure code will be provided. For
