openapi: 3.0.3
info:
  title: Elastic SIP Trunk API
  description: >-
    This document provides a detailed user guide and reference documentation on
    the Sinch Elastic SIP Trunk API. For information on how to authenticate API
    requests, please check the Authentication section.


    ## Authentication


    Elastic SIP Trunk API supports both
    [basic](https://developers.sinch.com/docs/est/api-reference/est/section/authentication#basic)
    and
    [OAuth2](https://developers.sinch.com/docs/est/api-reference/est/section/authentication#oauth2)
    authentication types.


    ### Basic


    {% partial file="/partials/authentication/basic/_intro.md"/ %}

    {% partial file="/partials/authentication/basic/_instructions.md"/ %}


    ### OAuth2


    {% partial file="/partials/authentication/oauth/_intro.md"/ %}

    {% partial file="/partials/authentication/oauth/_instructions.md"/ %}


    ## Servers


    Elastic SIP Trunk API serves all endpoints from the following server:


    ```https://elastic-trunking.api.sinch.com/v1/projects/{projectId}```


    {% admonition type="info" name="Note:" %}

    The `projectId` is a required parameter you must include when making any API
    calls. You can find your project ID on your
    [dashboard](https://dashboard.sinch.com).

    {% /admonition %}
  version: 1.0.0
  license:
    name: MIT
    url: https://www.sinch.com/toc
  contact:
    email: support@sinch.com
    name: support at sinch
security:
  - Basic: []
  - OAuth2.0: []
servers:
  - url: https://elastic-trunking.api.sinch.com
tags:
  - name: SIP Trunks
    description: >-
      The SIP Trunks endpoint has operations that allow you to create, view,
      update, and remove SIP trunks.
  - name: SIP Endpoints
    description: >-
      A SIP endpoint is the resource that represents your SIP infrastructure,
      typically an SBC. Note the Elastic SIP Trunk API does not support user
      registration and presence.
  - name: Country Permissions
    description: >-
      Country permissions are used to control which countries can be dialed from
      a specific SIP trunk. You can view, update, and remove country
      permissions. For beta, only US, CA and wild card are supported.

      Please note that these permissions are not per trunk but rather they are
      per project/account. In the future Sinch may extend these permissions to
      other voice and messaging products.

      If you are using sub-projects you can use the same country permissions for
      all sub-projects.

      You can also specify different country permissions for each sub-project
      that will override the parent country permissions.
  - name: Phone Numbers
    description: >-
      The `/phoneNumbers` endpoint has operations that allow you to assign and
      remove phone numbers from SIP trunks.
  - name: Calls
    description: >-
      The `/calls` endpoint has operations that allow you to retrieve call
      history and details about calls made or received using EST.
  - name: Call Blocking Rules
    description: >-
      The Call Blocking Rules endpoint has operations that allow you to
      configure and manage your call blocking rules for your EST solution.
  - name: Access Control List
    description: >-
      The Access Control List (ACL) endpoint has operations that allow you to
      create, view, update, and remove ACLs.

      You use ACLs to control which IP addresses can send traffic to your SIP
      trunk. You can create multiple ACLs and assign them to multiple SIP
      trunks. In order to make outbound calls you need to have at least one ACL
      set up.
    x-displayName: Access Control Lists
  - name: Credential Lists
    description: >-
      The Credential Lists endpoint has operations that allow you to view and
      manage credential lists. 

      You use credential lists to easily configure which users are allowed to
      make calls on a trunk.
  - name: Credentials
    description: >-
      The Credentials endpoint has operations that allow you to manage
      credentials within a credential list.
  - name: Projects
    description: Manage your Elastic SIP Trunking projects.
paths:
  /v1/projects/{projectId}/calls:
    get:
      summary: Find calls
      description: Find calls by query parameters.
      operationId: findCalls
      tags:
        - Calls
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: from
          in: query
          description: >-
            A phone number that you want to use to filter results. You can pass
            a partial number to get all calls sent to numbers that start with
            the number you passed.
          required: false
          schema:
            type: string
            format: phonenumber
        - name: to
          in: query
          description: >-
            Only include calls made to this number or address. You can pass a
            partial number to get all calls sent to numbers that start with the
            number you passed.
          required: false
          schema:
            type: string
            format: phonenumber
        - name: trunkId
          in: query
          description: Only include calls made from this trunk.
          required: false
          schema:
            type: string
        - name: createTime
          description: >-
            Filter calls based on  `createTime`. You make the query more
            precise, fewer results will be returned.

            For example, 2021-02-01 will return all calls from the first of
            February 2021, and 2021-02-01T14:00:00Z will return all calls after
            14:00 on the first of February.

            This field also supports <= and >= to search for calls in a range
            ?createTime>=2021-10-01&createTime<=2021-10-30 to get a list if
            calls for october 2021

            It is also possible to submit partial dates for example
            createTime=2021-02 will return all calls for February


            ***Defaults to 24 hours***


            ***Internal notes***

            If a customer submits = and not <> we should add min and max for the
            date range

            psueodo sql


            ```

            createTime = 2021-02-01

            select * from calls where createTime >= 2021-02-01 and createTime <=
            2021-02-01T23:59:59Z


            createTime = 2021-02-01T08

            select * from calls where createTime >= 2021-02-01T08:00:00 and
            createTime <= 2021-02-01T08:59:59Z

            ```


            but if they submit < or > we should just use the value they
            submitted and parse it a complete date
          required: false
          in: query
          schema:
            type: string
            example: '2021-02-01'
            default: now-24h
        - name: callResult
          in: query
          description: >-
            only include calls by on the callResult(s), example
            callResult=COMPLETED will return all calls which have completed
            normally.
          required: false
          schema:
            $ref: '#/components/schemas/CallResult'
        - name: direction
          in: query
          description: >-
            only include calls by on the direction(s), example
            direction=INBOUND,OUTBOUND will return all calls that are inbound or
            outbound.
          required: false
          schema:
            type: string
            description: Filter results based on the call direction.
            enum:
              - INBOUND
              - OUTBOUND
            x-ga-description: >-
              Describes whether the call was `INBOUND` *to* your Sinch number or
              was `OUTBOUND` and made *from* your Sinch number. An `INBOUND`
              call can also come from a SIP infrastructure or an application
              built using the Sinch SDK. An `OUTBOUND` call can be placed to a
              SIP infrastructure or an application built using the Sinch SDK.
            x-enumDescriptions:
              INBOUND: Somebody called your Sinch number.
              OUTBOUND: You called somebody from your SIP device.
        - name: page
          in: query
          description: The page you want to fetch
          schema:
            type: string
        - name: size
          in: query
          description: >-
            The maximum number of items to return per request. The default is
            100 and the maximum is 1000. If you need to export larger amounts
            and pagination is not suitable for you can use the Export function
            in the dashboard.
          schema:
            type: integer
            maximum: 1000
            minimum: 1
      responses:
        '200':
          description: Call result response
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      calls:
                        type: array
                        description: The list of calls that matches the query parameters.
                        items:
                          $ref: '#/components/schemas/Call'
                  - $ref: '#/components/schemas/Pagination'
      x-codeSamples:
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';

              // Replace with a valid 'from' number in your call history
              const fromFilter = '+1781';
              // Replace with one of: 'COMPLETED', 'NO_ANSWER', 'CANCEL', 'BUSY', 'FAILED'
              const callResultFilter = 'FAILED';

              const sinch = new SinchClient({ projectId, keyId, keySecret });

              try {
                const response = await sinch.elasticSipTrunking.calls.find({
                  from: fromFilter,
                  callResult: callResultFilter,
                });
                if (response.data.length === 0) {
                  console.log('No calls found matching your criteria.');
                  return;
                }
                console.log(`✅ Found ${response.data.length} calls.`);
                response.data.forEach((call) => {
                  console.log(call);
                });
              } catch (err) {
                console.error('❌ Failed to find calls:');
                console.error(err);
              }
            }

            main();
  /v1/projects/{projectId}/calls/export:
    get:
      tags:
        - Calls
      summary: Export call records
      description: >-
        Export call records for a project. This returns a comma separate value
        (CSV) response. You can specify which records to export using the query
        parameters.
      operationId: exportCallRecords
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: from
          in: query
          description: >-
            A phone number that you want to use to filter results. You can pass
            a partial number to get all calls sent to numbers that start with
            the number you passed.
          required: false
          schema:
            type: string
            format: phonenumber
        - name: to
          in: query
          description: >-
            Only include calls made to this number or address. You can pass a
            partial number to get all calls sent to numbers that start with the
            number you passed.
          required: false
          schema:
            type: string
            format: phonenumber
        - name: trunkId
          in: query
          description: Only include calls made from this trunk.
          required: false
          schema:
            type: string
        - name: createTime
          description: >-
            Filter calls based on  `createTime`. You make the query more
            precise, fewer results will be returned.

            For example, 2021-02-01 will return all calls from the first of
            February 2021, and 2021-02-01T14:00:00Z will return all calls after
            14:00 on the first of February.

            This field also supports <= and >= to search for calls in a range
            ?createTime>=2021-10-01&createTime<=2021-10-30 to get a list if
            calls for october 2021

            It is also possible to submit partial dates for example
            createTime=2021-02 will return all calls for February


            ***Defaults to 24 hours***
          required: false
          in: query
          style: form
          explode: true
          schema:
            type: string
            example: '2021-02-01'
            default: now-24h
        - name: callResult
          in: query
          description: >-
            only include calls by on the callResult(s), example
            callResult=COMPLETED will return all calls which have completed
            normally.
          required: false
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/CallResult'
        - name: direction
          in: query
          description: >-
            only include calls by on the direction(s), example
            direction=INBOUND,OUTBOUND will return all calls that are inbound or
            outbound.
          required: false
          style: form
          explode: false
          schema:
            type: string
            description: >-
              Filter results based on the call direction. Describes whether the
              call was `INBOUND` *to* your Sinch number or was `OUTBOUND` and
              made *from* your Sinch number. An `INBOUND` call can also come
              from a SIP infrastructure or an application built using the Sinch
              SDK. An `OUTBOUND` call can be placed to a SIP infrastructure or
              an application built using the Sinch SDK.
            enum:
              - INBOUND
              - OUTBOUND
            x-enumDescriptions:
              INBOUND: Somebody called your Sinch number.
              OUTBOUND: You called somebody from your SIP device.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: fromCountryCode
          in: query
          required: false
          description: >-
            Set this if you want to filter on the country of the caller phone
            number.
          schema:
            type: string
            example: US
        - name: toCountryCode
          in: query
          required: false
          description: >-
            Set this if you want to filter on the country of the callee phone
            number.
          schema:
            type: string
            example: CA
        - name: emergencyOnly
          in: query
          required: false
          description: Set this if you want to filter on emergency calls or not.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
            x-enumDescriptions:
              'true': Include only emergency calls.
              'false': Include all calls.
        - name: region
          in: query
          required: false
          description: Set this is you want to filter calls based on the region.
          schema:
            type: string
            example: us-east
        - name: projectIds
          in: query
          required: false
          description: Set this if you want to include calls from other projects.
          schema:
            type: string
        - name: fileName
          in: query
          required: false
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Set this if you want to filter calls based on the group ID.
          schema:
            type: string
            example: >-
              e234bd85-8uv5-44a2-a973-1f705a0960f5@vp3-i-06a73121dc26a8906.xmpp.vpc
        - name: parentId
          in: query
          required: false
          description: Set this if you want to filter calls based on the call's parent ID.
          schema:
            type: string
            example: 9128525b-7273-123f-73ae-0225d0254abb
        - name: relationshipType
          in: query
          required: false
          description: >-
            The type of relationship the call has, for example, an initial call
            or a child call.
          schema:
            type: string
            example: initial
        - name: hasChildren
          in: query
          required: false
          description: Set this if you want to filter on calls with children or not.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
            x-enumDescriptions:
              'true': Include only calls with children.
              'false': Include all calls.
      responses:
        '200':
          description: OK
          content:
            application/csv:
              schema:
                type: string
      x-codeSamples:
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';

              // Replace with a valid 'from' number in your call history
              const fromFilter = '+1440';
              // Replace with one of: 'COMPLETED', 'NO_ANSWER', 'CANCEL', 'BUSY', 'FAILED'
              const callResultFilter = 'FAILED';

              const sinch = new SinchClient({ projectId, keyId, keySecret });

              try {
                const response = await sinch.elasticSipTrunking.calls.export({
                  from: fromFilter,
                  callResult: callResultFilter,
                });
                console.log('✅ Successfully exported the call records.');
                console.log(response);
              } catch (err) {
                console.error('❌ Failed to export the call records:');
                console.error(err);
              }
            }

            main();
  /v1/projects/{projectId}/calls/records/{pcapId}/pcap:
    get:
      tags:
        - Calls
      summary: Get PCAPs by ID
      description: >-
        Return PCAPs by the PCAP ID. Returns a .pcap file of the requested call
        to download. You can find the PCAP ID in the response from
        ['/calls'](https://developers.sinch.com/docs/est/api-reference/est/calls/findcalls)
        endpoint. PCAPs are only available for calls from within the last 10
        days.
      operationId: getPcap
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: pcapId
          in: path
          description: The ID of the PCAP you want to retrieve.
          required: true
          schema:
            type: string
            example: 0a81e938-07bd-1240-8487-0ecf41868d11
        - name: direction
          in: query
          description: >-
            Request a PCAP for the call leg specified by the direction. If this
            query parameter is not included, the default behavior is to return
            OUTBOUND calls.
          required: false
          schema:
            type: string
            enum:
              - INBOUND
              - OUTBOUND
            x-enumDescriptions:
              INBOUND: Somebody called your Sinch number.
              OUTBOUND: You called somebody from your SIP device.
            default: OUTBOUND
      responses:
        '200':
          description: The .pcap file.
          content:
            application/octet-stream: {}
  /v1/projects/{projectId}/callBlockingRules:
    get:
      tags:
        - Call Blocking Rules
      summary: Get call blocking rules
      description: Return all the call blocking rules for the specified project.
      operationId: getBlockingRules
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallBlockingRule'
    post:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      tags:
        - Call Blocking Rules
      summary: Create call blocking rule
      description: Create a call blocking rule for the specified project.
      operationId: createBlockingRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallBlockingRule'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBlockingRule'
  /v1/projects/{projectId}/callBlockingRules/{id}:
    put:
      tags:
        - Call Blocking Rules
      summary: Update blocking rule
      description: Update the call blocking rule by the specified ID.
      operationId: updateBlockingRuleById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: id
          in: path
          required: true
          description: The ID of the call blocking rule to update.
          schema:
            type: string
            example: 01KG5BN8Z0HSR2P9GM3K9YA8RE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallBlockingRule'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBlockingRule'
    delete:
      tags:
        - Call Blocking Rules
      operationId: deleteBlockingRuleById
      summary: Delete blocking rule
      description: Delete a call blocking rule using its ID.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: id
          in: path
          required: true
          description: The ID of the call blocking rule to delete.
          schema:
            type: string
            example: 01KG5BN8Z0HSR2P9GM3K9YA8RE
      responses:
        '204':
          description: No Content
  /v1/projects/{projectId}/trunks/{sipTrunkId}/endpoints:
    get:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SipTrunkId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      tags:
        - SIP Endpoints
      summary: Return SIP endpoints
      description: Returns a list of all SIP endpoints with paging.
      operationId: getSipEndpoint
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      endpoints:
                        type: array
                        items:
                          $ref: '#/components/schemas/SipEndpoint'
      x-codeSamples:
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';

              // The SIP Trunk ID to list SIP Endpoints from
              const sipTrunkId = 'SIP_TRUNK_ID';

              const sinch = new SinchClient({ projectId, keyId, keySecret });

              try {
                const response = await sinch.elasticSipTrunking.sipEndpoints.list({
                  sipTrunkId,
                });
                if (response.data.length === 0) {
                  console.log(`No SIP Endpoints found for the SIP Trunk with ID ${sipTrunkId}.`);
                  return;
                }
                console.log(`✅ Found ${response.data.length} SIP Endpoints.`);
                response.data.forEach((endpoint) => {
                  console.log(endpoint);
                });
              } catch (err) {
                console.error(`❌ Failed to list the SIP Endpoints for the SIP Trunk with ID ${sipTrunkId}`);
                console.error(err);
              }
            }

            main();
    post:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SipTrunkId'
      tags:
        - SIP Endpoints
      summary: Create SIP endpoint
      description: Create a new SIP endpoint.
      operationId: createSipEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SipEndpoint'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      endpoints:
                        type: array
                        items:
                          $ref: '#/components/schemas/SipEndpoint'
      x-codeSamples:
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';

              // The SIP Trunk ID you want to create the endpoint in
              const sipTrunkId = 'SIP_TRUNK_ID';

              const sinch = new SinchClient({ projectId, keyId, keySecret });

              try {
                const response = await sinch.elasticSipTrunking.sipEndpoints.create({
                  sipTrunkId,
                  createSipEndpointRequestBody: {
                    address: '127.0.0.1',
                    name: 'Acme Endpoint',
                    priority: 1,
                  },
                });
                console.log('✅ Successfully created the SIP Endpoint.');
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error('❌ Failed to create the SIP Endpoint:');
                console.error(err);
              }
            }

            main();
  /v1/projects/{projectId}/trunks/{sipTrunkId}/endpoints/{sipEndpointId}:
