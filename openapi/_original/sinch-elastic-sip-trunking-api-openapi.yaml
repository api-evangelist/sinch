  schemas:
    AccessControlList:
      type: object
      required:
        - name
        - ipRanges
      properties:
        id:
          type: string
          description: The ID of the access control list entry.
          readOnly: true
        name:
          type: string
          description: Your name for the access control list entry.
          example: LA Office
        enabled:
          type: boolean
          description: >-
            Whether the access control list entry is enabled. You can use this
            to disable an list temporarily without deleting it.
          default: true
        ipRanges:
          type: array
          minItems: 1
          description: >-
            The associated IP ranges. When creating you need to submit at least
            one IP range.
          items:
            $ref: '#/components/schemas/IpRange'
        trunks:
          type: array
          readOnly: true
          description: The associated SIP trunks ID.
          items:
            type: string
            description: The ID of the SIP trunk.
        createTime:
          x-version: 1
          readOnly: true
          x-PII: false
          x-v1: true
          type: string
          format: date-time
          description: The time the call was created.
          example: '2021-11-01T23:20:50Z'
        updateTime:
          readOnly: true
          x-version: 1
          x-PII: false
          x-v1: true
          type: string
          format: date-time
          description: The time the call was created.
          example: '2021-11-01T23:20:50Z'
        projectId:
          x-version: 1
          readOnly: true
          type: string
          description: The ID of the project.
    IpRange:
      type: object
      description: A single or range of IP addresses.
      properties:
        id:
          type: string
          description: The ID of the IP range.
          readOnly: true
        description:
          type: string
          description: A description of the IP range.
          example: West wing of office
        ipAddress:
          type: string
          description: The start of the IP range.
          example: 10.0.1.1
        range:
          type: integer
          description: >-
            A range, also known as a CIDR, represents the number of leading bits
            that define the network portion of an IP address in CIDR notation.
            The range is specified after a slash (/) at the end of the IP
            address. The remaining bits define specific hosts within the
            network.

            - 10.0.0.0/8: Represents all IP addresses from 10.0.0.0 to
            10.255.255.255, allowing for over 16 million unique host addresses.

            - 172.16.0.0/16: Includes all IP addresses from 172.16.0.0 to
            172.16.255.255, providing up to 65,536 unique host addresses.

            - 192.168.1.0/24: Encompasses all IP addresses from 192.168.1.0 to
            192.168.1.255, offering 256 unique host addresses.

            - 192.168.1.0/32: Encompasses one ip address
          default: 32
          example: 32
        createTime:
          x-version: 1
          readOnly: true
          x-PII: false
          x-v1: true
          type: string
          format: date-time
          description: The time the call was created.
          example: '2021-11-01T23:20:50Z'
        updateTime:
          readOnly: true
          x-version: 1
          x-PII: false
          x-v1: true
          type: string
          format: date-time
          description: The time the call was created.
          example: '2021-11-01T23:20:50Z'
        projectId:
          x-version: 1
          readOnly: true
          type: string
          description: The ID of the project.
        accessControlListId:
          x-version: 1
          readOnly: true
          type: string
          description: The ID of the access control list.
    Call:
      description: >-
        The call resource represents an inbound or outbound connection between
        Sinch and a supported device
      type: object
      properties:
        callId:
          type: string
          description: The unique identifier of the call.
          format: ULID
        to:
          x-version: 1
          x-PII: true
          type: string
          description: >-
            For `INBOUND` calls, this is the Sinch number the phone dialed.

            For `OUTBOUND` calls, this is the phone number you want to make a
            call to.

            Formatted according e164 format.
        from:
          x-version: 1
          x-PII: true
          x-v1: breaking
          type: string
          x-mvp-description: >-
            The call's origination, formatted according to the call's
            `callType`. For calls to the telephone network, this is a phone
            number in
            [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537)
            format, including the leading `+`.

            <b>Note:</b> If you do not include the `from` property, the call is
            made from the number or identifier configured as the default for
            your application or service.
          description: >-
            For `INBOUND` calls, this is the number of the person calling. When
            making an outbound call set this to the your Sinch number you want
            to show up as Caller Id.

            The call's origination, formatted according to the call's
            `callType`. For calls in the telephone network,

            this is a phone number in
            [E.164](https://community.sinch.com/t5/Glossary/E-164/ta-p/7537)
            format, including the leading `+`.
          format: phoneNumber
          example: '+14155553434'
        direction:
          x-version: 1
          type: string
          enum:
            - INBOUND
            - OUTBOUND
          readOnly: true
          x-PII: false
          x-v1: false
          description: >-
            Describes whether the call was `INBOUND` *to* your Sinch number or
            was `OUTBOUND` and made *from* your Sinch number.
          x-enumDescriptions:
            INBOUND: Someone called your Sinch number.
            OUTBOUND: Someone called from your SIP device.
        answerTime:
          x-version: 1
          readOnly: true
          x-PII: false
          x-V1: breaking
          type: string
          format: date-time
          description: Time when call was answered
          example: '2021-11-01T23:26:50Z'
        endTime:
          x-version: 1
          readOnly: true
          type: string
          format: date-time
          x-PII: false
          x-V1: breaking
          description: The time the call ended
          example: '2021-11-01T23:29:50Z'
        durationSeconds:
          x-version: 1
          x-PII: false
          x-V1: breaking
          description: >-
            The duration of the call in seconds. For inbound calls, this is the
            time from when the call started until the call ended. For outbound
            calls, this is the time from when the call was answered until the
            call ended.
          readOnly: true
          type: integer
          example: 45
        callResult:
          $ref: '#/components/schemas/CallResult'
        pricePerMinute:
          description: The price per minute for this call.
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true
        billingDurationSeconds:
          x-version: 1
          readOnly: true
          description: The duration of the call adjusted with the billing period.
          type: integer
          example: 60
        price:
          x-version: 1
          description: >-
            The total price for this call. This field is populated when the call
            ends.
          allOf:
            - $ref: '#/components/schemas/Money'
          readOnly: true
        createTime:
          x-version: 1
          readOnly: true
          x-PII: false
          x-v1: true
          type: string
          format: date-time
          description: The time the call was created.
          example: '2021-11-01T23:20:50Z'
        projectId:
          x-version: 1
          type: string
          description: The ID of the project that the call belongs to.
        trunkId:
          x-version: 1
          example: dFeDe67-09d5-49d5-b469-e1fc2cb163c7
          type: string
          description: The ID of the trunk that the call was made through.
        pcapId:
          type: string
          description: >-
            The ID of the PCAP that can be retrieved. PCAPs are only stored for
            10 days.
          example: 0a81e938-07bd-1240-8487-0ecf41868d11
    SipTrunk:
      required:
        - name
        - hostName
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The SIP trunk id.
          example: ''
        hostName:
          type: string
          description: The host of the domain you would like to have for you trunk.
          example: acme-domain-1
        topLevelDomain:
          readOnly: true
          type: string
          description: The top level domain to which the SIP trunk belongs.
          example: .elastic-sip.sinch.com
        domain:
          readOnly: true
          type: string
          description: >-
            The fully qualified name of the domain, which is a combination of
            your 'hostName' and the 'topLevelDomain'.
          example: acme-domain-1.elastic-sip.sinch.com
        name:
          type: string
          description: The friendly name of your SIP trunk.
          example: Acme Trunk
        callsPerSecond:
          minimum: 1
          readOnly: true
          type: integer
          description: >-
            Number of calls started per second, to increase this please contact
            your account manager.
          example: 100
          default: 1
        enableCallerName:
          type: boolean
          description: Enable caller name lookup for incoming calls. US and canada only.
          example: true
          default: false
        callForwardNumber:
          type: string
          description: >-
            The valid E.164 phone number that will be dialed on inbound calls
            when no SIP endpoints are available. Required if `enableCallForward`
            property is `true`.
          example: '+17208511190'
          default: ''
        enableCallForward:
          type: boolean
          description: >-
            When enabled, if an inbound call can not be delivered to a SIP
            endpoint, calls will be forwarded to the configured
            `callForwardNumber`. To forward all calls without trying SIP, simply
            disable (or delete) all SIP endpoints on this trunk. Logs (and
            billing) will be created for 2 calls (inbound and outbound). 

            **Note:** Since there is no SIP connection, PCAPs will not be
            generated.
          example: true
          default: false
        createTime:
          type: string
          readOnly: true
          description: The date and time that the SIP trunk was created.
          format: date-time
          example: '2022-01-01T00:00:00Z'
        updateTime:
          type: string
          description: The date and time that the SIP trunk was last modified.
          format: date-time
          readOnly: true
          example: '2022-01-01T00:00:00Z'
        projectId:
          type: string
          readOnly: true
          description: The ID of the account.
          example: 1bf62742-7b84-4666-9cbe-8e5734fd57d0
      description: A created SIP trunk.
    Money:
      type: object
      readOnly: true
      properties:
        currencyCode:
          readOnly: true
          description: The 3-letter currency code defined in ISO 4217.
          type: string
          example: USD
        amount:
          readOnly: true
          description: The amount with 4 decimals and decimal delimiter `.`.
          type: string
          example: '0.0040'
    CallResult:
      description: The result of the call.
      readOnly: true
      type: string
      example: COMPLETED
      enum:
        - COMPLETED
        - NO_ANSWER
        - CANCEL
        - BUSY
        - FAILED
      x-enumDescriptions:
        COMPLETED: The call was completed successfully.
        NO_ANSWER: The call timeout before the recipient answered.
        CANCEL: The call was canceled.
        BUSY: The recipient was busy.
        FAILED: The call failed.
    Number:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: The ID of the phone number.
          example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        sipTrunkId:
          type: string
          readOnly: true
          example: 5RTRZ3NDEKTSV4RRFFQ69G5EWS
          description: The ID of the SIP trunk to which the phone number is assigned.
        phoneNumber:
          description: >-
            A Sinch phone number on your account and configured for Elastic SIP
            Trunking.
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
          example: '+15552229999'
        countryCode:
          readOnly: true
          type: string
          description: The country code of the phone number in ISO 3166-1 alpha-2 format.
          example: US
        createTime:
          type: string
          description: The date and time that the number was assigned to the SIP trunk.
          format: date-time
          readOnly: true
          example: '2022-01-01T00:00:00Z'
        updateTime:
          type: string
          description: The date and time that the phone number was last modified.
          format: date-time
          readOnly: true
          example: '2022-01-01T00:00:00Z'
      description: >-
        A Sinch phone number assigned to a SIP trunk. This must be a number you
        own and configured for Elastic SIP Trunking.
    StaticEndpoint:
      required:
        - address
      properties:
        address:
          type: string
          description: >-
            The address of the SIP endpoint can be an IP address or a domain
            name. EST uses IP authentication and will only accept calls from the
            specified address or domain.
          example: 127.0.0.1
        port:
          maximum: 65535
          minimum: 1
          type: integer
          description: The port of the SIP endpoint.
          format: int32
          example: 5060
          default: 5060
    RegisteredEndpoint:
      required:
        - isRegistered
        - credentialUsername
      properties:
        isRegistered:
          type: boolean
          description: >-
            This property determines whether the endpoint is static or
            registered. If registered, this must be set to `true`.
          example: true
        credentialUsername:
          type: string
          description: >-
            The username for the credential list you want to use to register the
            endpoint.
          example: MyCLUserName
    SipEndpoint:
      required:
        - name
        - priority
      type: object
      oneOf:
        - $ref: '#/components/schemas/StaticEndpoint'
        - $ref: '#/components/schemas/RegisteredEndpoint'
      properties:
        id:
          type: string
          description: The ID of the SIP endpoint.
          readOnly: true
        sipTrunkId:
          type: string
          description: The ID of the SIP trunk to which the endpoint is assigned.
          readOnly: true
          example: bbc55c4c-fe25-11ec-8482-d2e74e85a66f
        name:
          type: string
          description: The friendly name of the SIP endpoint.
          example: Acme Endpoint
        transport:
          type: string
          description: The transport protocol of the SIP endpoint.
          example: UDP
          x-enumDescriptions:
            TCP: >-
              [Transmission Control
              Protocol](https://community.sinch.com/t5/Glossary/TCP/ta-p/7741)
            UDP: >-
              [User Datagram
              Protocol](https://community.sinch.com/t5/Glossary/UDP/ta-p/7778)
            TLS: >-
              [Transport Layer
              Security](https://community.sinch.com/t5/Glossary/TLS/ta-p/7757)
          enum:
            - TCP
            - UDP
            - TLS
          default: UDP
        priority:
          minimum: 1
          type: integer
          description: >-
            Inbound call routing priority. If two or more endpoints have the
            same priority, calls will be routed to them using a round-robin
            strategy.


            Lower priority endpoints will be routed to first. Equal priority
            endpoints will round-robin calls between them.
          format: int32
          example: 1
        enabled:
          type: boolean
          description: Sets whether the SIP endpoint is enabled or not.
          default: true
        createTime:
          readOnly: true
          type: string
          description: The date and time that the SIP endpoint was created.
          format: date-time
          example: '2022-01-01T00:00:00Z'
        updateTime:
          readOnly: true
          type: string
          description: The date and time that the SIP endpoint was last modified.
          format: date-time
          example: '2022-01-01T00:00:00Z'
      description: >-
        A SIP endpoint which is the address of your SIP infrastructure. SIP
        endpoints can be one of two types: static endpoints or registered
        endpoints.


        | Endpoint | Description |

        | -------- | ----------- |

        | Static endpoints | Static endpoints are defined by a static value
        which can either be an IP address or a domain name. |

        | Registered endpoints | Registered endpoints use a credential list to
        determine the endpoint. |


        ---
    CountryPermission:
      description: >-
        With country permissions you can control which countries can be dialed
        from your account. For beta only, countries supported are US,CA and * if
        you would like to allow international dialing.
      type: object
      required:
        - enabled
      properties:
        isoCode:
          description: >-
            The [ISO code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) of
            the country
          type: string
          readOnly: true
          maxLength: 2
          example: US
        name:
          description: Country name in english
          type: string
          example: United States/Canada
          readOnly: true
        continent:
          description: Continent of the country
          type: string
          example: North America
          readOnly: true
        countryDialingCodes:
          description: >-
            The country calling codes as an array, most countries have only one
            but some have multiple like the San Marino, China, and a few others.
          type: array
          readOnly: true
          items:
            type: string
            description: The country calling code
            example: '+1'
        enabled:
          readOnly: false
          type: boolean
          description: >-
            If the country is enabled or not. When this is enabled regular
            numbers can be dialed from the account.
          default: true
          example: true
    DomainExists:
      type: object
      description: >-
        Displays whether the specified domain exists as a SIP trunk, and if so,
        the SIP Trunk ID.
      properties:
        exists:
          type: boolean
          description: >-
            This value returns true if the domain exists as a SIP trunk, and
            false if it does not.
