components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: >-
        The `projectId` is a required parameter you must include when making any
        API calls. You can find your project ID on your [Build
        dashboard](https://dashboard.sinch.com).
      schema:
        type: string
        example: 3acb7ae1-cf3d-4112-ba5e-3a9d8c71cd47
    Page:
      in: query
      name: page
      description: >-
        The page you want to fetch, can set to 1 for first page, or omitted for
        first page
      schema:
        type: integer
        default: 1
    Size:
      in: query
      name: size
      description: The size of each page to fetch
      schema:
        type: integer
        default: 500
        minimum: 1
        maximum: 500
    Sort:
      name: sort
      in: query
      description: >-
        An array setting the sorting criteria in the format of
        `property,(ascending/descending)`
      schema:
        type: array
        items:
          type: string
    SipEndpointIdQuery:
      name: sipEndpointId
      in: query
      description: The ID of the SIP endpoint to search for.
      required: false
      schema:
        minimum: 0
        type: integer
        format: int64
    SipTrunkIdQuery:
      name: sipTrunkId
      in: query
      description: The ID of the SIP trunk to search for.
      required: false
      schema:
        minimum: 0
        type: integer
        format: int64
    SipEndpointId:
      name: sipEndpointId
      in: path
      description: The ID of the SIP endpoint.
      required: true
      schema:
        minimum: 0
        type: integer
        format: int64
    SipTrunkId:
      name: sipTrunkId
      in: path
      description: The ID of the SIP trunk.
      required: true
      schema:
        type: string
