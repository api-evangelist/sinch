    ConversationBase:
      description: |-
        A collection of messages exchanged between a contact and an app.
        Conversations are normally created on the fly by Conversation API once
        a message is sent and there is no active conversation already.
        There can be only one active conversation at any given time between
        a particular contact and an app.
      type: object
      title: Conversation
      properties:
        active:
          description: Flag for whether this conversation is active.
          type: boolean
        active_channel:
          $ref: '#/components/schemas/ConversationChannel'
        app_id:
          description: The ID of the participating app.
          type: string
        contact_id:
          description: The ID of the participating contact.
          type: string
        metadata:
          description: >-
            Arbitrary data set by the Conversation API clients.

            Up to 1024 characters long.

            NOTE: This field has been deprecated due to changes in the system
            architecture or functionality.

            It is no longer actively maintained and may be removed in future
            versions. Please avoid relying on this field in new code.
          type: string
          deprecated: true
        metadata_json:
          description: >-
            Arbitrary data set by the Conversation API clients and/or provided
            in the `conversation_metadata` field of a SendMessageRequest.

            A valid JSON object.
          type: object
        correlation_id:
          type: string
          description: >-
            Arbitrary correlation ID related to the MT message set by the
            Conversation API user.
    Conversation:
      description: |-
        A collection of messages exchanged between a contact and an app.
        Conversations are normally created on the fly by Conversation API once
        a message is sent and there is no active conversation already.
        There can be only one active conversation at any given time between
        a particular contact and an app.
      type: object
      title: Conversation
      allOf:
        - $ref: '#/components/schemas/ConversationBase'
        - type: object
          properties:
            id:
              description: The ID of the conversation.
              type: string
            last_received:
              description: >-
                The timestamp of the latest message in the conversation. The
