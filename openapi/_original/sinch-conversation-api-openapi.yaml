      in: query
      schema:
        type: boolean
    update_mask:
      description: The set of field mask paths.
      name: update_mask
      in: query
      explode: false
      schema:
        type: array
        items:
          type: string
    request_id:
      description: >-
        ID for the asynchronous request, will be generated if not set. Currently
        this field is not used for idempotency but it will be added in v1.
      name: request_id
      in: query
      schema:
        type: string
    event_id:
      description: The unique ID of the event.
      name: event_id
      required: true
      in: path
      schema:
        type: string
    list_type:
