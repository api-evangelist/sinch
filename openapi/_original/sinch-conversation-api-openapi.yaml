    get:
      description: >-
        Lists contact identity conflicts across supported SIM-based channels
        (SMS, MMS, RCS).

        Use this to identify contact records sharing the same identity (e.g.,
        phone number), which must be resolved before enabling the Unified
        Contact ID feature.
      tags:
        - Contact
      summary: Lists Contact Identity Conflicts
      operationId: Contact_ListIdentityConflicts
      parameters:
        - description: Maximum number of conflicts to return (max 20).
          name: page_size
          in: query
          schema:
            type: integer
            format: int32
        - description: Pagination token for retrieving next page.
          name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        identity:
                          type: string
                          description: >-
                            The identity value (e.g., phone number) that is
                            duplicated across contacts.
                        channels:
                          type: array
                          items:
                            type: string
                          description: List of channels where this identity is present.
                        contact_ids:
                          type: array
                          items:
                            type: string
                          description: List of contact IDs that share this identity.
