    MessageQueue:
      type: string
      description: Select the priority type for the message
      default: NORMAL_PRIORITY
      example: NORMAL_PRIORITY
      x-enumDescriptions:
        NORMAL_PRIORITY: The normal priority queue.
        HIGH_PRIORITY: The high priority queue.
      enum:
        - NORMAL_PRIORITY
        - HIGH_PRIORITY
    QueueStats:
      type: object
      properties:
        outbound_size:
          description: The current size of the App's MT queue.
          type: integer
          format: int64
          readOnly: true
        outbound_limit:
          description: >-
            The limit of the App's MT queue. The default limit is 500000
            messages.
          type: integer
          format: int64
          readOnly: true
    RateLimits:
      type: object
      properties:
        inbound:
          description: |-
            The number of inbound messages/events we process per second,
            from underlying channels to the app.  The default rate limit is 25.
          type: integer
          format: int64
          readOnly: true
        outbound:
          description: >-
            The number of messages/events we process per second, from the

            app to the underlying channels. Note that underlying channels may
            have other

            rate limits.  The default rate limit is 25.
          type: integer
          format: int64
          readOnly: true
        webhooks:
          description: >-
            The rate limit of callbacks sent to the webhooks registered

            for the app. Note that if you have multiple webhooks with shared
            triggers,

            multiple callbacks will be sent out for each triggering event. The
            default rate limit is 25.
          type: integer
          format: int64
          readOnly: true
    Reason:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        description:
          description: A textual description of the reason.
          type: string
        sub_code:
          $ref: '#/components/schemas/ReasonSubCode'
        channel_code:
          description: >-
            Error code forwarded directly from the channel. Useful in case of
            unmapped or channel specific errors. Currently only supported on the
            WhatsApp channel.
          type: string
    ReasonCode:
      enum:
        - UNKNOWN
        - INTERNAL_ERROR
        - RATE_LIMITED
        - RECIPIENT_INVALID_CHANNEL_IDENTITY
        - RECIPIENT_NOT_REACHABLE
        - RECIPIENT_NOT_OPTED_IN
        - OUTSIDE_ALLOWED_SENDING_WINDOW
        - CHANNEL_FAILURE
        - CHANNEL_BAD_CONFIGURATION
        - CHANNEL_CONFIGURATION_MISSING
        - MEDIA_TYPE_UNSUPPORTED
        - MEDIA_TOO_LARGE
        - MEDIA_NOT_REACHABLE
        - NO_CHANNELS_LEFT
        - TEMPLATE_NOT_FOUND
        - TEMPLATE_INSUFFICIENT_PARAMETERS
        - TEMPLATE_NON_EXISTING_LANGUAGE_OR_VERSION
        - DELIVERY_TIMED_OUT
        - DELIVERY_REJECTED_DUE_TO_POLICY
        - CONTACT_NOT_FOUND
        - BAD_REQUEST
        - UNKNOWN_APP
        - NO_CHANNEL_IDENTITY_FOR_CONTACT
        - CHANNEL_REJECT
        - NO_PERMISSION
        - NO_PROFILE_AVAILABLE
        - UNSUPPORTED_OPERATION
      x-enumDescriptions:
        UNKNOWN: >-
          UNKNOWN is used if no other code can be used to describe the
          encountered error.
        INTERNAL_ERROR: >-
          An internal error occurred. Please save the entire callback if you
          want to report an error.
        RATE_LIMITED: The message or event was not sent due to rate limiting.
        RECIPIENT_INVALID_CHANNEL_IDENTITY: The channel recipient identity was malformed.
        RECIPIENT_NOT_REACHABLE: >-
          It was not possible to reach the contact, or channel recipient
          identity, on the channel.
        RECIPIENT_NOT_OPTED_IN: >-
          The contact, or channel recipient identity, has not opt-ed in on the
          channel.
        OUTSIDE_ALLOWED_SENDING_WINDOW: >-
          The allowed sending window has expired. See the channel documentation
          for more information about how the sending window works for the
          different channels.
        CHANNEL_FAILURE: >-
          The channel failed to accept the message. The Conversation API
          performs multiple retries in case of transient errors.
        CHANNEL_BAD_CONFIGURATION: >-
          The configuration of the channel for the used App is wrong. The bad
          configuration caused the channel to reject the message. Please see the
          [channel support documentation
          page](https://developers.sinch.com/docs/conversation/channel-support/)
          for how to set it up correctly.
        CHANNEL_CONFIGURATION_MISSING: >-
          The configuration of the channel is missing from the used App. Please
          see the [channel support
          documentation](https://developers.sinch.com/docs/conversation/channel-support/)
          page for how to set it up correctly.
        MEDIA_TYPE_UNSUPPORTED: >-
          Some of the referenced media files are of an unsupported media type.
          Please read the [channel support
          documentation](https://developers.sinch.com/docs/conversation/channel-support/)
          page to find out the limitations on media that the different channels
          impose.
        MEDIA_TOO_LARGE: >-
          Some of the referenced media files are too large. Please read the
          [channel support
          documentation](https://developers.sinch.com/docs/conversation/channel-support/)
          to find out the limitations on file size that the different channels
          impose.
        MEDIA_NOT_REACHABLE: >-
          The provided media link was not accessible from the Conversation API
          or from the underlying channels. Please make sure that the media file
          is accessible.
        NO_CHANNELS_LEFT: >-
          No channels to try to send the message to. This error will occur if
          one attempts to send a message to a channel with no channel identities
          or if all applicable channels have been attempted.
        TEMPLATE_NOT_FOUND: The referenced template was not found.
        TEMPLATE_INSUFFICIENT_PARAMETERS: >-
          Sufficient template parameters was not given. All parameters defined
          in the template must be provided when sending a template message.
        TEMPLATE_NON_EXISTING_LANGUAGE_OR_VERSION: >-
          The selected language, or version, of the referenced template did not
          exist. Please check the available versions and languages of the
          template.
        DELIVERY_TIMED_OUT: >-
          The message delivery, or event delivery, failed due to a
          channel-imposed timeout. See the [channel support
          documentation](https://developers.sinch.com/docs/conversation/channel-support/)
          page for further details about how the different channels behave.
        DELIVERY_REJECTED_DUE_TO_POLICY: >-
          The message or event was rejected by the channel due to a policy. Some
          channels have specific policies that must be met to send a message.
          See the [channel support
          documentation](https://developers.sinch.com/docs/conversation/channel-support/)
          page for more information about when this error will be triggered.
        CONTACT_NOT_FOUND: The provided Contact ID did not exist.
        BAD_REQUEST: >-
          Conversation API validates send requests in two different stages. The
          first stage is right before the message is enqueued. If this first
          validation fails the API responds with 400 Bad Request and the request
          is discarded immediately. The second validation kicks in during
          message processing and it normally contains channel specific
          validation rules. Failures during second request validation are
          delivered as callbacks to `MESSAGE_DELIVERY (EVENT_DELIVERY)` webhooks
          with ReasonCode `BAD_REQUEST`.
        UNKNOWN_APP: >-
          The used App is missing. This error may occur when the app is removed
          during message processing.
        NO_CHANNEL_IDENTITY_FOR_CONTACT: >-
          The contact has no channel identities set up, or the contact has no
          channels set up for the resolved channel priorities.
        CHANNEL_REJECT: >-
          Generic error for channel permanently rejecting a message. Only used
          if no other better matching error can be used.
        NO_PERMISSION: No permission to perform action.
        NO_PROFILE_AVAILABLE: No available profile data for user.
        UNSUPPORTED_OPERATION: Generic error for channel unsupported operations.
      type: string
    ReasonSubCode:
      enum:
        - UNSPECIFIED_SUB_CODE
        - ATTACHMENT_REJECTED
        - MEDIA_TYPE_UNDETERMINED
        - INACTIVE_SENDER
      x-enumDescriptions:
        UNSPECIFIED_SUB_CODE: >-
          UNSPECIFIED_SUB_CODE is used if no other sub code can be used to
          describe the encountered error.
        ATTACHMENT_REJECTED: >-
          The message attachment was rejected by the channel due to a policy.
          Some channels have specific policies that must be met to receive an
          attachment.
        MEDIA_TYPE_UNDETERMINED: The specified media urls media type could not be determined.
        INACTIVE_SENDER: >-
          The used credentials for the underlying channel is inactivated and not
          allowed to send or receive messages.
      type: string
    Recipient:
      description: Identifies the recipient.
      allOf:
        - $ref: '#/components/schemas/RecipientBase'
    RecipientRequest:
      description: >-
        Identifies the recipient. If [Dispatch
        Mode](https://developers.sinch.com/docs/conversation/processing-modes/)
        is used, you must use the `identified_by` field.
      allOf:
        - $ref: '#/components/schemas/RecipientBase'
    RecipientBase:
      type: object
      oneOf:
        - $ref: '#/components/schemas/IdentifiedByField'
        - $ref: '#/components/schemas/ContactIDField'
    ReplyToField:
      description: >-
        If the contact message was a response to a previous App message then
        this field contains information about that.
      type: object
      title: Reply To
      properties:
        reply_to:
          title: Reply To
          type: object
          required:
            - message_id
          properties:
            message_id:
              type: string
              description: Required. The Id of the message that this is a response to
    RetentionPolicy:
      type: object
      description: >-
        The retention policy configured for the app. For more information about
        retention policies, see [Retention
        Policy](https://developers.sinch.com/docs/conversation/keyconcepts/#retention-policy).
      title: Retention policy for messages and conversations
      properties:
        retention_type:
          $ref: '#/components/schemas/RetentionPolicyType'
        ttl_days:
          description: >-
            Optional. The days before a message or conversation is eligible for
            deletion.

            Default value is 180. The ttl_days value has no effect when
            retention_type

            is `PERSIST_RETENTION_POLICY`. The valid values for this field are
            [1 - 3650].

            Note that retention cleanup job runs once every twenty-four hours

            which can lead to delay i.e., messages and conversations are not
            deleted on

            the minute they become eligible for deletion.
          type: integer
          default: 180
          format: int64
    RetentionPolicyType:
      enum:
        - MESSAGE_EXPIRE_POLICY
        - CONVERSATION_EXPIRE_POLICY
        - PERSIST_RETENTION_POLICY
      x-enumDescriptions:
        MESSAGE_EXPIRE_POLICY: >-
          The default retention policy where messages older than ttl_days are
          automatically deleted from Conversation API database.
        CONVERSATION_EXPIRE_POLICY: >-
          The conversation expire policy only considers the last message in a
          conversation. If the last message is older that ttl_days the entire
          conversation is deleted. The difference with MESSAGE_EXPIRE_POLICY is
          that messages with accept_time older than ttl_days are persisted as
          long as there is a newer message in the same conversation.
        PERSIST_RETENTION_POLICY: >-
          Persist policy does not delete old messages or conversations. Please
          note that message storage might be subject to additional charges in
          the future.
      type: string
      default: MESSAGE_EXPIRE_POLICY
    DispatchRetentionPolicy:
      type: object
      description: >-
        The retention policy configured for messages in [Dispatch
        Mode](https://developers.sinch.com/docs/conversation/processing-modes/).
        Currently only `MESSAGE_EXPIRE_POLICY` is available. For more
        information about retention policies, see [Retention
        Policy](https://developers.sinch.com/docs/conversation/keyconcepts/#retention-policy).
      properties:
        retention_type:
          $ref: '#/components/schemas/DispatchRetentionPolicyType'
        ttl_days:
          description: >-
            Optional. The days before a message is eligible for deletion. The
            valid range is `[0 - 7]`. In the case of a `0` day TTL, messages
            aren't stored at all.

            Note the retention cleanup job runs once every twenty-four hours, so
            messages are not deleted on the minute they become eligible for
            deletion.
          type: integer
          default: 0
          format: int64
    DispatchRetentionPolicyType:
      x-enumDescriptions:
        MESSAGE_EXPIRE_POLICY: >-
          Removes all messages, sent or received by the app, older than the TTL
          days specified in the policy.
      enum:
        - MESSAGE_EXPIRE_POLICY
      type: string
      default: MESSAGE_EXPIRE_POLICY
    MessageSource:
      description: >-
        Specifies the message source for which the request will be processed.
        Used for operations on messages in Dispatch Mode. For more information,
        see [Processing
        Modes](https://developers.sinch.com/docs/conversation/processing-modes/).
      type: string
      enum:
        - CONVERSATION_SOURCE
        - DISPATCH_SOURCE
      default: CONVERSATION_SOURCE
      x-enumDescriptions:
        CONVERSATION_SOURCE: >-
          The default messages source. Retrieves messages sent in the
          `CONVERSATION` processing mode, which associates the messages with a
          specific conversation and contact.
        DISPATCH_SOURCE: >-
          Retrieves messages sent in the `DISPATCH` processing mode. These types
          of messages are not associated with any conversation or contact.
    ProcessingMode:
      description: >-
        Whether or not Conversation API should store contacts and conversations
        for the app. For more information, see [Processing
        Modes](https://developers.sinch.com/docs/conversation/processing-modes/).
      enum:
        - CONVERSATION
        - DISPATCH
      x-enumDescriptions:
        CONVERSATION: >-
          Creates contacts and conversations automatically when a message is
          sent or received and there's no existing contact or active
          conversation.
        DISPATCH: >-
          The default Processing Mode. Does not associate messages with contacts
          and conversations. This processing mode is mostly intended for
          unidirectional high volume SMS use cases. The lack of contacts and
          conversations limits some API features as related data won't be
          queryable in the
          [Contact](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/Contact/)
          and
          [Conversation](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/Conversation/)
          APIs.
      type: string
      default: DISPATCH
    SmartConversation:
      description: >-
        This object is required for apps that subscribe to Smart Conversations
        features.
      type: object
      properties:
        enabled:
          description: >-
            Set to true to allow messages processed by this app to be analyzed
            by Smart Conversations.
          type: boolean
          default: false
    CallbackSettings:
      description: This object contains additional settings related to callback processing.
      type: object
      properties:
        secret_for_overridden_callback_urls:
          description: >-
            Optional. Secret can be used to sign contents of delivery receipts
            for a message that was sent with the default callback URL overridden
            (using the [`callback_url`
            field](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/Messages/#tag/Messages/operation/Messages_SendMessage!path=callback_url&t=request)).
            You can then use the secret to verify the signature.
          type: string
          format: password
    DeliveryReportBasedFallback:
      description: >-
        This object contains additional settings related to [delivery report
        based
        fallback](https://developers.sinch.com/docs/conversation/keyconcepts/#delivery-report-base-message-fallback).
        Note that this is **paid** functionality.
      type: object
      properties:
        enabled:
          description: >-
            Optional. A flag specifying whether this app has enabled fallback
            message delivery upon no positive delivery report. This feature is
            applicable only to messages which are sent to a recipient with more
            than one channel identity. Identities must be defined on channels
            which support at least the 'DELIVERED' message state. **Please note
            that this functionality requires payment.**
          type: boolean
          default: false
        delivery_report_waiting_time:
          description: >-
            Optional. The time, in seconds, after which a message without a
            positive delivery report will fallback to the next channel.
          type: integer
          format: int32
          minimum: 10
          maximum: 259200
    MessageRetrySettings:
      description: This object contains settings related to message retry mechanism.
      type: object
      properties:
        retry_duration:
          description: >-
            The maximum duration, in seconds, during which the system will retry
            sending a message in the event of a temporary processing failure.
            Time is counted after the first message processing failure. At least
            one retry is guaranteed. Subsequent retry instances are randomized
            with exponential backoff. If the next retry timestamp exceeds the
            configured time, one final retry will be performed on the cut-off
            time. The valid values for this field are [30 - 3600].
          type: integer
          format: int32
          default: 3600
    StaticBearerCredentialsField:
      type: object
      title: Static Bearer Authentication
      properties:
        static_bearer:
          description: >-
            This object is required for channels which use a bearer-type of
            credential for authentication.
          type: object
          required:
            - claimed_identity
            - token
          title: Static Bearer Credentials
          properties:
            claimed_identity:
              description: The claimed identity for the channel.
              type: string
            token:
              description: The static bearer token for the channel.
              type: string
              format: password
    StaticTokenCredentialsField:
      type: object
      title: Static Token Authentication
      properties:
        static_token:
          type: object
          description: >-
            This object is required for channels which use a static token
            credential for authentication.
          required:
            - token
          title: Static Token Credentials
          properties:
            token:
              description: The static token for the channel.
              type: string
              format: password
    TelegramCredentialsField:
      type: object
      title: Telegram
      properties:
        telegram_credentials:
          type: object
          title: Telegram Credentials
          required:
            - token
          description: >-
            If you are including the Telegram Bot channel in the
            `channel_identifier` property, you must include this object.
          properties:
            token:
              type: string
              description: The token for the Telegram bot to which you are connecting.
              example: '{{TELEGRAM_BOT_TOKEN}}'
              format: password
    LineCredentialsField:
      type: object
      title: LINE
      properties:
        line_credentials:
          type: object
          title: LINE Credentials
          required:
            - token
            - secret
          description: >-
            If the `channel` property is set to `LINE` for this entry of the
            `channel_credentials` array, you must include either the
            `line_credentials` object or the `line_enterprise_credentials`
            object in the entry as well.
          properties:
            token:
              type: string
              description: The token for the LINE channel to which you are connecting.
              example: '{{LINE_TOKEN}}'
            secret:
              type: string
              description: The secret for the LINE channel to which you are connecting.
              format: password
              example: '{{LINE_SECRET}}'
            is_default:
              type: boolean
              description: >-
                When an app contains multiple LINE or LINE Enterprise
                credentials, one of the credentials needs to be defined as the
                default. Setting this property to `true` marks the corresponding
                credentials as the default credentials.
              default: false
    LineEnterpriseCredentials:
      type: object
      title: LINE Credentials
      required:
        - token
        - secret
      properties:
        token:
          type: string
          description: The token for the LINE channel to which you are connecting.
          example: '{{LINE_TOKEN}}'
        secret:
          type: string
          description: The secret for the LINE channel to which you are connecting.
          format: password
          example: '{{LINE_SECRET}}'
    LineCredentialsJapanField:
      type: object
      title: LINE Credentials Japan
      properties:
        line_japan:
          $ref: '#/components/schemas/LineEnterpriseCredentials'
    LineCredentialsThailandField:
      type: object
      title: LINE Credentials Thailand
      properties:
        line_thailand:
          $ref: '#/components/schemas/LineEnterpriseCredentials'
    LineEnterpriseCredentialsField:
      type: object
      title: LINE Enterprise
      properties:
        line_enterprise_credentials:
          type: object
          title: LINE Enterprise Credentials
          description: >-
            If the `channel` property is set to `LINE` for this entry of the
            `channel_credentials` array, you must include either the
            `line_credentials` object or the `line_enterprise_credentials`
            object in the entry as well.
          allOf:
            - oneOf:
                - $ref: '#/components/schemas/LineCredentialsJapanField'
                - $ref: '#/components/schemas/LineCredentialsThailandField'
            - type: object
              properties:
                is_default:
                  type: boolean
                  description: >-
                    When an app contains multiple LINE or LINE Enterprise
                    credentials, one of the credentials needs to be defined as
                    the default. Setting this property to `true` marks the
                    corresponding credentials as the default credentials.
                  default: false
    WeChatCredentialsField:
      type: object
      title: WeChat
      properties:
        wechat_credentials:
          type: object
          title: WeChat Credentials
          required:
            - app_id
            - app_secret
            - token
            - aes_key
          description: >-
            If you are including the WeChat channel in the `channel_identifier`
            property, you must include this object.
          properties:
            app_id:
              type: string
              description: >-
                The AppID(Developer ID) for the WeChat channel to which you are
                connecting.
              example: '{{WECHAT_APPID}}'
            app_secret:
              type: string
              description: >-
                The AppSecret(Developer Password) for the WeChat channel to
                which you are connecting.
              format: password
              example: '{{WECHAT_APPSECRET}}'
            token:
              type: string
              description: The Token for the WeChat channel to which you are connecting.
              example: '{{WECHAT_TOKEN}}'
            aes_key:
              type: string
              description: >-
                The Encoding AES Key for the WeChat channel to which you are
                connecting.
              example: '{{WECHAT_AESKEY}}'
    InstagramCredentialsField:
      type: object
      title: Instagram
      properties:
        instagram_credentials:
          type: object
          title: Instagram Credentials
          required:
            - token
          description: >-
            If you are including the INSTAGRAM channel in the
            `channel_identifier` property, you must include this object.
          properties:
            token:
              type: string
              description: The static token.
              format: password
            business_account_id:
              type: string
              description: Required if using the Sinch Facebook App.
    AppleBcCredentialsField:
      type: object
      title: Apple Business Chat
      properties:
        applebc_credentials:
          type: object
          title: Apple Business Chat Credentials
          required:
            - business_chat_account_id
          description: >-
            If you are including the AppleBC channel in the `channel_identifier`
            property, you must include this object.
          properties:
            business_chat_account_id:
              type: string
              description: The ID that identifies a Business Chat Account (BCA).
            merchant_id:
              type: string
              description: Merchant ID, required if our client wants to use Apple Pay.
            apple_pay_certificate_reference:
              type: string
              description: >-
                Certificate reference, required if our client wants to use Apple
                Pay.
            apple_pay_certificate_password:
              type: string
              format: password
              description: >-
                Certificate password, required if our client wants to use Apple
                Pay.
    KakaoTalkChatCredentialsField:
      type: object
      title: KakaoTalkChat
      properties:
        kakaotalkchat_credentials:
          type: object
          title: KakaoTalkChat Credentials
          required:
            - kakaotalk_plus_friend_id
          description: >-
            If you are including the KakaoTalkChat channel in the
            `channel_identifier` property, you must include this object.
          properties:
            kakaotalk_plus_friend_id:
              type: string
              description: Kakaotalk Plus friend ID.
            api_key:
              type: string
              description: InfoBank API KEY.
    TemplateMessageField:
      type: object
      description: Message referring to predefined template
      title: Template Message
      properties:
        template_message:
          type: object
          title: Template Message
          properties:
            channel_template:
              description: >-
                Optional. Channel specific template reference with parameters
                per channel.

                The channel template if exists overrides the omnichannel
                template.

                At least one of `channel_template` or `omni_template` needs to
                be present.

                The key in the map must point to a valid conversation channel as

                defined by the enum ConversationChannel.
              type: object
              additionalProperties:
                $ref: '#/components/schemas/TemplateReference'
            omni_template:
              $ref: '#/components/schemas/TemplateReferenceWithVersion'
    TemplateReferenceField:
      type: object
      title: Template (Reference)
      properties:
        template_reference:
          $ref: '#/components/schemas/TemplateReferenceWithVersion'
    TemplateReferenceWithVersion:
      type: object
      allOf:
        - required:
            - version
        - $ref: '#/components/schemas/TemplateReference'
    TemplateReference:
      type: object
      title: Template reference with concrete parameter values
      description: >-
        The referenced template can be an omnichannel template stored in
        Conversation API Template Store as an AppMessage. You may also reference
        external channel-specific templates, such as a WhatsApp Business
        Template. Note that channel-specific template references are not
        supported when populating the `explicit_channel_omni_message` field.
      required:
        - template_id
      properties:
        version:
          type: string
          description: >-
            Used to specify what version of a template to use. Required when
            using `omni_channel_override` and `omni_template` fields.

            This will be used in conjunction with `language_code`. Note that,
            when referencing omni-channel templates using the [Sinch Customer
            Dashboard](https://dashboard.sinch.com/), the latest version of a
            given omni-template can be identified by populating this field with
            `latest`.
        language_code:
          description: >-
            The BCP-47 language code, such as `en_US` or `sr_Latn`.

            For more information, see
            http://www.unicode.org/reports/tr35/#Unicode_locale_identifier.
            English is the default `language_code`.

            Note that, while many API calls involving templates accept either
            the dashed format (`en-US`) or the underscored format (`en_US`),
            some channel specific templates (for example, WhatsApp
            channel-specific templates) only accept the underscored format. Note
            that this field is required for WhatsApp channel-specific templates.
          type: string
        parameters:
          description: |-
            Required if the template has parameters. Concrete values must
            be present for all defined parameters
            in the template. Parameters can be different for
            different versions and/or languages of the template.
          type: object
          additionalProperties:
            type: string
        template_id:
          description: >-
            The ID of the template. Note that, in the case of WhatsApp
            channel-specific templates, this field must be populated by the name
            of the template.
          type: string
    TextMessageField:
      type: object
      title: Text
      description: A message containing only text.
      properties:
        text_message:
          type: object
          title: Text Message
          required:
            - text
          properties:
            text:
              description: The text to be sent.
              type: string
    UrlMessageField:
      description: A generic URL message.
      type: object
      title: URL
      properties:
        url_message:
          title: URL Message
          type: object
          required:
            - title
            - url
          properties:
            title:
              description: >-
                The title shown close to the URL. The title can be clickable in
                some cases.
              type: string
            url:
              description: The url to show.
              type: string
    CalendarMessageField:
      description: Message containing details about a calendar event.
      type: object
      title: Calendar
      properties:
        calendar_message:
          title: Calendar message
          type: object
          required:
            - title
            - event_start
            - event_end
            - event_title
            - fallback_url
          properties:
            title:
              description: >-
                The title is shown close to the button that leads to open a user
                calendar.
              type: string
            event_start:
              description: The timestamp defines start of a calendar event.
              type: string
              format: date-time
              example: '2025-11-30T10:00:00Z'
            event_end:
              description: The timestamp defines end of a calendar event.
              type: string
              format: date-time
              example: '2025-11-30T11:00:00Z'
            event_title:
              description: Title of a calendar event.
              type: string
            event_description:
              description: Description of a calendar event.
              type: string
            fallback_url:
              description: >-
                The URL that is opened when the user cannot open a calendar
                event directly or channel does not have support for this type.
              type: string
    ShareLocationMessageField:
      description: Message requesting location from a user.
      type: object
      title: Request location
      properties:
        share_location_message:
          title: Share Location Message
          type: object
          required:
            - title
            - fallback_url
          properties:
            title:
              description: >-
                The title is shown close to the button that leads to open a map
                to share a location.
              type: string
            fallback_url:
              description: >-
                The URL that is opened when channel does not have support for
                this type.
              type: string
    ChoiceMessagePropertiesField:
      type: object
      title: Properties
      description: Additional properties for the message.
      properties:
        message_properties:
          type: object
          properties:
            whatsapp_footer:
              description: >-
                Optional. Sets the text for the footer of a WhatsApp reply
                button or URL button message. Ignored for other channels.
              type: string
    Webhook:
      description: >-
        Represents a destination for receiving callbacks from the Conversation
        API.
      type: object
      title: Webhook
      required:
        - target
      properties:
        app_id:
          description: The app that this webhook belongs to.
          type: string
        client_credentials:
          $ref: '#/components/schemas/ClientCredentials'
        id:
          description: The ID of the webhook.
          type: string
          readOnly: true
        secret:
          description: >-
            Optional secret be used to sign contents of webhooks sent by the
            Conversation API.

            You can then use the secret to verify the signature.
          type: string
          format: password
        target:
          description: |-
            The target url where events should be sent to.
            Maximum URL length is 742.
            The conversation-api.*.sinch.com subdomains are forbidden.
          type: string
        target_type:
          $ref: '#/components/schemas/WebhookTargetType'
        triggers:
          description: >-
            An array of triggers that should trigger the webhook and result in
            an

            event being sent to the target url.

            Refer to the list of [Webhook
            Triggers](https://developers.sinch.com/docs/conversation/callbacks/#webhook-triggers)

            for a complete list.
          type: array
          items:
            $ref: '#/components/schemas/WebhookTrigger'
    Identity:
      description: Represents a identity from the Conversation API.
      type: object
      title: Identity
      required:
        - identity
      properties:
        identity:
          description: The identity from Conversation API.
          type: string
    AuditRecord:
      description: Represents a consent audit record from the Conversation API.
      type: object
      title: AuditRecord
      required:
        - operation
        - origin
        - list_type
        - project_id
        - app_id
        - datetime
      properties:
        origin:
          description: >-
            The origin from the opt-out or opt-in. This could be the Batch API
            or an MO (when matched with an end-user MO).
          type: string
          enum:
            - ORIGIN_API
            - ORIGIN_MO
          x-enumDescriptions:
            ORIGIN_API: The opt-in or opt-out came from the API.
            ORIGIN_MO: The opt-in or optout came from an MO.
        operation:
          description: >-
            The operation that the audit record refers to. Can be INSERT, UPDATE
            or DELETE.
          type: string
          enum:
            - OPERATION_INSERT
            - OPERATION_UPDATE
            - OPERATION_DELETE
          x-enumDescriptions:
            OPERATION_INSERT: The Insert operation
            OPERATION_UPDATE: The Update operation
            OPERATION_DELETE: The Delete operation
        list_type:
          allOf:
            - description: The list type of the consent list the audit record refers to.
            - $ref: '#/components/schemas/ConsentsListType'
        project_id:
          description: >-
            The project ID associated with the consent list the audit record
            refers to.
          type: string
        app_id:
          description: >-
            The app ID associated with the consent list the audit record refers
            to.
          type: string
        datetime:
          description: Datetime of when the consent list audit record happened.
          type: string
          format: date-time
    WebhookTargetType:
      type: string
      default: DISMISS
      x-enumDescriptions:
        DISMISS: Events won't be sent.
        HTTP: Events will be sent to an HTTP target.
      enum:
        - DISMISS
        - HTTP
    WebhookTrigger:
      description: Each webhook can subscribe to one or more of the following triggers
      type: string
      example: MESSAGE_DELIVERY
      x-enumDescriptions:
        UNSPECIFIED_TRIGGER: Using this value will cause errors.
        MESSAGE_DELIVERY: Subscribe to delivery receipts for a message sent.
        EVENT_DELIVERY: Subscribe to delivery receipts for a event sent.
        MESSAGE_INBOUND: >-
          Subscribe to inbound messages from end users on the underlying
          channels.
        EVENT_INBOUND: Subscribe to inbound events from end users on the underlying channels.
        CONVERSATION_START: >-
          Subscribe to an event that is triggered when a new conversation has
          been started.
        CONVERSATION_STOP: >-
          Subscribe to an event that is triggered when a active conversation has
          been stopped.
        CONTACT_CREATE: >-
          Subscribe to an event that is triggered when a new contact has been
          created.
        CONTACT_DELETE: >-
          Subscribe to an event that is triggered when a contact has been
          deleted.
        CONTACT_MERGE: >-
          Subscribe to an event that is triggered when a two contacts are
          merged.
        CONTACT_UPDATE: Subscribe to an event that is triggered when a contact is updated.
        UNSUPPORTED: >-
          Subscribe to callbacks that are not natively supported by the
          Conversation API.
        OPT_IN: Subscribe to opt_ins.
        OPT_OUT: Subscribe to opt_outs.
        CAPABILITY: Subscribe to see get capability results.
        CONVERSATION_DELETE: Subscribe to get an event when a conversation is deleted.
        CONTACT_IDENTITIES_DUPLICATION: >-
          Subscribe to get an event when contact identity duplications are found
          during message or event processing.
        CHANNEL_EVENT: Subscribe to direct channel event.
        SMART_CONVERSATION: >-
          Subscribe to [Smart conversation
          analysis](https://developers.sinch.com/docs/smart-conversations).
        MESSAGE_INBOUND_SMART_CONVERSATION_REDACTION: >-
          Subscribe to
          [analysis](https://developers.sinch.com/docs/smart-conversations) for
          messages from end-users.
        RECORD_NOTIFICATION: Subscribe to Record Notifications.
        MESSAGE_SUBMIT: Subscribe to message submit Notifications.
      enum:
        - UNSPECIFIED_TRIGGER
        - MESSAGE_DELIVERY
        - EVENT_DELIVERY
        - MESSAGE_INBOUND
        - EVENT_INBOUND
        - CONVERSATION_START
        - CONVERSATION_STOP
        - CONTACT_CREATE
        - CONTACT_DELETE
        - CONTACT_MERGE
        - CONTACT_UPDATE
        - UNSUPPORTED
        - OPT_IN
        - OPT_OUT
        - CAPABILITY
        - CONVERSATION_DELETE
        - CONTACT_IDENTITIES_DUPLICATION
        - CHANNEL_EVENT
        - SMART_CONVERSATION
        - MESSAGE_INBOUND_SMART_CONVERSATION_REDACTION
        - RECORD_NOTIFICATION
        - MESSAGE_SUBMIT
    ConversationMessagesView:
      type: string
      default: WITH_METADATA
      x-enumDescriptions:
        WITH_METADATA: View the message with metadata.
        WITHOUT_METADATA: View the message without metadata.
      enum:
        - WITH_METADATA
        - WITHOUT_METADATA
    ListAppsResponse:
      type: object
      properties:
        apps:
          description: List of apps belonging to a specific project ID.
          type: array
          items:
            $ref: '#/components/schemas/AppResponse'
    ListContactsResponse:
      type: object
      properties:
        contacts:
          description: List of contacts belonging to the specified project.
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        next_page_token:
          description: |-
            Token that should be included in the next list contacts request to
            fetch the next page.
          type: string
    ListConversationsResponse:
      type: object
      properties:
        conversations:
          description: List of conversations matching the search query.
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
          readOnly: true
        next_page_token:
          type: string
          description: >-
            Token that should be included in the next request to fetch the next
            page.
        total_size:
          type: integer
          format: int32
    ListMessagesByChannelIdentityRequest:
      type: object
      description: >-
        Request body for listing messages by channel identity. NOTE: You can use
        either contact_ids OR channel_identities, but not both in the same
        request.
      properties:
        channel_identities:
          description: Optional. Filter messages by `channel_identity`.
          type: array
          items:
            type: string
        contact_ids:
          description: >-
            Optional. Resource name (id) of the contact. In case the messages
            source is set to `CONVERSATION_SOURCE`: Can list last messages by
            contact_id. In case the messages source is set to `DISPATCH_SOURCE`:
            The field is unsupported and cannot be set.
          type: array
          items:
            type: string
        app_id:
          description: Optional. Resource name (id) of the app.
          type: string
        messages_source:
          $ref: '#/components/schemas/MessageSource'
        page_size:
          description: >-
            Optional. Maximum number of messages to fetch. Defaults to 10 and
            the maximum is 1000.
          type: integer
          format: int32
          default: 10
        page_token:
          description: Optional. Next page token previously returned if any.
          type: string
        view:
          allOf:
            - description: >-
                Optional. Specifies the representation in which messages should
                be returned. Default to `WITH_METADATA`.
              default: WITH_METADATA
            - $ref: '#/components/schemas/ConversationMessagesView'
        start_time:
          description: Optional. Only fetch messages with `accept_time` after this date.
          type: string
          format: date-time
        end_time:
          description: Optional. Only fetch messages with `accept_time` before this date.
          type: string
          format: date-time
        channel:
          allOf:
            - description: Optional. Only fetch messages from the `channel`.
            - $ref: '#/components/schemas/ConversationChannel'
        direction:
          allOf:
            - description: >-
                Optional. Only fetch messages with the specified `direction`. If
                direction is not specified, it will list both TO_APP and
                TO_CONTACT messages.
              example: TO_CONTACT
            - $ref: '#/components/schemas/ConversationDirection'
    ListMessagesResponse:
      type: object
      properties:
        messages:
          description: List of messages associated to the referenced conversation.
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
          readOnly: true
        next_page_token:
          type: string
          description: >-
            Token that should be included in the next request to fetch the next
            page.
    ListWebhooksResponse:
      type: object
      properties:
        webhooks:
          type: array
          description: List of webhooks belonging to a specific project ID and app ID
          items:
            $ref: '#/components/schemas/Webhook'
    GetIdentitiesFromConsentResponse:
      type: object
      properties:
        identities:
          type: array
          description: >-
            List of identities belonging to a specific project ID, app ID, and
            list type
          items:
            $ref: '#/components/schemas/Identity'
        next_page_token:
          description: Token for the next page of the search, to be used in the next call.
          type: string
    GetAuditRecordsFromConsentResponse:
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        audit_records:
          type: array
          description: List of audit records associated with the given identity
          items:
            $ref: '#/components/schemas/AuditRecord'
    MergeContactRequest:
      type: object
      required:
        - source_id
      properties:
        source_id:
          description: Required. The ID of the contact that should be removed.
          type: string
        strategy:
          $ref: '#/components/schemas/ConversationMergeStrategy'
    GetChannelProfileRequest:
      type: object
      required:
        - app_id
        - recipient
        - channel
      properties:
        app_id:
          type: string
          description: The ID of the app.
          example: '{APP_ID}'
        recipient:
          $ref: '#/components/schemas/Recipient'
        channel:
          $ref: '#/components/schemas/GetChannelProfileConversationChannel'
    GetChannelProfileResponse:
      type: object
      properties:
        profile_name:
          type: string
          description: The profile name.
          example: John Doe
    QueryCapability:
      type: object
      required:
        - app_id
        - recipient
      properties:
        app_id:
          description: The ID of the app to use for capability lookup.
          type: string
          example: '{APP_ID}'
        recipient:
          $ref: '#/components/schemas/Recipient'
        request_id:
          type: string
          description: |-
            ID for the asynchronous response, will be generated if not set.
            Currently this field is not used for idempotency.
    QueryCapabilityResponse:
      description: |-
        A CapabilityResponse contains the identity of the recipient for which
        a capability lookup will be performed.
      type: object
      title: Represents an explicit Capability registration
      properties:
        app_id:
          description: The ID of the app to use for capability lookup.
          type: string
        recipient:
          $ref: '#/components/schemas/Recipient'
        request_id:
          type: string
          description: ID for the asynchronous response, will be generated if not set.
    SendEventRequest:
      type: object
      required:
        - app_id
        - recipient
        - event
      properties:
        app_id:
          description: The ID of the app sending the event.
          type: string
        callback_url:
          description: >-
            Overwrites the default callback url for delivery receipts for this
            message

            The REST URL should be of the form: `http://host[:port]/path`
          type: string
        channel_priority_order:
          description: >-
            Optional. A single element array that dictates on what channel
            should

            the Conversation API try to send the event.

            It overrides any default set on the contact. Providing more than one

            option has no effect.
          type: array
          items:
            $ref: '#/components/schemas/ConversationChannel'
        event:
          $ref: '#/components/schemas/AppEventField'
        event_metadata:
          description: Optional. Eventual metadata that should be associated to the event.
          type: string
        queue:
          $ref: '#/components/schemas/MessageQueue'
        recipient:
          $ref: '#/components/schemas/RecipientRequest'
    SendEventResponse:
      type: object
      properties:
        accepted_time:
          description: Accepted timestamp.
          type: string
          format: date-time
          readOnly: true
        event_id:
          description: Event id.
          type: string
          readOnly: true
    SendMessageRequest:
      type: object
      description: >-
        This is the request body for sending a message. `app_id`, `recipient`,
        and `message` are all required fields.
      required:
        - app_id
        - recipient
        - message
      properties:
        app_id:
          description: The ID of the app sending the message.
          type: string
          example: '{APP_ID}'
        callback_url:
          description: >-
            Overwrites the default callback url for delivery receipts for this
            message.

            Note that you may [define a `secret_for_overridden_callback_urls` at
            the app
            level](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/App/#tag/App/operation/App_UpdateApp!path=callback_settings/secret_for_overridden_callback_urls&t=request);
            this secret will be used to sign the contents of delivery receipts
            when the default callback URL is overridden by this property. The
            REST URL should be of the form: `http://host[:port]/path`
          type: string
        channel_priority_order:
          description: >-
            Explicitly define the channels and order in which they are tried
            when sending the message. All channels provided in this field must
            be configured in the corresponding Conversation API app, or the
            request will be rejected.

            Which channels the API will try and their priority is defined by:

            1. `channel_priority_order` if available.

            2. `recipient.identified_by.channel_identities` if available.

            3. When recipient is a `contact_id`:
                - if a conversation with the contact exists: the active channel of the conversation is tried first.
                - the existing channels for the contact are ordered by contact channel preferences if given.
                - lastly the existing channels for the contact are ordered by the app priority.
          type: array
          items:
            $ref: '#/components/schemas/ConversationChannel'
        channel_properties:
          description: |-
            Channel-specific properties.
            The key in the map must point to a valid channel property key as
            defined by the enum ChannelPropertyKeys.
            The maximum allowed property value length is 1024 characters.
          type: object
          additionalProperties:
            type: string
        message:
          $ref: '#/components/schemas/AppMessage'
        message_metadata:
          description: >-
            Metadata that should be associated with the message.

            Returned in the `metadata` field of a [Message Delivery
            Receipt](https://developers.sinch.com/docs/conversation/callbacks/#message-delivery-receipt).
            Up to 1024 characters long.
          type: string
        conversation_metadata:
          description: >-
            Metadata that will be associated with the conversation in
            `CONVERSATION` mode and with the specified recipient identities in
            `DISPATCH` mode.

            This metadata will be propagated on MO callbacks associated

            with the respective conversation or user identity. Up to 2048
            characters long.

            Note that the MO callback will always use the last metadata
            available.

            Important notes:

             - If you send a message with the `conversation_metadata` field populated, and then send another message without populating the `conversation_metadata` field, the original metadata will continue be propagated on the related MO callbacks.
             - If you send a message with the `conversation_metadata` field populated, and then send another message with a different value for `conversation_metadata` in the same conversation, the latest metadata value overwrites the existing one. So, future MO callbacks will include the new metadata.
             - The `conversation_metadata` only accepts json objects.
             - If you send a message in `DISPATCH` mode while the [retention period](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/App/#tag/App/operation/App_CreateApp!path=dispatch_retention_policy/ttl_days&t=request) of the app is set to 0 (note that this value is set to 0 by default), the `conversation_metadata` field will not be retained.

            Currently only returned in the `message_metadata` field of an
            [Inbound
            Message](https://developers.sinch.com/docs/conversation/callbacks/#inbound-message)
            callback.
          type: object
        queue:
          $ref: '#/components/schemas/MessageQueue'
        recipient:
          $ref: '#/components/schemas/RecipientRequest'
        ttl:
          description: >-
            The timeout allotted for sending the message, expressed in seconds.

            Passed to channels which support it and

            emulated by the Conversation API for channels without ttl support

            but with message retract/unsend functionality.

            Channel failover will not be performed for messages with an expired
            TTL.

            The format is an integer with the suffix `s` (for seconds).

            Valid integer range is 3 to 315,576,000,000 (inclusive).

            Example values include `10s` (10 seconds) and `86400s` (24 hours).
          type: string
        processing_strategy:
          $ref: '#/components/schemas/ProcessingStrategy'
        correlation_id:
          type: string
          description: >-
            An arbitrary identifier that will be propagated to callbacks related
            to this message,

            including MO messages from the recipient. The `correlation_id` is
            associated with the conversation in `CONVERSATION` mode and with the
            specified recipient identities in `DISPATCH` mode. The MO callbacks
            will always include the last `correlation_id` available,

            (which is similar to how the `conversation_metadata` property
            functions).

            Up to 128 characters long.

            Important note: If you send a message in `DISPATCH` mode while the
            [retention
            period](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/App/#tag/App/operation/App_CreateApp!path=dispatch_retention_policy/ttl_days&t=request)
            of the app is set to 0 (note that this value is set to 0 by
            default), the `correlation_id` field will not be retained.
        conversation_metadata_update_strategy:
          $ref: '#/components/schemas/MetadataUpdateStrategy'
        message_content_type:
          $ref: '#/components/schemas/MessageContentType'
    MessageContentType:
      description: >-
        This field classifies the message content for use with Sinch's [consent
        management
        functionality](https://developers.sinch.com/docs/conversation/consent-management/).
        Note that this field is currently only used with Sinch's consent
        management functionality, and is not referenced elsewhere by the
        Conversation API.
      type: string
      x-enumDescriptions:
        CONTENT_UNKNOWN: >-
          The default content type, when the content is not clearly defined, can
          be any type of content.
        CONTENT_MARKETING: >-
          Type that indicates that the content is related to Marketing, like
          marketing campaign messages.
        CONTENT_NOTIFICATION: >-
          Type that indicates that the content is related to Notifications, like
          charges and alerts.
      default: CONTENT_UNKNOWN
      enum:
        - CONTENT_UNKNOWN
        - CONTENT_MARKETING
        - CONTENT_NOTIFICATION
    ProcessingStrategy:
      description: >-
        Overrides the app's [Processing
        Mode](https://developers.sinch.com/docs/conversation/processing-modes/).
        Default value is `DEFAULT`.
      enum:
        - DEFAULT
        - DISPATCH_ONLY
      x-enumDescriptions:
        DEFAULT: The request will inherit the app's configured processing mode.
        DISPATCH_ONLY: >-
          Forces the request to be processed in dispatch mode (without storing
          contacts and conversations), regardless of the app's configured
          processing mode. Please note that user replies will still be processed
          in the app's default processing mode and that the
          `conversation_metadata` and `correlation_id` fields are not supported
          when using this option with an app in `CONVERSATION` mode.
      type: string
      default: DEFAULT
    MetadataUpdateStrategy:
      enum:
        - REPLACE
        - MERGE_PATCH
      description: >-
        Update strategy for the `conversation_metadata` field. Only supported in
        `CONVERSATION` processing mode.
      x-enumDescriptions:
        REPLACE: >-
          The default strategy. Replaces the whole `conversation_metadata` field
          with the new value provided.
        MERGE_PATCH: >-
          Patches the `conversation_metadata` field with the patch provided
          according to RFC 7386.
      type: string
      default: REPLACE
    SendMessageResponse:
      type: object
      properties:
        accepted_time:
          description: >-
            Timestamp when the Conversation API accepted the message for
            delivery to the referenced contact.
          type: string
          format: date-time
          readOnly: true
        message_id:
          description: The ID of the message.
          type: string
          readOnly: true
