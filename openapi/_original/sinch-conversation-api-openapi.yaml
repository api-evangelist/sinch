tags:
  - description: >-
      To start sending messages you must have a Conversation API
      [**app**](https://dashboard.sinch.com/convapi/apps). The app holds
      information about the channel credentials and registered webhooks to which
      the API delivers callbacks such as message delivery receipts and contact
      messages. If you don't already have an app please follow the instructions
      in the getting started guide available in the [Sinch
      Dashboard](https://dashboard.sinch.com/convapi/getting-started) to create
      one.
    name: Messages
    x-displayName: Messages
  - description: >-
      Apps are created and configured through the [Sinch
      Dashboard](https://dashboard.sinch.com/convapi/apps), are tied to the API
      user and come with a set of **channel credentials** for each underlying
      connected channel. The app has a list of **conversations** between itself
      and different **contacts** which share the same **project**.


      Webhooks, which the app is attached to, defines the destination for
      various events coming from the Conversation API. An **app** has the
      following configurable properties:


      | Field                        |
      Description                                                                                                      
      |

      | ---------------------------- |
      -----------------------------------------------------------------------------------------------------------------
      |

      | Display name                 | The name visible in the [Sinch
      Dashboard](https://dashboard.sinch.com/convapi/apps).                                
      |

      | Conversation metadata report | Specifies the amount of **conversation**
      metadata that's returned as part of each callback.                       
      |

      | Retention Policy             | The retention policy specifies how long
      messages, sent to or from an **app**, are stored by the Conversation API.
      |
    name: App
    x-displayName: Apps
  - description: >-
      A contact is a collection that groups together underlying connected
      **channel recipient identities**. It's tied to a specific **project** and
      is therefore considered public to all **apps** sharing the same
      **project**. Most contact creation and maintenance is handled by the
      Conversation API's automatic [contact
      management](https://developers.sinch.com/docs/conversation/contact-management/)
      processes. However, you can also use API calls to manually manage your
      contacts.


      A **contact** has the following configurable properties:


      | Field              |
      Description                                                                                                                                        
      |

      | ------------------ |
      ---------------------------------------------------------------------------------------------------------------------------------------------------
      |

      | Channel identities | List of channel identities specifying how the
      contact is identified on underlying
      channels                                                          |

      | Channel priority   | Specifies the channel priority order used when
      sending messages to this contact. This can be overridden by message
      specific channel priority order. |

      | Display name       | Optional display name used in chat windows and
      other
      UIs                                                                                           
      |

      | Email              | Optional Email of the
      contact                                                                                                                      
      |

      | External id        | Optional identifier of the contact in external
      systems                                                                                             
      |

      | Metadata           | Optional metadata associated with the
      contact.                                                                                                     
      |
    name: Contact
    x-displayName: Contacts
  - description: Endpoints for working with the conversation log.
    name: Conversation
    x-displayName: Conversations
  - description: Endpoint for sending events.
    name: Events
    x-displayName: Events
  - description: Endpoint for transcoding generic message format to channel-specific one.
    name: Transcoding
    x-displayName: Transcode
  - description: >-
      A capability query determines which options are available for reaching a
      [contact](https://developers.sinch.com/docs/conversation/keyconcepts/#contact)
      on the channels on which the contact has a channel identity.


      To execute the request, either the contact ID or the channel recipient
      identities of the contact are required.


      The request is executed asynchronously. Therefore the service responds
      with immediate acknowledgment. The final result of the capability query is
      sent to a
      [webhook](https://developers.sinch.com/docs/conversation/keyconcepts/#webhook)
      registered for the `CAPABILITY` trigger.


      When no authoritative source of truth exists for a given channel's
      capability, the endpoint **MUST** respond as `Capable` for that channel.
      This ensures that any configured fallback and upscale routing strategies
      continue to function as expected.


      {% admonition type="info" name="Note:" %}

      The `status` received via the `MESSAGE_DELIVERY` callback should be
      treated as the definitive indication of reachability for the corresponding
      recipient at the time of the delivery attempt. For example, a
      `RECIPIENT_NOT_REACHABLE` status may legitimately follow an earlier
      `Capable` response from the Capability endpoint, as reachability can
      change between the time of capability assessment and the time of actual
      message delivery.

      {% /admonition %}
    name: Capability
    x-displayName: Capability
  - description: >-
      Consent queries provide a way to retrieve any identities stored within a
      given consent list. You can also retrieve audit records that provide
      details for a given identity's journey through [consent
      management](https://developers.sinch.com/docs/conversation/consent-management/).
    name: Consent
    x-displayName: Consents
  - description: >-
      Endpoint for managing various settings for your [Sinch
      project](https://developers.sinch.com/docs/conversation/keyconcepts#project).
    name: Project Settings
    x-displayName: Projects
