      type: object
      title: Project Settings Request
      description: Request body for creating or updating project settings.
      properties:
        contact_settings:
          $ref: '#/components/schemas/ContactSettings'
    ContactSettings:
      type: object
      title: Contact Settings
      description: Settings related to contact management for the project.
      properties:
        unified_contact_id_enabled:
          type: boolean
          description: >
            Enables the Unified Contact ID feature. When enabled, contacts with
            the same phone number across SMS, RCS, and MMS channels are treated
            as a single entity. [See the
            documentation](https://developers.sinch.com/docs/conversation/unified-contact-id/)
            for details and requirements.
          example: true
    CallbackEventCommon:
      type: object
      required:
        - app_id
        - project_id
      properties:
        app_id:
          description: Id of the subscribed app.
          type: string
        accepted_time:
          description: >-
            Timestamp marking when the channel callback was accepted/received by
            the Conversation API.
          type: string
          format: date-time
        event_time:
          description: Timestamp of the event as provided by the underlying channels.
          type: string
          format: date-time
        project_id:
          description: The project ID of the app which has subscribed for the callback.
          type: string
        message_metadata:
          description: >-
            Context-dependent metadata. Refer to specific callback's
            documentation for exact information provided.
          type: string
        correlation_id:
          description: >-
            The value provided in field correlation_id of a send message
            request.
          type: string
    MessageInboundEvent:
      type: object
      description: This callback delivers contact (end-user) messages to the API clients.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            message:
              $ref: '#/components/schemas/MessageInboundEventItem'
    MessageInboundSmartConversationRedactionEvent:
      type: object
      description: >-
        This callback delivers contact (end-user) messages to the API clients.
        The content of the message goes through an A.I. analysis and is redacted
        if required.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            message_redaction:
              $ref: '#/components/schemas/MessageInboundEventItem'
    MessageInboundEventItem:
      type: object
      properties:
        id:
          description: The message ID.
          type: string
        direction:
          description: >-
            The direction of the message, it's always TO_APP for contact
            messages.
          type: string
          x-enumDescriptions:
            TO_APP: A message sent to a Conversation API app.
          enum:
            - TO_APP
        contact_message:
          $ref: '#/components/schemas/ContactMessage'
        channel_identity:
          $ref: '#/components/schemas/ChannelIdentity'
        conversation_id:
          description: >-
            The ID of the conversation this message is part of. Will be empty if
            processing_mode is DISPATCH.
          type: string
        contact_id:
          description: The ID of the contact. Will be empty if processing_mode is DISPATCH.
          type: string
        metadata:
          description: >-
            Usually, metadata specific to the underlying channel is provided in
            this field. Refer to the individual channels' documentation for more
            information (for example, SMS delivery receipts). Note that, for
            Choice message responses, this field is populated with the value of
            the message_metadata field of the corresponding Send message
            request.
          type: string
        accept_time:
          description: >-
            Timestamp marking when the channel callback was received by the
            Conversation API.
          type: string
          format: date-time
        sender_id:
          description: >-
            The sender ID to which the contact sent the message, if applicable.
            For example, originator msisdn/short code for SMS and MMS.
          type: string
        processing_mode:
          $ref: '#/components/schemas/ProcessingMode'
        injected:
          description: Flag for whether this message was injected.
          type: boolean
    MessageSubmitEvent:
      description: >-
        This callback provides a notification to the API clients that the
        corresponding app message was submitted to a channel. This notification
        is created before any confirmation from Delivery Receipts.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            message_submit_notification:
              type: object
              properties:
                message_id:
                  description: The ID of the app message.
                  type: string
                conversation_id:
                  description: >-
                    The ID of the conversation the app message is part of. Will
                    be empty if processing_mode is DISPATCH.
                  type: string
                channel_identity:
                  $ref: '#/components/schemas/ChannelIdentity'
                contact_id:
                  description: >-
                    The ID of the contact. Will be empty if processing_mode is
                    DISPATCH.
                  type: string
                submitted_message:
                  $ref: '#/components/schemas/AppMessage'
                metadata:
                  description: >-
                    Metadata specified in the message_metadata field of a Send
                    Message request, if any.
                  type: string
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    MessageDeliveryReceiptEvent:
      description: >-
        This callback notifies the API clients about status changes of already
        sent app message.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            message_delivery_report:
              type: object
              properties:
                message_id:
                  description: The ID of the app message.
                  type: string
                conversation_id:
                  description: >-
                    The ID of the conversation the app message is part of. Will
                    be empty if processing_mode is DISPATCH.
                  type: string
                status:
                  $ref: '#/components/schemas/DeliveryStatus'
                channel_identity:
                  $ref: '#/components/schemas/ChannelIdentity'
                contact_id:
                  description: >-
                    The ID of the contact. Will be empty if processing_mode is
                    DISPATCH.
                  type: string
                reason:
                  $ref: '#/components/schemas/Reason'
                metadata:
                  description: >-
                    Metadata specified in the message_metadata field of a Send
                    Message request, if any.
                  type: string
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    DeliveryStatus:
      description: Shows the status of the message or event delivery
      type: string
      x-enumDescriptions:
        QUEUED_ON_CHANNEL: >-
          The message has been queued on the corresponding Conversation API
          channel.
        DELIVERED: The message has been delivered.
        READ: The message has been read.
        FAILED: Message delivery failed.
        SWITCHING_CHANNEL: >-
          The Conversation API app is switching to a different channel to
          deliver the message.
      enum:
        - QUEUED_ON_CHANNEL
        - DELIVERED
        - READ
        - FAILED
        - SWITCHING_CHANNEL
    EventInbound:
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            event:
              type: object
              properties:
                id:
                  description: The event ID.
                  type: string
                direction:
                  description: >-
                    The direction of the event. It's always TO_APP for contact
                    events.
                  type: string
                  x-enumDescriptions:
                    TO_APP: An event sent to a Conversation API app.
                  enum:
                    - TO_APP
                contact_event:
                  $ref: '#/components/schemas/ContactEvent'
                contact_message_event:
                  $ref: '#/components/schemas/ContactMessageEvent'
                channel_identity:
                  $ref: '#/components/schemas/ChannelIdentity'
                contact_id:
                  description: >-
                    The ID of the contact. Will be empty if processing_mode is
                    DISPATCH.
                  type: string
                conversation_id:
                  description: >-
                    The ID of the conversation this event is part of. Will be
                    empty if processing_mode is DISPATCH.
                  type: string
                accept_time:
                  description: >-
                    Timestamp marking when the channel callback was received by
                    the Conversation API.
                  type: string
                  format: date-time
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    ContactEvent:
      title: Contact Event
      description: Message originating from a contact
      type: object
      oneOf:
        - $ref: '#/components/schemas/ComposingEventField'
        - $ref: '#/components/schemas/ComposingEndEventField'
        - $ref: '#/components/schemas/ConversationDeletedEventField'
        - $ref: '#/components/schemas/CommentEventField'
        - $ref: '#/components/schemas/GenericEventField'
    CommentEvent:
      description: >-
        Object which contains information of a comment made by an user outside
        of the main conversation context. Currently only supported on Instagram
        channel, see Instagram Private Replies for more details
      type: object
      required:
        - text
      properties:
        id:
          description: Event's ID
          type: string
        text:
          description: Comment's text
          type: string
        comment_type:
          description: >-
            Either LIVE or FEED. Indicates the type of media on which the
            comment was made.
          type: string
          x-enumDescriptions:
            FEED: A comment was made on a Feed post.
            LIVE: A comment was made during a Live.
          enum:
            - FEED
            - LIVE
        commented_on:
          description: >-
            Instagram's URL of the live broadcast or the post on which the
            comment was made (permalink).
          type: string
        user:
          description: >-
            Username of the account that commented in the live broadcast or
            post.
          type: string
    ShortLinkActivatedEvent:
      description: >-
        Object reflecting an event that is created when a contact visits a
        shortlink. Currently, this is only supported for the Messenger and
        Instagram channels. See [Shortlink Activated
        Event](https://developers.sinch.com/docs/conversation/callbacks/#shortlink-activated-event)
        for more details.
      type: object
      properties:
        payload:
          type: string
          description: >-
            Refers to the payload previously configured to be sent in the
            postback.
        title:
          type: string
          description: Only relevant for the Instagram channel.
        ref:
          type: string
          description: The ref parameter from the shortlink the user visited.
        source:
          type: string
          description: Defaults to "SHORTLINK" for this type of event.
        type:
          type: string
          description: >-
            The identifier for the referral. For Instagram and Messenger
            shortlinks, this is always set to "OPEN_THREAD".
        existing_thread:
          type: boolean
          description: >-
            Set to true if target channel's conversation thread already existed
            at the moment the shortlink was visited. Set to false if a new
            conversation thread began when the shortlink was visited.
    ReactionAction:
      description: Type of action
      type: string
      x-enumDescriptions:
        REACTION_ACTION_UNKNOWN: Unrecognized type of action
        REACTION_ACTION_REACT: User placed some emoji reaction
        REACTION_ACTION_UNREACT: User removed previously placed emoji reaction
      enum:
        - REACTION_ACTION_UNKNOWN
        - REACTION_ACTION_REACT
        - REACTION_ACTION_UNREACT
    ReactionEvent:
      description: >-
        Object reflecting an event that is created when a contact
        reacts/unreacts with an emoji to a particular MT message. Currently,
        this is supported for the Messenger, Instagram, and WhatsApp channels.
        See [Reaction
        Event](https://developers.sinch.com/docs/conversation/callbacks/#reaction-event)
        for more details.
      type: object
      required:
        - emoji
        - action
        - message_id
      properties:
        emoji:
          description: >-
            Indicates that an emoji reaction was placed on a message. This value
            is the string representation of the emoji.

            For example: "&#2764&#FE0F"
          type: string
        action:
          $ref: '#/components/schemas/ReactionAction'
        message_id:
          description: The ID of the MT message that this reaction is associated with.
          type: string
        reaction_category:
          description: >-
            If present, represents the grouping of emojis.

            Example values: "smile", "angry", "sad", "wow", "love", "like",
            "dislike", "other"
          type: string
    ContactMessageEvent:
      description: >-
        The content of the event when contact_event is not populated. Note that
        this object is currently only available to select customers for beta
        testing. Mutually exclusive with contact_event.
      type: object
      oneOf:
        - type: object
          title: Payment Status Update
          properties:
            payment_status_update_event:
              $ref: '#/components/schemas/PaymentStatusUpdateEvent'
        - type: object
          title: Short Link Activated
          properties:
            shortlink_activated_event:
              $ref: '#/components/schemas/ShortLinkActivatedEvent'
        - type: object
          title: Reaction
          properties:
            reaction_event:
              $ref: '#/components/schemas/ReactionEvent'
    EventDelivery:
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            event_delivery_report:
              type: object
              properties:
                event_id:
                  description: The ID of the app event.
                  type: string
                status:
                  $ref: '#/components/schemas/DeliveryStatus'
                channel_identity:
                  $ref: '#/components/schemas/ChannelIdentity'
                contact_id:
                  description: >-
                    The ID of the contact. Will be empty if processing_mode is
                    DISPATCH.
                  type: string
                reason:
                  $ref: '#/components/schemas/Reason'
                metadata:
                  description: Metadata specified when sending the event if any.
                  type: string
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    ConversationStartEvent:
      description: >-
        This callback is sent when a new conversation between the subscribed app
        and a contact is started.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            conversation_start_notification:
              $ref: '#/components/schemas/ConversationNotification'
    ConversationStopEvent:
      description: >-
        This callback is sent when a conversation between the subscribed app and
        a contact is stopped.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            conversation_stop_notification:
              $ref: '#/components/schemas/ConversationNotification'
    ConversationDeleteEvent:
      description: >-
        This callback is sent when a conversation between the subscribed app and
        a contact is deleted.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            conversation_delete_notification:
              $ref: '#/components/schemas/ConversationNotification'
    ConversationNotification:
      description: >-
        Object containing the details of the started / stopped / deleted
        conversation
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
    ContactCreateEvent:
      description: This callback is sent when a new contact is created.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            contact_create_notification:
              $ref: '#/components/schemas/ContactNotification'
    ContactDeleteEvent:
      description: This callback is sent when a contact is deleted.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            contact_delete_notification:
              $ref: '#/components/schemas/ContactNotification'
    ContactUpdateEvent:
      description: This callback is sent when a contact is updated.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            contact_update_notification:
              $ref: '#/components/schemas/ContactNotification'
    ContactNotification:
      type: object
      properties:
        contact:
          $ref: '#/components/schemas/Contact'
    ContactMergeEvent:
      description: This callback is sent when two contacts are merged.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            contact_merge_notification:
              type: object
              properties:
                preserved_contact:
                  $ref: '#/components/schemas/Contact'
                deleted_contact:
                  $ref: '#/components/schemas/Contact'
    ContactIdentitiesDuplicationEvent:
      description: >-
        This callback is sent when duplicates of channel identities are found
        between multiple contacts in the contact database during message and
        event processing.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            duplicated_contact_identities_notification:
              type: object
              properties:
                duplicated_identities:
                  type: array
                  items:
                    type: object
                    properties:
                      channel:
                        $ref: '#/components/schemas/ConversationChannel'
                      contact_ids:
                        description: List of duplicated ids in the specified channel.
                        type: array
                        items:
                          type: string
    CapabilityEvent:
      description: >-
        This callback is used to deliver the results of the asynchronous
        capability checks.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            capability_notification:
              type: object
              properties:
                request_id:
                  description: >-
                    ID generated when submitting the capability request. Can be
                    used to detect duplicates.
                  type: string
                contact_id:
                  description: The ID of the contact.
                  type: string
                channel:
                  $ref: '#/components/schemas/ConversationChannel'
                identity:
                  description: >-
                    The channel identity. For example, a phone number for SMS,
                    WhatsApp, and Viber Business.
                  type: string
                capability_status:
                  description: Status indicating the recipient's capability on the channel.
                  type: string
                  x-enumDescriptions:
                    CAPABILITY_UNKNOWN: >-
                      The channel capability for the contact is unknown due to
                      the underlying channel not making this information
                      available.
                    CAPABILITY_FULL: >-
                      The specified contact supports all the features of the
                      channel.
                    CAPABILITY_PARTIAL: >-
                      The specified contact supports a subset of the channel
                      features.
                    NO_CAPABILITY: The specified contact has no capability on the channel.
                  enum:
                    - CAPABILITY_UNKNOWN
                    - CAPABILITY_FULL
                    - CAPABILITY_PARTIAL
                    - NO_CAPABILITY
                channel_capabilities:
                  description: >-
                    When capability_status is set to CAPABILITY_PARTIAL, this
                    field includes a list of the supported channel-specific
                    capabilities reported by the channel.
                  type: array
                  items:
                    type: string
                reason:
                  $ref: '#/components/schemas/Reason'
    OptInEvent:
      description: This callback is used to deliver opt-in notifications from the channels.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            opt_in_notification:
              type: object
              properties:
                request_id:
                  description: >-
                    ID generated when making an opt-in registration request. Can
                    be used to detect duplicates.
                  type: string
                contact_id:
                  description: >-
                    The ID of the contact which is the subject of the opt-in.
                    Will be empty if processing_mode is DISPATCH.
                  type: string
                channel:
                  $ref: '#/components/schemas/ConversationChannel'
                identity:
                  description: >-
                    The channel identity. For example, a phone number for SMS,
                    WhatsApp and Viber Business.
                  type: string
                status:
                  description: Status of the opt-in registration.
                  type: string
                  x-enumDescriptions:
                    OPT_IN_SUCCEEDED: The opt-in registration succeeded.
                    OPT_IN_FAILED: The opt-in registration failed.
                    OPT_IN_STATUS_UNSPECIFIED: The status of the opt-in registration is unknown.
                  enum:
                    - OPT_IN_SUCCEEDED
                    - OPT_IN_FAILED
                    - OPT_IN_STATUS_UNSPECIFIED
                error_details:
                  description: This field is populated if the opt-in failed.
                  type: object
                  properties:
                    description:
                      description: Human-readable error description.
                      type: string
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    OptOutEvent:
      description: >-
        This callback is used to deliver opt-out notifications from the
        channels.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            opt_out_notification:
              type: object
              properties:
                request_id:
                  description: >-
                    ID generated when making an opt-out registration request.
                    Can be used to detect duplicates.
                  type: string
                contact_id:
                  description: >-
                    The ID of the contact which is the subject of the opt-out.
                    Will be empty if processing_mode is DISPATCH.
                  type: string
                channel:
                  $ref: '#/components/schemas/ConversationChannel'
                identity:
                  description: >-
                    The channel identity. For example, a phone number for SMS,
                    WhatsApp and Viber Business.
                  type: string
                status:
                  description: Status of the opt-out registration.
                  type: string
                  x-enumDescriptions:
                    OPT_OUT_SUCCEEDED: The opt-out registration succeeded.
                    OPT_OUT_FAILED: The opt-out registration failed.
                    OPT_OUT_STATUS_UNSPECIFIED: The status of the opt-out registration is unknown.
                  enum:
                    - OPT_OUT_SUCCEEDED
                    - OPT_OUT_FAILED
                    - OPT_OUT_STATUS_UNSPECIFIED
                error_details:
                  description: This field is populated if the opt-out failed.
                  type: object
                  properties:
                    description:
                      description: Human-readable error description.
                      type: string
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    ChannelEvent:
      description: >-
        This callback is used to deliver notifications regarding
        channel-specific information and updates. For example, if your are using
        the WhatsApp channel of the Conversation API, and your quality rating
        has been changed to GREEN, a POST would be made to the CHANNEL_EVENT
        webhook.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            channel_event_notification:
              properties:
                channel_event:
                  type: object
                  properties:
                    channel:
                      $ref: '#/components/schemas/ConversationChannel'
                    event_type:
                      description: The type of event being reported.
                      type: string
                    additional_data:
                      description: >-
                        An object containing additional information regarding
                        the event. The contents of the object depend on the
                        channel and the event_type.
                      type: object
    UnsupportedCallbackEvent:
      description: >-
        Some of the callbacks received from the underlying channels might be
        specific to a single channel or may not have a proper mapping in
        Conversation API yet.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            unsupported_callback:
              properties:
                channel:
                  $ref: '#/components/schemas/ConversationChannel'
                payload:
                  description: Normally a JSON payload as sent by the channel.
                  type: string
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
                id:
                  description: The message ID.
                  type: string
                contact_id:
                  description: The ID of the contact. This field is blank if not supported.
                  type: string
                conversation_id:
                  description: >-
                    The ID of the conversation this message is part of. This
                    field is blank if not supported.
                  type: string
                channel_identity:
                  $ref: '#/components/schemas/ChannelIdentity'
    SmartConversationsEvent:
      description: >-
        When using the Smart Conversations functionality, Machine Learning and
        Artificial Intelligence analyses are delivered through specific
        callbacks on the Conversation API.
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            smart_conversation_notification:
              type: object
              properties:
                contact_id:
                  description: The unique ID of the contact that sent the message.
                  type: string
                channel_identity:
                  description: The channel-specific identifier for the contact.
                  type: string
                channel:
                  $ref: '#/components/schemas/ConversationChannel'
                message_id:
                  description: The unique ID of the corresponding message.
                  type: string
                conversation_id:
                  description: The ID of the conversation the app message is part of.
                  type: string
                analysis_results:
                  $ref: '#/components/schemas/AnalysisResult'
    AnalysisResult:
      description: >-
        The analysis provided by the Smart Conversations machine learning
        engine(s). The contents of the object are determined by the
        functionalities that are enabled for your solution.
      type: object
      properties:
        ml_sentiment_result:
          description: >-
            An array that contains the analyses of the sentiments of the
            corresponding messages.
          type: array
          items:
            $ref: '#/components/schemas/MachineLearningSentimentResult'
        ml_nlu_result:
          description: >-
            An array that contains the analyses of the intentions of, and
            entities within, the corresponding messages.
          type: array
          items:
            $ref: '#/components/schemas/MachineLearningNLUResult'
        ml_image_recognition_result:
          description: >-
            An array that contains the image recognition analyses of the images
            identified in the corresponding messages.
          type: array
          items:
            $ref: '#/components/schemas/MachineLearningImageRecognitionResult'
        ml_pii_result:
          description: >-
            An array that contains the PII analysis of the corresponding
            messages.
          type: array
          items:
            $ref: '#/components/schemas/MachineLearningPIIResult'
        ml_offensive_analysis_result:
          $ref: '#/components/schemas/MachineLearningOffensiveAnalysisResult'
    Sentiment:
      description: The most probable sentiment of the analyzed text.
      type: string
      x-enumDescriptions:
        positive: The sentiment of the text is most likely positive.
        negative: The sentiment of the text is most likely negative.
        neutral: The sentiment of the text is most likely neutral.
      enum:
        - positive
        - negative
        - neutral
    MachineLearningSentimentResult:
      type: object
      properties:
        message:
          description: The message text that was analyzed.
          type: string
        results:
          description: >-
            An array of JSON objects made up of sentiment and score pairs, where
            the score represents the likelihood that the message communicates
            the corresponding sentiment.
          type: array
          items:
            $ref: '#/components/schemas/SentimentResult'
      allOf:
        - $ref: '#/components/schemas/SentimentResult'
    SentimentResult:
      type: object
      properties:
        sentiment:
          $ref: '#/components/schemas/Sentiment'
        score:
          description: >-
            The likelihood that the assigned sentiment represents the emotional
            context of the analyzed text. 1 is the maximum value, representing
            the highest likelihood that the message text matches the sentiment,
            and 0 is the minimum value, representing the lowest likelihood that
            the message text matches the sentiment.
          type: number
          format: float
    MachineLearningNLUResult:
      type: object
      properties:
        message:
          description: The message text that was analyzed.
          type: string
        results:
          description: >-
            An array of JSON objects made up of intent and score pairs, where
            the score represents the likelihood that the message has the
            corresponding intent.
          type: array
          items:
            $ref: '#/components/schemas/IntentResult'
      allOf:
        - $ref: '#/components/schemas/IntentResult'
    IntentResult:
      type: object
      properties:
        intent:
          description: >-
            The most probable intent of the analyzed text. For example,
            chitchat.greeting, chitchat.bye, chitchat.compliment,
            chitchat.how_are_you, or general.yes_or_agreed.
          type: string
        score:
          description: >-
            The likelihood that the assigned intent represents the purpose of
            the analyzed text. 1 is the maximum value, representing the highest
            likelihood that the message text matches the intent, and 0 is the
            minimum value, representing the lowest likelihood that the message
            text matches the intent.
          type: number
          format: float
    MachineLearningImageRecognitionResult:
      type: object
      properties:
        url:
          description: The URL of the image that was processed.
          type: string
        document_image_classification:
          $ref: '#/components/schemas/DocumentImageClassification'
        optical_character_recognition:
          $ref: '#/components/schemas/OpticalCharacterRecognition'
        document_field_classification:
          $ref: '#/components/schemas/DocumentFieldClassification'
    DocumentImageClassification:
      description: >-
        An object that identifies a document type within the image, along with a
        confidence level for that document type.
      type: object
      properties:
        doc_type:
          description: The document type that the analyzed image most likely contains.
          type: string
        confidence:
          description: >-
            The likelihood that the analyzed image contains the assigned
            document type. 1 is the maximum value, representing the highest
            likelihood that the analyzed image contains the assigned document
            type, and 0 is the minimum value, representing the lowest likelihood
            that the analyzed image contains the assigned document type.
          type: number
          format: float
    OpticalCharacterRecognition:
      description: >-
        An object containing a result array that reports the machine learning
        engine's character extraction results.
      type: object
      properties:
        result:
          description: The result of the OCR process.
          type: array
          items:
            $ref: '#/components/schemas/OpticalCharacterRecognitionData'
    OpticalCharacterRecognitionData:
      type: object
      properties:
        data:
          description: >-
            The data array contains the string(s) identified in one section of
            an analyzed image.
          type: array
          items:
            type: string
    DocumentFieldClassification:
      description: >-
        An object containing a result object that reports on all identified
        fields, as well as the values assigned to those fields.
      type: object
      properties:
        result:
          description: The result of the Document Field Classification process
          type: array
          items:
            $ref: '#/components/schemas/DocumentFieldClassificationData'
    DocumentFieldClassificationData:
      type: object
      additionalProperties:
        type: object
        properties:
          data:
            description: >-
              The data array contains the string(s) assigned to the
              corresponding document field.
            type: array
            items:
              type: string
    MachineLearningPIIResult:
      description: An object that contains the PII analysis of the corresponding messages.
      type: object
      properties:
        message:
          description: The message text that was analyzed.
          type: string
        masked:
          description: >-
            The redacted message text in which sensitive information was
            replaced with appropriate masks. A MISC mask is applied to a term
            that has been identified as PII, but with low confidence regarding
            which type of mask to assign.
          type: string
    MachineLearningOffensiveAnalysisResult:
      description: >-
        An array that contains the analyses of the offenses of the corresponding
        messages.
      type: array
      items:
        $ref: '#/components/schemas/OffensiveAnalysis'
    OffensiveAnalysis:
      type: object
      properties:
        message:
          description: Either the message text or the URL of the image that was analyzed.
          type: string
        url:
          description: URL of the image that was analyzed.
          type: string
        evaluation:
          description: >-
            A label, either SAFE or UNSAFE, that classifies the analyzed
            content.
          type: string
          x-enumDescriptions:
            SAFE: The analysis of the content indicates that it is most likely safe.
            UNSAFE: >-
              The analysis of the content indicates that it is most likely
              unsafe.
          enum:
            - SAFE
            - UNSAFE
        score:
          description: >-
            The likelihood that the assigned evaluation represents the analyzed
            message correctly. 1 is the maximum value, representing the highest
            likelihood that the content of the message matches the evaluation. 0
            is the minimum value, representing the lowest likelihood that the
            content of the message matches the evaluation.
          type: number
          format: float
    RecordNotificationEvent:
      required:
        - entityId
        - recordStatus
        - processingMode
      allOf:
        - $ref: '#/components/schemas/CallbackEventCommon'
        - type: object
          properties:
            record_notification:
              type: object
              properties:
                entity_id:
                  description: The ID of the entity.
                  type: string
                record_status:
                  description: Record status for a specific entity
                  type: string
                  x-enumDescriptions:
                    RECORD_STATUS_UNSPECIFIED: The record status is unknown.
                    EVENT_RECORD_STORED: The record for the entity has been stored.
                  enum:
                    - RECORD_STATUS_UNSPECIFIED
                    - EVENT_RECORD_STORED
                channel_identity:
                  $ref: '#/components/schemas/ChannelIdentity'
                contact_id:
                  description: >-
                    The ID of the contact. Will not be present for apps in
                    Dispatch Mode.
                  type: string
                conversation_id:
                  description: >-
                    The ID of the conversation. Will not be present for apps in
                    Dispatch Mode.
                  type: string
                reason:
                  $ref: '#/components/schemas/Reason'
                processing_mode:
                  $ref: '#/components/schemas/ProcessingMode'
    ConversationWebhookEvent:
      type: object
      oneOf:
        - $ref: '#/components/schemas/MessageInboundEvent'
        - $ref: '#/components/schemas/MessageInboundSmartConversationRedactionEvent'
        - $ref: '#/components/schemas/MessageSubmitEvent'
        - $ref: '#/components/schemas/MessageDeliveryReceiptEvent'
        - $ref: '#/components/schemas/EventInbound'
        - $ref: '#/components/schemas/EventDelivery'
        - $ref: '#/components/schemas/ConversationStartEvent'
        - $ref: '#/components/schemas/ConversationStopEvent'
        - $ref: '#/components/schemas/ConversationDeleteEvent'
        - $ref: '#/components/schemas/ContactCreateEvent'
        - $ref: '#/components/schemas/ContactDeleteEvent'
        - $ref: '#/components/schemas/ContactMergeEvent'
        - $ref: '#/components/schemas/ContactUpdateEvent'
        - $ref: '#/components/schemas/ContactIdentitiesDuplicationEvent'
        - $ref: '#/components/schemas/CapabilityEvent'
        - $ref: '#/components/schemas/OptInEvent'
        - $ref: '#/components/schemas/OptOutEvent'
        - $ref: '#/components/schemas/ChannelEvent'
        - $ref: '#/components/schemas/SmartConversationsEvent'
        - $ref: '#/components/schemas/RecordNotificationEvent'
        - $ref: '#/components/schemas/UnsupportedCallbackEvent'
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: >-
        For more information about basic authentication, see [Basic
        Authentication](https://developers.sinch.com/docs/conversation/api-reference/#authentication).
    oAuth2:
      type: oauth2
      description: >-
        The user name and password are your client_id and key_secret from the
        [Access keys sections](https://dashboard.sinch.com/settings/access-keys)
      flows:
        clientCredentials:
          tokenUrl: https://auth.sinch.com/oauth2/token
          scopes: {}
x-readme:
  proxy-enabled: true
  samples-enabled: true
