        accept_time: YYYY-MM-DDTHH:MM:SS
    injectEventResponse:
      summary: Inject event response
      value:
        event_id: string
        accepted_time: YYYY-MM-DDTHH:MM:SS
  responses:
    400Error:
      description: >-
        Malformed request. See [common error
        responses](https://developers.sinch.com/docs/conversation/api-reference/#common-error-responses)
        for more information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/runtimeError'
          example:
            code: 400
            message: Malformed request
            status: INVALID_REQUEST
            details: []
    401Error:
      description: >-
        Incorrect credentials. See [common error
        responses](https://developers.sinch.com/docs/conversation/api-reference/#common-error-responses)
        for more information.
      content:
        application/json:
          schema:
            type: object
    404Error:
      description: >-
        No information was found. See [common error
        responses](https://developers.sinch.com/docs/conversation/api-reference/#common-error-responses)
        for more information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/runtimeError'
          example:
            code: 404
            message: information not found
            status: NOT_FOUND
            details: []
    403Error:
      description: >-
        Correct credentials but you don't have access to the requested resource.
        See [common error
        responses](https://developers.sinch.com/docs/conversation/api-reference/#common-error-responses)
        for more information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/runtimeError'
          example:
            code: 403
            message: You do not have access to the requested resource.
            status: UNAUTHORIZED
            details: []
    500Error:
      description: >-
        Correct credentials but you don't have access to the requested resource.
        See [common error
        responses](https://developers.sinch.com/docs/conversation/api-reference/#common-error-responses)
        for more information.
      content:
        application/json:
          schema:
