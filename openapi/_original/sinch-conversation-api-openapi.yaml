security:
  - Basic: []
  - oAuth2: []
paths:
  /v1/projects/{project_id}/messages:send:
    parameters:
      - $ref: '#/components/parameters/project_id'
    post:
      description: >-
        You can send a message from a Conversation app to a contact associated
        with that app. If the recipient is not associated with an existing
        contact, a new contact will be created.


        The message is added to the active conversation with the contact if a
        conversation already exists. If no active conversation exists a new one
        is started automatically.


        You can find all of your IDs and authentication credentials on the
        [Sinch Customer
        Dashboard](https://dashboard.sinch.com/settings/access-keys).
      tags:
        - Messages
      summary: Send a message
      operationId: Messages_SendMessage
      requestBody:
        $ref: '#/components/requestBodies/SendMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/sendMessageResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '500':
          $ref: '#/components/responses/500Error'
        '501':
          $ref: '#/components/responses/501Error'
      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package conversation.messages;


            import com.sinch.sdk.SinchClient;

            import com.sinch.sdk.domains.conversation.api.v1.MessagesService;

            import
            com.sinch.sdk.domains.conversation.models.v1.ChannelRecipientIdentities;

            import
            com.sinch.sdk.domains.conversation.models.v1.ChannelRecipientIdentity;

            import
            com.sinch.sdk.domains.conversation.models.v1.ConversationChannel;

            import
            com.sinch.sdk.domains.conversation.models.v1.messages.AppMessage;

            import
            com.sinch.sdk.domains.conversation.models.v1.messages.request.SendMessageRequest;

            import
            com.sinch.sdk.domains.conversation.models.v1.messages.response.SendMessageResponse;

            import
            com.sinch.sdk.domains.conversation.models.v1.messages.types.text.TextMessage;

            import com.sinch.sdk.models.Configuration;

            import com.sinch.sdk.models.ConversationRegion;

            import java.util.logging.Logger;

            import utils.Settings;


            public class Send {

              private static final Logger LOGGER = Logger.getLogger(Send.class.getName());

              public static void main(String[] args) {

                String projectId = Settings.getProjectId().orElse("MY_PROJECT_ID");
                String keyId = Settings.getKeyId().orElse("MY_KEY_ID");
                String keySecret = Settings.getKeySecret().orElse("MY_KEY_SECRET");
                String conversationRegion = Settings.getConversationRegion().orElse("MY_CONVERSATION_REGION");

                // The ID of the Conversation Application to send the message from
                String conversationApplicationId = "CONVERSATION_APPLICATION_ID";
                // Phone number to send the SMS message to (in E.164 format, e.g. +46701234567)
                String smsRecipientPhoneNumber = "RECIPIENT_PHONE_NUMBER";

                Configuration configuration =
                    Configuration.builder()
                        .setProjectId(projectId)
                        .setKeyId(keyId)
                        .setKeySecret(keySecret)
                        .setConversationRegion(ConversationRegion.from(conversationRegion))
                        .build();

                SinchClient client = new SinchClient(configuration);

                MessagesService messagesService = client.conversation().v1().messages();

                LOGGER.info(
                    String.format(
                        "Send SMS message with Conversation to phone number '%s'", smsRecipientPhoneNumber));

                SendMessageRequest<TextMessage> request =
                    createSMSSendMessage(conversationApplicationId, smsRecipientPhoneNumber);

                SendMessageResponse response = messagesService.sendTextMessage(request);

                LOGGER.info("Response: " + response);
              }

              static SendMessageRequest<TextMessage> createSMSSendMessage(
                  String applicationId, String smsRecipientPhoneNumber) {

                SendMessageRequest.Builder<TextMessage> builder = SendMessageRequest.<TextMessage>builder();

                builder
                    .setAppId(applicationId)
                    .setMessage(
                        AppMessage.<TextMessage>builder()
                            .setBody(
                                TextMessage.builder()
                                    .setText("[Java SDK: Conversation Message] Sample text message")
                                    .build())
                            .build())
                    .setRecipient(
                        ChannelRecipientIdentities.of(
                            ChannelRecipientIdentity.builder()
                                .setChannel(ConversationChannel.SMS)
                                .setIdentity(smsRecipientPhoneNumber)
                                .build()))
                    .build();

                return builder.build();
              }
            }
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';
              const conversationRegion = process.env.SINCH_CONVERSATION_REGION ?? 'MY_CONVERSATION_REGION';

              // The ID of the Conversation App to send the message from
              const appId = 'CONVERSATION_APP_ID';
              // The phone number of the recipient in E.164 format
              const recipientPhoneNumber = 'RECIPIENT_PHONE_NUMBER';

              const sinch = new SinchClient({ projectId, keyId, keySecret, conversationRegion });

              try {
                const response = await sinch.conversation.messages.send({
                  sendMessageRequestBody :{
                    app_id: appId,
                    message: {
                      text_message: {
                        text: '[Node.js SDK: Conversation Message] Sample text message',
                      },
                    },
                    recipient: {
                      identified_by: {
                        channel_identities: [
                          {
                            channel: 'RCS',
                            identity: recipientPhoneNumber,
                          },
                        ],
                      },
                    },
                  },
                });
                console.log('✅ Successfully sent Message.');
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error(`❌ Failed to send Message to the phone number ${recipientPhoneNumber}:`);
                console.error(err);
              }
            }

            main();
        - lang: Python
          source: >
            """

            Sinch Python Snippet


            This snippet is available at
            https://github.com/sinch/sinch-sdk-python/tree/main/examples/snippets

            """


            import os

            from dotenv import load_dotenv

            from sinch import SinchClient


            load_dotenv()


            sinch_client = SinchClient(
                project_id=os.environ.get("SINCH_PROJECT_ID") or "MY_PROJECT_ID",
                key_id=os.environ.get("SINCH_KEY_ID") or "MY_KEY_ID",
                key_secret=os.environ.get("SINCH_KEY_SECRET") or "MY_KEY_SECRET",
                conversation_region=os.environ.get("SINCH_CONVERSATION_REGION") or "MY_CONVERSATION_REGION"
            )


            # The ID of the Conversation App to send the message from

            app_id = "CONVERSATION_APP_ID"

            # The phone number of the recipient in E.164 format (e.g.
            +46701234567)

            recipient_identities = [
                {
                    "channel": "RCS",
                    "identity": "RECIPIENT_PHONE_NUMBER"
                }
            ]


            # The conversation message payload to send

            message = {
                "text_message": {
                    "text": "[Python SDK: Conversation Message] Sample text message",
                },
            }


            response = sinch_client.conversation.messages.send(
                app_id=app_id,
                message=message,
                recipient_identities=recipient_identities,
            )


            print(f"Successfully sent message.\n{response}")
