  schemas:
    ConsentsListType:
      type: string
      description: >-
        The consent list type. See [consent
        management](https://developers.sinch.com/docs/conversation/consent-management)
        page for more information.
      enum:
        - OPT_OUT_ALL
        - OPT_OUT_MARKETING
        - OPT_OUT_NOTIFICATION
      x-enumDescriptions:
        OPT_OUT_ALL: List type that blocks all kinds of messages
        OPT_OUT_MARKETING: List type that blocks only marketing messages
        OPT_OUT_NOTIFICATION: List type that blocks only notification messages
    protobufAny:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
    runtimeError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              format: int32
            details:
              type: array
              items:
                $ref: '#/components/schemas/protobufAny'
            message:
              type: string
            status:
              type: string
    AppCreateRequest:
      description: The request sent to the API endpoint to create a new app.
      type: object
      title: Conversation API app
      required:
        - display_name
        - channel_credentials
      properties:
        channel_credentials:
          description: >-
            An array of channel credentials. The order of the credentials
            defines the app channel priority.
          type: array
          items:
            $ref: '#/components/schemas/ConversationChannelCredentials'
        conversation_metadata_report_view:
          $ref: '#/components/schemas/ConversationMetadataReportView'
        display_name:
          description: The display name for the app.
          type: string
          example: Sinch Conversation API Demo App 001
        retention_policy:
          $ref: '#/components/schemas/RetentionPolicy'
        dispatch_retention_policy:
          $ref: '#/components/schemas/DispatchRetentionPolicy'
        processing_mode:
          $ref: '#/components/schemas/ProcessingMode'
        smart_conversation:
          $ref: '#/components/schemas/SmartConversation'
        callback_settings:
          $ref: '#/components/schemas/CallbackSettings'
        message_retry_settings:
          $ref: '#/components/schemas/MessageRetrySettings'
        delivery_report_based_fallback:
          $ref: '#/components/schemas/DeliveryReportBasedFallback'
    AppUpdateRequest:
      description: >-
        The request sent to the API endpoint to update the configuration of an
        app.
      type: object
      title: Conversation API app
      properties:
        channel_credentials:
          description: >-
            An array of channel credentials. The order of the credentials
            defines the app channel priority.
          type: array
          items:
            $ref: '#/components/schemas/ConversationChannelCredentials'
        conversation_metadata_report_view:
          $ref: '#/components/schemas/ConversationMetadataReportView'
        display_name:
          description: The display name for the app.
          type: string
          example: Sinch Conversation API Demo App 001
        retention_policy:
          $ref: '#/components/schemas/RetentionPolicy'
        dispatch_retention_policy:
          $ref: '#/components/schemas/DispatchRetentionPolicy'
        processing_mode:
          $ref: '#/components/schemas/ProcessingMode'
        smart_conversation:
          $ref: '#/components/schemas/SmartConversation'
        callback_settings:
          $ref: '#/components/schemas/CallbackSettings'
        message_retry_settings:
          $ref: '#/components/schemas/MessageRetrySettings'
        delivery_report_based_fallback:
          $ref: '#/components/schemas/DeliveryReportBasedFallback'
    AppResponse:
      description: The response showing information about the app.
      type: object
      title: Conversation API app
      properties:
        channel_credentials:
          type: array
          items:
            $ref: '#/components/schemas/ConversationChannelCredentials'
        conversation_metadata_report_view:
          $ref: '#/components/schemas/ConversationMetadataReportView'
        display_name:
          description: The display name for the app.
          type: string
          example: Sinch Conversation API Demo App 001
        id:
          description: >-
            The ID of the app. You can find this on the [Sinch
            Dashboard](https://dashboard.sinch.com/convapi/apps).
          type: string
          example: '{APP_ID}'
        rate_limits:
          $ref: '#/components/schemas/RateLimits'
        retention_policy:
          $ref: '#/components/schemas/RetentionPolicy'
        dispatch_retention_policy:
          $ref: '#/components/schemas/DispatchRetentionPolicy'
        processing_mode:
          $ref: '#/components/schemas/ProcessingMode'
        smart_conversation:
          $ref: '#/components/schemas/SmartConversation'
        queue_stats:
          $ref: '#/components/schemas/QueueStats'
        callback_settings:
          $ref: '#/components/schemas/CallbackSettings'
        delivery_report_based_fallback:
          $ref: '#/components/schemas/DeliveryReportBasedFallback'
        message_retry_settings:
          $ref: '#/components/schemas/MessageRetrySettings'
    AppMessageObject:
      type: object
      title: App
      properties:
        app_message:
          $ref: '#/components/schemas/AppMessage'
    AppMessage:
      type: object
      title: Message originating from app
      description: A message originating from a Conversation API app
      allOf:
        - $ref: '#/components/schemas/AppMessageTypes'
        - $ref: '#/components/schemas/AppMessageCommonProps'
    AppMessageTypes:
      type: object
      oneOf:
        - $ref: '#/components/schemas/CardMessageField'
        - $ref: '#/components/schemas/CarouselMessageField'
        - $ref: '#/components/schemas/ChoiceMessageField'
        - $ref: '#/components/schemas/LocationMessageField'
        - $ref: '#/components/schemas/MediaMessageField'
        - $ref: '#/components/schemas/TemplateMessageField'
        - $ref: '#/components/schemas/TextMessageField'
        - $ref: '#/components/schemas/ListMessageField'
        - $ref: '#/components/schemas/ContactInfoMessageField'
    AppMessageCommonProps:
      type: object
      properties:
        explicit_channel_message:
          description: >-
            Allows you to specify a channel and define a corresponding channel
            specific message payload that will override the standard
            Conversation API message types. The key in the map must point to a
            valid conversation channel as defined in the enum
            `ConversationChannel`. The message content must be provided in a
            string format. You may use the [transcoding
            endpoint](https://developers.sinch.com/docs/conversation/api-reference/conversation/tag/Transcoding/)
            to help create your message. For more information about how to
            construct an explicit channel message for a particular channel, see
            that [channel's corresponding
            documentation](https://developers.sinch.com/docs/conversation/channel-support/)
            (for example, using explicit channel messages with [the WhatsApp
            channel](https://developers.sinch.com/docs/conversation/channel-support/whatsapp/message-support/#explicit-channel-messages)).
          type: object
          additionalProperties:
            type: string
        explicit_channel_omni_message:
          description: >-
            Override the message's content for specified channels. The key in
            the map must point to a valid conversation channel as defined in the
            enum `ConversationChannel`. The content defined under the specified
            channel will be sent on that channel.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OmniMessageOverride'
        channel_specific_message:
          description: >-
            Channel specific messages, overriding any transcoding. The structure
            of this property is more well-defined than the open structure of the
            `explicit_channel_message` property, and may be easier to use.

            The key in the map must point to a valid conversation channel as
            defined in the enum `ConversationChannel`.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChannelSpecificMessage'
        agent:
          $ref: '#/components/schemas/Agent'
        reply_to:
          title: Reply To
          description: >-
            Sends this message as a contextual reply to an inbound contact
            message, so the contact sees their original message quoted. Only
            supported on the WhatsApp channel. Conversation API keeps the
            mapping needed for the quote for 96 hours. If the referenced message
            is unknown or older than 96 hours, or the message is sent on a
            channel that does not support contextual replies, the message is
            still sent without the quote. For more information, see [Sending
            contextual
            replies](https://developers.sinch.com/docs/conversation/channel-support/whatsapp/message-support/#sending-contextual-replies).
          type: object
          required:
            - message_id
          properties:
            message_id:
              type: string
              description: >-
                Required when using `reply_to`. The Conversation API ID of the
                inbound contact message this message replies to. Do not use a
                channel message ID (e.g., a WhatsApp message ID) from Meta.
    AppEventField:
      type: object
      title: App Event Type
      properties:
        app_event:
          description: Event originating from an app
          type: object
          title: App Event
          oneOf:
            - $ref: '#/components/schemas/ComposingEventField'
            - $ref: '#/components/schemas/ComposingEndEventField'
            - $ref: '#/components/schemas/ReadMessageEventField'
            - $ref: '#/components/schemas/CommentReplyEventField'
            - $ref: '#/components/schemas/AgentJoinedEventField'
            - $ref: '#/components/schemas/AgentLeftEventField'
            - $ref: '#/components/schemas/GenericEventField'
    BasicAuthCredentials:
      description: It consists of a username and a password.
      type: object
      required:
        - password
        - username
      title: Basic Auth Credential
      properties:
        password:
