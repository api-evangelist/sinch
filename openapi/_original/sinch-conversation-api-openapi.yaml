    get:
      description: >-
        This operation lists all messages sent or received via particular
        [Processing
        Modes](https://developers.sinch.com/docs/conversation/processing-modes/).


        Setting the `messages_source` parameter to `CONVERSATION_SOURCE` allows
        for querying messages in `CONVERSATION` mode, and setting it to
        `DISPATCH_SOURCE`

        will allow for queries of messages in `DISPATCH` mode. Note that
        `conversation_id` and `contact_id` are only supported as query
        parameters if `messages_source` is set to `CONVERSATION_SOURCE`.


        Combining multiple parameters is supported for more detailed filtering
        of messages, but some of them are not supported

        depending on the value specified for `messages_source`. The description
        for each field will inform if that field may not be supported.


        The messages are ordered by their `accept_time` property in descending
        order,

        where `accept_time` is a timestamp of when the message was enqueued by
        the Conversation API.

        This means messages received most recently will be listed first.
