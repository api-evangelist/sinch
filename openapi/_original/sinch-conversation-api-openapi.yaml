    delete:
      description: >-
        Delete a specific message by its ID. Note that this operation deletes
        the message from Conversation API storage; this operation does not
        affect messages already delivered to recipients' handsets. Also note
        that removing all messages of a conversation will not automatically
        delete the conversation.
