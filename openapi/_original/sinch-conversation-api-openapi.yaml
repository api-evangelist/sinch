      x-codeSamples:
        - lang: Java
          source: >
            /**
             * Sinch Java Snippet
             *
             * <p>This snippet is available at https://github.com/sinch/sinch-sdk-java
             *
             * <p>See https://github.com/sinch/sinch-sdk-java/blob/main/examples/snippets/README.md for details
             */
            package conversation.capability;


            import com.sinch.sdk.SinchClient;

            import com.sinch.sdk.domains.conversation.api.v1.CapabilityService;

            import
            com.sinch.sdk.domains.conversation.models.v1.ChannelRecipientIdentities;

            import
            com.sinch.sdk.domains.conversation.models.v1.ChannelRecipientIdentity;

            import
            com.sinch.sdk.domains.conversation.models.v1.ConversationChannel;

            import com.sinch.sdk.domains.conversation.models.v1.Recipient;

            import
            com.sinch.sdk.domains.conversation.models.v1.capability.request.QueryCapabilityRequest;

            import
            com.sinch.sdk.domains.conversation.models.v1.capability.response.QueryCapabilityResponse;

            import com.sinch.sdk.models.Configuration;

            import com.sinch.sdk.models.ConversationRegion;

            import java.util.logging.Logger;

            import utils.Settings;


            public class Capability {

              private static final Logger LOGGER = Logger.getLogger(Capability.class.getName());

              public static void main(String[] args) {

                String projectId = Settings.getProjectId().orElse("MY_PROJECT_ID");
                String keyId = Settings.getKeyId().orElse("MY_KEY_ID");
                String keySecret = Settings.getKeySecret().orElse("MY_KEY_SECRET");
                String conversationRegion = Settings.getConversationRegion().orElse("MY_CONVERSATION_REGION");

                // The ID of the Conversation App where the recipient channel is configured
                String conversationApplicationId = "CONVERSATION_APP_ID";
                // The channel to look up the capabilities for
                ConversationChannel recipientChannel = ConversationChannel.SMS;
                // The phone number of the recipient to look up the capabilities for
                String recipientPhoneNumber = "RECIPIENT_PHONE_NUMBER";

                Configuration configuration =
                    Configuration.builder()
                        .setProjectId(projectId)
                        .setKeyId(keyId)
                        .setKeySecret(keySecret)
                        .setConversationRegion(ConversationRegion.from(conversationRegion))
                        .build();

                SinchClient client = new SinchClient(configuration);

                CapabilityService capabilityService = client.conversation().v1().capability();

                Recipient channelRecipients =
                    ChannelRecipientIdentities.of(
                        ChannelRecipientIdentity.builder()
                            .setChannel(recipientChannel)
                            .setIdentity(recipientPhoneNumber)
                            .build());

                QueryCapabilityRequest request =
                    QueryCapabilityRequest.builder()
                        .setAppId(conversationApplicationId)
                        .setRecipient(channelRecipients)
                        .build();

                LOGGER.info(
                    String.format("Trigger capability lookup for phone number '%s'", recipientPhoneNumber));

                QueryCapabilityResponse response = capabilityService.lookup(request);

                LOGGER.info("Response: " + response);
              }
            }
        - lang: Node.js
          source: |
            /**
             * Sinch Node.js Snippet
             * See: https://github.com/sinch/sinch-sdk-node/examples/snippets
             */
            import { SinchClient } from '@sinch/sdk-core';
            import * as dotenv from 'dotenv';
            dotenv.config();

            async function main() {
              const projectId = process.env.SINCH_PROJECT_ID ?? 'MY_PROJECT_ID';
              const keyId = process.env.SINCH_KEY_ID ?? 'MY_KEY_ID';
              const keySecret = process.env.SINCH_KEY_SECRET ?? 'MY_KEY_SECRET';
              const conversationRegion = process.env.SINCH_CONVERSATION_REGION ?? 'MY_CONVERSATION_REGION';

              // The ID of the Conversation App where the recipient channel is configured
              const appId = 'CONVERSATION_APP_ID';
              // The phone number of the recipient to look up the capabilities for
              const recipientPhoneNumber = 'RECIPIENT_PHONE_NUMBER';

              const sinch = new SinchClient({ projectId, keyId, keySecret, conversationRegion });

              try {
                const response = await sinch.conversation.capability.lookup({
                  lookupCapabilityRequestBody: {
                    app_id: appId,
                    recipient: {
                      identified_by: {
                        channel_identities: [
                          {
                            channel: 'RCS',
                            identity: recipientPhoneNumber,
                          },
                        ],
                      },
                    },
                  },
                });
                console.log('✅ Successfully looked up the recipient capabilities - check the CAPABILITY webhook for the result.');
                console.log(JSON.stringify(response, null, 2));
              } catch (err) {
                console.error(`❌ Failed to look up the recipient capabilities for phone number ${recipientPhoneNumber}:`);
                console.error(err);
              }
            }

            main();
