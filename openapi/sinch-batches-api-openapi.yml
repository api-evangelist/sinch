  responses:
    '400':
      description: Invalid request parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/badRequest'
    '404':
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/notFound'
    '500':
      description: Internal server error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/internalServerError'
    '403':
      description: Forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/forbidden'
    '401':
      description: Authentication failed — token missing, invalid, or expired.
      headers:
        WWW-Authenticate:
          description: RFC 7235 challenge. Indicates the required authentication scheme and, for expired tokens, provides an error hint.
          schema:
            type: string
            example: Bearer realm="sinch", error="invalid_token", error_description="Token has expired"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/unauthorized'
    '429':
      description: Too many requests — rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          required: false
          schema:
            type: integer
            example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/tooManyRequests'
