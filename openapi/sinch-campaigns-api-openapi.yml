            type: array
            items:
              $ref: '#/components/schemas/CampaignAttachment'
          logs:
            description: All transitions applied to this campaign
            type: array
            items:
              $ref: '#/components/schemas/CampaignLog'
          notes:
            description: Notes used to contact customer and agents regarding this campaign.
            type: array
            items:
              $ref: '#/components/schemas/Note'
          smsApp:
            $ref: '#/components/schemas/smsApp'
          mmsApp:
            $ref: '#/components/schemas/mmsApp'
          mmsMoUrl:
            $ref: '#/components/schemas/mmsMoUrl'
          mmsDrUrl:
            $ref: '#/components/schemas/mmsDrUrl'
    ContentDefinitionRequest:
      description: This is where the client would provide important information about their short code campaign(s) – what the call to action is (how is the short code advertised and how consent is collected), whether it’s a one-time or subscription/recurring campaign, and example messages (example messages of what the brand will be sending once live)
      properties:
        messageType:
          $ref: '#/components/schemas/MessageTypeEnum'
        contentType:
          $ref: '#/components/schemas/ContentTypeEnum'
        subscription:
          description: Content definition subscription type.
          enum:
          - ONE_TIME
          - SUBSCRIPTION
          x-enumDescriptions:
            ONE_TIME: One time payment
            SUBSCRIPTION: Subscription payment
          example: ONE_TIME
          format: enum
          type: string
        messageFlow:
          $ref: '#/components/schemas/MessageFlow'
      type: object
    ListCampaignResponse:
      description: List of campaigns object
      properties:
        campaigns:
          description: List of campaigns
          items:
            $ref: '#/components/schemas/BasicCampaign'
          type: array
        nextPageToken:
          description: Token to request the next page of results.
          type: string
        totalSize:
          description: Total count of campaigns matching provided search criteria
          format: int32
          type: integer
      type: object
    CarrierOrderNoteBody:
      description: Body object linked to callback body when event type is CARRIER_ORDER_NOTE.
      type: object
      properties:
        campaignId:
          description: The ID of the campaign to which the event belongs.
          example: '20000'
          type: string
        carrierOrderId:
          description: The ID of the carrier order to which the event belongs.
          example: '20010'
          type: string
        note:
          $ref: '#/components/schemas/Note'
    CarrierOrderStatus:
      description: Carrier order status
      enum:
      - PENDING
      - SUBMITTED
      - APPROVED
      - REJECTED
      - PROVISIONED_BY_CARRIER
      - PROVISIONED_BY_SINCH
      - CLIENT_CERTIFICATION_REQUESTED
      - CARRIER_CERTIFICATION_REQUESTED
      - CERTIFIED
      - DEPROVISIONED
      - CERTIFICATION_FAILURE
      - CANCELLED
      x-enumDescriptions:
        PENDING: Campaign has not been submitted yet to the carrier.
        SUBMITTED: Campaign has been submitted to the carrier.
        APPROVED: Campaign has been approved by carrier.
        REJECTED: Campaign has not been approved by carrier.
        PROVISIONED_BY_CARRIER: Short Code has been approved and configured on Sinch’s bind by this carrier.
        PROVISIONED_BY_SINCH: Short Code has been set up on client’s account.
        CLIENT_CERTIFICATION_REQUESTED: Campaign is ready to be tested by Sinch Team (to test opt-in and auto-responses such as HELP and STOP)
        CARRIER_CERTIFICATION_REQUESTED: Campaign has passed Sinch testing and is pending certification/testing with the Carrier(not all carriers require this) where they will test opt-in and auto-responses for HELP and STOP.
        CERTIFIED: Campaign has passed certification on this carrier and it is now LIVE! Ready for live traffic
        DEPROVISIONED: Used when cancelling the connectivity part with this carrier.
        CERTIFICATION_FAILURE: Testing failed. It can be due to keyword and auto-responses not set up as described in the campaign or the call to action is not live or not compliant.
        CANCELLED: When the overall SC Campaign is not longer active with all carriers and the SC lease is cancelled.
      example: PENDING
      format: enum
      type: string
    CampaignLog:
      description: A transition applied to a campaign
      properties:
        previousStatus:
          $ref: '#/components/schemas/CampaignStatus'
        currentStatus:
          $ref: '#/components/schemas/CampaignStatus'
        createdAt:
          description: Log creation date
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
      type: object
    ErrorDetails:
      type: object
      oneOf:
      - $ref: '#/components/schemas/NotFoundDetails'
      - $ref: '#/components/schemas/InvalidRequestDetails'
      discriminator:
        propertyName: type
        mapping:
          ResourceInfo: '#/components/schemas/NotFoundDetails'
          BadRequest: '#/components/schemas/InvalidRequestDetails'
    TrafficCharge:
      description: Campaign traffic charge type.
      enum:
      - STANDARD
      - FREE_TO_END_USER
      x-enumDescriptions:
        STANDARD: Standard rates apply to send and receive for end users. Sinch customers will be charged for MT/MO messages.
        FREE_TO_END_USER: Sinch customers will be charged at a higher MT/MO rate while end users will not be charged.
      example: STANDARD
      format: enum
      type: string
    MessageTypeEnum:
      description: Message type that will be used in the content definition.
      enum:
      - SMS
      - MMS_VIDEO
      - MMS_AUDIO
      - MMS_IMAGE
      x-enumDescriptions:
        SMS: SMS
        MMS_VIDEO: MMS Video
        MMS_AUDIO: MMS Audio
        MMS_IMAGE: MMS Image
      example: SMS
      format: enum
      type: string
    ContentDefinition:
      description: This is where the client would provide important information about their short code campaign(s) – what the call to action is (how is the short code advertised and how consent is collected), whether it’s a one-time or subscription/recurring campaign, and example messages (example messages of what the brand will be sending once live)
      properties:
        messageType:
          description: Message type that will be used in the content definition.
          example: SMS
          format: enum
          type: string
        contentType:
          description: Content type that will be used in the content definition.
          example: CHAT
          type: string
        subscription:
          description: Content definition subscription type.
          example: ONE_TIME
          type: string
        messageFlow:
          $ref: '#/components/schemas/MessageFlow'
      type: object
    RestError:
      properties:
        error:
          $ref: '#/components/schemas/InternalRestError'
      type: object
    ContactEmails:
      description: Contact emails that will be used to contact about campaign order status. If you plan to set a callback url, please ignore this field
      type: array
      items:
        type: string
        format: email
    MessageFlow:
      description: Message flow that will be used in the content definition. Contains the call to action, opt in and sample alert.
      properties:
        callToAction:
          description: Call to action that will be used in the content definition.
          example: Text JOIN to 12345 and receive a link to start setting up your MyCompany account.
          type: string
        optIn:
          description: Opt-in message that will be used in the content definition.
          example: You are subscribed to MyCompany texting alerts. Text HELP for help, STOP to opt-out.
          type: string
        sampleAlert:
          description: Sample alert that will be used in the content definition.
          example: Are you enrolled for your compliance regulations? Text me at this number for help. STOP to opt out.
          type: string
      type: object
    CreateCampaignRequest:
      allOf:
      - $ref: '#/components/schemas/CampaignRequestBase'
      - type: object
        description: Create a new US Short Code Campaign Draft request.
        properties:
          notes:
            description: Add some comments to the campaign. This field is optional.
            type: array
            items:
              type: string
              example: This is a note
    CampaignStatus:
      description: Campaign status
      enum:
      - DRAFT
      - PENDING_REVIEW
      - REVIEWING
      - READY_CARRIER_SUBMISSION
      - CARRIER_SUBMITTED
      - COMPLETED
      - CANCELLED
      - DEPROVISIONED
      - AWAITING_CLIENT_UPDATE
      x-enumDescriptions:
        DRAFT: A working draft campaign, not submitted for review
        PENDING_REVIEW: Submitted campaign, waiting for review
        REVIEWING: An agent is actively reviewing the campaign
        READY_CARRIER_SUBMISSION: Agent has completed review and is ready to submit to carriers
        CARRIER_SUBMITTED: Campaign information has been submitted to carriers (at this point follow carrier order status updates)
        COMPLETED: Campaign has been approved by all carriers and is ready for use
        CANCELLED: Campaign has been cancelled
        DEPROVISIONED: An approved campaign that has been deprovisioned and is no longer in use
        AWAITING_CLIENT_UPDATE: Some information must be edited or added to the campaign to continue the review process
      example: DRAFT
      format: enum
      type: string
    mmsDrUrl:
      description: Location where DR messages will be delivered. A specific URL for Delivery Receipt at the shortcode level. This parameter is optional and allows for overriding the account-level DR URL. If a value is provided, all DR notifications for this shortcode will be sent to the specified URL. If it is not provided, notifications will continue to be sent to the default URL configured at the account level.
      example: https://mycompany/dr/url
      type: string
    Note:
      description: Notes used to contact customer and agents.
      properties:
        author:
          description: Author. It can be either a customer or an agent.
          enum:
          - CUSTOMER
          - AGENT
          x-enumDescriptions:
            CUSTOMER: Customer
            AGENT: Agent
          example: CUSTOMER
          format: enum
          type: string
        text:
          description: Note text
          example: This is a note
          type: string
        createdAt:
          description: Note creation date
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
      type: object
    CarrierOrderLog:
      description: A transition applied to a carrier order
      properties:
        previousStatus:
          $ref: '#/components/schemas/CarrierOrderStatus'
        currentStatus:
          $ref: '#/components/schemas/CarrierOrderStatus'
        createdAt:
          description: Log creation date
          example: '2023-01-01T00:00:00Z'
          type: string
          format: date-time
      type: object
    CarrierList:
      description: List of carriers available for a campaign
      properties:
        carriers:
          description: List of carriers
          items:
            $ref: '#/components/schemas/Carrier'
          type: array
      type: object
    ScRequested:
      description: Customer needs Sinch to lease a short code for them. When sc_requested is true, customers need to provide an existing brand ID, not rejected.
      example: true
      type: boolean
    mmsApp:
      description: The MMS routing profile app
      example: My_MMS_App
      type: string
  securitySchemes:
    OAuth2:
      description: The username and password are your Key ID and Key Secret from the Access keys section in the Sinch Customer Dashboard. Exchange these for a bearer token (access token).
      flows:
        clientCredentials:
          scopes:
            read: read
            write: write
          tokenUrl: https://auth.sinch.com/oauth2/token
      type: oauth2
    hmacAuth:
      type: http
      scheme: hmac
      description: Used for hashing callbacks. Please refer to the callback-configuration endpoints for more information.
