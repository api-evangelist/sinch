            BadRequest: Value indicate it is related to a InvalidRequest error
        fieldViolations:
          items:
            $ref: '#/components/schemas/FieldViolation'
          type: array
    CampaignNoteBody:
      description: Body object linked to callback body when event type is CAMPAIGN_NOTE.
      type: object
      properties:
        campaignId:
          description: The ID of the campaign to which the event belongs.
          example: '20000'
          type: string
        note:
          $ref: '#/components/schemas/Note'
    PrivacyPolicy:
      description: Provide the URL to your company’s Privacy Policy, which outlines how you collect, use, and protect customers' personal information. If you do not have a URL, please enter the full text of your Privacy Policy. Mandatory at submission time.
      properties:
        text:
          description: Privacy policy text.
          example: We respect your privacy and will not share your personal information with third parties.
          type: string
        url:
          description: Privacy policy URL
          example: https://www.mycompany.com/privacy
          type: string
          format: uri
      type: object
    Carrier:
      description: Carrier object
      properties:
        carrier_id:
          description: Carrier ID
          example: '123'
          type: string
        name:
          description: Carrier name
          example: AT&T
          type: string
      type: object
    Campaign:
      description: Campaign content
      allOf:
      - $ref: '#/components/schemas/BasicCampaign'
      - type: object
        properties:
          description:
            description: Campaign description
            example: My Campaign Description
            type: string
          trafficCharge:
            $ref: '#/components/schemas/TrafficCharge'
          scRequested:
            $ref: '#/components/schemas/ScRequested'
          brandId:
            $ref: '#/components/schemas/BrandId'
          customerCare:
            $ref: '#/components/schemas/CustomerCare'
          contentDefinitions:
            description: You can configure specific flows to fit your needs. You can check the documentation for more information about flows. Each campaign must contain at least one content definition at submission time.
            type: array
            items:
              $ref: '#/components/schemas/ContentDefinition'
          termsAndConditions:
            $ref: '#/components/schemas/TermsAndConditions'
          privacyPolicy:
            $ref: '#/components/schemas/PrivacyPolicy'
          complianceEmails:
            $ref: '#/components/schemas/ComplianceEmails'
          contactEmails:
            $ref: '#/components/schemas/ContactEmails'
          callbackUrl:
            $ref: '#/components/schemas/CallbackUrl'
          isMigrated:
            $ref: '#/components/schemas/IsMigrated'
          carrierOrders:
