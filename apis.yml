- aid: sinch:sinch-hosting-orders-api
  name: Sinch Hosting Orders API
  description: >-
    Hosted numbers provide you with an easy method to port your SMS enabled numbers to Sinch or to use
    SMS messaging and other products to send and receive messages, on voice-enabled numbers (including
    landline numbers) that you already own.


    Note: The SMS enablement process is only supported in United States and Canada.


    The Hosting Orders API allows you to manage all the numbers that you are hosting on the Sinch platform.
    This includes numbers that you have ported to Sinch and/or any non- Sinch numbers that you already
    own and are hosting on Sinch to enable Sinch SMS messaging and other products.
  humanURL: https://developers.sinch.com/docs/conversation/api-reference/conversation
  baseURL: https://us.conversation.api.sinch.com
