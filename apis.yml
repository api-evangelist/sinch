- aid: sinch:sinch-cover-pages-api
  name: Sinch Cover pages API
  description: >-
    You can add cover pages to Sinch Fax either via the API or the [Build dashboard](https://dashboard.sinch.com).


    A Fax service can have 0 or more cover pages configured.


    ### When cover pages are added


    #### Via dashboard


    In the **Send Fax** tab you can select the option to ***select a cover page from a drop down***. When
    one is selected it will use that cover page on all outbound faxes.


    **Note:** If you are using Fax to Email, this is currently the only way to add a cover page to your
    faxes.


    #### Via API


    When sending a fax using the API, you can specify `coverPageId` and supply your own cover page data.


    ### How to create a cover page


    Create a PDF that fits your brand. It should have all the standard static content you need to stay
    compliant. Insert tags that will be replaced at run time by us for dynamic content.


    #### Automatic fields


    If we find the tags described in the table below, we will replace these tokens with fax metadata.


    |Tag | Content | Example |Description |

    | ---- | ----- | ----- | ----- |

    |{{from}}| string | +15557897890 | Your Sinch number that you used to send the fax. |

    |{{to}}| string | +15551231234 |  The number to which you are sending the fax. |

    |{{date}}| date | 2/4/2025 | The date when the fax was sent. |

    |{{pageCount}}| number | 52 | The total number of pages to be transmitted. |


    ### Specifying your own dynamic fields in API calls


    When sending faxes via API you can add any tags you like with `{{}}`` syntax and set those in your
    app calls for cover page data.


    Example:
      If you would like to add the recipient's name and your own message on the cover page:

    ```json

    /// in your template pdf

    Fax to : {{to_name}}

    {{my_custom_message}}


    {
      ///other fax fields removed for clarity
      coverPageData: {
        "to_name": "Dr. John Smith",
        "my_custom_message": "I know you are busy please take on this patient"
        }
    }

    ```
  humanURL: https://developers.sinch.com/docs/conversation/api-reference/conversation
  baseURL: https://us.conversation.api.sinch.com
