- aid: sinch:sinch-available-number-api
  name: Sinch Available Number API
  description: >-
    You can use the Available Number API to search for numbers that are available to buy, in any region
    and of any number type, and to check a specific number's availability, price, and capabilities.


    To buy a number you found, use the [Number Order](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order)
    API.


    **Deprecated:** The activation endpoints in this API, "Activate a new phone number" and "Rent any
    number that matches the criteria", are deprecated and only support US `LOCAL` numbers. They remain
    available for existing integrations, but new integrations should use the [Number Order](https://developers.sinch.com/docs/numbers/api-reference/numbers/number-order)
    API, which supports numbers from all regions and of all number types.
