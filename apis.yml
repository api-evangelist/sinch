- name: Sinch Conversation API
  description: "Overview Send and receive messages globally over SMS, RCS, WhatsApp, Viber Business, Facebook\
    \ messenger and other popular channels using the Sinch Conversation API. {% admonition type=\"info\"\
    \ name=\"Note:\" %} If you would like help setting up your Conversation API solution, and want to\
    \ quickly get started sending and receiving messages, review our Getting Started guide. {% /admonition\
    \ %} The Conversation API endpoint uses built-in transcoding to give you the power of conversation\
    \ across all supported channels and, if required, full control over channel specific features. Authentication\
    \ OAuth2.0 "
