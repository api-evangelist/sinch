- aid: sinch:sinch-10dlc-campaign-registration-api
  name: Sinch 10DLC Campaign Registration API
  description: "10DLC is a system in the United States that allows businesses to send Application-to-Person\
    \ (A2P) messaging via 10-digit-long-codes (10DLC). It uses a dedicated 10-digit telephone number allocated\
    \ within the North American Numbering Plan (NANP). \n\nIn order to register for a 10DLC campaign,\
    \ you need to have a 10DLC enabled brand. Create a 10DLC enabled brand before you start, see [Brand\
    \ Registrations](https://developers.sinch.com/docs/10dlc-registration/api-reference/10dlc-registration/tag/Brand-Registration/)\
    \ for more info.\n\nBefore you launch your 10DLC message program, Sinch must review your campaign.\
    \ We make sure your message program aligns with carrier and industry requirements. Principally we\
    \ look for alignment with the [CTIA 2023 Messaging Principals & Best Practices](https://community.sinch.com/t5/SMS/CTIA-Messaging-Principles-and-Best-Practices/ta-p/7087/highlight/true).\
    \ If your campaign does not meet these requirements, we will reject it. If we do reject it, you will\
    \ need to make changes to the campaign and resubmit it for Sinch to review again.  \n\nIt's important\
    \ to understand [10DLC compliance requirements](https://community.sinch.com/t5/10DLC/10DLC-Compliance-Requirements-and-Guidance/ta-p/10706)\
    \ as well as other best practices. You should also know the [most common reasons why Sinch may reject\
    \ your campaign](https://community.sinch.com/t5/10DLC/Why-was-my-campaign-rejected/ta-p/15408) . We\
    \ want to help you get your campaigns approved the first time. Then you can get your message program\
    \ up and running right away!"
  humanURL: https://developers.sinch.com/docs/conversation/api-reference/conversation
