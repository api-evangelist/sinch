- aid: sinch:sinch-number-order-api
  name: Sinch Number Order API
  description: >-
    You can use the Number Order API to buy numbers. This is the recommended way to buy numbers: it supports
    numbers from all regions and of all number types, including numbers that require registration (KYC)
    information and supporting documents.


    A number order reserves the numbers, lets you provide the information the region requires, and is
    then submitted for review. The numbers aren't activated immediately: track the order's `state` with
    the "Get a number order" endpoint or the `NUMBER_ORDER_PROCESSING` callbacks.


    You can create an order in one of two ways:

    - **Order specific phone numbers** (`numberOrderOption`): order a phone number you found with "Search
    for available phone numbers". Only one phone number per order is currently supported.

    - **Order by quantity** (`quantityOrderOption`): order between 1 and 100 numbers that match your criteria
    (pattern, capabilities), without choosing the specific numbers.


    Steps for buying a number via an order and providing the required KYC information:

    1. "Lookup number requirements" endpoint: look up country KYC requirements to establish which fields
    / information needs to be provided as part of buying the phone number. Also reveals if any attachment
    files need to be provided.

    2. "Search for available phone numbers" endpoint (in the Available Numbers API): search numbers you
    may want to buy. Not needed if you order by quantity.

    3. "Create a number order" endpoint: create the Number Order for a specific phone number (`numberOrderOption`)
    or for a quantity of numbers matching a set of criteria (`quantityOrderOption`), which reserves the
    numbers for a period between 30 minutes and 48 hours (check the expireTime field), giving plenty of
    time to call the other endpoint to submit the fields required as revealed by the API at 1. and also
    to hit the final Submit endpoint.

    4. "Update number order registration" endpoint: update the order Registration (container for the actual
    KYC required fields / information revealed at step #1). This is validated on the spot for required
    / optional fields, fields lengths etc. (also revealed at step #1).

    5. "Upload an attachment for a number order" endpoint: upload file attachments - only if mandatory
    as per requirements revealed by step #1. AttachmentId necessary for the URL will be returned at step
    #1.

    6. "Submit number order" endpoint: submit the order - final step after creating the order and providing
    registration info and (if required) attachments


    You can follow a detailed tutorial outlining the entire ordering process [here](https://developers.sinch.com/docs/numbers/kyc-numbers-order).
