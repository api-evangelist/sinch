- aid: sinch:sinch-country-permissions-api
  name: Sinch Country Permissions API
  description: >-
    Country permissions are used to control which countries can be dialed from a specific SIP trunk. You
    can view, update, and remove country permissions. For beta, only US, CA and wild card are supported.

    Please note that these permissions are not per trunk but rather they are per project/account. In the
    future Sinch may extend these permissions to other voice and messaging products.

    If you are using sub-projects you can use the same country permissions for all sub-projects.

    You can also specify different country permissions for each sub-project that will override the parent
    country permissions.
