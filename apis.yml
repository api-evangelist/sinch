- aid: sinch:sinch-payloads-api
  name: Sinch Payloads API
  description: >-
    SVAML (Sinch Voice API Markup Language) is a JSON-based markup language used to define call flows
    and control the behavior of voice calls in the Sinch Voice API. It allows developers to specify commands
    that dictate how calls are handled, including dialing, playing messages, gathering input, and more.


    SVAML is used in various contexts within the Voice API, including:

    - **Call Creation**: When initiating outbound calls via the API.

    - **Webhooks**: When responding to call events with commands to control the ongoing call flow.

    - **Batch Calls**: When defining call flows for multiple calls in a batch operation.
