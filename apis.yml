- aid: sinch:sinch-app-api
  name: Sinch App API
  description: >-
    Apps are created and configured through the [Sinch Dashboard](https://dashboard.sinch.com/convapi/apps),
    are tied to the API user and come with a set of **channel credentials** for each underlying connected
    channel. The app has a list of **conversations** between itself and different **contacts** which share
    the same **project**.


    Webhooks, which the app is attached to, defines the destination for various events coming from the
    Conversation API. An **app** has the following configurable properties:


    | Field                        | Description                                                                                                       |

    | ---------------------------- | -----------------------------------------------------------------------------------------------------------------
    |

    | Display name                 | The name visible in the [Sinch Dashboard](https://dashboard.sinch.com/convapi/apps).                                 |

    | Conversation metadata report | Specifies the amount of **conversation** metadata that's returned
    as part of each callback.                        |

    | Retention Policy             | The retention policy specifies how long messages, sent to or from
    an **app**, are stored by the Conversation API. |
