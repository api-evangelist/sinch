- aid: sinch:sinch-advanced-porting-api
  name: Sinch Advanced porting API
  description: >-
    This section is for advanced porting operations, like on demand activating numbers, getting available
    numbers for activation, and more.

    If you are looking for basic porting operations like creating an order, checking portability, and
    more, please refer to the Port-in numbers section.


    ### Scheduled ports


    The recommended way to port numbers to Sinch is to schedule the port, this means that you create an
    order and specify a desired port date and time,

    this is the date you want the numbers to be ported in to Sinch automatically and we will sync with
    the loosing carrier to make sure the port is done on

    that date with minimal downtime for you and your customers.


    ### On demand ports


    If you need to control your self when a number is activated you can use on demand ports, that means
    as soon as the number is confirmed you can activate

    it when you want. And we take care of the rest. When using on demand ports you need to make sure the
    number is confirmed and released for activation. you can also choose

    to activate numbers on activation groups.


    ### Activation groups


    When you create a port in order we assign an activating group on the numbers, the grouping is by carrier
    so if you have a large port-in order from multiple different carriers

    you can group and look at the numbers by group to see status. Updates to port order usually comes
    on group basis and are confirmed ro rejected on carrier level.


    You can also use this as a way  to activate groups for on-demand activation.

    However we recommend you porting in numbers by carrier to make sure you get the best experience.


    ### On demand activation


    When you set up an order with onDemandActivation set to true, you can activate the numbers when you
    want. This is useful if you want to control when the numbers are activated.


    You can activate a whole order by calling `/orders/portins/{orderId}/activate` or you can activate
    a specific group of numbers by calling `/orders/portins/{orderId}/activate`

    with the phoneNumberGroup you find on the number. Please note that it is not possible to activate
    single numbers by order or activation group.
  humanURL: https://developers.sinch.com/docs/conversation/api-reference/conversation
  baseURL: https://us.conversation.api.sinch.com
