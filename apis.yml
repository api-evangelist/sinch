- aid: sinch:sinch-fax-to-email-api
  name: Sinch Fax to Email API
  description: >-
    The Emails endpoint allows you to configure the Fax to Email functionality. Fax to Email allows you
    to send an email and then receive a fax on your Sinch number or send a fax and have it sent to your
    email address.

    The service supports sending incoming faxes to multiple email addresses and having many numbers associated
    with one email address.


    ## Setting up fax to email


    You can configure fax to email in two different places:

      - In the dashboard on a number-by-number basis or by adding an email address and associating many
    numbers to one email address.
      - Via the API when you create a number or update a number, or by using the email endpoint to set
    it up directly
      - Supported fax to email file types are Word, PDF, and TIF

    ## Fax to email example


    The following example shows how to configure Fax to Email using the API:
      1. Buy a number in the dashboard and assign it to a Fax service
      2. Add your email and associate it with the number you bought in step 1.

    ```json

    POST https://fax.api.sinch.com/v3/projects/{projectId}/services/{serviceId}/emails
     {
        "email": "user@domain.com",
        "phoneNumbers": [
           {
            "number": "+14155552222",
            "permissions": "both"
           }
        ]
    }

    ```


    Now you can use your email client with the above email address to fax.


    ## Send a fax using email


    Make sure the email address you are sending from is added to your account. You can add it in the dashboard
    under the **Fax to email** of your Fax service in the [Build dashboard]https://dashboard.sinch.com/fax/fax-to-email)
    or via the API.


    Send an email to {PhoneNumberToSendFaxTo}@sinchfax.com with the following:


    | Field | Description |

    | ----- | ----------- |

    | **Subject:** | If you have multiple phone numbers associated with the email address, enter the number
    you want to use. If left blank, the first number that we find will be used. |

    | **Body:** | By default, the email body is not used.  |

    | **Attachments** | Add any attachments you want to fax. If you want to specify the order of pages
    we recommend that you create one document with all pages in the correct order and attach that document.
    If you attach multiple documents we will merge them  into one document in the order we receive them.
    |



    ## Receive a fax using email


    When you receive a fax, we will send you an email with the following:

    | Field | Description |

    | ----- | ----------- |

    | **From:** | The number the fax was sent from, e.g. +15612600684@sinchfax.com |

    | **Subject:** | You have received a new fax on {+1 234 555 5555} |

    | **Body:** | The page count and other metadata are HTML only, and will not appear in plain text in
    the email. |


    There will be one PDF attachment with the fax content.


    ## Configuring your email system for best performance


    Make sure you allowlist `sinchfax.com` and `sinch.com` in your spam filter to ensure delivery to your
    inbox, both on client and server side.

    Ensure your mail server is setup correctly and not on spam lists.


    ## Encryption


    All emails are sent using TLS during transport from Sinch.
