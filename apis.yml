- aid: sinch:sinch-services-api
  name: Sinch Services API
  description: >-
    A fax service identifies a set of configuration values. You can specify the service as a part of an
    API request or by associating a Sinch number with a service.


    This can be useful if you want to point a group of numbers to a particular incoming fax URL, or want
    to set the storage strategy for some of your numbers but not all of them.


    ## Dashboard

    You can manage all your fax services and their settings via the [Dashboard](https://dashboard.sinch.com/fax/services).


    ## Sending a test fax


    To send a TEST Inbound fax event in the Dashboard, enter the `IncomingWebhookUrl` on the Incoming
    tab and click **Save**.  Then click the **SEND TEST REQUEST** button. This will emulate all aspects
    of a real INCOMING fax event without charging your account.
