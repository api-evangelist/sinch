  - name: sinch functions dev
    description: 'Start a local development server with hot reload. The server restarts automatically when you save changes.
      On first run, prompts whether to create a tunnel for '
  - name: sinch functions status
    description: Show the current status and details of a deployed function.
  - name: sinch functions logs
    description: View historical logs for a deployed function. Opens an interactive terminal UI showing a table of requests.
      Press Enter on any row to see request/response detai
  - name: sinch functions logs stream
    description: Alias for `sinch functions logs --follow`. Connects to the live log stream and displays new requests as they
      arrive.
  - name: sinch functions download
    description: Download the deployed source code of a function as a ZIP file.
  - name: sinch functions delete
    description: Delete a deployed function. Prompts for confirmation unless `--force` is passed.
  - name: sinch functions validate
    description: Check the function configuration before deployment.
  - name: sinch functions docs
    description: Generate AI-powered documentation for the function in the current directory. Reads the function source and
      writes a `README.md`.
  env_and_secrets:
  - name: sinch env init
