  - name: sinch secrets list
    description: List all custom secrets by key name. Values are not shown.
  - name: sinch secrets add
    description: Add or update a secret in the OS keychain. If the key already exists, the value is updated.
  - name: sinch secrets get
    description: Retrieve a secret from the keychain. The value is hidden by default.
  - name: sinch secrets delete
    description: Remove a secret from the keychain. Requires confirmation unless `--force` is passed. **Aliases:** `remove`,
      `rm`
  - name: sinch secrets clear
    description: Remove all custom secrets from the keychain. Requires confirmation unless `--force` is passed.
