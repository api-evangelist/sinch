      an OAuth 2.0 access token, and stores credentials sec
  - name: sinch auth status
    description: 'Show the current authentication state: which credentials are stored and whether the OAuth token is valid.'
  - name: sinch auth logout
    description: Remove all stored credentials (keychain secrets and local session tokens). Prompts for confirmation before
      clearing.
  config:
  - name: sinch config set
    description: Set a configuration value.
  - name: sinch config get
    description: Read a configuration value.
  - name: sinch config list
    description: Show all current configuration values for the active profile.
  - name: sinch config profile
    description: Manage credential profiles for working across multiple Sinch projects. Each profile stores its own credentials
      in the keychain.
  - name: sinch config profile list
  - name: sinch config profile create
  - name: sinch config profile use
  - name: sinch config profile delete
  - name: sinch health
    description: Check connectivity to the SinchFunctions API.
  - name: sinch completion
    description: Generate shell completion scripts for tab completion.
  functions:
  - name: sinch functions init
    description: 'Initialize a new function from a template. Downloads the template, prompts for variables and secrets, sets
      up the project directory, and installs dependencies. '
  - name: sinch functions list
    description: List all functions in the current project.
  - name: sinch functions deploy
    description: Deploy the function in the current directory to production. Packages the source into a ZIP, reads configuration
