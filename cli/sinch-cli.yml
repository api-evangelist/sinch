name: Sinch CLI
description: 'The Sinch CLI builds, tests and deploys Sinch Functions from the terminal and manages the Sinch resources those
  functions use: phone numbers, porting orders, voice services and calls, SIP trunks, conversation apps, fax. Published as
  @sinch/cli on npm (0.8.1, 2026-10-08; native binaries ship as optional dependencies); the package is catalogued in packages/sinch-packages.yml.'
docs: https://developers.sinch.com/docs/functions/cli/installation
repo: https://github.com/sinch/cli
package: https://www.npmjs.com/package/@sinch/cli
version: 0.8.1
install:
  npm: npm install -g @sinch/cli
  requirements: Windows 10+, macOS 12+, Linux; Node.js 24+ for Node functions, .NET 10 SDK for C# functions
  verify: sinch --version
authentication:
  command: sinch auth login
  credentials: Project ID, Key ID and Key Secret from the Sinch Dashboard Access Keys section
  storage: Key secrets are stored in your OS keychain (Windows Credential Manager, macOS Keychain, or Linux Secret Service).
    Short-lived session tokens are stored in your local config (~/.sinch/).
commands:
